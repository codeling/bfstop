COM_BFSTOP_SETUP_SUMMARY_SETTINGS="Com as configurações atuais, o Brute Force Stop bloqueia um endereço após %1$d falhas de login em %2$s (menos se as tentativas parecerem arriscadas, ou se a conta for atacada a partir de muitos endereços), por %3$s. Todas as outras configurações mantêm seus valores: altere-as na página de configurações a qualquer momento."
