COM_BFSTOP_SETUP_START="Começar"
COM_BFSTOP_SETUP_OVERVIEW_INSTALL="Bem-vindo ao Brute Force Stop. Antes de bloquear alguém, ele precisa saber como os visitantes chegam ao seu site: diretamente, ou por meio de um proxy, um balanceador de carga ou uma CDN. Atrás de um proxy, todo visitante parece vir do endereço do proxy – sem as configurações certas, algumas falhas de login bloqueariam todo mundo."
COM_BFSTOP_SETUP_OVERVIEW_UPGRADE="O Brute Force Stop foi atualizado a partir da versão %s. Isto é o que a atualização fez:"
COM_BFSTOP_SETUP_OVERVIEW_DID_SETTINGS="As configurações foram transferidas do Gerenciador de plugins para este componente."
COM_BFSTOP_SETUP_OVERVIEW_DID_BLOCKMODE="As antigas opções 'Bloqueio ativado' e 'Usar .htaccess' tornaram-se o modo de bloqueio '%s'."
COM_BFSTOP_SETUP_OVERVIEW_DID_API="Os logins pela API de Web Services do Joomla agora também são protegidos (a configuração 'Ativo para')."
COM_BFSTOP_SETUP_OVERVIEW_DID_ADDRESSES="Os endereços da lista de bloqueios e da lista de permitidos foram padronizados em uma única grafia."
COM_BFSTOP_SETUP_OVERVIEW_DID_MAINTENANCE="A manutenção diária agora é uma tarefa do Agendador de tarefas do Joomla."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS="Uma seção de bloqueio que versões anteriores escreveram no arquivo .htaccess, se havia, foi reescrita na forma atual."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS_FAILED="A seção de bloqueio que versões anteriores escreveram no arquivo .htaccess não pôde ser reescrita: ela deixa passar qualquer pessoa que não esteja bloqueada pelos demais controles de acesso desse diretório. Torne o arquivo gravável e execute a atualização de novo, ou remova a seção manualmente."
COM_BFSTOP_SETUP_OVERVIEW_DID_DELAYS="O atraso da resposta a falhas de login, que suas configurações usavam, foi removido: o Brute Force Stop agora responde imediatamente e bloqueia como antes."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_PROXY="A atualização desativou o Brute Force Stop: a requisição da atualização veio por meio de um proxy, um balanceador de carga ou uma CDN, e sem configurações de proxy o BFStop bloquearia o endereço do proxy, ou seja, todo mundo. Ele permanece desativado até que este assistente seja concluído."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_LOADBALANCER="A atualização desativou o Brute Force Stop: 'Atrás de balanceador de carga' está ativado no Joomla, então o site parece estar atrás de um proxy, e sem configurações de proxy o BFStop bloquearia o endereço do proxy, ou seja, todo mundo. Ele permanece desativado até que este assistente seja concluído."
COM_BFSTOP_SETUP_OVERVIEW_STEPS="O assistente percorre as configurações que precisam da sua decisão: como os visitantes chegam ao site, e o modo de bloqueio. Cada etapa propõe o que combina com o que ela detecta; a última ativa a proteção."
COM_BFSTOP_SETUP_PROXY_INTRO="O Brute Force Stop conta as falhas de login por endereço de visitante. Atrás de um proxy, um balanceador de carga ou uma CDN, o servidor web vê o endereço do proxy para cada visitante, e o endereço do visitante está em um cabeçalho que o proxy adiciona – que só conta se a requisição veio de um proxy em que você confia. Sua própria requisição a esta página mostra o que vale para o seu site."
COM_BFSTOP_SETUP_PROXY_DETECTED="O que sua requisição mostra"
COM_BFSTOP_SETUP_PROXY_REMOTE_PUBLIC="Sua requisição chegou ao servidor web a partir de %s, um endereço na internet."
COM_BFSTOP_SETUP_PROXY_REMOTE_PRIVATE="Sua requisição chegou ao servidor web a partir de %s, um endereço de uma rede privada ou local – geralmente o de um proxy ou balanceador de carga."
COM_BFSTOP_SETUP_PROXY_HEADER_UNSUPPORTED="Ela trazia o cabeçalho %s, que o Brute Force Stop não lê."
COM_BFSTOP_SETUP_SCENARIO_A="Seu site parece ser acessado diretamente: não há proxy a configurar."
COM_BFSTOP_SETUP_SCENARIO_B="Seu site parece estar atrás de um proxy reverso ou balanceador de carga. Sem configurações de proxy, o BFStop contaria as falhas de login de todos os visitantes no endereço do proxy e bloquearia todo mundo."
COM_BFSTOP_SETUP_SCENARIO_C="Seu servidor web já obtém o endereço do visitante do cabeçalho do proxy (mod_remoteip, real_ip do nginx): o BFStop não deve ler o cabeçalho de novo. Mantenha a configuração de proxy dele desativada."
COM_BFSTOP_SETUP_SCENARIO_D="Seu site parece estar atrás de uma CDN (ou sua própria rede adiciona um cabeçalho de encaminhamento na saída). Sem configurações de proxy, o BFStop bloquearia os servidores da CDN, e com eles visitantes aleatórios."
COM_BFSTOP_SETUP_SCENARIO_E="Seu proxy só envia cabeçalhos que o Brute Force Stop não pode usar. Ele permanece inativo até que o proxy envie um cabeçalho que ele lê, ou o servidor web resolva o endereço."
COM_BFSTOP_SETUP_UNSUPPORTED="Seu proxy envia %s, que o Brute Force Stop não pode usar."
COM_BFSTOP_SETUP_UNSUPPORTED_USE_OTHER="Sua requisição também trazia um cabeçalho que o BFStop lê: escolha esse abaixo."
COM_BFSTOP_SETUP_UNSUPPORTED_FIX="Faça o proxy acrescentar ao X-Forwarded-For (nginx: <code>proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</code>), ou deixe o servidor web resolver o endereço com seu módulo real-IP (mod_remoteip do Apache, real_ip do nginx)."
COM_BFSTOP_SETUP_UNSUPPORTED_ISSUE="Conte-nos sobre sua configuração (abre uma nova issue no GitHub, somente com os nomes dos cabeçalhos, o cenário detectado e as versões)"
COM_BFSTOP_SETUP_CLOUDFLARE_WARNING="Seu site parece estar atrás da Cloudflare. Confiar em todos os endereços da Cloudflare permite que qualquer pessoa que use a Cloudflare chegue ao seu servidor com um endereço à sua escolha em CF-Connecting-IP (um Worker na própria zona pode defini-lo). Isso só é seguro se o seu servidor aceitar o tráfego da Cloudflare somente para a sua zona: Authenticated Origin Pulls com um certificado da sua zona, Cloudflare Tunnel ou uma regra de firewall. Caso contrário, deixe o servidor web resolver o endereço com seu módulo real-IP e mantenha a configuração de proxy do BFStop desativada."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH="Buscar as faixas de endereços da Cloudflare"
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH_DESC="Busca as faixas que a Cloudflare publica (www.cloudflare.com/ips-v4 e ips-v6) como proxies confiáveis, com o cabeçalho CF-Connecting-IP. Somente quando você clica: nada é enviado para outro lugar."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCHED="%d faixas de endereços da Cloudflare obtidas. Verifique-as com sua requisição antes de salvar."
COM_BFSTOP_SETUP_CLOUDFLARE_FAILED="Não foi possível obter as faixas de endereços da Cloudflare. Digite-as manualmente, a partir de www.cloudflare.com/ips."
COM_BFSTOP_SETUP_PROXY_CHOICE="Como seu site é acessado?"
COM_BFSTOP_SETUP_PROXY_CHOICE_NONE="Não há proxy a configurar: os visitantes acessam o site diretamente, ou o servidor web já resolve o endereço deles."
COM_BFSTOP_SETUP_PROXY_ACKNOWLEDGE="Tenho certeza: o cabeçalho de encaminhamento da sua requisição não vem de um proxy na frente deste site (mas, por exemplo, da minha própria rede)."
COM_BFSTOP_SETUP_PROXY_CHOICE_PROXY="O site está atrás de um proxy, balanceador de carga ou CDN, que envia o endereço do visitante neste cabeçalho:"
COM_BFSTOP_SETUP_PROXY_HEADER_PRESENT="(sua requisição o tem)"
COM_BFSTOP_SETUP_PROXY_TRUSTED_DESC="É proposto o endereço a partir do qual o proxy se conecta ao servidor web. Se houver mais de um nó de proxy (vários balanceadores de carga, uma CDN), informe todos, ou a menor rede que contenha todos eles (não maior que /8 para IPv4 ou /16 para IPv6)."
COM_BFSTOP_SETUP_PREVIEW="Verificar com minha requisição"
COM_BFSTOP_SETUP_PREVIEW_QUESTION="Com estas configurações, o Brute Force Stop considera que o seu endereço é %s. Esse é o endereço do seu computador na internet? Se for o do proxy, ou outro que você não conhece, as configurações ainda não estão certas."
COM_BFSTOP_SETUP_PREVIEW_CONFIRM="Sim, %s é o endereço do meu computador."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOTTRUSTED="Sua requisição não veio de nenhum destes proxies confiáveis: o Brute Force Stop usaria o endereço de onde ela veio, como sem configurações de proxy. Adicione o endereço de onde veio sua requisição (veja acima)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOHEADER="Sua requisição não trazia este cabeçalho: escolha um que ela tenha (veja acima)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_UNUSABLE="Este cabeçalho da sua requisição não termina em um endereço que não seja um dos proxies confiáveis: o Brute Force Stop não conseguiria determinar o seu endereço. Verifique o cabeçalho e os proxies confiáveis."
COM_BFSTOP_SETUP_PROXY_SAVE="Salvar e continuar"
COM_BFSTOP_SETUP_PROXY_SAVED="As configurações de proxy foram salvas."
COM_BFSTOP_SETUP_PROXY_ERROR_UNSUPPORTED="Seu proxy só envia cabeçalhos que o Brute Force Stop não pode usar: existe um proxy, então 'sem proxy' bloquearia todos atrás dele. Faça primeiro o proxy enviar um cabeçalho que o BFStop leia."
COM_BFSTOP_SETUP_PROXY_ERROR_ACKNOWLEDGE="Sua requisição veio por meio de um proxy. Sem configurações de proxy, o Brute Force Stop bloquearia o proxy, ou seja, todo mundo: confirme que o site é acessado diretamente mesmo assim, ou configure o proxy."
COM_BFSTOP_SETUP_PROXY_ERROR_CONFIRM="Verifique as configurações com sua requisição e confirme que o endereço mostrado é o do seu computador antes que elas sejam salvas."
COM_BFSTOP_SETUP_PROXY_ERROR_HEADER="Escolha um cabeçalho que o Brute Force Stop leia."
COM_BFSTOP_SETUP_PROXY_ERROR_TRUSTED="Informe o endereço (ou a rede) do seu proxy."
COM_BFSTOP_SETUP_REMINDER="Mantenha estas configurações atualizadas. Sempre que sua hospedagem mudar (um novo proxy ou CDN, nós do balanceador de carga adicionados ou substituídos, uma mudança para outro provedor), execute de novo a verificação de proxy. Configurações erradas podem bloquear todos os visitantes, ou permitir que atacantes escolham o endereço no qual são contados."
COM_BFSTOP_SETUP_RERUN_PROXY_CHECK="Executar de novo a verificação de proxy"
COM_BFSTOP_SETUP_DISMISS="Isto é esperado"
COM_BFSTOP_SETUP_DISMISSED="Esta mensagem não será mais mostrada, a menos que algo diferente mude."
COM_BFSTOP_SETUP_MISMATCH_APPEARSBEHINDPROXY="Seu site agora parece estar atrás de um proxy, balanceador de carga ou CDN: sua requisição trazia um cabeçalho de encaminhamento, mas o Brute Force Stop não confia em nenhum proxy."
COM_BFSTOP_SETUP_MISMATCH_PROXYADDRESSCHANGED="Endereço de proxy novo ou alterado? Sua requisição trazia um cabeçalho de encaminhamento, mas não veio de nenhum dos proxies confiáveis."
COM_BFSTOP_SETUP_MISMATCH_PROXYREMOVED="Proxy removido, ou você está acessando o site diretamente? Sua requisição não veio de nenhum dos proxies confiáveis e não trazia cabeçalho de encaminhamento."
COM_BFSTOP_SETUP_MISMATCH_HEADERCHANGED="Seu proxy agora envia outro cabeçalho: sua requisição veio de um proxy confiável, sem o cabeçalho configurado, mas com outro."
COM_BFSTOP_SETUP_MISMATCH_SERVERRESOLVES="Seu servidor web já resolve o endereço do visitante; a configuração de proxy do BFStop não é mais necessária."
COM_BFSTOP_SETUP_MISMATCH_UNSUPPORTEDHEADER="Seu proxy só envia cabeçalhos que o Brute Force Stop não pode usar."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHON="A configuração 'Atrás de balanceador de carga' do próprio Joomla (Configuração global, Servidor) está desativada: as sessões do Joomla, o log de ações de usuários (com as entradas do Brute Force Stop) e as ferramentas de privacidade registram o endereço do proxy. Ative-a, mas somente se o site não puder ser acessado a não ser pelo proxy: o Joomla confia no cabeçalho de qualquer um. O Brute Force Stop não usa esta configuração."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHOFF="A configuração 'Atrás de balanceador de carga' do próprio Joomla (Configuração global, Servidor) está ativada, mas aqui nenhum proxy precisa dela: o Joomla então obtém o endereço, nos próprios logs, de um cabeçalho que qualquer um pode falsificar. Desative-a. O Brute Force Stop não usa esta configuração."
COM_BFSTOP_SETUP_PANEL_HEADING="Valores salvos que impedem salvar as configurações"
COM_BFSTOP_SETUP_PANEL_DESC="A página de configurações verifica todas as configurações sempre que algo é salvo, e estes valores, salvos por uma versão anterior ou que não são mais válidos, não passam. Os valores propostos são salvos junto com esta etapa; altere-os se quiser."
