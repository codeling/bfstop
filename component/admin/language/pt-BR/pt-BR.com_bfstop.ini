COM_BFSTOP_SETUP_BLOCKMODE_WARNING_NGINX="O nginx não lê arquivos .htaccess: '%1$s' só fingiria bloquear no servidor web. Escolha '%2$s'; o nginx pode negar os endereços bloqueados com o arquivo de negação do nginx abaixo."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_LITESPEED="O LiteSpeed lê arquivos .htaccess, mas não todas as diretivas do Apache: se escolher '%1$s', verifique se funciona com o botão abaixo."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_HTACCESSPROXY="Atrás de um proxy, o servidor web compara as entradas do arquivo .htaccess com o endereço do proxy, então elas não recusam ninguém – ou, se o endereço do proxy entrar nele, todo mundo. Escolha '%2$s', ou deixe o servidor web resolver primeiro o endereço do visitante (mod_remoteip)."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_REPORTINGONLY="'Somente relatório' registra as falhas de login e envia notificações, mas não bloqueia ninguém: seu site não está protegido. Confirme abaixo que é isso que você pretende."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_UNPROTECTED="Seu site não está protegido agora: com 'Somente relatório', o atraso das falhas de login era toda a proteção das suas configurações anteriores, e a atualização removeu os atrasos. Escolha 'Somente login' ou '%2$s'."
COM_BFSTOP_SETUP_RECOMMENDED="recomendado"
COM_BFSTOP_SETUP_BLOCKMODE_LOGINONLY_DESC="Um endereço bloqueado pode navegar no site, mas seus logins são recusados."
COM_BFSTOP_SETUP_BLOCKMODE_FULL_DESC="Toda requisição de um endereço bloqueado é recusada (exceto a página de desbloqueio e a recuperação de senha)."
COM_BFSTOP_SETUP_BLOCKMODE_HTACCESS_DESC="Como 'Site inteiro', e o servidor web também recusa os endereços bloqueados, a partir do arquivo .htaccess (Apache 2.4; não atrás de um proxy)."
COM_BFSTOP_SETUP_BLOCKMODE_OFF_DESC="As falhas de login são registradas e notificadas, ninguém é bloqueado."
COM_BFSTOP_SETUP_BLOCKMODE_CONFIRM_OFF="Com 'Somente relatório': sei que ele não bloqueia ninguém."
COM_BFSTOP_SETUP_NGINX_INCLUDE="Inclua o arquivo no bloco server da configuração do nginx do seu site, e faça o nginx recarregar quando ele mudar:"
