COM_BFSTOP_LOG_CLEAR_TITLE="Esvaziar o log"
COM_BFSTOP_LOG_CLEAR_DESC="Todas as entradas do log serão excluídas permanentemente, inclusive as do arquivo de log anterior. Isso não pode ser desfeito. Os bloqueios e as entradas de logins com falha não são afetados."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Esvaziar"
COM_BFSTOP_LOG_CLEARED="O log foi esvaziado."
COM_BFSTOP_SETTINGS_NOTIFY_ANY_NEEDS_LIVE_SITE="Links de desbloqueio só podem ser enviados se o endereço do site estiver definido ($live_site no configuration.php do site). Defina-o lá, ou desative os links de desbloqueio."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_ABOVE_BLOCK_NUMBER="\"%1$s\" (%2$d) não pode ser maior que \"%3$s\" (%4$d): todo cliente teria %2$d tentativas. Diminua \"%1$s\", ou aumente \"%3$s\"."
COM_BFSTOP_SETTINGS_HTACCESS_NEEDS_APACHE="Este site roda no nginx, que não lê arquivos .htaccess: o modo de bloqueio '%1$s' não pode funcionar aqui. Escolha '%2$s'; o nginx pode negar endereços na sua própria configuração."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_LABEL="Arquivo de negação do nginx"
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_DESC="Apenas para sites servidos pelo nginx, que não lê arquivos .htaccess: um arquivo (um caminho absoluto, terminado em .conf) em que o BFStop mantém os bloqueios ativos, como linhas 'deny', para o bloco server da configuração do nginx do site incluir. O nginx só o lê ao ser recarregado: providencie que ele seja recarregado quando o arquivo mudar (por exemplo, com uma unidade path do systemd ou uma tarefa cron que execute 'nginx -t &amp;&amp; nginx -s reload'). Endereços da lista de permissões e proxies confiáveis são omitidos. Vazio: nenhum arquivo."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_PATH="Não é um arquivo que o BFStop possa escrever como arquivo de negação do nginx: %1$s. Precisa ser o caminho absoluto de um arquivo cujo nome termine em %2$s."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_DIRECTORY="O diretório do arquivo de negação do nginx %1$s não existe ou não pode ser gravado."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_FOREIGN="%1$s existe e não foi escrito pelo BFStop: seria sobrescrito. Escolha um arquivo novo."
COM_BFSTOP_WARNING_NO_LIVE_SITE="O endereço do site não está definido ($live_site no configuration.php). O Joomla! então monta os links dos e-mails do Brute Force Stop com o host indicado em cada requisição, que um visitante pode escolher livremente - por isso nenhum link de desbloqueio é enviado e as notificações aos administradores não indicam nenhum endereço. Para definir o endereço, adicione esta linha à classe no configuration.php do site, com o endereço pelo qual o site é acessado (proposto a partir desta requisição, verifique-o): %s"
COM_BFSTOP_WARNING_NOTIFY_ANY_WITHOUT_LIVE_SITE="Links de desbloqueio devem ser enviados (<a href=\"%s\">configurações</a>), mas o endereço do site não está definido ($live_site no configuration.php): nenhum link de desbloqueio é enviado."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_56="/56 (recomendado)"
COM_BFSTOP_IP_NETWORK_TOO_LARGE="A rede %1$s é grande demais: o comprimento do prefixo deve ser de pelo menos /%2$d para IPv4 e /%3$d para IPv6."
COM_BFSTOP_IPADDRESS_TRUSTED_PROXY="Isto é (ou contém) um proxy confiável das configurações: bloqueado no arquivo .htaccess, toda requisição que passa por ele seria recusada."
COM_BFSTOP_SETTINGS_HTACCESS_NOT_TIDIED="O Brute Force Stop não conseguiu retirar seus bloqueios de <code>%s</code>, que não bloqueia mais: o servidor web continua recusando esses endereços, mesmo depois que seus bloqueios terminam. Torne o arquivo gravável e retire-os manualmente - eles estão nas linhas &lt;If&gt; entre '# BEGIN BFStop Blocks' e '# END BFStop Blocks'."
COM_BFSTOP_BLOCK_HTACCESS_NOT_WRITTEN="O bloqueio foi salvo, mas não pôde ser adicionado a <code>%s</code>: o Joomla recusa o endereço, o servidor web não."

