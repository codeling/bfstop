COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="O Super Usuário está usando o nome de usuário padrão 'admin'. Isso é um risco de segurança; os atacantes sabem que esse nome de usuário existe em muitas instalações do Joomla!, por isso ele é muito usado em vários ataques. Para aumentar a segurança, recomenda-se alterar o nome de usuário do Super Usuário! Veja também: <a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Joomla! Security and Performance FAQ: Why should I immediately change the name of the default admin user after a new install?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="Ou você não está usando um servidor Apache, ou o arquivo .htaccess não existe ou não pode ser lido nem gravado. O bloqueio via .htaccess não vai funcionar."
COM_BFSTOP_WARNING_HTACCESS_NGINX="Este site roda no nginx, que não lê arquivos .htaccess: com o modo de bloqueio '%1$s', nenhum endereço é recusado pelo servidor web, apenas pelo BFStop, como com '%2$s'. Escolha '%2$s' nas configurações; o nginx pode negar endereços na sua própria configuração."
COM_BFSTOP_WARNING_HTACCESS_LITESPEED="Este site roda no LiteSpeed, que lê arquivos .htaccess, mas não todas as diretivas do Apache: se ele respeita as seções &lt;If&gt; com que o BFStop bloqueia endereços depende da sua edição e versão. Verifique se o servidor web recusa um endereço bloqueado, ou escolha '%2$s' nas configurações."
COM_BFSTOP_HTACCESS_CHECK="Verificar .htaccess"
COM_BFSTOP_HTACCESS_CHECK_EFFECTIVE="O servidor web respeita a seção de bloqueios do arquivo .htaccess em %s: uma requisição de teste que ele deve recusar foi recusada."
COM_BFSTOP_HTACCESS_CHECK_IGNORED="O servidor web ignora a seção de bloqueios do arquivo .htaccess em %s: uma requisição de teste que ele deveria ter recusado passou. O Apache precisa poder ler ali diretivas de autorização (AllowOverride AuthConfig, ou All). O nginx não lê arquivos .htaccess, o OpenLiteSpeed lê apenas as regras de reescrita deles, e o LiteSpeed Enterprise pode não suportar todas as diretivas que a seção de bloqueios usa."
COM_BFSTOP_HTACCESS_CHECK_BROKEN="O servidor web falhou em um arquivo de teste com as diretivas da seção de bloqueios (status 500): ele não as entende (elas precisam do Apache 2.4 ou posterior). A seção de bloqueios quebraria o site em %s da mesma forma; o log de erros do servidor web diz mais."
