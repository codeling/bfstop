COM_BFSTOP_FAILEDLOGIN_FILTER_CLEAR="Show all"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Usernames Not Matching an Account"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Users often type their password into the username field. With 'Hash', the username of a failed login is only stored (and shown, logged and mailed) as typed if it belongs to an existing account or is on the list of common usernames; anything else is replaced by an unreadable value, which is still the same for the same input, so attempts against it are counted together. 'Store as typed' keeps every entered username readable, but then also stores passwords typed into the username field."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Hash (recommended)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Store as typed"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="Not a valid email address: %s"
COM_BFSTOP_SETTINGS_PROXY_IP_INVALID="Not a valid proxy address: %1$s. Each entry has to be an IP address or a network in CIDR notation, with a prefix length of at least /%2$d for IPv4 and /%3$d for IPv6."
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="The .htaccess path has to be an existing directory of the server's file system."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="The GeoIP database path has to be the name of a MaxMind database file (ending in .mmdb) in the server's file system."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="IPv6 Tracking Granularity"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="A client with an IPv6 address usually controls a whole network and can switch to another address in it at will. Failed logins and blocks of IPv6 clients are therefore tracked per network of this size instead of per address. A /64 is a single local network; a home, mobile or business connection is usually given at least a /56 - 256 such networks, from any of which its owner can send requests - which is why /56 is recommended. Choose a smaller network or a single address only if you know that clients on your site share their networks with others whom you don't want to be blocked together."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Single address (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Log File Size Limit (MB)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Once the log file is bigger than this, it is moved to a second file (plg_system_bfstop.1.log.php in the logs directory), replacing the previous one. So the log files together never take much more than twice this size."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Keep Log Entries (Days)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Log entries older than this number of days are deleted automatically (once a day, even if logging is disabled in the meantime). Set to 0 to keep entries until the size limit is reached."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Log entries older than %1$d days are deleted automatically, and the log file is rotated once it exceeds %2$d MB. You can change this in the 'Advanced' tab of the <a href=\"%3$s\">Settings</a>."
