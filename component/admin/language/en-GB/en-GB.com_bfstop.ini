COM_BFSTOP_SETUP_CLEANUP_INTRO="While BFStop took the proxy's address for every visitor's, it counted their failed logins against the proxy, may have blocked it (which blocks everybody, and makes the next block permanent after a few), and remembered it as an address every user has logged in from. This step removes what BFStop holds of the trusted proxies."
