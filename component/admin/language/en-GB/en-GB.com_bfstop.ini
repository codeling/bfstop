COM_BFSTOP_SETUP_PROXY_ERROR_UNSUPPORTED="Your proxy only sends headers Brute Force Stop can't use: there is a proxy, so 'no proxy' would block everybody behind it. Have the proxy send a header BFStop reads first."
COM_BFSTOP_SETUP_PROXY_ERROR_ACKNOWLEDGE="Your request came through a proxy. Without proxy settings, Brute Force Stop would block the proxy, which means everyone: confirm that the site is reached directly all the same, or configure the proxy."
COM_BFSTOP_SETUP_PROXY_ERROR_CONFIRM="Check the settings with your request, and confirm that the address shown is your computer's, before they are saved."
COM_BFSTOP_SETUP_PROXY_ERROR_HEADER="Choose a header Brute Force Stop reads."
COM_BFSTOP_SETUP_PROXY_ERROR_TRUSTED="Enter the address (or network) of your proxy."
COM_BFSTOP_SETUP_REMINDER="Keep these settings up to date. Whenever your hosting changes (a new proxy or CDN, load balancer nodes added or replaced, a move to another host), run the proxy check again. Wrong settings can block every visitor, or let attackers choose the address they are counted under."
