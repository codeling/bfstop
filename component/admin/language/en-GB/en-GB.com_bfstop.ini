COM_BFSTOP_WARNING_PLUGIN_DISABLED="BFStop plugin is not enabled! Please go to the <a href=\"%s\">plugin overview</a>, search for 'Brute Force Stop', and enable the 'System - Brute Force Stop' plugin - it needs to be running for blocking to take effect. All BFStop settings are configured here in this component, not on the plugin itself."
COM_BFSTOP_WARNING_PROXY_NOT_CONFIGURED="A proxy/load balancer header (e.g. X-Forwarded-For) was detected on this request, but 'Behind a proxy / load balancer' is not enabled in the <a href=\"%s\">component settings</a>. Without this configured, BFStop only trusts the direct connection address, so IP-based blocking may not work correctly behind your proxy. If your site does sit behind a reverse proxy or load balancer, go to the component's Settings view and enable and configure the 'Proxy / Load Balancer' options - otherwise a visitor could forge this header to get an arbitrary IP address blocked."
