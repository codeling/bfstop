COM_BFSTOP_SETUP_START="Start"
COM_BFSTOP_SETUP_OVERVIEW_INSTALL="Welcome to Brute Force Stop. Before it starts to block anybody, it has to know how visitors reach your site: directly, or through a proxy, a load balancer or a CDN. Behind a proxy, every visitor seems to come from the proxy's address - without the right settings, a few failed logins would block everybody."
COM_BFSTOP_SETUP_OVERVIEW_UPGRADE="Brute Force Stop has been updated from version %s. This is what the update did:"
COM_BFSTOP_SETUP_OVERVIEW_DID_SETTINGS="The settings moved from the Plugin Manager into this component."
COM_BFSTOP_SETUP_OVERVIEW_DID_BLOCKMODE="The former switches 'Block enabled' and 'Use .htaccess' became the blocking mode '%s'."
COM_BFSTOP_SETUP_OVERVIEW_DID_API="Logins through Joomla's Web Services API are protected too now (the setting 'Active for')."
COM_BFSTOP_SETUP_OVERVIEW_DID_ADDRESSES="The addresses of the block list and the allow list were brought into one spelling."
COM_BFSTOP_SETUP_OVERVIEW_DID_MAINTENANCE="The daily maintenance is a task of Joomla's Task Scheduler now."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS="A block section which earlier versions wrote into the .htaccess file, if there was one, was rewritten in the current form."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS_FAILED="The block section which earlier versions wrote into the .htaccess file could not be rewritten: it lets everybody who isn't blocked past the other access controls of that directory. Make the file writable and run the update again, or remove the section by hand."
COM_BFSTOP_SETUP_OVERVIEW_DID_DELAYS="The delay of the response to failed logins, which your settings used, was removed: Brute Force Stop answers at once now and blocks as before."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_PROXY="The update disabled Brute Force Stop: the request of the update came through a proxy, a load balancer or a CDN, and without proxy settings, BFStop would block the proxy's address, which means everyone. It stays disabled until this assistant has been completed."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_LOADBALANCER="The update disabled Brute Force Stop: Joomla's 'Behind Load Balancer' is on, so the site appears to be behind a proxy, and without proxy settings, BFStop would block the proxy's address, which means everyone. It stays disabled until this assistant has been completed."
COM_BFSTOP_SETUP_OVERVIEW_STEPS="The assistant goes through the settings which need your decision: how visitors reach the site, and the blocking mode. Each step proposes what fits what it detects; the last one activates protection."
COM_BFSTOP_SETUP_PROXY_INTRO="Brute Force Stop counts failed logins per visitor address. Behind a proxy, a load balancer or a CDN, the web server sees the proxy's address for every visitor, and the visitor's address is in a header the proxy adds - which only counts if the request came from a proxy you trust. Your own request to this page shows what applies to your site."
COM_BFSTOP_SETUP_PROXY_DETECTED="What your request shows"
COM_BFSTOP_SETUP_PROXY_REMOTE_PUBLIC="Your request reached the web server from %s, an address on the internet."
COM_BFSTOP_SETUP_PROXY_REMOTE_PRIVATE="Your request reached the web server from %s, an address of a private or local network - usually that of a proxy or load balancer."
COM_BFSTOP_SETUP_PROXY_HEADER_UNSUPPORTED="It carried the header %s, which Brute Force Stop doesn't read."
COM_BFSTOP_SETUP_SCENARIO_A="Your site appears to be reached directly: there is no proxy to configure."
COM_BFSTOP_SETUP_SCENARIO_B="Your site appears to be behind a reverse proxy or load balancer. Without proxy settings, BFStop would count every visitor's failed logins against the proxy's address and block everybody."
COM_BFSTOP_SETUP_SCENARIO_C="Your web server already takes the visitor's address from the proxy's header (mod_remoteip, nginx's real_ip): BFStop must not read the header again. Keep its proxy setting off."
COM_BFSTOP_SETUP_SCENARIO_D="Your site appears to be behind a CDN (or your own network adds a forwarding header on the way out). Without proxy settings, BFStop would block the CDN's servers, and with them random visitors."
COM_BFSTOP_SETUP_SCENARIO_E="Your proxy only sends headers Brute Force Stop can't use. It stays inactive until the proxy sends a header it reads, or the web server resolves the address."
COM_BFSTOP_SETUP_UNSUPPORTED="Your proxy sends %s, which Brute Force Stop can't use."
COM_BFSTOP_SETUP_UNSUPPORTED_USE_OTHER="Your request also carried a header which BFStop reads: choose that one below."
COM_BFSTOP_SETUP_UNSUPPORTED_FIX="Have the proxy append to X-Forwarded-For (nginx: <code>proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</code>), or let the web server resolve the address with its real-IP module (Apache's mod_remoteip, nginx's real_ip)."
COM_BFSTOP_SETUP_UNSUPPORTED_ISSUE="Tell us about your setup (opens a new issue on GitHub, with the header names, the detected scenario and the versions only)"
COM_BFSTOP_SETUP_CLOUDFLARE_WARNING="Your site appears to be behind Cloudflare. Trusting all of Cloudflare's addresses lets anyone who uses Cloudflare reach your server with an address of their choice in CF-Connecting-IP (a Worker in their own zone can set it). That is only safe if your server accepts Cloudflare's traffic for your zone alone: Authenticated Origin Pulls with a certificate of your zone, Cloudflare Tunnel, or a firewall rule. Otherwise, let the web server resolve the address with its real-IP module, and keep BFStop's proxy setting off."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH="Fetch Cloudflare's address ranges"
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH_DESC="Fetches the ranges Cloudflare publishes (www.cloudflare.com/ips-v4 and ips-v6) as the trusted proxies, with the header CF-Connecting-IP. Only when you click: nothing is sent anywhere else."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCHED="Fetched %d address ranges of Cloudflare. Check them with your request before saving."
COM_BFSTOP_SETUP_CLOUDFLARE_FAILED="Cloudflare's address ranges could not be fetched. Enter them by hand, from www.cloudflare.com/ips."
COM_BFSTOP_SETUP_PROXY_CHOICE="How is your site reached?"
COM_BFSTOP_SETUP_PROXY_CHOICE_NONE="There is no proxy to configure: visitors reach the site directly, or the web server already resolves their address."
COM_BFSTOP_SETUP_PROXY_ACKNOWLEDGE="I am sure: the forwarding header your request carried doesn't come from a proxy in front of this site (but, say, from my own network)."
COM_BFSTOP_SETUP_PROXY_CHOICE_PROXY="The site is behind a proxy, load balancer or CDN, which sends the visitor's address in this header:"
COM_BFSTOP_SETUP_PROXY_HEADER_PRESENT="(your request has it)"
COM_BFSTOP_SETUP_PROXY_TRUSTED_DESC="The address the proxy connects to the web server from is proposed. If there is more than one proxy node (several load balancers, a CDN), list all of them, or the narrowest network which contains them all (no wider than /8 for IPv4 or /16 for IPv6)."
