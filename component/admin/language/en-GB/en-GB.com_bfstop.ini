COM_BFSTOP_USERNAMESTATS_INFO="The usernames used in failed login attempts, and how often each was used. These statistics are kept independently of the failed login entries, so they are not affected when old failed login entries are deleted; they only start with the installation of (or update to) BFStop 2.0.0, seeded from the failed login entries which existed at that time. Click a username to see its failed login entries that are still stored."
