COM_BFSTOP_SETUP_MISMATCH_UNSUPPORTEDHEADER="Your proxy only sends headers Brute Force Stop can't use."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHON="Joomla's own 'Behind Load Balancer' (Global Configuration, Server) is off: Joomla's sessions, the User Actions Log (with Brute Force Stop's entries) and the privacy tools record the proxy's address. Switch it on, but only if the site can't be reached except through the proxy: Joomla trusts the header from anyone. Brute Force Stop doesn't use this setting."
