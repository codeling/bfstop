COM_BFSTOP_SETUP_HTACCESS_INTRO="The .htaccess file %s still has the block section earlier versions wrote, which the update could not rewrite. It lets everybody who isn't blocked past the other access controls of that directory (password protection, IP restrictions). Make the file writable and rewrite it here, or remove the lines between '# BEGIN BFStop Blocks' and '# END BFStop Blocks' by hand."
COM_BFSTOP_SETUP_HTACCESS_FINE="The block section of %s is in its current form."
COM_BFSTOP_SETUP_HTACCESS_CURRENT="The section now"
COM_BFSTOP_SETUP_HTACCESS_PROPOSED="The section rewritten"
COM_BFSTOP_SETUP_HTACCESS_RUN="Rewrite the section"
COM_BFSTOP_SETUP_HTACCESS_DONE="The block section of the .htaccess file is in its current form."
COM_BFSTOP_SETUP_HTACCESS_ERROR_WRITE="The block section of %s could not be rewritten: make the file writable, and try again."
COM_BFSTOP_SETUP_NOTIFY_INTRO="Who is told about failed logins and blocks, and whether a user whose username got an address blocked gets a link to unblock it."
COM_BFSTOP_SETUP_NOTIFY_MEANING="The meaning of the unblock mails changed with this update. Version 1.x sent the link for any address; now this setting has three values: 'only if the user has logged in from that address before' (recommended: where somebody locks themselves out, but never an attacker's address), 'for any IP address' (anybody can make the site mail any user by failing to log in as them; at most one usable link per user at a time) and off. Your setting was taken over as the first. Both need the site's address ($live_site). Choose below."
COM_BFSTOP_SETUP_PARTS_INTRO="Where Brute Force Stop counts failed logins and turns blocked addresses away: the site (frontend), the administrator backend, and Joomla's Web Services API, whose logins use API tokens or HTTP Basic authentication."
COM_BFSTOP_SETUP_PARTS_API_TOKENS="Users with an enabled API token: %d. An integration using the API from an address whose logins may fail can get that address blocked."
COM_BFSTOP_SETUP_PARTS_ERROR_NONE="Choose at least one part: Brute Force Stop would protect nothing."
COM_BFSTOP_SETUP_PRIVACY_FAILEDLOGINS="Brute Force Stop holds %1$d failed logins, the oldest from %2$s. They hold addresses and usernames: personal data."
COM_BFSTOP_SETUP_PRIVACY_NO_FAILEDLOGINS="Brute Force Stop holds no failed logins."
COM_BFSTOP_SETUP_HASHING_HEADING="Usernames stored in plain text"
COM_BFSTOP_SETUP_HASHING_DESC="Version 1.x stored every username typed into the login form - also passwords typed there by mistake - and the update copied them into the username statistics, which are not purged by age. New ones which belong to no account are stored as a hash since 2.0, old ones are not. This replaces the old ones by their hash as well, in rounds of a few seconds: usernames of accounts and the common usernames of the settings stay readable, and statistics which end up with the same hash are merged. It can't be undone."
COM_BFSTOP_SETUP_HASHING_RUN="Hash old usernames"
COM_BFSTOP_SETUP_HASHING_CONTINUE="Continue hashing"
COM_BFSTOP_SETUP_HASHING_PROGRESS="%d usernames hashed so far. Continue to hash the rest."
COM_BFSTOP_SETUP_HASHING_DONE="All old usernames which belong to no account are hashed now (%d in this run)."
COM_BFSTOP_SETUP_PRIVACY_LOG="The log file (%1$s) holds usernames too: clear it on the <a href=\"%2$s\">log page</a> if you like."
COM_BFSTOP_SETUP_RATELIMIT_INTRO="The update removed the delay of the response to failed logins, which your settings used: a delayed response holds a PHP worker for the whole delay, which attackers can use to run the server out of them, and it hardly slows them down. Blocking still stops them; to slow clients down, use rate limiting in front of PHP."
COM_BFSTOP_SETUP_RATELIMIT_DIRECT="Your site is reached directly: the rate limiting of the web server works, e.g. nginx's limit_req, Apache's mod_evasive or mod_qos, or fail2ban (see the README of BFStop)."
COM_BFSTOP_SETUP_RATELIMIT_PROXY="Your site is behind a proxy or CDN: the web server only sees the proxy's address, so limits per address would slow down every visitor at once, and fail2ban would ban the proxy. Rate-limit at the proxy or CDN instead, or let the web server resolve the visitor's address first (its real-IP module)."
COM_BFSTOP_SETUP_RATELIMIT_RESOLVED="Your web server resolves the visitor's address itself: its rate limiting works, with the address the real-IP module sets."
COM_BFSTOP_SETUP_SCHEDULER_INTRO="Brute Force Stop purges what it stores for too long, trims its tables and takes expired blocks out of the .htaccess file once a day, as a task of Joomla's Task Scheduler."
COM_BFSTOP_SETUP_SCHEDULER_PLUGIN_ON="The plugin 'Task - Brute Force Stop' is enabled."
COM_BFSTOP_SETUP_SCHEDULER_PLUGIN_OFF="The plugin 'Task - Brute Force Stop' is not enabled."
COM_BFSTOP_SETUP_SCHEDULER_NO_TASK="There is no task 'Brute Force Stop maintenance'."
COM_BFSTOP_SETUP_SCHEDULER_TASK_ON="The task '%1$s' is enabled; last run: %2$s, next run: %3$s."
COM_BFSTOP_SETUP_SCHEDULER_TASK_OFF="The task '%1$s' is disabled; last run: %2$s."
COM_BFSTOP_SETUP_SCHEDULER_LAZY_ON="The Task Scheduler runs due tasks in the requests of visitors ('Lazy Scheduler')."
COM_BFSTOP_SETUP_SCHEDULER_LAZY_OFF="The Task Scheduler's 'Lazy Scheduler' is off: due tasks only run if a cron job runs them (php cli/joomla.php scheduler:run)."
COM_BFSTOP_SETUP_SCHEDULER_FALLBACK="Without an enabled task, a visitor's request runs the maintenance once it hasn't run for two days."
COM_BFSTOP_SETUP_SCHEDULER_TASKS_LINK="Scheduled Tasks"
COM_BFSTOP_SETUP_SCHEDULER_PLUGINS_LINK="Task plugins"
COM_BFSTOP_SETUP_SCHEDULER_OPTIONS_LINK="Options of the Task Scheduler"
COM_BFSTOP_SETUP_SUMMARY_CHANGED_DEFAULTS="Defaults of 2.0 which change what an updated site does:"
COM_BFSTOP_SETUP_SUMMARY_DEFAULT_ACCOUNT="'Distributed Attacks on One Account': while an account is attacked from many addresses, its attackers get blocked sooner (3 risk points by default)."
COM_BFSTOP_SETUP_SUMMARY_DEFAULT_RISK="Risk scoring: a common username or a missing user agent lowers the number of attempts allowed."
COM_BFSTOP_SETUP_SUMMARY_DEFAULT_IPV6="IPv6 clients are tracked per /56 network."
COM_BFSTOP_SETUP_SUMMARY_DEFAULT_LOG="BFStop's log is pruned after 28 days, on the first maintenance run."
COM_BFSTOP_SETUP_SUMMARY_DEFAULT_DELAY="Responses to failed logins are no longer delayed."
COM_BFSTOP_SETUP_SUMMARY_DEFAULT_SCHEDULER="The daily maintenance is a task of Joomla's Task Scheduler."
COM_BFSTOP_ACTIONLOG_USERNAMES_HASHED="User <a href=\"{accountlink}\">{username}</a> hashed the usernames which 1.x of Brute Force Stop stored in plain text"
