COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOHEADER="Your request didn't carry this header: choose one it has (see above)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_UNUSABLE="This header of your request doesn't end in an address which isn't one of the trusted proxies: Brute Force Stop couldn't tell your address. Check the header and the trusted proxies."
