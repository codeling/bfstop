COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="El superusuari utilitza el nom d'usuari per defecte «admin». Això és un risc de seguretat; els atacants saben que aquest nom d'usuari existeix en moltes instal·lacions de Joomla!, per això s'utilitza molt sovint en molts atacs. Per augmentar la seguretat es recomana canviar el nom d'usuari del superusuari! Vegeu també: <a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Joomla! Security and Performance FAQ: Why should I immediately change the name of the default admin user after a new install?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="O bé no feu servir un servidor Apache, o bé el fitxer .htaccess no existeix o no es pot llegir o escriure. El bloqueig mitjançant .htaccess no funcionarà."
COM_BFSTOP_WARNING_HTACCESS_NGINX="Aquest lloc funciona amb nginx, que no llegeix els fitxers .htaccess: amb el mode de bloqueig «%1$s», el servidor web no rebutja cap adreça, només ho fa BFStop, com amb «%2$s». Trieu «%2$s» a la configuració; nginx pot denegar adreces a la seva pròpia configuració."
COM_BFSTOP_WARNING_HTACCESS_LITESPEED="Aquest lloc funciona amb LiteSpeed, que llegeix els fitxers .htaccess, però no totes les directives d'Apache: que respecti les seccions &lt;If&gt; amb què BFStop bloqueja adreces depèn de la seva edició i versió. Comproveu que el servidor web rebutja una adreça bloquejada, o trieu «%2$s» a la configuració."
COM_BFSTOP_HTACCESS_CHECK="Comprova .htaccess"
COM_BFSTOP_HTACCESS_CHECK_EFFECTIVE="El servidor web respecta la secció de bloquejos del fitxer .htaccess a %s: una sol·licitud de prova que ha de rebutjar s'ha rebutjat."
COM_BFSTOP_HTACCESS_CHECK_IGNORED="El servidor web ignora la secció de bloquejos del fitxer .htaccess a %s: una sol·licitud de prova que hauria d'haver rebutjat ha passat. Apache ha de poder llegir-hi directives d'autorització (AllowOverride AuthConfig, o All). nginx no llegeix fitxers .htaccess, OpenLiteSpeed només en llegeix les regles de reescriptura i és possible que LiteSpeed Enterprise no admeti totes les directives que fa servir la secció de bloquejos."
COM_BFSTOP_HTACCESS_CHECK_BROKEN="El servidor web ha fallat amb un fitxer de prova amb les directives de la secció de bloquejos (estat 500): no les entén (necessiten Apache 2.4 o posterior). La secció de bloquejos trencaria el lloc a %s de la mateixa manera; el registre d'errors del servidor web en diu més."
