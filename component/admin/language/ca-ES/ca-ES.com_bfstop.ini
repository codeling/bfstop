COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Noms d'usuari que no corresponen a cap compte"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Sovint els usuaris escriuen la contrasenya al camp del nom d'usuari. Amb «Hash», el nom d'usuari d'un inici de sessió fallit només es guarda (i es mostra, registra i envia per correu) tal com s'ha escrit si pertany a un compte existent o és a la llista de noms d'usuari comuns; qualsevol altre se substitueix per un valor il·legible que, tanmateix, és el mateix per a la mateixa entrada, de manera que els intents amb ell es compten junts. «Desa tal com s'ha escrit» manté llegible cada nom d'usuari introduït, però aleshores també desa les contrasenyes escrites al camp del nom d'usuari."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Hash (recomanat)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Desa tal com s'ha escrit"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="No és una adreça de correu electrònic vàlida: %s"
COM_BFSTOP_SETTINGS_PROXY_IP_INVALID="No és una adreça de proxy vàlida: %1$s. Cada entrada ha de ser una adreça IP o una xarxa en notació CIDR, amb una longitud del prefix de com a mínim /%2$d per a IPv4 i /%3$d per a IPv6."
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="La ruta de .htaccess ha de ser un directori existent del sistema de fitxers del servidor."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="La ruta de la base de dades GeoIP ha de ser el nom d'un fitxer de base de dades de MaxMind (que acabi en .mmdb) del sistema de fitxers del servidor."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="Granularitat del seguiment d'IPv6"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="Un client amb adreça IPv6 sol controlar tota una xarxa i pot canviar a una altra adreça d'aquesta xarxa quan vulgui. Per això els inicis de sessió fallits i els bloquejos dels clients IPv6 es registren per xarxa d'aquesta mida en lloc de per adreça. Un /64 és una sola xarxa local; una connexió domèstica, mòbil o d'empresa sol rebre com a mínim un /56 - 256 xarxes d'aquest tipus, des de qualsevol de les quals el seu titular pot enviar peticions -, per això es recomana /56. Trieu una xarxa més petita o una sola adreça només si sabeu que els clients del vostre lloc comparteixen les seves xarxes amb altres que no voleu que es bloquegin alhora."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Adreça única (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Límit de mida del fitxer de registre (MB)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Quan el fitxer de registre supera aquesta mida, es trasllada a un segon fitxer (plg_system_bfstop.1.log.php al directori de registres), que substitueix l'anterior. Així, els fitxers de registre junts mai no ocupen gaire més del doble d'aquesta mida."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Conserva les entrades del registre (dies)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Les entrades del registre amb més d'aquest nombre de dies s'eliminen automàticament (un cop al dia, encara que entretant es desactivi el registre). Useu 0 per conservar les entrades fins que s'arribi al límit de mida."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Les entrades del registre amb més de %1$d dies s'eliminen automàticament i el fitxer de registre es rota quan supera els %2$d MB. Podeu canviar-ho a la pestanya «Avançat» de la <a href=\"%3$s\">Configuració</a>."
COM_BFSTOP_LOG_AUTOPRUNE_DISABLED="Actualment les entrades antigues del registre no s'eliminen per antiguitat, només quan el fitxer de registre es rota en superar els %1$d MB. Per canviar-ho, configureu «Conserva les entrades del registre» a la <a href=\"%2$s\">Configuració</a>, o feu servir els botons «Depura el registre» i «Buida el registre»."
COM_BFSTOP_LOG_PRUNE_BUTTON="Depura el registre"
COM_BFSTOP_LOG_PRUNE_DISABLED="Depurar requereix un període de conservació: configureu «Conserva les entrades del registre» a la <a href=\"%s\">Configuració</a>, o buideu el registre."
COM_BFSTOP_LOG_PRUNE_N_DELETED="S'han eliminat %1$d entrades del registre amb més de %2$d dies."
COM_BFSTOP_LOG_PRUNE_N_DELETED_0="No hi havia entrades del registre amb més de %2$d dies."
COM_BFSTOP_LOG_PRUNE_N_DELETED_1="S'ha eliminat una entrada del registre amb més de %2$d dies."
COM_BFSTOP_LOG_CLEAR_BUTTON="Buida el registre"
COM_BFSTOP_LOG_CLEAR_TITLE="Buida el registre"
COM_BFSTOP_LOG_CLEAR_DESC="Totes les entrades del registre s'eliminaran de manera permanent, incloses les del fitxer de registre anterior. Aquesta acció no es pot desfer. Els bloquejos i les entrades d'inicis de sessió fallits no es veuen afectats."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Buida"
COM_BFSTOP_LOG_CLEARED="S'ha buidat el registre."
COM_BFSTOP_SETTINGS_NOTIFY_ANY_NEEDS_LIVE_SITE="Els enllaços de desbloqueig només es poden enviar si l'adreça del lloc està definida ($live_site al configuration.php del lloc). Definiu-la allà, o desactiveu els enllaços de desbloqueig."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_ABOVE_BLOCK_NUMBER="\"%1$s\" (%2$d) no pot ser més alt que \"%3$s\" (%4$d): cada client tindria %2$d intents. Reduïu \"%1$s\", o augmenteu \"%3$s\"."
COM_BFSTOP_SETTINGS_HTACCESS_NEEDS_APACHE="Aquest lloc funciona amb nginx, que no llegeix els fitxers .htaccess: el mode de bloqueig «%1$s» no pot funcionar aquí. Trieu «%2$s»; nginx pot denegar adreces a la seva pròpia configuració."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_LABEL="Fitxer de denegació de nginx"
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_DESC="Només per a llocs servits per nginx, que no llegeix fitxers .htaccess: un fitxer (un camí absolut, acabat en .conf) on BFStop manté els bloquejos actius, com a línies «deny», perquè el bloc server de la configuració de nginx del lloc l'inclogui. nginx només el llegeix quan es recarrega: feu que es recarregui quan el fitxer canviï (p. ex., amb una unitat path de systemd o una tasca cron que executi «nginx -t &amp;&amp; nginx -s reload»). S'ometen les adreces de la llista de permesos i els proxies de confiança. Buit: cap fitxer."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_PATH="No és un fitxer que BFStop pugui escriure com a fitxer de denegació de nginx: %1$s. Ha de ser el camí absolut d'un fitxer el nom del qual acabi en %2$s."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_DIRECTORY="El directori del fitxer de denegació de nginx %1$s no existeix o no s'hi pot escriure."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_FOREIGN="%1$s existeix i no l'ha escrit BFStop: se sobreescriuria. Trieu un fitxer nou."
COM_BFSTOP_WARNING_NO_LIVE_SITE="L'adreça del lloc no està definida ($live_site al configuration.php). Llavors Joomla! construeix els enllaços dels correus de Brute Force Stop amb l'amfitrió indicat a cada petició, que un visitant pot triar lliurement - per això no s'envia cap enllaç de desbloqueig i les notificacions als administradors no indiquen cap adreça. Per definir l'adreça, afegiu aquesta línia a la classe del configuration.php del lloc, amb l'adreça amb què s'accedeix al lloc (proposada a partir d'aquesta petició, comproveu-la): %s"
COM_BFSTOP_WARNING_NOTIFY_ANY_WITHOUT_LIVE_SITE="S'han d'enviar enllaços de desbloqueig (<a href=\"%s\">configuració</a>), però l'adreça del lloc no està definida ($live_site al configuration.php): no s'envia cap enllaç de desbloqueig."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_56="/56 (recomanat)"
COM_BFSTOP_IP_NETWORK_TOO_LARGE="La xarxa %1$s és massa gran: la longitud del prefix ha de ser com a mínim /%2$d per a IPv4 i /%3$d per a IPv6."
COM_BFSTOP_IPADDRESS_TRUSTED_PROXY="Això és (o conté) un servidor intermediari de confiança de la configuració: si es bloqueja al fitxer .htaccess, es rebutjaria qualsevol petició que hi passi."
COM_BFSTOP_SETTINGS_HTACCESS_NOT_TIDIED="Brute Force Stop no ha pogut treure els seus bloquejos de <code>%s</code>, que ja no bloqueja: el servidor web continua rebutjant aquestes adreces, també quan els seus bloquejos s'han acabat. Feu que el fitxer es pugui escriure i traieu-les a mà - són a les línies &lt;If&gt; entre '# BEGIN BFStop Blocks' i '# END BFStop Blocks'."
COM_BFSTOP_BLOCK_HTACCESS_NOT_WRITTEN="El bloqueig s'ha desat, però no s'ha pogut afegir a <code>%s</code>: Joomla rebutja l'adreça, el servidor web no."

