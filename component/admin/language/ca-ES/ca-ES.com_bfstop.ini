COM_BFSTOP_SETUP_OVERVIEW_INSTALL="Benvinguts a Brute Force Stop. Abans de bloquejar ningú, ha de saber com arriben els visitants al vostre lloc: directament, o a través d'un proxy, un balancejador de càrrega o una CDN. Darrere d'un proxy, tots els visitants semblen venir de l'adreça del proxy: sense la configuració correcta, uns quants inicis de sessió fallits bloquejarien tothom."
COM_BFSTOP_SETUP_OVERVIEW_UPGRADE="Brute Force Stop s'ha actualitzat des de la versió %s. Això és el que ha fet l'actualització:"
COM_BFSTOP_SETUP_OVERVIEW_DID_SETTINGS="La configuració ha passat del Gestor de connectors a aquest component."
COM_BFSTOP_SETUP_OVERVIEW_DID_BLOCKMODE="Els antics interruptors 'Bloqueig activat' i 'Utilitza .htaccess' s'han convertit en el mode de bloqueig '%s'."
COM_BFSTOP_SETUP_OVERVIEW_DID_API="Els inicis de sessió a través de l'API de serveis web de Joomla ara també estan protegits (el paràmetre 'Actiu per a')."
COM_BFSTOP_SETUP_OVERVIEW_DID_ADDRESSES="Les adreces de la llista de bloquejos i de la llista de permesos s'han unificat en una sola grafia."
COM_BFSTOP_SETUP_OVERVIEW_DID_MAINTENANCE="El manteniment diari ara és una tasca del Planificador de tasques de Joomla."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS="Una secció de bloqueig que versions anteriors van escriure al fitxer .htaccess, si n'hi havia, s'ha reescrit en la forma actual."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS_FAILED="La secció de bloqueig que versions anteriors van escriure al fitxer .htaccess no s'ha pogut reescriure: deixa passar qualsevol que no estigui bloquejat per sobre dels altres controls d'accés d'aquest directori. Feu que el fitxer es pugui escriure i torneu a executar l'actualització, o elimineu la secció a mà."
COM_BFSTOP_SETUP_OVERVIEW_DID_DELAYS="S'ha eliminat el retard de la resposta als inicis de sessió fallits que feia servir la vostra configuració: Brute Force Stop ara respon de seguida i bloqueja com abans."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_PROXY="L'actualització ha desactivat Brute Force Stop: la petició de l'actualització va arribar a través d'un proxy, un balancejador de càrrega o una CDN, i sense configuració de proxy BFStop bloquejaria l'adreça del proxy, és a dir, tothom. Es manté desactivat fins que s'hagi completat aquest assistent."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_LOADBALANCER="L'actualització ha desactivat Brute Force Stop: 'Darrere d'un balancejador de càrrega' està activat a Joomla, de manera que el lloc sembla ser darrere d'un proxy, i sense configuració de proxy BFStop bloquejaria l'adreça del proxy, és a dir, tothom. Es manté desactivat fins que s'hagi completat aquest assistent."
COM_BFSTOP_SETUP_OVERVIEW_STEPS="L'assistent repassa els paràmetres que necessiten la vostra decisió: com arriben els visitants al lloc, i el mode de bloqueig. Cada pas proposa el que correspon al que detecta; l'últim activa la protecció."
COM_BFSTOP_SETUP_PROXY_INTRO="Brute Force Stop compta els inicis de sessió fallits per adreça de visitant. Darrere d'un proxy, un balancejador de càrrega o una CDN, el servidor web veu l'adreça del proxy per a cada visitant, i l'adreça del visitant és en una capçalera que afegeix el proxy, que només compta si la petició ve d'un proxy en què confieu. La vostra pròpia petició a aquesta pàgina mostra què s'aplica al vostre lloc."
COM_BFSTOP_SETUP_PROXY_DETECTED="Què mostra la vostra petició"
COM_BFSTOP_SETUP_PROXY_REMOTE_PUBLIC="La vostra petició va arribar al servidor web des de %s, una adreça d'Internet."
COM_BFSTOP_SETUP_PROXY_REMOTE_PRIVATE="La vostra petició va arribar al servidor web des de %s, una adreça d'una xarxa privada o local, normalment la d'un proxy o d'un balancejador de càrrega."
COM_BFSTOP_SETUP_PROXY_HEADER_UNSUPPORTED="Duia la capçalera %s, que Brute Force Stop no llegeix."
COM_BFSTOP_SETUP_SCENARIO_A="Sembla que s'arriba al vostre lloc directament: no hi ha cap proxy per configurar."
COM_BFSTOP_SETUP_SCENARIO_B="Sembla que el vostre lloc és darrere d'un proxy invers o d'un balancejador de càrrega. Sense configuració de proxy, BFStop comptaria els inicis de sessió fallits de tots els visitants a l'adreça del proxy i bloquejaria tothom."
COM_BFSTOP_SETUP_SCENARIO_C="El vostre servidor web ja pren l'adreça del visitant de la capçalera del proxy (mod_remoteip, real_ip de nginx): BFStop no ha de tornar a llegir la capçalera. Mantingueu desactivat el seu paràmetre de proxy."
COM_BFSTOP_SETUP_SCENARIO_D="Sembla que el vostre lloc és darrere d'una CDN (o la vostra pròpia xarxa afegeix una capçalera de reenviament en sortir). Sense configuració de proxy, BFStop bloquejaria els servidors de la CDN, i amb ells visitants a l'atzar."
COM_BFSTOP_SETUP_SCENARIO_E="El vostre proxy només envia capçaleres que Brute Force Stop no pot fer servir. Es manté inactiu fins que el proxy enviï una capçalera que llegeixi, o el servidor web resolgui l'adreça."
COM_BFSTOP_SETUP_UNSUPPORTED="El vostre proxy envia %s, que Brute Force Stop no pot fer servir."
COM_BFSTOP_SETUP_UNSUPPORTED_USE_OTHER="La vostra petició també duia una capçalera que BFStop llegeix: trieu-la a sota."
COM_BFSTOP_SETUP_UNSUPPORTED_FIX="Feu que el proxy afegeixi a X-Forwarded-For (nginx: <code>proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</code>), o deixeu que el servidor web resolgui l'adreça amb el seu mòdul real-IP (mod_remoteip d'Apache, real_ip de nginx)."
COM_BFSTOP_SETUP_UNSUPPORTED_ISSUE="Expliqueu-nos la vostra configuració (obre una nova incidència a GitHub, només amb els noms de les capçaleres, l'escenari detectat i les versions)"
COM_BFSTOP_SETUP_CLOUDFLARE_WARNING="Sembla que el vostre lloc és darrere de Cloudflare. Confiar en totes les adreces de Cloudflare permet a qualsevol que faci servir Cloudflare arribar al vostre servidor amb l'adreça que vulgui a CF-Connecting-IP (un Worker a la seva pròpia zona la pot definir). Només és segur si el vostre servidor accepta el trànsit de Cloudflare únicament per a la vostra zona: Authenticated Origin Pulls amb un certificat de la vostra zona, Cloudflare Tunnel o una regla de tallafoc. Si no, deixeu que el servidor web resolgui l'adreça amb el seu mòdul real-IP, i mantingueu desactivat el paràmetre de proxy de BFStop."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH="Obtenir els intervals d'adreces de Cloudflare"
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH_DESC="Obté els intervals que publica Cloudflare (www.cloudflare.com/ips-v4 i ips-v6) com a proxies de confiança, amb la capçalera CF-Connecting-IP. Només quan hi feu clic: no s'envia res enlloc més."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCHED="S'han obtingut %d intervals d'adreces de Cloudflare. Comproveu-los amb la vostra petició abans de desar."
COM_BFSTOP_SETUP_CLOUDFLARE_FAILED="No s'han pogut obtenir els intervals d'adreces de Cloudflare. Introduïu-los a mà, des de www.cloudflare.com/ips."
COM_BFSTOP_SETUP_PROXY_CHOICE="Com s'arriba al vostre lloc?"
COM_BFSTOP_SETUP_PROXY_CHOICE_NONE="No hi ha cap proxy per configurar: els visitants arriben al lloc directament, o el servidor web ja resol la seva adreça."
COM_BFSTOP_SETUP_PROXY_ACKNOWLEDGE="N'estic segur: la capçalera de reenviament de la vostra petició no ve d'un proxy davant d'aquest lloc (sinó, per exemple, de la meva pròpia xarxa)."
COM_BFSTOP_SETUP_PROXY_CHOICE_PROXY="El lloc és darrere d'un proxy, un balancejador de càrrega o una CDN, que envia l'adreça del visitant en aquesta capçalera:"
COM_BFSTOP_SETUP_PROXY_HEADER_PRESENT="(la vostra petició la porta)"
COM_BFSTOP_SETUP_PROXY_TRUSTED_DESC="Es proposa l'adreça des de la qual el proxy es connecta al servidor web. Si hi ha més d'un node de proxy (diversos balancejadors de càrrega, una CDN), indiqueu-los tots, o la xarxa més petita que els contingui tots (no més àmplia que /8 per a IPv4 o /16 per a IPv6)."
COM_BFSTOP_SETUP_PREVIEW="Comprovar amb la meva petició"
COM_BFSTOP_SETUP_PREVIEW_QUESTION="Amb aquesta configuració, Brute Force Stop pren %s com la vostra adreça. És l'adreça del vostre ordinador a Internet? Si és la del proxy, o una altra que no coneixeu, la configuració encara no és adequada."
COM_BFSTOP_SETUP_PREVIEW_CONFIRM="Sí, %s és l'adreça del meu ordinador."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOTTRUSTED="La vostra petició no venia de cap d'aquests proxies de confiança: Brute Force Stop prendria l'adreça d'on venia, com sense configuració de proxy. Afegiu l'adreça d'on venia la vostra petició (vegeu a dalt)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOHEADER="La vostra petició no duia aquesta capçalera: trieu-ne una que porti (vegeu a dalt)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_UNUSABLE="Aquesta capçalera de la vostra petició no acaba en una adreça que no sigui un dels proxies de confiança: Brute Force Stop no podria determinar la vostra adreça. Comproveu la capçalera i els proxies de confiança."
COM_BFSTOP_SETUP_PROXY_SAVE="Desar i continuar"
COM_BFSTOP_SETUP_PROXY_SAVED="La configuració del proxy s'ha desat."
COM_BFSTOP_SETUP_PROXY_ERROR_UNSUPPORTED="El vostre proxy només envia capçaleres que Brute Force Stop no pot fer servir: hi ha un proxy, de manera que 'sense proxy' bloquejaria tothom qui hi ha al darrere. Feu primer que el proxy enviï una capçalera que BFStop llegeixi."
COM_BFSTOP_SETUP_PROXY_ERROR_ACKNOWLEDGE="La vostra petició va arribar a través d'un proxy. Sense configuració de proxy, Brute Force Stop bloquejaria el proxy, és a dir, tothom: confirmeu que tot i així s'arriba al lloc directament, o configureu el proxy."
COM_BFSTOP_SETUP_PROXY_ERROR_CONFIRM="Comproveu la configuració amb la vostra petició i confirmeu que l'adreça mostrada és la del vostre ordinador abans que es desi."
COM_BFSTOP_SETUP_PROXY_ERROR_HEADER="Trieu una capçalera que Brute Force Stop llegeixi."
COM_BFSTOP_SETUP_PROXY_ERROR_TRUSTED="Introduïu l'adreça (o la xarxa) del vostre proxy."
COM_BFSTOP_SETUP_REMINDER="Mantingueu aquesta configuració al dia. Sempre que canviï el vostre allotjament (un nou proxy o CDN, nodes del balancejador de càrrega afegits o substituïts, un trasllat a un altre proveïdor), torneu a executar la comprovació del proxy. Una configuració errònia pot bloquejar tots els visitants, o permetre que els atacants triïn l'adreça amb què se'ls compta."
COM_BFSTOP_SETUP_RERUN_PROXY_CHECK="Tornar a comprovar el proxy"
COM_BFSTOP_SETUP_DISMISS="És el que s'espera"
COM_BFSTOP_SETUP_DISMISSED="Aquest missatge no es tornarà a mostrar, tret que canviï una altra cosa."
COM_BFSTOP_SETUP_MISMATCH_APPEARSBEHINDPROXY="Ara sembla que el vostre lloc és darrere d'un proxy, un balancejador de càrrega o una CDN: la vostra petició duia una capçalera de reenviament, però Brute Force Stop no confia en cap proxy."
COM_BFSTOP_SETUP_MISMATCH_PROXYADDRESSCHANGED="Adreça de proxy nova o canviada? La vostra petició duia una capçalera de reenviament, però no venia de cap dels proxies de confiança."
COM_BFSTOP_SETUP_MISMATCH_PROXYREMOVED="S'ha retirat el proxy, o esteu arribant al lloc directament? La vostra petició no venia de cap dels proxies de confiança i no duia cap capçalera de reenviament."
COM_BFSTOP_SETUP_MISMATCH_HEADERCHANGED="El vostre proxy ara envia una altra capçalera: la vostra petició venia d'un proxy de confiança, sense la capçalera configurada però amb una altra."
COM_BFSTOP_SETUP_MISMATCH_SERVERRESOLVES="El vostre servidor web ja resol l'adreça del visitant; el paràmetre de proxy de BFStop ja no és necessari."
COM_BFSTOP_SETUP_MISMATCH_UNSUPPORTEDHEADER="El vostre proxy només envia capçaleres que Brute Force Stop no pot fer servir."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHON="El paràmetre 'Darrere d'un balancejador de càrrega' de Joomla (Configuració global, Servidor) està desactivat: les sessions de Joomla, el registre d'accions d'usuaris (amb les entrades de Brute Force Stop) i les eines de privadesa enregistren l'adreça del proxy. Activeu-lo, però només si no es pot arribar al lloc si no és a través del proxy: Joomla confia en la capçalera de qualsevol. Brute Force Stop no fa servir aquest paràmetre."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHOFF="El paràmetre 'Darrere d'un balancejador de càrrega' de Joomla (Configuració global, Servidor) està activat, però aquí cap proxy no el necessita: llavors Joomla pren l'adreça, als seus propis registres, d'una capçalera que qualsevol pot falsificar. Desactiveu-lo. Brute Force Stop no fa servir aquest paràmetre."
COM_BFSTOP_SETUP_PANEL_HEADING="Valors desats que impedeixen desar la configuració"
COM_BFSTOP_SETUP_PANEL_DESC="La pàgina de configuració comprova tots els paràmetres cada vegada que es desa alguna cosa, i aquests valors, desats per una versió anterior o que ja no són vàlids, no passen la comprovació. Els valors proposats es desen juntament amb aquest pas; canvieu-los si voleu."
COM_BFSTOP_SETUP_PANEL_SETTING="Paràmetre"
COM_BFSTOP_SETUP_PANEL_STORED="Desat"
COM_BFSTOP_SETUP_PANEL_PROBLEM="Problema"
COM_BFSTOP_SETUP_PANEL_FIX="Valor proposat"
COM_BFSTOP_SETUP_BLOCKMODE_INTRO="El vostre lloc funciona amb %1$s. El mode de bloqueig és '%2$s'."
COM_BFSTOP_SETUP_SERVER_APACHE="Apache"
COM_BFSTOP_SETUP_SERVER_LITESPEED="LiteSpeed"
COM_BFSTOP_SETUP_SERVER_NGINX="nginx"
COM_BFSTOP_SETUP_SERVER_OTHER="un servidor web que Brute Force Stop no reconeix"
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_NGINX="nginx no llegeix els fitxers .htaccess: '%1$s' només faria veure que bloqueja al servidor web. Trieu '%2$s'; nginx pot denegar les adreces bloquejades amb el fitxer de denegació de nginx de sota."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_LITESPEED="LiteSpeed llegeix els fitxers .htaccess, però no totes les directives d'Apache: si trieu '%1$s', comproveu que funciona amb el botó de sota."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_HTACCESSPROXY="Darrere d'un proxy, el servidor web compara les entrades del fitxer .htaccess amb l'adreça del proxy, de manera que no rebutgen ningú o, si l'adreça del proxy hi entra, tothom. Trieu '%2$s', o deixeu que el servidor web resolgui primer l'adreça del visitant (mod_remoteip)."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_REPORTINGONLY="'Només informes' enregistra els inicis de sessió fallits i envia notificacions, però no bloqueja ningú: el vostre lloc no està protegit. Confirmeu a sota que és el que voleu."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_UNPROTECTED="Ara el vostre lloc no està protegit: amb 'Només informes', el retard dels inicis de sessió fallits era tota la protecció de la vostra configuració anterior, i l'actualització ha eliminat els retards. Trieu 'Només inici de sessió' o '%2$s'."
COM_BFSTOP_SETUP_RECOMMENDED="recomanat"
COM_BFSTOP_SETUP_BLOCKMODE_LOGINONLY_DESC="Una adreça bloquejada pot navegar pel lloc, però els seus inicis de sessió es rebutgen."
COM_BFSTOP_SETUP_BLOCKMODE_FULL_DESC="Es rebutja cada petició d'una adreça bloquejada (excepte la pàgina de desbloqueig i la recuperació de la contrasenya)."
COM_BFSTOP_SETUP_BLOCKMODE_HTACCESS_DESC="Com 'Tot el lloc', i el servidor web també rebutja les adreces bloquejades, des del fitxer .htaccess (Apache 2.4; no darrere d'un proxy)."
COM_BFSTOP_SETUP_BLOCKMODE_OFF_DESC="Els inicis de sessió fallits s'enregistren i es notifiquen, no es bloqueja ningú."
COM_BFSTOP_SETUP_BLOCKMODE_CONFIRM_OFF="Amb 'Només informes': sé que no bloqueja ningú."
COM_BFSTOP_SETUP_NGINX_INCLUDE="Incloeu el fitxer al bloc server de la configuració de nginx del vostre lloc, i feu que nginx es recarregui quan canviï:"
COM_BFSTOP_SETUP_BLOCKMODE_SAVE="Desar i continuar"
COM_BFSTOP_SETUP_BLOCKMODE_SAVED="El mode de bloqueig s'ha desat."
COM_BFSTOP_SETUP_BLOCKMODE_ERROR_MODE="Trieu un mode de bloqueig."
COM_BFSTOP_SETUP_BLOCKMODE_ERROR_OFF="'Només informes' no bloqueja ningú: confirmeu que és el que voleu."
COM_BFSTOP_SETUP_SUMMARY_COMPLETED="La protecció es va activar el %s."
COM_BFSTOP_SETUP_SUMMARY_COMPLETED_DISABLED="La protecció es va activar el %s, però el connector s'ha desactivat des de llavors. Torneu-la a activar a sota."
COM_BFSTOP_SETUP_SUMMARY_SETTINGS="Amb la configuració actual, Brute Force Stop bloqueja una adreça després de %1$d inicis de sessió fallits en %2$s (menys si els intents semblen arriscats, o el compte és atacat des de moltes adreces), durant %3$s. Tots els altres paràmetres mantenen els seus valors: canvieu-los a la pàgina de configuració en qualsevol moment."
COM_BFSTOP_SETUP_MISSING_PROXY="El pas del proxy encara no està fet."
COM_BFSTOP_SETUP_MISSING_BLOCKMODE="El pas del mode de bloqueig encara no està fet."
COM_BFSTOP_SETUP_MISSING_MODEUNFIT="El mode de bloqueig no és adequat per al servidor web (.htaccess a nginx)."
COM_BFSTOP_SETUP_MISSING_BLOCKINGVALUES="Hi ha valors desats que impedeixen desar la configuració."
