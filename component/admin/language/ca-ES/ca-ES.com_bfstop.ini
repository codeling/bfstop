COM_BFSTOP_SETUP_ACTIVATED="Brute Force Stop està actiu."
COM_BFSTOP_SETUP_ACTIVATE_ERROR_MISSING="La protecció encara no es pot activar: completeu primer els passos marcats com a 'pendent'."
COM_BFSTOP_SETUP_ACTIVATE_ERROR_PLUGIN="No s'ha pogut activar el connector 'Sistema - Brute Force Stop': està instal·lat?"
COM_BFSTOP_BANNER_NOT_ACTIVE="Brute Force Stop no està actiu: el seu connector està desactivat. Executeu l'<a href=\"%s\">assistent de configuració</a>, que l'activa."
COM_BFSTOP_BANNER_SETUP_INCOMPLETE="La configuració de Brute Force Stop no està completa. Obriu l'<a href=\"%s\">assistent de configuració</a>."
COM_BFSTOP_BANNER_PROXY_CHECK="Obriu la <a href=\"%s\">comprovació del proxy</a>."
COM_BFSTOP_POSTINSTALL_SETUP_TITLE="Brute Force Stop: completeu la configuració"
COM_BFSTOP_POSTINSTALL_SETUP_DESC="Brute Force Stop només protegeix el vostre lloc quan el seu assistent de configuració ha comprovat com arriben els visitants al lloc (directament, o a través d'un proxy, un balancejador de càrrega o una CDN) i el mode de bloqueig, i l'ha activat."
