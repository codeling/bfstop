COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS="Een blokkeersectie die eerdere versies in het .htaccess-bestand schreven, als die er was, is in de huidige vorm herschreven."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS_FAILED="De blokkeersectie die eerdere versies in het .htaccess-bestand schreven, kon niet herschreven worden: die laat iedereen die niet geblokkeerd is langs de andere toegangscontroles van die map. Maak het bestand schrijfbaar en voer de update opnieuw uit, of verwijder de sectie met de hand."
COM_BFSTOP_SETUP_OVERVIEW_DID_DELAYS="De vertraging van het antwoord op mislukte logins, die je instellingen gebruikten, is verwijderd: Brute Force Stop antwoordt nu meteen en blokkeert zoals voorheen."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_PROXY="De update heeft Brute Force Stop uitgeschakeld: het verzoek van de update kwam via een proxy, een load balancer of een CDN, en zonder proxy-instellingen zou BFStop het adres van de proxy blokkeren, dus iedereen. Het blijft uitgeschakeld tot deze assistent afgerond is."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_LOADBALANCER="De update heeft Brute Force Stop uitgeschakeld: 'Achter load balancer' staat aan in Joomla, dus de site lijkt achter een proxy te staan, en zonder proxy-instellingen zou BFStop het adres van de proxy blokkeren, dus iedereen. Het blijft uitgeschakeld tot deze assistent afgerond is."
COM_BFSTOP_SETUP_OVERVIEW_STEPS="De assistent loopt de instellingen langs die jouw beslissing nodig hebben: hoe bezoekers de site bereiken, en de blokkeermodus. Elke stap stelt voor wat past bij wat hij vaststelt; de laatste activeert de bescherming."
COM_BFSTOP_SETUP_PROXY_INTRO="Brute Force Stop telt mislukte logins per bezoekersadres. Achter een proxy, een load balancer of een CDN ziet de webserver voor elke bezoeker het adres van de proxy, en het adres van de bezoeker staat in een header die de proxy toevoegt – die alleen telt als het verzoek van een proxy kwam die je vertrouwt. Je eigen verzoek aan deze pagina laat zien wat voor jouw site geldt."
COM_BFSTOP_SETUP_PROXY_DETECTED="Wat je verzoek laat zien"
COM_BFSTOP_SETUP_PROXY_REMOTE_PUBLIC="Je verzoek bereikte de webserver vanaf %s, een adres op internet."
COM_BFSTOP_SETUP_PROXY_REMOTE_PRIVATE="Je verzoek bereikte de webserver vanaf %s, een adres van een privé- of lokaal netwerk – meestal dat van een proxy of load balancer."
COM_BFSTOP_SETUP_PROXY_HEADER_UNSUPPORTED="Het bevatte de header %s, die Brute Force Stop niet leest."
COM_BFSTOP_SETUP_SCENARIO_A="Je site lijkt direct bereikt te worden: er is geen proxy in te stellen."
COM_BFSTOP_SETUP_SCENARIO_B="Je site lijkt achter een reverse proxy of load balancer te staan. Zonder proxy-instellingen zou BFStop de mislukte logins van alle bezoekers bij het adres van de proxy tellen en iedereen blokkeren."
COM_BFSTOP_SETUP_SCENARIO_C="Je webserver haalt het adres van de bezoeker al uit de header van de proxy (mod_remoteip, real_ip van nginx): BFStop mag de header niet nog eens lezen. Laat zijn proxy-instelling uit."
COM_BFSTOP_SETUP_SCENARIO_D="Je site lijkt achter een CDN te staan (of je eigen netwerk voegt onderweg naar buiten een doorstuurheader toe). Zonder proxy-instellingen zou BFStop de servers van het CDN blokkeren, en daarmee willekeurige bezoekers."
COM_BFSTOP_SETUP_SCENARIO_E="Je proxy stuurt alleen headers die Brute Force Stop niet kan gebruiken. Het blijft inactief tot de proxy een header stuurt die het leest, of de webserver het adres oplost."
COM_BFSTOP_SETUP_UNSUPPORTED="Je proxy stuurt %s, die Brute Force Stop niet kan gebruiken."
COM_BFSTOP_SETUP_UNSUPPORTED_USE_OTHER="Je verzoek bevatte ook een header die BFStop leest: kies die hieronder."
COM_BFSTOP_SETUP_UNSUPPORTED_FIX="Laat de proxy aan X-Forwarded-For toevoegen (nginx: <code>proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</code>), of laat de webserver het adres oplossen met zijn real-IP-module (mod_remoteip van Apache, real_ip van nginx)."
COM_BFSTOP_SETUP_UNSUPPORTED_ISSUE="Vertel ons over je opzet (opent een nieuwe issue op GitHub, alleen met de namen van de headers, het vastgestelde scenario en de versies)"
COM_BFSTOP_SETUP_CLOUDFLARE_WARNING="Je site lijkt achter Cloudflare te staan. Alle adressen van Cloudflare vertrouwen laat iedereen die Cloudflare gebruikt je server bereiken met een adres naar keuze in CF-Connecting-IP (een Worker in hun eigen zone kan het zetten). Dat is alleen veilig als je server verkeer van Cloudflare uitsluitend voor jouw zone aanneemt: Authenticated Origin Pulls met een certificaat van jouw zone, Cloudflare Tunnel of een firewallregel. Laat anders de webserver het adres oplossen met zijn real-IP-module, en laat de proxy-instelling van BFStop uit."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH="Adresbereiken van Cloudflare ophalen"
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH_DESC="Haalt de bereiken op die Cloudflare publiceert (www.cloudflare.com/ips-v4 en ips-v6) als vertrouwde proxy's, met de header CF-Connecting-IP. Alleen als je klikt: er wordt nergens anders iets heen gestuurd."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCHED="%d adresbereiken van Cloudflare opgehaald. Controleer ze met je verzoek voor je opslaat."
COM_BFSTOP_SETUP_CLOUDFLARE_FAILED="De adresbereiken van Cloudflare konden niet opgehaald worden. Vul ze met de hand in, vanaf www.cloudflare.com/ips."
COM_BFSTOP_SETUP_PROXY_CHOICE="Hoe wordt je site bereikt?"
COM_BFSTOP_SETUP_PROXY_CHOICE_NONE="Er is geen proxy in te stellen: bezoekers bereiken de site direct, of de webserver lost hun adres al op."
COM_BFSTOP_SETUP_PROXY_ACKNOWLEDGE="Ik weet het zeker: de doorstuurheader van je verzoek komt niet van een proxy voor deze site (maar bijvoorbeeld uit mijn eigen netwerk)."
COM_BFSTOP_SETUP_PROXY_CHOICE_PROXY="De site staat achter een proxy, load balancer of CDN, die het adres van de bezoeker in deze header stuurt:"
COM_BFSTOP_SETUP_PROXY_HEADER_PRESENT="(je verzoek heeft hem)"
COM_BFSTOP_SETUP_PROXY_TRUSTED_DESC="Voorgesteld is het adres van waaruit de proxy verbinding maakt met de webserver. Is er meer dan één proxy-knooppunt (meerdere load balancers, een CDN), vul ze dan allemaal in, of het kleinste netwerk dat ze allemaal bevat (niet groter dan /8 voor IPv4 of /16 voor IPv6)."
COM_BFSTOP_SETUP_PREVIEW="Controleren met mijn verzoek"
COM_BFSTOP_SETUP_PREVIEW_QUESTION="Met deze instellingen houdt Brute Force Stop %s voor je adres. Is dat het adres van je computer op internet? Is het dat van de proxy, of een ander dat je niet kent, dan passen de instellingen nog niet."
COM_BFSTOP_SETUP_PREVIEW_CONFIRM="Ja, %s is het adres van mijn computer."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOTTRUSTED="Je verzoek kwam van geen van deze vertrouwde proxy's: Brute Force Stop zou het adres nemen waar het vandaan kwam, zoals zonder proxy-instellingen. Voeg het adres toe waar je verzoek vandaan kwam (zie boven)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOHEADER="Je verzoek bevatte deze header niet: kies er een die het heeft (zie boven)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_UNUSABLE="Deze header van je verzoek eindigt niet op een adres dat geen van de vertrouwde proxy's is: Brute Force Stop zou je adres niet kunnen bepalen. Controleer de header en de vertrouwde proxy's."
COM_BFSTOP_SETUP_PROXY_SAVE="Opslaan en verder"
COM_BFSTOP_SETUP_PROXY_SAVED="De proxy-instellingen zijn opgeslagen."
COM_BFSTOP_SETUP_PROXY_ERROR_UNSUPPORTED="Je proxy stuurt alleen headers die Brute Force Stop niet kan gebruiken: er is een proxy, dus 'geen proxy' zou iedereen erachter blokkeren. Laat de proxy eerst een header sturen die BFStop leest."
COM_BFSTOP_SETUP_PROXY_ERROR_ACKNOWLEDGE="Je verzoek kwam via een proxy. Zonder proxy-instellingen zou Brute Force Stop de proxy blokkeren, dus iedereen: bevestig dat de site toch direct bereikt wordt, of stel de proxy in."
COM_BFSTOP_SETUP_PROXY_ERROR_CONFIRM="Controleer de instellingen met je verzoek en bevestig dat het getoonde adres dat van je computer is, voordat ze opgeslagen worden."
COM_BFSTOP_SETUP_PROXY_ERROR_HEADER="Kies een header die Brute Force Stop leest."
COM_BFSTOP_SETUP_PROXY_ERROR_TRUSTED="Vul het adres (of netwerk) van je proxy in."
COM_BFSTOP_SETUP_REMINDER="Houd deze instellingen actueel. Telkens als je hosting verandert (een nieuwe proxy of een nieuw CDN, load-balancerknooppunten toegevoegd of vervangen, een verhuizing naar een andere host), voer je de proxycontrole opnieuw uit. Verkeerde instellingen kunnen elke bezoeker blokkeren, of aanvallers het adres laten kiezen waarop ze geteld worden."
COM_BFSTOP_SETUP_RERUN_PROXY_CHECK="Proxycontrole opnieuw uitvoeren"
COM_BFSTOP_SETUP_DISMISS="Dit is zo bedoeld"
COM_BFSTOP_SETUP_DISMISSED="Deze melding wordt niet meer getoond, tenzij er iets anders verandert."
COM_BFSTOP_SETUP_MISMATCH_APPEARSBEHINDPROXY="Je site lijkt nu achter een proxy, load balancer of CDN te staan: je verzoek bevatte een doorstuurheader, maar Brute Force Stop vertrouwt geen enkele proxy."
COM_BFSTOP_SETUP_MISMATCH_PROXYADDRESSCHANGED="Nieuw of gewijzigd proxyadres? Je verzoek bevatte een doorstuurheader, maar kwam van geen van de vertrouwde proxy's."
COM_BFSTOP_SETUP_MISMATCH_PROXYREMOVED="Proxy verwijderd, of bereik je de site direct? Je verzoek kwam van geen van de vertrouwde proxy's en bevatte geen doorstuurheader."
COM_BFSTOP_SETUP_MISMATCH_HEADERCHANGED="Je proxy stuurt nu een andere header: je verzoek kwam van een vertrouwde proxy, zonder de ingestelde header maar met een andere."
COM_BFSTOP_SETUP_MISMATCH_SERVERRESOLVES="Je webserver lost het bezoekersadres al op; de proxy-instelling van BFStop is niet meer nodig."
COM_BFSTOP_SETUP_MISMATCH_UNSUPPORTEDHEADER="Je proxy stuurt alleen headers die Brute Force Stop niet kan gebruiken."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHON="De Joomla-instelling 'Achter load balancer' (Algemene instellingen, Server) staat uit: de sessies van Joomla, het gebruikersactiviteitenlog (met de vermeldingen van Brute Force Stop) en de privacyhulpmiddelen leggen het adres van de proxy vast. Zet haar aan, maar alleen als de site uitsluitend via de proxy bereikbaar is: Joomla vertrouwt de header van iedereen. Brute Force Stop gebruikt deze instelling niet."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHOFF="De Joomla-instelling 'Achter load balancer' (Algemene instellingen, Server) staat aan, maar hier heeft geen proxy haar nodig: Joomla haalt het adres dan in zijn eigen logs uit een header die iedereen kan vervalsen. Zet haar uit. Brute Force Stop gebruikt deze instelling niet."
COM_BFSTOP_SETUP_PANEL_HEADING="Opgeslagen waarden die het opslaan van de instellingen tegenhouden"
COM_BFSTOP_SETUP_PANEL_DESC="De instellingenpagina controleert bij elk opslaan alle instellingen, en deze waarden, opgeslagen door een eerdere versie of niet meer geldig, komen niet door die controle. De voorgestelde waarden worden met deze stap opgeslagen; pas ze aan als je wilt."
COM_BFSTOP_SETUP_PANEL_SETTING="Instelling"
COM_BFSTOP_SETUP_PANEL_STORED="Opgeslagen"
COM_BFSTOP_SETUP_PANEL_PROBLEM="Probleem"
COM_BFSTOP_SETUP_PANEL_FIX="Voorgestelde waarde"
