COM_BFSTOP_SETUP_OVERVIEW_INSTALL="Welkom bij Brute Force Stop. Voordat het iemand blokkeert, moet het weten hoe bezoekers je site bereiken: direct, of via een proxy, een load balancer of een CDN. Achter een proxy lijkt elke bezoeker van het adres van de proxy te komen – zonder de juiste instellingen zouden een paar mislukte logins iedereen blokkeren."
COM_BFSTOP_SETUP_OVERVIEW_UPGRADE="Brute Force Stop is bijgewerkt vanaf versie %s. Dit heeft de update gedaan:"
