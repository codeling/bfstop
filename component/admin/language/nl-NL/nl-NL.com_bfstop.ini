COM_BFSTOP_SETTINGS_NOTIFY_ANY_NEEDS_LIVE_SITE="Deblokkeerlinks kunnen alleen worden verstuurd als het adres van de site is ingesteld ($live_site in de configuration.php van de site). Stel het daar in, of schakel de deblokkeerlinks uit."
