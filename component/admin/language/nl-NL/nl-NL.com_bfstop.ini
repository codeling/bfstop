COM_BFSTOP_WARNING_HTACCESS_LITESPEED="Deze site draait op LiteSpeed, dat .htaccess-bestanden leest, maar niet elke directive van Apache: of het de &lt;If&gt;-secties volgt waarmee BFStop adressen blokkeert, hangt af van de editie en versie. Controleer of de webserver een geblokkeerd adres weigert, of kies '%2$s' in de instellingen."
