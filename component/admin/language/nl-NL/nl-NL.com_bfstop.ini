COM_BFSTOP_SETUP_OVERVIEW_DID_BLOCKMODE="De vroegere schakelaars 'Blokkeren ingeschakeld' en '.htaccess gebruiken' zijn de blokkeermodus '%s' geworden."
COM_BFSTOP_SETUP_OVERVIEW_DID_API="Logins via de Web Services API van Joomla zijn nu ook beschermd (de instelling 'Actief voor')."
