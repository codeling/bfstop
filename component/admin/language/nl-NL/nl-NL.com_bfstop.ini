COM_BFSTOP_HTACCESS_CHECK_IGNORED="De webserver negeert de blokkeersectie van het .htaccess-bestand in %s: een testverzoek dat hij had moeten weigeren, kwam erdoor. Apache moet daar autorisatiedirectives mogen lezen (AllowOverride AuthConfig of All). nginx leest geen .htaccess-bestanden, OpenLiteSpeed leest er alleen de rewrite-regels uit, en LiteSpeed Enterprise ondersteunt mogelijk niet elke directive die de blokkeersectie gebruikt."
COM_BFSTOP_HTACCESS_CHECK_BROKEN="De webserver liep vast op een testbestand met de directives van de blokkeersectie (status 500): hij begrijpt ze niet (ze vereisen Apache 2.4 of nieuwer). De blokkeersectie zou de site in %s op dezelfde manier breken; het foutenlogboek van de webserver zegt meer."
