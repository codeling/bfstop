COM_BFSTOP_SETUP_BLOCKMODE_ERROR_MODE="Kies een blokkeermodus."
COM_BFSTOP_SETUP_BLOCKMODE_ERROR_OFF="'Alleen rapporteren' blokkeert niemand: bevestig dat dit je bedoeling is."
COM_BFSTOP_SETUP_SUMMARY_COMPLETED="De bescherming is geactiveerd op %s."
COM_BFSTOP_SETUP_SUMMARY_COMPLETED_DISABLED="De bescherming is geactiveerd op %s, maar de plugin is sindsdien uitgeschakeld. Activeer haar hieronder opnieuw."
COM_BFSTOP_SETUP_SUMMARY_SETTINGS="Met de huidige instellingen blokkeert Brute Force Stop een adres na %1$d mislukte logins binnen %2$s (na minder als de pogingen riskant lijken, of het account vanaf veel adressen aangevallen wordt), voor %3$s. Alle andere instellingen houden hun waarden: wijzig ze op elk moment op de instellingenpagina."
