COM_BFSTOP_SETUP_SERVER_LITESPEED="LiteSpeed"
COM_BFSTOP_SETUP_SERVER_NGINX="nginx"
COM_BFSTOP_SETUP_SERVER_OTHER="een webserver die Brute Force Stop niet herkent"
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_NGINX="nginx leest geen .htaccess-bestanden: '%1$s' zou in de webserver alleen schijnbaar blokkeren. Kies '%2$s'; nginx kan de geblokkeerde adressen weigeren met het nginx-weigerbestand hieronder."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_LITESPEED="LiteSpeed leest .htaccess-bestanden, maar niet elke opdracht van Apache: als je '%1$s' kiest, controleer dan met de knop hieronder of het werkt."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_HTACCESSPROXY="Achter een proxy vergelijkt de webserver de regels van het .htaccess-bestand met het adres van de proxy, dus weigeren ze niemand – of, als het adres van de proxy erin komt, iedereen. Kies '%2$s', of laat de webserver eerst het bezoekersadres oplossen (mod_remoteip)."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_REPORTINGONLY="'Alleen rapporteren' legt mislukte logins vast en stuurt meldingen, maar blokkeert niemand: je site is niet beschermd. Bevestig hieronder dat dit je bedoeling is."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_UNPROTECTED="Je site is nu niet beschermd: met 'Alleen rapporteren' was de vertraging van mislukte logins de enige bescherming van je vorige instellingen, en de update heeft de vertragingen verwijderd. Kies 'Alleen aanmelden' of '%2$s'."
COM_BFSTOP_SETUP_RECOMMENDED="aanbevolen"
COM_BFSTOP_SETUP_BLOCKMODE_LOGINONLY_DESC="Een geblokkeerd adres kan de site bekijken, maar zijn logins worden geweigerd."
COM_BFSTOP_SETUP_BLOCKMODE_FULL_DESC="Elk verzoek van een geblokkeerd adres wordt geweigerd (behalve de deblokkeerpagina en het wachtwoordherstel)."
COM_BFSTOP_SETUP_BLOCKMODE_HTACCESS_DESC="Zoals 'Hele site', en de webserver weigert de geblokkeerde adressen ook, via het .htaccess-bestand (Apache 2.4; niet achter een proxy)."
COM_BFSTOP_SETUP_BLOCKMODE_OFF_DESC="Mislukte logins worden vastgelegd en gemeld, niemand wordt geblokkeerd."
COM_BFSTOP_SETUP_BLOCKMODE_CONFIRM_OFF="Met 'Alleen rapporteren': ik weet dat het niemand blokkeert."
COM_BFSTOP_SETUP_NGINX_INCLUDE="Neem het bestand op in het server-blok van de nginx-configuratie van je site, en laat nginx herladen als het verandert:"
COM_BFSTOP_SETUP_BLOCKMODE_SAVE="Opslaan en verder"
