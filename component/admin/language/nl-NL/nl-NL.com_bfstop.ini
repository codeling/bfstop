COM_BFSTOP_SETTINGS_HTACCESS_NEEDS_APACHE="Deze site draait op nginx, dat geen .htaccess-bestanden leest: de blokkeermodus '%1$s' kan hier niet werken. Kies '%2$s'; nginx kan adressen in zijn eigen configuratie weigeren."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_LABEL="nginx-weigerbestand"
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_DESC="Alleen voor sites die nginx serveert, dat geen .htaccess-bestanden leest: een bestand (een absoluut pad, eindigend op .conf) waarin BFStop de actieve blokkades bijhoudt als 'deny'-regels, zodat het server-blok van de nginx-configuratie van de site het kan invoegen. nginx leest het alleen bij herladen: zorg dat het herladen wordt wanneer het bestand verandert (bijv. met een systemd-path-unit of een cronjob die 'nginx -t &amp;&amp; nginx -s reload' uitvoert). Adressen van de toegestane lijst en vertrouwde proxy's worden weggelaten. Leeg: geen bestand."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_PATH="Geen bestand dat BFStop als nginx-weigerbestand kan schrijven: %1$s. Het moet een absoluut pad zijn van een bestand waarvan de naam eindigt op %2$s."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_DIRECTORY="De map van het nginx-weigerbestand %1$s bestaat niet of is niet beschrijfbaar."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_FOREIGN="%1$s bestaat en is niet door BFStop geschreven: het zou worden overschreven. Kies een nieuw bestand."
COM_BFSTOP_WARNING_NO_LIVE_SITE="Het adres van de site is niet ingesteld ($live_site in configuration.php). Joomla! bouwt de links in de e-mails van Brute Force Stop dan op uit de host die elk verzoek noemt, en die kan een bezoeker vrij kiezen - daarom worden geen deblokkeerlinks verstuurd en noemen de meldingen aan de beheerders geen adres. Om het adres in te stellen, voeg deze regel toe aan de klasse in de configuration.php van de site, met het adres waarop de site bereikbaar is (voorgesteld op basis van dit verzoek, controleer het): %s"
COM_BFSTOP_WARNING_NOTIFY_ANY_WITHOUT_LIVE_SITE="Er moeten deblokkeerlinks worden verstuurd (<a href=\"%s\">instellingen</a>), maar het adres van de site is niet ingesteld ($live_site in configuration.php): er worden geen deblokkeerlinks verstuurd."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_56="/56 (aanbevolen)"
COM_BFSTOP_IP_NETWORK_TOO_LARGE="Het netwerk %1$s is te groot: de prefixlengte moet minstens /%2$d zijn voor IPv4 en /%3$d voor IPv6."
COM_BFSTOP_IPADDRESS_TRUSTED_PROXY="Dit is (of bevat) een vertrouwde proxy uit de instellingen: geblokkeerd in het .htaccess-bestand zou elk verzoek dat erdoorheen komt worden geweigerd."
COM_BFSTOP_SETTINGS_HTACCESS_NOT_TIDIED="Brute Force Stop kon zijn blokkades niet uit <code>%s</code> verwijderen, dat niet meer blokkeert: de webserver blijft deze adressen weigeren, ook als hun blokkades voorbij zijn. Maak het bestand schrijfbaar en verwijder ze met de hand - ze staan in de &lt;If&gt;-regels tussen '# BEGIN BFStop Blocks' en '# END BFStop Blocks'."
