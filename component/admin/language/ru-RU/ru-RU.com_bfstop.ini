COM_BFSTOP_SETUP_START="Начать"
COM_BFSTOP_SETUP_OVERVIEW_INSTALL="Добро пожаловать в Brute Force Stop. Прежде чем кого-либо блокировать, он должен знать, как посетители попадают на ваш сайт: напрямую или через прокси, балансировщик нагрузки или CDN. За прокси каждый посетитель как будто приходит с адреса прокси — без правильных настроек несколько неудачных входов заблокировали бы всех."
COM_BFSTOP_SETUP_OVERVIEW_UPGRADE="Brute Force Stop обновлён с версии %s. Вот что сделало обновление:"
COM_BFSTOP_SETUP_OVERVIEW_DID_SETTINGS="Настройки перенесены из менеджера плагинов в этот компонент."
COM_BFSTOP_SETUP_OVERVIEW_DID_BLOCKMODE="Прежние переключатели «Блокировка включена» и «Использовать .htaccess» превратились в режим блокировки «%s»."
COM_BFSTOP_SETUP_OVERVIEW_DID_API="Входы через Web Services API Joomla теперь тоже защищены (настройка «Активен для»)."
COM_BFSTOP_SETUP_OVERVIEW_DID_ADDRESSES="Адреса списка блокировок и списка разрешённых приведены к единому написанию."
COM_BFSTOP_SETUP_OVERVIEW_DID_MAINTENANCE="Ежедневное обслуживание теперь является задачей планировщика задач Joomla."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS="Раздел блокировок, который прежние версии записывали в файл .htaccess, если он был, переписан в текущем виде."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS_FAILED="Раздел блокировок, который прежние версии записывали в файл .htaccess, не удалось переписать: он пропускает всех незаблокированных мимо остальных ограничений доступа этого каталога. Сделайте файл доступным для записи и запустите обновление снова или удалите раздел вручную."
COM_BFSTOP_SETUP_OVERVIEW_DID_DELAYS="Задержка ответа на неудачные входы, которую использовали ваши настройки, удалена: Brute Force Stop теперь отвечает сразу и блокирует, как прежде."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_PROXY="Обновление отключило Brute Force Stop: запрос обновления пришёл через прокси, балансировщик нагрузки или CDN, и без настроек прокси BFStop заблокировал бы адрес прокси, то есть всех. Он останется отключённым, пока этот мастер не будет завершён."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_LOADBALANCER="Обновление отключило Brute Force Stop: в Joomla включено «За балансировщиком нагрузки», значит, сайт, похоже, находится за прокси, и без настроек прокси BFStop заблокировал бы адрес прокси, то есть всех. Он останется отключённым, пока этот мастер не будет завершён."
COM_BFSTOP_SETUP_OVERVIEW_STEPS="Мастер проходит по настройкам, которые требуют вашего решения: как посетители попадают на сайт, и режим блокировки. Каждый шаг предлагает то, что подходит к обнаруженному; последний включает защиту."
COM_BFSTOP_SETUP_PROXY_INTRO="Brute Force Stop считает неудачные входы по адресу посетителя. За прокси, балансировщиком нагрузки или CDN веб-сервер видит для каждого посетителя адрес прокси, а адрес посетителя находится в заголовке, который добавляет прокси, — и учитывается он, только если запрос пришёл от прокси, которому вы доверяете. Ваш собственный запрос к этой странице показывает, что относится к вашему сайту."
COM_BFSTOP_SETUP_PROXY_DETECTED="Что показывает ваш запрос"
COM_BFSTOP_SETUP_PROXY_REMOTE_PUBLIC="Ваш запрос пришёл на веб-сервер с %s, адреса в интернете."
COM_BFSTOP_SETUP_PROXY_REMOTE_PRIVATE="Ваш запрос пришёл на веб-сервер с %s, адреса частной или локальной сети — обычно это адрес прокси или балансировщика нагрузки."
COM_BFSTOP_SETUP_PROXY_HEADER_UNSUPPORTED="В нём был заголовок %s, который Brute Force Stop не читает."
COM_BFSTOP_SETUP_SCENARIO_A="Похоже, на ваш сайт заходят напрямую: настраивать прокси не нужно."
COM_BFSTOP_SETUP_SCENARIO_B="Похоже, ваш сайт находится за обратным прокси или балансировщиком нагрузки. Без настроек прокси BFStop засчитывал бы неудачные входы всех посетителей адресу прокси и заблокировал бы всех."
COM_BFSTOP_SETUP_SCENARIO_C="Ваш веб-сервер уже берёт адрес посетителя из заголовка прокси (mod_remoteip, real_ip в nginx): BFStop не должен читать заголовок повторно. Оставьте его настройку прокси выключенной."
COM_BFSTOP_SETUP_SCENARIO_D="Похоже, ваш сайт находится за CDN (или ваша собственная сеть добавляет заголовок пересылки на выходе). Без настроек прокси BFStop заблокировал бы серверы CDN, а вместе с ними случайных посетителей."
COM_BFSTOP_SETUP_SCENARIO_E="Ваш прокси отправляет только заголовки, которые Brute Force Stop не может использовать. Он остаётся неактивным, пока прокси не начнёт отправлять заголовок, который он читает, или веб-сервер не начнёт сам определять адрес."
COM_BFSTOP_SETUP_UNSUPPORTED="Ваш прокси отправляет %s, который Brute Force Stop не может использовать."
COM_BFSTOP_SETUP_UNSUPPORTED_USE_OTHER="В вашем запросе был и заголовок, который BFStop читает: выберите его ниже."
COM_BFSTOP_SETUP_UNSUPPORTED_FIX="Пусть прокси дописывает адрес в X-Forwarded-For (nginx: <code>proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</code>), или пусть веб-сервер определяет адрес своим модулем real-IP (mod_remoteip в Apache, real_ip в nginx)."
COM_BFSTOP_SETUP_UNSUPPORTED_ISSUE="Расскажите нам о своей конфигурации (открывает новую задачу на GitHub только с названиями заголовков, обнаруженным сценарием и версиями)"
COM_BFSTOP_SETUP_CLOUDFLARE_WARNING="Похоже, ваш сайт находится за Cloudflare. Доверие ко всем адресам Cloudflare позволяет любому пользователю Cloudflare обращаться к вашему серверу с любым адресом в CF-Connecting-IP (его может задать Worker в собственной зоне). Это безопасно, только если ваш сервер принимает трафик Cloudflare исключительно для вашей зоны: Authenticated Origin Pulls с сертификатом вашей зоны, Cloudflare Tunnel или правило брандмауэра. Иначе пусть веб-сервер определяет адрес своим модулем real-IP, а настройка прокси BFStop остаётся выключенной."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH="Получить диапазоны адресов Cloudflare"
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH_DESC="Получает опубликованные Cloudflare диапазоны (www.cloudflare.com/ips-v4 и ips-v6) как доверенные прокси с заголовком CF-Connecting-IP. Только по вашему нажатию: больше никуда ничего не отправляется."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCHED="Получено диапазонов адресов Cloudflare: %d. Проверьте их своим запросом перед сохранением."
COM_BFSTOP_SETUP_CLOUDFLARE_FAILED="Не удалось получить диапазоны адресов Cloudflare. Введите их вручную со страницы www.cloudflare.com/ips."
COM_BFSTOP_SETUP_PROXY_CHOICE="Как посетители попадают на ваш сайт?"
COM_BFSTOP_SETUP_PROXY_CHOICE_NONE="Настраивать прокси не нужно: посетители заходят на сайт напрямую, или веб-сервер уже сам определяет их адрес."
COM_BFSTOP_SETUP_PROXY_ACKNOWLEDGE="Я уверен: заголовок пересылки в вашем запросе приходит не от прокси перед этим сайтом (а, например, из моей собственной сети)."
COM_BFSTOP_SETUP_PROXY_CHOICE_PROXY="Сайт находится за прокси, балансировщиком нагрузки или CDN, который передаёт адрес посетителя в этом заголовке:"
COM_BFSTOP_SETUP_PROXY_HEADER_PRESENT="(он есть в вашем запросе)"
COM_BFSTOP_SETUP_PROXY_TRUSTED_DESC="Предложен адрес, с которого прокси подключается к веб-серверу. Если узлов прокси несколько (несколько балансировщиков нагрузки, CDN), укажите их все или наименьшую сеть, содержащую их все (не шире /8 для IPv4 или /16 для IPv6)."
COM_BFSTOP_SETUP_PREVIEW="Проверить моим запросом"
COM_BFSTOP_SETUP_PREVIEW_QUESTION="С этими настройками Brute Force Stop считает вашим адресом %s. Это адрес вашего компьютера в интернете? Если это адрес прокси или другой незнакомый вам адрес, настройки пока не подходят."
COM_BFSTOP_SETUP_PREVIEW_CONFIRM="Да, %s — адрес моего компьютера."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOTTRUSTED="Ваш запрос пришёл не от одного из этих доверенных прокси: Brute Force Stop взял бы адрес, с которого он пришёл, как без настроек прокси. Добавьте адрес, с которого пришёл ваш запрос (см. выше)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOHEADER="В вашем запросе нет этого заголовка: выберите тот, который в нём есть (см. выше)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_UNUSABLE="Этот заголовок вашего запроса не заканчивается адресом, который не является одним из доверенных прокси: Brute Force Stop не смог бы определить ваш адрес. Проверьте заголовок и доверенные прокси."
COM_BFSTOP_SETUP_PROXY_SAVE="Сохранить и продолжить"
COM_BFSTOP_SETUP_PROXY_SAVED="Настройки прокси сохранены."
COM_BFSTOP_SETUP_PROXY_ERROR_UNSUPPORTED="Ваш прокси отправляет только заголовки, которые Brute Force Stop не может использовать: прокси есть, поэтому «без прокси» заблокировало бы всех за ним. Сначала настройте прокси на отправку заголовка, который читает BFStop."
COM_BFSTOP_SETUP_PROXY_ERROR_ACKNOWLEDGE="Ваш запрос пришёл через прокси. Без настроек прокси Brute Force Stop заблокировал бы прокси, то есть всех: подтвердите, что на сайт всё же заходят напрямую, или настройте прокси."
COM_BFSTOP_SETUP_PROXY_ERROR_CONFIRM="Проверьте настройки своим запросом и подтвердите, что показанный адрес — адрес вашего компьютера, прежде чем они будут сохранены."
COM_BFSTOP_SETUP_PROXY_ERROR_HEADER="Выберите заголовок, который читает Brute Force Stop."
COM_BFSTOP_SETUP_PROXY_ERROR_TRUSTED="Введите адрес (или сеть) вашего прокси."
COM_BFSTOP_SETUP_REMINDER="Поддерживайте эти настройки в актуальном состоянии. Всякий раз, когда меняется ваш хостинг (новый прокси или CDN, добавленные или заменённые узлы балансировщика нагрузки, переезд к другому хостеру), запускайте проверку прокси снова. Неправильные настройки могут заблокировать всех посетителей или позволить злоумышленникам выбирать адрес, по которому их учитывают."
COM_BFSTOP_SETUP_RERUN_PROXY_CHECK="Повторить проверку прокси"
COM_BFSTOP_SETUP_DISMISS="Так и должно быть"
COM_BFSTOP_SETUP_DISMISSED="Это сообщение больше не будет показываться, если не изменится что-то другое."
COM_BFSTOP_SETUP_MISMATCH_APPEARSBEHINDPROXY="Похоже, ваш сайт теперь находится за прокси, балансировщиком нагрузки или CDN: в вашем запросе был заголовок пересылки, но Brute Force Stop не доверяет ни одному прокси."
COM_BFSTOP_SETUP_MISMATCH_PROXYADDRESSCHANGED="Новый или изменившийся адрес прокси? В вашем запросе был заголовок пересылки, но он пришёл не от одного из доверенных прокси."
COM_BFSTOP_SETUP_MISMATCH_PROXYREMOVED="Прокси убран, или вы заходите на сайт напрямую? Ваш запрос пришёл не от одного из доверенных прокси и не содержал заголовка пересылки."
COM_BFSTOP_SETUP_MISMATCH_HEADERCHANGED="Ваш прокси теперь отправляет другой заголовок: ваш запрос пришёл от доверенного прокси без настроенного заголовка, но с другим."
COM_BFSTOP_SETUP_MISMATCH_SERVERRESOLVES="Ваш веб-сервер уже сам определяет адрес посетителя; настройка прокси BFStop больше не нужна."
COM_BFSTOP_SETUP_MISMATCH_UNSUPPORTEDHEADER="Ваш прокси отправляет только заголовки, которые Brute Force Stop не может использовать."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHON="Собственная настройка Joomla «За балансировщиком нагрузки» (Общие настройки, Сервер) выключена: сессии Joomla, журнал действий пользователей (с записями Brute Force Stop) и инструменты конфиденциальности записывают адрес прокси. Включите её, но только если на сайт нельзя попасть иначе как через прокси: Joomla доверяет заголовку от кого угодно. Brute Force Stop эту настройку не использует."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHOFF="Собственная настройка Joomla «За балансировщиком нагрузки» (Общие настройки, Сервер) включена, но здесь она не нужна ни одному прокси: тогда Joomla берёт адрес для своих журналов из заголовка, который может подделать кто угодно. Выключите её. Brute Force Stop эту настройку не использует."
COM_BFSTOP_SETUP_PANEL_HEADING="Сохранённые значения, которые мешают сохранить настройки"
COM_BFSTOP_SETUP_PANEL_DESC="Страница настроек при каждом сохранении проверяет все настройки, а эти значения, сохранённые прежней версией или ставшие недействительными, проверку не проходят. Предложенные значения сохраняются вместе с этим шагом; при желании измените их."
COM_BFSTOP_SETUP_PANEL_SETTING="Настройка"
COM_BFSTOP_SETUP_PANEL_STORED="Сохранено"
COM_BFSTOP_SETUP_PANEL_PROBLEM="Проблема"
COM_BFSTOP_SETUP_PANEL_FIX="Предлагаемое значение"
COM_BFSTOP_SETUP_BLOCKMODE_INTRO="Ваш сайт работает на %1$s. Режим блокировки: «%2$s»."
COM_BFSTOP_SETUP_SERVER_APACHE="Apache"
COM_BFSTOP_SETUP_SERVER_LITESPEED="LiteSpeed"
COM_BFSTOP_SETUP_SERVER_NGINX="nginx"
COM_BFSTOP_SETUP_SERVER_OTHER="веб-сервере, который Brute Force Stop не распознаёт"
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_NGINX="nginx не читает файлы .htaccess: «%1$s» лишь создавал бы видимость блокировки в веб-сервере. Выберите «%2$s»; nginx может отклонять заблокированные адреса с помощью файла запретов nginx ниже."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_LITESPEED="LiteSpeed читает файлы .htaccess, но не все директивы Apache: если вы выберете «%1$s», проверьте его работу кнопкой ниже."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_HTACCESSPROXY="За прокси веб-сервер сравнивает записи файла .htaccess с адресом прокси, поэтому они никого не отклоняют — или, если туда попадёт адрес прокси, отклоняют всех. Выберите «%2$s» или пусть веб-сервер сначала определяет адрес посетителя (mod_remoteip)."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_REPORTINGONLY="«Только отчёты» записывает неудачные входы и отправляет уведомления, но никого не блокирует: ваш сайт не защищён. Подтвердите ниже, что вы этого хотите."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_UNPROTECTED="Сейчас ваш сайт не защищён: при «Только отчёты» задержка неудачных входов была всей защитой ваших прежних настроек, а обновление удалило задержки. Выберите «Только вход» или «%2$s»."
COM_BFSTOP_SETUP_RECOMMENDED="рекомендуется"
COM_BFSTOP_SETUP_BLOCKMODE_LOGINONLY_DESC="Заблокированный адрес может просматривать сайт, но его входы отклоняются."
COM_BFSTOP_SETUP_BLOCKMODE_FULL_DESC="Каждый запрос заблокированного адреса отклоняется (кроме страницы разблокировки и восстановления пароля)."
COM_BFSTOP_SETUP_BLOCKMODE_HTACCESS_DESC="Как «Весь сайт», и веб-сервер тоже отклоняет заблокированные адреса по файлу .htaccess (Apache 2.4; не за прокси)."
COM_BFSTOP_SETUP_BLOCKMODE_OFF_DESC="Неудачные входы записываются и сообщаются, никто не блокируется."
COM_BFSTOP_SETUP_BLOCKMODE_CONFIRM_OFF="С «Только отчёты»: я знаю, что он никого не блокирует."
COM_BFSTOP_SETUP_NGINX_INCLUDE="Подключите файл в блоке server конфигурации nginx вашего сайта и обеспечьте перезагрузку nginx при его изменении:"
COM_BFSTOP_SETUP_BLOCKMODE_SAVE="Сохранить и продолжить"
COM_BFSTOP_SETUP_BLOCKMODE_SAVED="Режим блокировки сохранён."
COM_BFSTOP_SETUP_BLOCKMODE_ERROR_MODE="Выберите режим блокировки."
COM_BFSTOP_SETUP_BLOCKMODE_ERROR_OFF="«Только отчёты» никого не блокирует: подтвердите, что вы этого хотите."
