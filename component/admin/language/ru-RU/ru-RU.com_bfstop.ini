COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="Супер администратор использует по умолчанию имя пользователя 'admin'. Это риск для безопасности; хакеры используют это имя пользователя очень часто для взлома. Для повышения безопасности рекомендуется изменить имя пользователя для супер администратора! Смотри также: <a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Joomla! FAQ Безопасность и производительность: Почему я должен немедленно изменить имя пользователя администратора по умолчанию после установки Joomla?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="Либо вы используете не сервер Apache, либо файл .htaccess не существует или недоступен для чтения или записи. Блокировка через .htaccess работать не будет."
COM_BFSTOP_WARNING_HTACCESS_NGINX="Этот сайт работает на nginx, который не читает файлы .htaccess: в режиме блокировки «%1$s» адреса отклоняет не веб-сервер, а только BFStop, как в режиме «%2$s». Выберите в настройках «%2$s»; nginx может запрещать адреса в собственной конфигурации."
COM_BFSTOP_WARNING_HTACCESS_LITESPEED="Этот сайт работает на LiteSpeed, который читает файлы .htaccess, но не все директивы Apache: соблюдает ли он разделы &lt;If&gt;, которыми BFStop блокирует адреса, зависит от его редакции и версии. Проверьте, что веб-сервер отклоняет заблокированный адрес, или выберите в настройках «%2$s»."
COM_BFSTOP_HTACCESS_CHECK="Проверить .htaccess"
COM_BFSTOP_HTACCESS_CHECK_EFFECTIVE="Веб-сервер соблюдает раздел блокировок файла .htaccess в %s: тестовый запрос, который он должен отклонить, был отклонён."
COM_BFSTOP_HTACCESS_CHECK_IGNORED="Веб-сервер игнорирует раздел блокировок файла .htaccess в %s: тестовый запрос, который он должен был отклонить, прошёл. Apache должен иметь право читать там директивы авторизации (AllowOverride AuthConfig или All). nginx не читает файлы .htaccess, OpenLiteSpeed читает из них только правила перезаписи, а LiteSpeed Enterprise может поддерживать не все директивы, которые использует раздел блокировок."
COM_BFSTOP_HTACCESS_CHECK_BROKEN="Веб-сервер выдал ошибку на тестовом файле с директивами раздела блокировок (статус 500): он их не понимает (нужен Apache 2.4 или новее). Раздел блокировок так же нарушил бы работу сайта в %s; подробности в журнале ошибок веб-сервера."
COM_BFSTOP_HTACCESS_CHECK_UNKNOWN="Не удалось проверить файл .htaccess в %1$s: %2$s."
