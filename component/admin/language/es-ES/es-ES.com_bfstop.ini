COM_BFSTOP_SETUP_START="Empezar"
COM_BFSTOP_SETUP_OVERVIEW_INSTALL="Bienvenido a Brute Force Stop. Antes de bloquear a nadie, tiene que saber cómo llegan los visitantes a su sitio: directamente, o a través de un proxy, un balanceador de carga o una CDN. Detrás de un proxy, todos los visitantes parecen venir de la dirección del proxy: sin los ajustes correctos, unos pocos inicios de sesión fallidos bloquearían a todo el mundo."
COM_BFSTOP_SETUP_OVERVIEW_UPGRADE="Brute Force Stop se ha actualizado desde la versión %s. Esto es lo que hizo la actualización:"
COM_BFSTOP_SETUP_OVERVIEW_DID_SETTINGS="Los ajustes se han trasladado del Gestor de plugins a este componente."
COM_BFSTOP_SETUP_OVERVIEW_DID_BLOCKMODE="Los antiguos interruptores «Bloqueo activado» y «Usar .htaccess» se han convertido en el modo de bloqueo «%s»."
COM_BFSTOP_SETUP_OVERVIEW_DID_API="Los inicios de sesión a través de la API de servicios web de Joomla también están protegidos ahora (el ajuste «Activo para»)."
COM_BFSTOP_SETUP_OVERVIEW_DID_ADDRESSES="Las direcciones de la lista de bloqueos y de la lista de permitidos se han unificado en una sola escritura."
COM_BFSTOP_SETUP_OVERVIEW_DID_MAINTENANCE="El mantenimiento diario es ahora una tarea del Planificador de tareas de Joomla."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS="Una sección de bloqueo que versiones anteriores escribieron en el archivo .htaccess, si la había, se ha reescrito en la forma actual."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS_FAILED="La sección de bloqueo que versiones anteriores escribieron en el archivo .htaccess no se ha podido reescribir: deja pasar a cualquiera que no esté bloqueado por encima de los demás controles de acceso de ese directorio. Haga que el archivo se pueda escribir y vuelva a ejecutar la actualización, o elimine la sección a mano."
COM_BFSTOP_SETUP_OVERVIEW_DID_DELAYS="Se ha eliminado el retardo de la respuesta a los inicios de sesión fallidos que usaban sus ajustes: Brute Force Stop responde ahora al instante y bloquea como antes."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_PROXY="La actualización ha desactivado Brute Force Stop: la petición de la actualización llegó a través de un proxy, un balanceador de carga o una CDN, y sin ajustes de proxy, BFStop bloquearía la dirección del proxy, es decir, a todo el mundo. Permanece desactivado hasta que se complete este asistente."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_LOADBALANCER="La actualización ha desactivado Brute Force Stop: «Detrás de un balanceador de carga» está activado en Joomla, por lo que el sitio parece estar detrás de un proxy, y sin ajustes de proxy, BFStop bloquearía la dirección del proxy, es decir, a todo el mundo. Permanece desactivado hasta que se complete este asistente."
COM_BFSTOP_SETUP_OVERVIEW_STEPS="El asistente repasa los ajustes que necesitan su decisión: cómo llegan los visitantes al sitio, y el modo de bloqueo. Cada paso propone lo que corresponde a lo que detecta; el último activa la protección."
COM_BFSTOP_SETUP_PROXY_INTRO="Brute Force Stop cuenta los inicios de sesión fallidos por dirección de visitante. Detrás de un proxy, un balanceador de carga o una CDN, el servidor web ve la dirección del proxy para cada visitante, y la dirección del visitante está en una cabecera que añade el proxy, que solo cuenta si la petición vino de un proxy en el que usted confía. Su propia petición a esta página muestra lo que se aplica a su sitio."
COM_BFSTOP_SETUP_PROXY_DETECTED="Lo que muestra su petición"
COM_BFSTOP_SETUP_PROXY_REMOTE_PUBLIC="Su petición llegó al servidor web desde %s, una dirección de Internet."
COM_BFSTOP_SETUP_PROXY_REMOTE_PRIVATE="Su petición llegó al servidor web desde %s, una dirección de una red privada o local, normalmente la de un proxy o un balanceador de carga."
COM_BFSTOP_SETUP_PROXY_HEADER_UNSUPPORTED="Llevaba la cabecera %s, que Brute Force Stop no lee."
COM_BFSTOP_SETUP_SCENARIO_A="Parece que se llega a su sitio directamente: no hay ningún proxy que configurar."
COM_BFSTOP_SETUP_SCENARIO_B="Su sitio parece estar detrás de un proxy inverso o un balanceador de carga. Sin ajustes de proxy, BFStop contaría los inicios de sesión fallidos de todos los visitantes en la dirección del proxy y bloquearía a todo el mundo."
COM_BFSTOP_SETUP_SCENARIO_C="Su servidor web ya toma la dirección del visitante de la cabecera del proxy (mod_remoteip, real_ip de nginx): BFStop no debe volver a leer la cabecera. Mantenga desactivado su ajuste de proxy."
COM_BFSTOP_SETUP_SCENARIO_D="Su sitio parece estar detrás de una CDN (o su propia red añade una cabecera de reenvío al salir). Sin ajustes de proxy, BFStop bloquearía los servidores de la CDN, y con ellos a visitantes al azar."
COM_BFSTOP_SETUP_SCENARIO_E="Su proxy solo envía cabeceras que Brute Force Stop no puede usar. Permanece inactivo hasta que el proxy envíe una cabecera que lea, o el servidor web resuelva la dirección."
COM_BFSTOP_SETUP_UNSUPPORTED="Su proxy envía %s, que Brute Force Stop no puede usar."
COM_BFSTOP_SETUP_UNSUPPORTED_USE_OTHER="Su petición también llevaba una cabecera que BFStop lee: elíjala abajo."
COM_BFSTOP_SETUP_UNSUPPORTED_FIX="Haga que el proxy añada a X-Forwarded-For (nginx: <code>proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</code>), o deje que el servidor web resuelva la dirección con su módulo real-IP (mod_remoteip de Apache, real_ip de nginx)."
COM_BFSTOP_SETUP_UNSUPPORTED_ISSUE="Cuéntenos su configuración (abre una nueva incidencia en GitHub, solo con los nombres de las cabeceras, el escenario detectado y las versiones)"
COM_BFSTOP_SETUP_CLOUDFLARE_WARNING="Su sitio parece estar detrás de Cloudflare. Confiar en todas las direcciones de Cloudflare permite a cualquiera que use Cloudflare llegar a su servidor con la dirección que elija en CF-Connecting-IP (un Worker en su propia zona puede fijarla). Solo es seguro si su servidor acepta el tráfico de Cloudflare únicamente para su zona: Authenticated Origin Pulls con un certificado de su zona, Cloudflare Tunnel o una regla de cortafuegos. Si no, deje que el servidor web resuelva la dirección con su módulo real-IP, y mantenga desactivado el ajuste de proxy de BFStop."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH="Obtener los rangos de direcciones de Cloudflare"
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH_DESC="Obtiene los rangos que publica Cloudflare (www.cloudflare.com/ips-v4 e ips-v6) como proxies de confianza, con la cabecera CF-Connecting-IP. Solo cuando hace clic: no se envía nada a ningún otro sitio."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCHED="Se han obtenido %d rangos de direcciones de Cloudflare. Compruébelos con su petición antes de guardar."
COM_BFSTOP_SETUP_CLOUDFLARE_FAILED="No se han podido obtener los rangos de direcciones de Cloudflare. Introdúzcalos a mano, desde www.cloudflare.com/ips."
COM_BFSTOP_SETUP_PROXY_CHOICE="¿Cómo se llega a su sitio?"
COM_BFSTOP_SETUP_PROXY_CHOICE_NONE="No hay ningún proxy que configurar: los visitantes llegan al sitio directamente, o el servidor web ya resuelve su dirección."
COM_BFSTOP_SETUP_PROXY_ACKNOWLEDGE="Estoy seguro: la cabecera de reenvío de su petición no viene de un proxy delante de este sitio (sino, por ejemplo, de mi propia red)."
COM_BFSTOP_SETUP_PROXY_CHOICE_PROXY="El sitio está detrás de un proxy, un balanceador de carga o una CDN, que envía la dirección del visitante en esta cabecera:"
COM_BFSTOP_SETUP_PROXY_HEADER_PRESENT="(su petición la lleva)"
COM_BFSTOP_SETUP_PROXY_TRUSTED_DESC="Se propone la dirección desde la que el proxy se conecta al servidor web. Si hay más de un nodo de proxy (varios balanceadores de carga, una CDN), indíquelos todos, o la red más pequeña que los contenga a todos (no más amplia que /8 para IPv4 o /16 para IPv6)."
COM_BFSTOP_SETUP_PREVIEW="Comprobar con mi petición"
COM_BFSTOP_SETUP_PREVIEW_QUESTION="Con estos ajustes, Brute Force Stop toma %s como su dirección. ¿Es esa la dirección de su ordenador en Internet? Si es la del proxy, u otra que no conoce, los ajustes aún no son adecuados."
COM_BFSTOP_SETUP_PREVIEW_CONFIRM="Sí, %s es la dirección de mi ordenador."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOTTRUSTED="Su petición no vino de ninguno de estos proxies de confianza: Brute Force Stop tomaría la dirección de la que vino, como sin ajustes de proxy. Añada la dirección de la que vino su petición (véase arriba)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOHEADER="Su petición no llevaba esta cabecera: elija una que lleve (véase arriba)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_UNUSABLE="Esta cabecera de su petición no termina en una dirección que no sea uno de los proxies de confianza: Brute Force Stop no podría determinar su dirección. Compruebe la cabecera y los proxies de confianza."
COM_BFSTOP_SETUP_PROXY_SAVE="Guardar y continuar"
COM_BFSTOP_SETUP_PROXY_SAVED="Los ajustes del proxy se han guardado."
COM_BFSTOP_SETUP_PROXY_ERROR_UNSUPPORTED="Su proxy solo envía cabeceras que Brute Force Stop no puede usar: hay un proxy, así que «sin proxy» bloquearía a todos los que están detrás. Haga primero que el proxy envíe una cabecera que BFStop lea."
COM_BFSTOP_SETUP_PROXY_ERROR_ACKNOWLEDGE="Su petición llegó a través de un proxy. Sin ajustes de proxy, Brute Force Stop bloquearía el proxy, es decir, a todo el mundo: confirme que aun así se llega al sitio directamente, o configure el proxy."
COM_BFSTOP_SETUP_PROXY_ERROR_CONFIRM="Compruebe los ajustes con su petición y confirme que la dirección mostrada es la de su ordenador antes de que se guarden."
COM_BFSTOP_SETUP_PROXY_ERROR_HEADER="Elija una cabecera que Brute Force Stop lea."
COM_BFSTOP_SETUP_PROXY_ERROR_TRUSTED="Introduzca la dirección (o la red) de su proxy."
COM_BFSTOP_SETUP_REMINDER="Mantenga estos ajustes al día. Siempre que cambie su alojamiento (un nuevo proxy o CDN, nodos del balanceador de carga añadidos o sustituidos, un traslado a otro proveedor), vuelva a ejecutar la comprobación del proxy. Unos ajustes erróneos pueden bloquear a todos los visitantes, o permitir que los atacantes elijan la dirección a la que se les atribuye."
COM_BFSTOP_SETUP_RERUN_PROXY_CHECK="Volver a comprobar el proxy"
COM_BFSTOP_SETUP_DISMISS="Es lo esperado"
COM_BFSTOP_SETUP_DISMISSED="Este mensaje no volverá a mostrarse, a menos que cambie otra cosa."
COM_BFSTOP_SETUP_MISMATCH_APPEARSBEHINDPROXY="Su sitio parece estar ahora detrás de un proxy, un balanceador de carga o una CDN: su petición llevaba una cabecera de reenvío, pero Brute Force Stop no confía en ningún proxy."
COM_BFSTOP_SETUP_MISMATCH_PROXYADDRESSCHANGED="¿Dirección de proxy nueva o cambiada? Su petición llevaba una cabecera de reenvío, pero no vino de ninguno de los proxies de confianza."
COM_BFSTOP_SETUP_MISMATCH_PROXYREMOVED="¿Se ha retirado el proxy, o está llegando al sitio directamente? Su petición no vino de ninguno de los proxies de confianza y no llevaba ninguna cabecera de reenvío."
COM_BFSTOP_SETUP_MISMATCH_HEADERCHANGED="Su proxy envía ahora otra cabecera: su petición vino de un proxy de confianza, sin la cabecera configurada pero con otra."
COM_BFSTOP_SETUP_MISMATCH_SERVERRESOLVES="Su servidor web ya resuelve la dirección del visitante; el ajuste de proxy de BFStop ya no es necesario."
COM_BFSTOP_SETUP_MISMATCH_UNSUPPORTEDHEADER="Su proxy solo envía cabeceras que Brute Force Stop no puede usar."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHON="El ajuste «Detrás de un balanceador de carga» de Joomla (Configuración global, Servidor) está desactivado: las sesiones de Joomla, el registro de acciones de usuarios (con las entradas de Brute Force Stop) y las herramientas de privacidad registran la dirección del proxy. Actívelo, pero solo si no se puede llegar al sitio más que a través del proxy: Joomla confía en la cabecera de cualquiera. Brute Force Stop no usa este ajuste."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHOFF="El ajuste «Detrás de un balanceador de carga» de Joomla (Configuración global, Servidor) está activado, pero aquí ningún proxy lo necesita: Joomla toma entonces la dirección, en sus propios registros, de una cabecera que cualquiera puede falsificar. Desactívelo. Brute Force Stop no usa este ajuste."
COM_BFSTOP_SETUP_PANEL_HEADING="Valores guardados que impiden guardar los ajustes"
COM_BFSTOP_SETUP_PANEL_DESC="La página de ajustes comprueba todos los ajustes cada vez que se guarda algo, y estos valores, guardados por una versión anterior o que ya no son válidos, no pasan la comprobación. Los valores propuestos se guardan junto con este paso; cámbielos si lo desea."
COM_BFSTOP_SETUP_PANEL_SETTING="Ajuste"
COM_BFSTOP_SETUP_PANEL_STORED="Guardado"
COM_BFSTOP_SETUP_PANEL_PROBLEM="Problema"
COM_BFSTOP_SETUP_PANEL_FIX="Valor propuesto"
COM_BFSTOP_SETUP_BLOCKMODE_INTRO="Su sitio funciona con %1$s. El modo de bloqueo es «%2$s»."
COM_BFSTOP_SETUP_SERVER_APACHE="Apache"
COM_BFSTOP_SETUP_SERVER_LITESPEED="LiteSpeed"
COM_BFSTOP_SETUP_SERVER_NGINX="nginx"
COM_BFSTOP_SETUP_SERVER_OTHER="un servidor web que Brute Force Stop no reconoce"
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_NGINX="nginx no lee los archivos .htaccess: «%1$s» solo fingiría bloquear en el servidor web. Elija «%2$s»; nginx puede denegar las direcciones bloqueadas con el archivo de denegación de nginx de abajo."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_LITESPEED="LiteSpeed lee los archivos .htaccess, pero no todas las directivas de Apache: si elige «%1$s», compruebe que funciona con el botón de abajo."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_HTACCESSPROXY="Detrás de un proxy, el servidor web compara las entradas del archivo .htaccess con la dirección del proxy, así que no rechazan a nadie o, si la dirección del proxy entra en él, a todo el mundo. Elija «%2$s», o deje que el servidor web resuelva primero la dirección del visitante (mod_remoteip)."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_REPORTINGONLY="«Solo informes» registra los inicios de sesión fallidos y envía notificaciones, pero no bloquea a nadie: su sitio no está protegido. Confirme abajo que es lo que pretende."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_UNPROTECTED="Su sitio no está protegido ahora: con «Solo informes», el retardo de los inicios de sesión fallidos era toda la protección de sus ajustes anteriores, y la actualización ha eliminado los retardos. Elija «Solo inicio de sesión» o «%2$s»."
COM_BFSTOP_SETUP_RECOMMENDED="recomendado"
COM_BFSTOP_SETUP_BLOCKMODE_LOGINONLY_DESC="Una dirección bloqueada puede navegar por el sitio, pero sus inicios de sesión se rechazan."
COM_BFSTOP_SETUP_BLOCKMODE_FULL_DESC="Se rechaza cada petición de una dirección bloqueada (excepto la página de desbloqueo y la recuperación de la contraseña)."
COM_BFSTOP_SETUP_BLOCKMODE_HTACCESS_DESC="Como «Todo el sitio», y el servidor web también rechaza las direcciones bloqueadas, desde el archivo .htaccess (Apache 2.4; no detrás de un proxy)."
COM_BFSTOP_SETUP_BLOCKMODE_OFF_DESC="Los inicios de sesión fallidos se registran y se notifican, no se bloquea a nadie."
COM_BFSTOP_SETUP_BLOCKMODE_CONFIRM_OFF="Con «Solo informes»: sé que no bloquea a nadie."
COM_BFSTOP_SETUP_NGINX_INCLUDE="Incluya el archivo en el bloque server de la configuración de nginx de su sitio, y haga que nginx se recargue cuando cambie:"
COM_BFSTOP_SETUP_BLOCKMODE_SAVE="Guardar y continuar"
COM_BFSTOP_SETUP_BLOCKMODE_SAVED="El modo de bloqueo se ha guardado."
COM_BFSTOP_SETUP_BLOCKMODE_ERROR_MODE="Elija un modo de bloqueo."
COM_BFSTOP_SETUP_BLOCKMODE_ERROR_OFF="«Solo informes» no bloquea a nadie: confirme que es lo que pretende."
COM_BFSTOP_SETUP_SUMMARY_COMPLETED="La protección se activó el %s."
COM_BFSTOP_SETUP_SUMMARY_COMPLETED_DISABLED="La protección se activó el %s, pero el plugin se ha desactivado desde entonces. Vuelva a activarla abajo."
COM_BFSTOP_SETUP_SUMMARY_SETTINGS="Con los ajustes actuales, Brute Force Stop bloquea una dirección tras %1$d inicios de sesión fallidos en %2$s (menos si los intentos parecen arriesgados, o la cuenta es atacada desde muchas direcciones), durante %3$s. Todos los demás ajustes mantienen sus valores: cámbielos en la página de ajustes en cualquier momento."
COM_BFSTOP_SETUP_MISSING_PROXY="El paso del proxy aún no está hecho."
COM_BFSTOP_SETUP_MISSING_BLOCKMODE="El paso del modo de bloqueo aún no está hecho."
COM_BFSTOP_SETUP_MISSING_MODEUNFIT="El modo de bloqueo no es adecuado para el servidor web (.htaccess en nginx)."
COM_BFSTOP_SETUP_MISSING_BLOCKINGVALUES="Hay valores guardados que impiden guardar los ajustes."
COM_BFSTOP_SETUP_ACTIVATE="Activar la protección"
COM_BFSTOP_SETUP_ACTIVATED="Brute Force Stop está activo."
COM_BFSTOP_SETUP_ACTIVATE_ERROR_MISSING="La protección aún no se puede activar: complete primero los pasos marcados como «pendiente»."
COM_BFSTOP_SETUP_ACTIVATE_ERROR_PLUGIN="No se ha podido activar el plugin «Sistema - Brute Force Stop»: ¿está instalado?"
COM_BFSTOP_BANNER_NOT_ACTIVE="Brute Force Stop no está activo: su plugin está desactivado. Ejecute el <a href=\"%s\">asistente de configuración</a>, que lo activa."
COM_BFSTOP_BANNER_SETUP_INCOMPLETE="La configuración de Brute Force Stop no está completa. Abra el <a href=\"%s\">asistente de configuración</a>."
COM_BFSTOP_BANNER_PROXY_CHECK="Abra la <a href=\"%s\">comprobación del proxy</a>."
COM_BFSTOP_POSTINSTALL_SETUP_TITLE="Brute Force Stop: complete la configuración"
COM_BFSTOP_POSTINSTALL_SETUP_DESC="Brute Force Stop solo protege su sitio cuando su asistente de configuración ha comprobado cómo llegan los visitantes al sitio (directamente, o a través de un proxy, un balanceador de carga o una CDN) y el modo de bloqueo, y lo ha activado."
COM_BFSTOP_POSTINSTALL_SETUP_ACTION="Abrir el asistente de configuración"
COM_BFSTOP_ACTIONLOG_SETUP_STEP_APPLIED="El usuario <a href=\"{accountlink}\">{username}</a> aplicó el paso {step} del asistente de configuración de Brute Force Stop"
COM_BFSTOP_ACTIONLOG_PROTECTION_ACTIVATED="El usuario <a href=\"{accountlink}\">{username}</a> activó la protección de Brute Force Stop"
COM_BFSTOP_SETUP_PAGE_CLEANUP="Limpieza tras la corrección del proxy"
COM_BFSTOP_SETUP_PAGE_HTACCESS="Sección .htaccess de versiones anteriores"
COM_BFSTOP_SETUP_PAGE_NOTIFY="Notificaciones"
COM_BFSTOP_SETUP_PAGE_PARTS="Partes protegidas"
COM_BFSTOP_SETUP_PAGE_PRIVACY="Privacidad"
COM_BFSTOP_SETUP_PAGE_RATELIMIT="Limitación de frecuencia"
COM_BFSTOP_SETUP_PAGE_SCHEDULER="Mantenimiento programado"
COM_BFSTOP_SETUP_SAVE="Guardar y continuar"
COM_BFSTOP_SETUP_SKIP="Omitir"
COM_BFSTOP_SETUP_SKIPPED="Se ha omitido el paso. Puede volver a él en cualquier momento."
COM_BFSTOP_SETUP_STEP_SAVED="El paso está hecho."
COM_BFSTOP_SETUP_UNDERSTOOD="Entendido, continuar"
COM_BFSTOP_SETUP_ERROR_SKIP="Este paso no se puede omitir ni guardar de esta forma."
COM_BFSTOP_SETUP_CHECK_AGAIN="Comprobar de nuevo"
COM_BFSTOP_SETUP_PROXY_SUSPICIOUS_BLOCKS="Estos bloqueos activos parecen los de un proxy (una dirección de una red privada, o aquella desde la que vino su petición): %1$s. Si es su proxy, todos los que están detrás están bloqueados: levante los bloqueos en la <a href=\"%2$s\">lista de bloqueos</a>, y configure el proxy abajo."
COM_BFSTOP_SETUP_CLEANUP_INTRO="Mientras BFStop tomaba la dirección del proxy por la de cada visitante, contó sus inicios de sesión fallidos en el proxy, puede que lo bloqueara (lo que bloquea a todo el mundo y hace permanente el siguiente bloqueo tras unos cuantos) y lo registró como una dirección desde la que ha iniciado sesión cada usuario. Este paso elimina lo que BFStop guarda de los proxies de confianza."
COM_BFSTOP_SETUP_CLEANUP_NO_PROXY="No hay ningún proxy configurado, así que no hay nada de un proxy que limpiar."
COM_BFSTOP_SETUP_CLEANUP_BLOCKS="Bloqueos activos de un proxy: %d"
COM_BFSTOP_SETUP_CLEANUP_FAILEDLOGINS="Inicios de sesión fallidos contados en un proxy: %d"
COM_BFSTOP_SETUP_CLEANUP_OFFENCES="Bloqueos anteriores de un proxy que cuentan para un bloqueo permanente: %d"
COM_BFSTOP_SETUP_CLEANUP_KNOWNIPS="Inicios de sesión registrados desde la dirección de un proxy: %d"
COM_BFSTOP_SETUP_CLEANUP_ALLOWLIST="La lista de permitidos tiene entradas que contienen un proxy de confianza: %1$s. Añadir el proxy a la lista de permitidos es un apaño habitual, pero exime de la protección a todos los visitantes. Elimínelas en la <a href=\"%2$s\">lista de permitidos</a> ahora que el proxy está configurado."
COM_BFSTOP_SETUP_CLEANUP_RUN="Limpiar"
COM_BFSTOP_SETUP_CLEANUP_DONE="Se ha eliminado lo que BFStop guardaba del proxy."
COM_BFSTOP_SETUP_CLEANUP_ERROR_NO_PROXY="Configure primero el proxy (el paso del proxy): la limpieza necesita conocer su dirección."
COM_BFSTOP_SETUP_HTACCESS_INTRO="El archivo .htaccess %s aún tiene la sección de bloqueo que escribieron versiones anteriores y que la actualización no pudo reescribir. Deja pasar a cualquiera que no esté bloqueado por encima de los demás controles de acceso de ese directorio (protección con contraseña, restricciones de IP). Haga que el archivo se pueda escribir y reescríbala aquí, o elimine a mano las líneas entre '# BEGIN BFStop Blocks' y '# END BFStop Blocks'."
COM_BFSTOP_SETUP_HTACCESS_FINE="La sección de bloqueo de %s tiene su forma actual."
COM_BFSTOP_SETUP_HTACCESS_CURRENT="La sección ahora"
COM_BFSTOP_SETUP_HTACCESS_PROPOSED="La sección reescrita"
COM_BFSTOP_SETUP_HTACCESS_RUN="Reescribir la sección"
COM_BFSTOP_SETUP_HTACCESS_DONE="La sección de bloqueo del archivo .htaccess tiene su forma actual."
COM_BFSTOP_SETUP_HTACCESS_ERROR_WRITE="No se ha podido reescribir la sección de bloqueo de %s: haga que el archivo se pueda escribir e inténtelo de nuevo."
COM_BFSTOP_SETUP_NOTIFY_INTRO="Quién recibe avisos de los inicios de sesión fallidos y de los bloqueos, y si un usuario cuyo nombre de usuario hizo que se bloqueara una dirección recibe un enlace para desbloquearla."
COM_BFSTOP_SETUP_NOTIFY_MEANING="El significado de los correos de desbloqueo ha cambiado con esta actualización. La versión 1.x enviaba el enlace para cualquier dirección; ahora este ajuste tiene tres valores: «solo si el usuario ya ha iniciado sesión desde esa dirección» (recomendado: desde ahí se bloquea uno a sí mismo, nunca desde la dirección de un atacante), «para cualquier dirección IP» (cualquiera puede hacer que el sitio envíe un correo a cualquier usuario fallando al iniciar sesión con su nombre; como máximo un enlace utilizable por usuario) y desactivado. Su ajuste se ha tomado como el primero. Ambos necesitan la dirección del sitio ($live_site). Elija abajo."
COM_BFSTOP_SETUP_PARTS_INTRO="Dónde cuenta Brute Force Stop los inicios de sesión fallidos y rechaza las direcciones bloqueadas: el sitio (frontend), la administración (backend) y la API de servicios web de Joomla, cuyos inicios de sesión usan tokens de API o autenticación HTTP Basic."
COM_BFSTOP_SETUP_PARTS_API_TOKENS="Usuarios con un token de API activado: %d. Una integración que use la API desde una dirección cuyos inicios de sesión puedan fallar puede hacer que se bloquee esa dirección."
COM_BFSTOP_SETUP_PARTS_ERROR_NONE="Elija al menos una parte: si no, Brute Force Stop no protegería nada."
COM_BFSTOP_SETUP_PRIVACY_FAILEDLOGINS="Brute Force Stop guarda %1$d inicios de sesión fallidos, el más antiguo del %2$s. Contienen direcciones y nombres de usuario: datos personales."
COM_BFSTOP_SETUP_PRIVACY_NO_FAILEDLOGINS="Brute Force Stop no guarda ningún inicio de sesión fallido."
COM_BFSTOP_SETUP_HASHING_HEADING="Nombres de usuario guardados en texto plano"
COM_BFSTOP_SETUP_HASHING_DESC="La versión 1.x guardaba cada nombre de usuario escrito en el formulario de inicio de sesión – también contraseñas escritas allí por error – y la actualización los copió en las estadísticas de nombres de usuario, que no se purgan por antigüedad. Desde la 2.0, los nuevos que no pertenecen a ninguna cuenta se guardan como hash, los antiguos no. Esto sustituye también los antiguos por su hash, en rondas de unos segundos: los nombres de usuario de cuentas y los nombres de usuario comunes de los ajustes siguen legibles, y las estadísticas que acaban con el mismo hash se fusionan. No se puede deshacer."
COM_BFSTOP_SETUP_HASHING_RUN="Aplicar hash a los nombres de usuario antiguos"
COM_BFSTOP_SETUP_HASHING_CONTINUE="Continuar con el hash"
COM_BFSTOP_SETUP_HASHING_PROGRESS="%d nombres de usuario con hash hasta ahora. Continúe para aplicar el hash al resto."
COM_BFSTOP_SETUP_HASHING_DONE="Todos los nombres de usuario antiguos que no pertenecen a ninguna cuenta tienen ahora hash (%d en esta ejecución)."
COM_BFSTOP_SETUP_PRIVACY_LOG="El archivo de registro (%1$s) también contiene nombres de usuario: vacíelo en la <a href=\"%2$s\">página del registro</a> si lo desea."
COM_BFSTOP_SETUP_RATELIMIT_INTRO="La actualización ha eliminado el retardo de la respuesta a los inicios de sesión fallidos que usaban sus ajustes: una respuesta retardada ocupa un proceso de PHP durante todo el retardo, lo que los atacantes pueden usar para agotar los del servidor, y apenas los frena. El bloqueo sigue deteniéndolos; para frenar a los clientes, use una limitación de frecuencia por delante de PHP."
COM_BFSTOP_SETUP_RATELIMIT_DIRECT="Se llega a su sitio directamente: la limitación de frecuencia del servidor web funciona, por ejemplo limit_req de nginx, mod_evasive o mod_qos de Apache, o fail2ban (véase el README de BFStop)."
COM_BFSTOP_SETUP_RATELIMIT_PROXY="Su sitio está detrás de un proxy o una CDN: el servidor web solo ve la dirección del proxy, así que los límites por dirección frenarían a todos los visitantes a la vez, y fail2ban bloquearía el proxy. Limite en el proxy o la CDN, o deje que el servidor web resuelva primero la dirección del visitante (su módulo real-IP)."
COM_BFSTOP_SETUP_RATELIMIT_RESOLVED="Su servidor web resuelve él mismo la dirección del visitante: su limitación de frecuencia funciona, con la dirección que fija el módulo real-IP."
COM_BFSTOP_SETUP_SCHEDULER_INTRO="Una vez al día, Brute Force Stop purga lo que guarda desde hace demasiado tiempo, limita sus tablas y quita los bloqueos caducados del archivo .htaccess, como tarea del Planificador de tareas de Joomla."
COM_BFSTOP_SETUP_SCHEDULER_PLUGIN_ON="El plugin «Tarea - Brute Force Stop» está activado."
COM_BFSTOP_SETUP_SCHEDULER_PLUGIN_OFF="El plugin «Tarea - Brute Force Stop» no está activado."
COM_BFSTOP_SETUP_SCHEDULER_NO_TASK="No hay ninguna tarea «Brute Force Stop maintenance»."
COM_BFSTOP_SETUP_SCHEDULER_TASK_ON="La tarea «%1$s» está activada; última ejecución: %2$s, próxima ejecución: %3$s."
COM_BFSTOP_SETUP_SCHEDULER_TASK_OFF="La tarea «%1$s» está desactivada; última ejecución: %2$s."
COM_BFSTOP_SETUP_SCHEDULER_LAZY_ON="El Planificador de tareas ejecuta las tareas pendientes en las peticiones de los visitantes («Lazy Scheduler»)."
COM_BFSTOP_SETUP_SCHEDULER_LAZY_OFF="El «Lazy Scheduler» del Planificador de tareas está desactivado: las tareas pendientes solo se ejecutan si un cron las ejecuta (php cli/joomla.php scheduler:run)."
COM_BFSTOP_SETUP_SCHEDULER_FALLBACK="Sin una tarea activada, la petición de un visitante ejecuta el mantenimiento en cuanto lleva dos días sin ejecutarse."
COM_BFSTOP_SETUP_SCHEDULER_TASKS_LINK="Tareas programadas"
COM_BFSTOP_SETUP_SCHEDULER_PLUGINS_LINK="Plugins de tareas"
COM_BFSTOP_SETUP_SCHEDULER_OPTIONS_LINK="Opciones del Planificador de tareas"
COM_BFSTOP_SETUP_SUMMARY_CHANGED_DEFAULTS="Valores predeterminados de la 2.0 que cambian lo que hace un sitio actualizado:"
COM_BFSTOP_SETUP_SUMMARY_DEFAULT_ACCOUNT="«Ataques distribuidos a una cuenta»: mientras una cuenta es atacada desde muchas direcciones, sus atacantes se bloquean antes (3 puntos de riesgo por defecto)."
COM_BFSTOP_SETUP_SUMMARY_DEFAULT_RISK="Puntuación de riesgo: un nombre de usuario común o la falta de agente de usuario reducen el número de intentos permitidos."
COM_BFSTOP_SETUP_SUMMARY_DEFAULT_IPV6="Los clientes IPv6 se siguen por red /56."
COM_BFSTOP_SETUP_SUMMARY_DEFAULT_LOG="El registro de BFStop se poda tras 28 días, en el primer mantenimiento."
COM_BFSTOP_SETUP_SUMMARY_DEFAULT_DELAY="Las respuestas a los inicios de sesión fallidos ya no se retardan."
COM_BFSTOP_SETUP_SUMMARY_DEFAULT_SCHEDULER="El mantenimiento diario es una tarea del Planificador de tareas de Joomla."
COM_BFSTOP_ACTIONLOG_USERNAMES_HASHED="El usuario <a href=\"{accountlink}\">{username}</a> aplicó el hash a los nombres de usuario que Brute Force Stop 1.x guardó en texto plano"
COM_BFSTOP_SETUP_PROXY_CDN_REALIP="Detrás de un CDN, lo mejor es que el servidor web tome él mismo la dirección del visitante de la cabecera del CDN (mod_remoteip de Apache, el módulo real_ip de nginx, con los rangos de direcciones que publica el CDN): así Brute Force Stop no necesita ajustes de proxy. Si no, introduzca como proxies de confianza todos los rangos de direcciones que publica su CDN; la dirección de la que vino su petición es solo uno de los muchos servidores del CDN."
COM_BFSTOP_SETUP_PROXY_COMMON_NETWORK="Todas las direcciones introducidas están en la red %s."
COM_BFSTOP_SETUP_PROXY_USE_NETWORK="Usar esta red"
COM_BFSTOP_SETUP_SUMMARY_NO_PROXY_ACKNOWLEDGED="Ha confirmado que no hay ningún proxy delante de este sitio, aunque su petición llegó a través de un proxy o CDN. Si eso es incorrecto, Brute Force Stop bloqueará la dirección del proxy - es decir, a todos - tras los primeros inicios de sesión fallidos. Revise de nuevo el <a href=\"%s\">paso del proxy</a> antes de activar la protección."
COM_BFSTOP_SETUP_SUMMARY_SELF_BLOCKED="Su propia dirección, %1$s (tal como los ajustes guardados la toman de su petición), está bloqueada. Activado, Brute Force Stop le dejaría fuera - de todo el sitio con \"Todo el sitio\". Levante primero el bloqueo en la <a href=\"%2$s\">lista de bloqueos</a>, o añada su dirección a la lista de permitidos."
COM_BFSTOP_SETUP_OVERVIEW_UPDATE_REQUEST="La petición de la actualización llegó por otro camino que esta: %1$s Cabeceras de reenvío que llevaba: %2$s."
COM_BFSTOP_SETUP_CLEANUP_NOTHING="BFStop no guarda nada de los proxies de confianza: no hay nada que limpiar."
