COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="Super-usuario está utilizando el valor predeterminado para el nombre de usuario 'admin'. Este es un riesgo de seguridad, los atacantes saben que este nombre de usuario ya existe en Joomla!-instalación, por lo tanto, se utiliza muy frecuentemente en muchos de los ataques. Para aumentar la seguridad, se recomienda cambiar el nombre de usuario para el superusuario. Ver también: <a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Joomla! Security and Performance FAQ: Why should I immediately change the name of the default admin user after a new install?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="O bien no está utilizando un servidor Apache, o bien el archivo .htaccess no existe o no se puede leer o escribir. El bloqueo mediante .htaccess no funcionará."
COM_BFSTOP_WARNING_HTACCESS_NGINX="Este sitio funciona con nginx, que no lee los archivos .htaccess: con el modo de bloqueo «%1$s», el servidor web no rechaza ninguna dirección, solo lo hace BFStop, como con «%2$s». Elija «%2$s» en los ajustes; nginx puede denegar direcciones en su propia configuración."
COM_BFSTOP_WARNING_HTACCESS_LITESPEED="Este sitio funciona con LiteSpeed, que lee los archivos .htaccess, pero no todas las directivas de Apache: que respete las secciones &lt;If&gt; con las que BFStop bloquea direcciones depende de su edición y versión. Compruebe que el servidor web rechaza una dirección bloqueada, o elija «%2$s» en los ajustes."
COM_BFSTOP_HTACCESS_CHECK="Comprobar .htaccess"
COM_BFSTOP_HTACCESS_CHECK_EFFECTIVE="El servidor web respeta la sección de bloqueos del archivo .htaccess en %s: una solicitud de prueba que debe rechazar fue rechazada."
COM_BFSTOP_HTACCESS_CHECK_IGNORED="El servidor web ignora la sección de bloqueos del archivo .htaccess en %s: una solicitud de prueba que debería haber rechazado pasó. Apache debe poder leer allí las directivas de autorización (AllowOverride AuthConfig, o All). nginx no lee los archivos .htaccess, OpenLiteSpeed solo lee sus reglas de reescritura y puede que LiteSpeed Enterprise no admita todas las directivas que usa la sección de bloqueos."
COM_BFSTOP_HTACCESS_CHECK_BROKEN="El servidor web falló con un archivo de prueba con las directivas de la sección de bloqueos (estado 500): no las entiende (necesitan Apache 2.4 o posterior). La sección de bloqueos rompería el sitio en %s de la misma manera; el registro de errores del servidor web da más detalles."
COM_BFSTOP_HTACCESS_CHECK_UNKNOWN="No se pudo comprobar el archivo .htaccess en %1$s: %2$s."
