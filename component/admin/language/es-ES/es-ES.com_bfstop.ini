COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED="Se han eliminado las estadísticas de %1$d nombres de usuario no vistos desde hace más de %2$d días."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_0="No había nombres de usuario no vistos desde hace más de %2$d días."
COM_BFSTOP_USERNAMESTATS_PURGE_N_DELETED_1="Se han eliminado las estadísticas de un nombre de usuario no visto desde hace más de %2$d días."
COM_BFSTOP_USERNAMESTATS_PURGE_INVALID_AGE="Introduzca un número de días de al menos 1."
COM_BFSTOP_USERNAMESTATS_PURGE_FAILED="Ha fallado la eliminación de las estadísticas de nombres de usuario obsoletos: %s"
COM_BFSTOP_FAILEDLOGIN_FILTERED_BY_USERNAME="Se muestran solo los inicios de sesión fallidos del nombre de usuario «%s»."
COM_BFSTOP_FAILEDLOGIN_FILTER_CLEAR="Mostrar todos"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Nombres de usuario que no corresponden a una cuenta"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Los usuarios suelen escribir su contraseña en el campo del nombre de usuario. Con «Hash», el nombre de usuario de un inicio de sesión fallido solo se guarda (y se muestra, registra y envía por correo) tal como se escribió si pertenece a una cuenta existente o está en la lista de nombres de usuario comunes; cualquier otro se sustituye por un valor ilegible que, aun así, es el mismo para la misma entrada, de modo que los intentos con él se cuentan juntos. «Guardar tal cual» mantiene legible cada nombre de usuario introducido, pero entonces también guarda las contraseñas escritas en el campo del nombre de usuario."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Hash (recomendado)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Guardar tal cual"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="No es una dirección de correo electrónico válida: %s"
COM_BFSTOP_SETTINGS_PROXY_IP_INVALID="No es una dirección de proxy válida: %1$s. Cada entrada debe ser una dirección IP o una red en notación CIDR, con una longitud de prefijo de al menos /%2$d para IPv4 y /%3$d para IPv6."
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="La ruta de .htaccess debe ser un directorio existente del sistema de archivos del servidor."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="La ruta de la base de datos GeoIP debe ser el nombre de un archivo de base de datos de MaxMind (que termine en .mmdb) del sistema de archivos del servidor."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="Granularidad del seguimiento de IPv6"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="Un cliente con dirección IPv6 suele controlar toda una red y puede cambiar a otra dirección de ella cuando quiera. Por eso los inicios de sesión fallidos y los bloqueos de clientes IPv6 se registran por red de este tamaño en lugar de por dirección. Un /64 es una sola red local; una conexión doméstica, móvil o de empresa suele recibir al menos un /56 - 256 redes de ese tipo, desde cualquiera de las cuales su titular puede enviar peticiones -, por eso se recomienda /56. Elija una red más pequeña o una sola dirección solo si sabe que los clientes de su sitio comparten sus redes con otros a los que no quiere bloquear a la vez."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Dirección única (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Límite de tamaño del archivo de registro (MB)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Cuando el archivo de registro supera este tamaño, se traslada a un segundo archivo (plg_system_bfstop.1.log.php en el directorio de registros), que sustituye al anterior. Así, los archivos de registro juntos nunca ocupan mucho más del doble de este tamaño."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Conservar entradas del registro (días)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Las entradas del registro con más de este número de días se eliminan automáticamente (una vez al día, aunque entretanto se desactive el registro). Use 0 para conservar las entradas hasta alcanzar el límite de tamaño."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Las entradas del registro con más de %1$d días se eliminan automáticamente y el archivo de registro se rota cuando supera los %2$d MB. Puede cambiarlo en la pestaña «Avanzado» de los <a href=\"%3$s\">Ajustes</a>."
COM_BFSTOP_LOG_AUTOPRUNE_DISABLED="Actualmente las entradas antiguas del registro no se eliminan por antigüedad, solo cuando el archivo de registro se rota al superar los %1$d MB. Para cambiarlo, configure «Conservar entradas del registro» en los <a href=\"%2$s\">Ajustes</a>, o use los botones «Depurar registro» y «Vaciar registro»."
COM_BFSTOP_LOG_PRUNE_BUTTON="Depurar registro"
COM_BFSTOP_LOG_PRUNE_DISABLED="Depurar requiere un periodo de conservación: configure «Conservar entradas del registro» en los <a href=\"%s\">Ajustes</a>, o vacíe el registro."
COM_BFSTOP_LOG_PRUNE_N_DELETED="Se han eliminado %1$d entradas del registro con más de %2$d días."
COM_BFSTOP_LOG_PRUNE_N_DELETED_0="No había entradas del registro con más de %2$d días."
COM_BFSTOP_LOG_PRUNE_N_DELETED_1="Se ha eliminado una entrada del registro con más de %2$d días."
COM_BFSTOP_LOG_CLEAR_BUTTON="Vaciar registro"
COM_BFSTOP_LOG_CLEAR_TITLE="Vaciar el registro"
COM_BFSTOP_LOG_CLEAR_DESC="Todas las entradas del registro se eliminarán de forma permanente, incluidas las del archivo de registro anterior. Esta acción no se puede deshacer. Los bloqueos y las entradas de inicios de sesión fallidos no se ven afectados."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Vaciar"
COM_BFSTOP_LOG_CLEARED="Se ha vaciado el registro."
COM_BFSTOP_SETTINGS_NOTIFY_ANY_NEEDS_LIVE_SITE="Los enlaces de desbloqueo solo se pueden enviar si la dirección del sitio está definida ($live_site en el configuration.php del sitio). Defínala allí, o desactive los enlaces de desbloqueo."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_ABOVE_BLOCK_NUMBER="\"%1$s\" (%2$d) no puede ser mayor que \"%3$s\" (%4$d): cada cliente tendría %2$d intentos. Reduzca \"%1$s\", o aumente \"%3$s\"."
COM_BFSTOP_SETTINGS_HTACCESS_NEEDS_APACHE="Este sitio funciona con nginx, que no lee los archivos .htaccess: el modo de bloqueo «%1$s» no puede funcionar aquí. Elija «%2$s»; nginx puede denegar direcciones en su propia configuración."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_LABEL="Archivo de denegación de nginx"
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_DESC="Solo para sitios servidos por nginx, que no lee los archivos .htaccess: un archivo (una ruta absoluta, terminada en .conf) en el que BFStop mantiene los bloqueos activos, como líneas «deny», para que el bloque server de la configuración de nginx del sitio lo incluya. nginx solo lo lee al recargarse: haga que se recargue cuando el archivo cambie (p. ej., con una unidad path de systemd o una tarea cron que ejecute «nginx -t &amp;&amp; nginx -s reload»). Se omiten las direcciones de la lista de permitidos y los proxies de confianza. Vacío: ningún archivo."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_PATH="No es un archivo que BFStop pueda escribir como archivo de denegación de nginx: %1$s. Debe ser la ruta absoluta de un archivo cuyo nombre termine en %2$s."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_DIRECTORY="El directorio del archivo de denegación de nginx %1$s no existe o no se puede escribir en él."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_FOREIGN="%1$s existe y no lo escribió BFStop: se sobrescribiría. Elija un archivo nuevo."
COM_BFSTOP_WARNING_NO_LIVE_SITE="La dirección del sitio no está definida ($live_site en configuration.php). Entonces Joomla! construye los enlaces de los correos de Brute Force Stop con el host indicado en cada petición, que un visitante puede elegir libremente - por eso no se envían enlaces de desbloqueo y las notificaciones a los administradores no indican ninguna dirección. Para definir la dirección, añada esta línea a la clase del configuration.php del sitio, con la dirección en la que se accede al sitio (propuesta a partir de esta petición, compruébela): %s"
COM_BFSTOP_WARNING_NOTIFY_ANY_WITHOUT_LIVE_SITE="Se deben enviar enlaces de desbloqueo (<a href=\"%s\">configuración</a>), pero la dirección del sitio no está definida ($live_site en configuration.php): no se envían enlaces de desbloqueo."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_56="/56 (recomendado)"
COM_BFSTOP_IP_NETWORK_TOO_LARGE="La red %1$s es demasiado grande: la longitud de su prefijo debe ser al menos /%2$d para IPv4 y /%3$d para IPv6."
COM_BFSTOP_IPADDRESS_TRUSTED_PROXY="Esto es (o contiene) un proxy de confianza de la configuración: bloqueado en el archivo .htaccess, se rechazaría cualquier petición que pase por él."
COM_BFSTOP_SETTINGS_HTACCESS_NOT_TIDIED="Brute Force Stop no pudo quitar sus bloqueos de <code>%s</code>, que ya no bloquea: el servidor web sigue rechazando estas direcciones, también cuando sus bloqueos han terminado. Haga el archivo escribible y quítelas a mano - están en las líneas &lt;If&gt; entre '# BEGIN BFStop Blocks' y '# END BFStop Blocks'."
COM_BFSTOP_BLOCK_HTACCESS_NOT_WRITTEN="El bloqueo se ha guardado, pero no se pudo añadir a <code>%s</code>: Joomla rechaza la dirección, el servidor web no."

