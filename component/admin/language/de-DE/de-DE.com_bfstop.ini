COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="Der Superuser hat den Standard-Benutzernamen 'admin'. Dies stellt ein Sicherheitsrisiko dar; Angreifern ist bewusst, dass dieser Benutzername in vielen Joomla!-Installationen existiert, darum wird er bei Angriffen besonders oft verwendet. Zur Erhöhung der Sicherheit wird empfohlen, den Benutzernamen zu ändern! Siehe auch: <a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>FAQ: Why should I immediately change the name of the default admin user after a new install?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="Ihr Server ist entweder kein Apache, oder die .htaccess existiert entweder nicht oder ist nicht les- oder beschreibbar; das Blocken mittels .htaccess-Eintrag wird nicht funktionieren!"
COM_BFSTOP_WARNING_HTACCESS_NGINX="Diese Website läuft auf nginx, das keine .htaccess-Dateien liest: Mit dem Sperrmodus „%1$s“ weist nicht der Webserver Adressen ab, sondern nur BFStop, wie bei „%2$s“. Wähle in den Einstellungen „%2$s“; nginx kann Adressen in seiner eigenen Konfiguration sperren."
COM_BFSTOP_WARNING_HTACCESS_LITESPEED="Diese Website läuft auf LiteSpeed, das .htaccess-Dateien liest, aber nicht jede Direktive von Apache: Ob es die &lt;If&gt;-Abschnitte beachtet, mit denen BFStop Adressen sperrt, hängt von seiner Edition und Version ab. Prüfe, ob der Webserver eine gesperrte Adresse abweist, oder wähle in den Einstellungen „%2$s“."
COM_BFSTOP_HTACCESS_CHECK="Prüfe .htaccess"
COM_BFSTOP_HTACCESS_CHECK_EFFECTIVE="Der Webserver beachtet den Sperrabschnitt der .htaccess-Datei in %s: Eine Testanfrage, die er abweisen soll, wurde abgewiesen."
COM_BFSTOP_HTACCESS_CHECK_IGNORED="Der Webserver ignoriert den Sperrabschnitt der .htaccess-Datei in %s: Eine Testanfrage, die er hätte abweisen sollen, kam durch. Apache muss dort Autorisierungsdirektiven lesen dürfen (AllowOverride AuthConfig oder All). nginx liest keine .htaccess-Dateien, OpenLiteSpeed liest nur ihre Rewrite-Regeln, und LiteSpeed Enterprise unterstützt womöglich nicht jede Direktive, die der Sperrabschnitt verwendet."
COM_BFSTOP_HTACCESS_CHECK_BROKEN="Der Webserver ist an einer Testdatei mit den Direktiven des Sperrabschnitts gescheitert (Status 500): Er versteht sie nicht (sie brauchen Apache 2.4 oder neuer). Der Sperrabschnitt würde die Website in %s genauso lahmlegen; mehr steht im Fehlerlog des Webservers."
