COM_BFSTOP_SETUP_START="Commencer"
COM_BFSTOP_SETUP_OVERVIEW_INSTALL="Bienvenue dans Brute Force Stop. Avant de bloquer qui que ce soit, il doit savoir comment les visiteurs atteignent votre site : directement, ou via un proxy, un répartiteur de charge ou un CDN. Derrière un proxy, chaque visiteur semble venir de l'adresse du proxy : sans les bons réglages, quelques échecs de connexion bloqueraient tout le monde."
COM_BFSTOP_SETUP_OVERVIEW_UPGRADE="Brute Force Stop a été mis à jour depuis la version %s. Voici ce que la mise à jour a fait :"
COM_BFSTOP_SETUP_OVERVIEW_DID_SETTINGS="Les réglages ont quitté le Gestionnaire de plugins pour ce composant."
COM_BFSTOP_SETUP_OVERVIEW_DID_BLOCKMODE="Les anciens interrupteurs « Blocage activé » et « Utiliser .htaccess » sont devenus le mode de blocage « %s »."
COM_BFSTOP_SETUP_OVERVIEW_DID_API="Les connexions via l'API des services web de Joomla sont désormais protégées aussi (le réglage « Actif pour »)."
COM_BFSTOP_SETUP_OVERVIEW_DID_ADDRESSES="Les adresses de la liste de blocage et de la liste d'autorisation ont été mises dans une même écriture."
COM_BFSTOP_SETUP_OVERVIEW_DID_MAINTENANCE="La maintenance quotidienne est désormais une tâche du planificateur de tâches de Joomla."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS="Une section de blocage écrite par des versions antérieures dans le fichier .htaccess, s'il y en avait une, a été réécrite dans la forme actuelle."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS_FAILED="La section de blocage écrite par des versions antérieures dans le fichier .htaccess n'a pas pu être réécrite : elle laisse passer toute personne non bloquée au-delà des autres contrôles d'accès de ce répertoire. Rendez le fichier accessible en écriture et relancez la mise à jour, ou supprimez la section à la main."
COM_BFSTOP_SETUP_OVERVIEW_DID_DELAYS="Le délai de réponse aux échecs de connexion, que vos réglages utilisaient, a été supprimé : Brute Force Stop répond désormais immédiatement et bloque comme avant."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_PROXY="La mise à jour a désactivé Brute Force Stop : la requête de la mise à jour est passée par un proxy, un répartiteur de charge ou un CDN, et sans réglages de proxy, BFStop bloquerait l'adresse du proxy, c'est-à-dire tout le monde. Il reste désactivé jusqu'à ce que cet assistant soit terminé."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_LOADBALANCER="La mise à jour a désactivé Brute Force Stop : « Derrière un répartiteur de charge » est activé dans Joomla, le site semble donc se trouver derrière un proxy, et sans réglages de proxy, BFStop bloquerait l'adresse du proxy, c'est-à-dire tout le monde. Il reste désactivé jusqu'à ce que cet assistant soit terminé."
COM_BFSTOP_SETUP_OVERVIEW_STEPS="L'assistant passe en revue les réglages qui demandent votre décision : comment les visiteurs atteignent le site, et le mode de blocage. Chaque étape propose ce qui convient à ce qu'elle détecte ; la dernière active la protection."
COM_BFSTOP_SETUP_PROXY_INTRO="Brute Force Stop compte les échecs de connexion par adresse de visiteur. Derrière un proxy, un répartiteur de charge ou un CDN, le serveur web voit l'adresse du proxy pour chaque visiteur, et l'adresse du visiteur se trouve dans un en-tête ajouté par le proxy, qui ne compte que si la requête vient d'un proxy auquel vous faites confiance. Votre propre requête vers cette page montre ce qui s'applique à votre site."
COM_BFSTOP_SETUP_PROXY_DETECTED="Ce que montre votre requête"
COM_BFSTOP_SETUP_PROXY_REMOTE_PUBLIC="Votre requête a atteint le serveur web depuis %s, une adresse sur Internet."
COM_BFSTOP_SETUP_PROXY_REMOTE_PRIVATE="Votre requête a atteint le serveur web depuis %s, une adresse d'un réseau privé ou local, généralement celle d'un proxy ou d'un répartiteur de charge."
COM_BFSTOP_SETUP_PROXY_HEADER_UNSUPPORTED="Elle contenait l'en-tête %s, que Brute Force Stop ne lit pas."
COM_BFSTOP_SETUP_SCENARIO_A="Votre site semble être atteint directement : il n'y a pas de proxy à configurer."
COM_BFSTOP_SETUP_SCENARIO_B="Votre site semble se trouver derrière un proxy inverse ou un répartiteur de charge. Sans réglages de proxy, BFStop compterait les échecs de connexion de tous les visiteurs pour l'adresse du proxy et bloquerait tout le monde."
COM_BFSTOP_SETUP_SCENARIO_C="Votre serveur web prend déjà l'adresse du visiteur dans l'en-tête du proxy (mod_remoteip, real_ip de nginx) : BFStop ne doit pas relire l'en-tête. Laissez son réglage de proxy désactivé."
COM_BFSTOP_SETUP_SCENARIO_D="Votre site semble se trouver derrière un CDN (ou votre propre réseau ajoute un en-tête de transfert en sortie). Sans réglages de proxy, BFStop bloquerait les serveurs du CDN, et avec eux des visiteurs au hasard."
COM_BFSTOP_SETUP_SCENARIO_E="Votre proxy n'envoie que des en-têtes que Brute Force Stop ne peut pas utiliser. Il reste inactif jusqu'à ce que le proxy envoie un en-tête qu'il lit, ou que le serveur web résolve l'adresse."
COM_BFSTOP_SETUP_UNSUPPORTED="Votre proxy envoie %s, que Brute Force Stop ne peut pas utiliser."
COM_BFSTOP_SETUP_UNSUPPORTED_USE_OTHER="Votre requête contenait aussi un en-tête que BFStop lit : choisissez celui-ci ci-dessous."
COM_BFSTOP_SETUP_UNSUPPORTED_FIX="Faites en sorte que le proxy complète X-Forwarded-For (nginx : <code>proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</code>), ou laissez le serveur web résoudre l'adresse avec son module real-IP (mod_remoteip d'Apache, real_ip de nginx)."
COM_BFSTOP_SETUP_UNSUPPORTED_ISSUE="Parlez-nous de votre configuration (ouvre un nouveau ticket sur GitHub, avec seulement les noms des en-têtes, le scénario détecté et les versions)"
COM_BFSTOP_SETUP_CLOUDFLARE_WARNING="Votre site semble se trouver derrière Cloudflare. Faire confiance à toutes les adresses de Cloudflare permet à quiconque utilise Cloudflare d'atteindre votre serveur avec l'adresse de son choix dans CF-Connecting-IP (un Worker dans sa propre zone peut la définir). Ce n'est sûr que si votre serveur n'accepte le trafic de Cloudflare que pour votre zone : Authenticated Origin Pulls avec un certificat de votre zone, Cloudflare Tunnel, ou une règle de pare-feu. Sinon, laissez le serveur web résoudre l'adresse avec son module real-IP, et laissez le réglage de proxy de BFStop désactivé."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH="Récupérer les plages d'adresses de Cloudflare"
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH_DESC="Récupère les plages publiées par Cloudflare (www.cloudflare.com/ips-v4 et ips-v6) comme proxys de confiance, avec l'en-tête CF-Connecting-IP. Seulement quand vous cliquez : rien n'est envoyé ailleurs."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCHED="%d plages d'adresses de Cloudflare récupérées. Vérifiez-les avec votre requête avant d'enregistrer."
COM_BFSTOP_SETUP_CLOUDFLARE_FAILED="Les plages d'adresses de Cloudflare n'ont pas pu être récupérées. Saisissez-les à la main, depuis www.cloudflare.com/ips."
COM_BFSTOP_SETUP_PROXY_CHOICE="Comment votre site est-il atteint ?"
COM_BFSTOP_SETUP_PROXY_CHOICE_NONE="Il n'y a pas de proxy à configurer : les visiteurs atteignent le site directement, ou le serveur web résout déjà leur adresse."
COM_BFSTOP_SETUP_PROXY_ACKNOWLEDGE="J'en suis sûr : l'en-tête de transfert de votre requête ne vient pas d'un proxy placé devant ce site (mais, par exemple, de mon propre réseau)."
COM_BFSTOP_SETUP_PROXY_CHOICE_PROXY="Le site se trouve derrière un proxy, un répartiteur de charge ou un CDN, qui envoie l'adresse du visiteur dans cet en-tête :"
COM_BFSTOP_SETUP_PROXY_HEADER_PRESENT="(votre requête l'a)"
COM_BFSTOP_SETUP_PROXY_TRUSTED_DESC="L'adresse depuis laquelle le proxy se connecte au serveur web est proposée. S'il y a plus d'un nœud de proxy (plusieurs répartiteurs de charge, un CDN), indiquez-les tous, ou le plus petit réseau qui les contient tous (pas plus large que /8 pour IPv4 ou /16 pour IPv6)."
COM_BFSTOP_SETUP_PREVIEW="Vérifier avec ma requête"
COM_BFSTOP_SETUP_PREVIEW_QUESTION="Avec ces réglages, Brute Force Stop considère que votre adresse est %s. Est-ce l'adresse de votre ordinateur sur Internet ? S'il s'agit de celle du proxy, ou d'une autre que vous ne connaissez pas, les réglages ne conviennent pas encore."
COM_BFSTOP_SETUP_PREVIEW_CONFIRM="Oui, %s est l'adresse de mon ordinateur."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOTTRUSTED="Votre requête ne venait d'aucun de ces proxys de confiance : Brute Force Stop prendrait l'adresse d'où elle venait, comme sans réglages de proxy. Ajoutez l'adresse d'où venait votre requête (voir ci-dessus)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOHEADER="Votre requête ne contenait pas cet en-tête : choisissez-en un qu'elle contient (voir ci-dessus)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_UNUSABLE="Cet en-tête de votre requête ne se termine pas par une adresse qui ne soit pas l'un des proxys de confiance : Brute Force Stop ne pourrait pas déterminer votre adresse. Vérifiez l'en-tête et les proxys de confiance."
COM_BFSTOP_SETUP_PROXY_SAVE="Enregistrer et continuer"
COM_BFSTOP_SETUP_PROXY_SAVED="Les réglages du proxy sont enregistrés."
COM_BFSTOP_SETUP_PROXY_ERROR_UNSUPPORTED="Votre proxy n'envoie que des en-têtes que Brute Force Stop ne peut pas utiliser : il y a un proxy, « pas de proxy » bloquerait donc tous ceux qui se trouvent derrière. Faites d'abord envoyer au proxy un en-tête que BFStop lit."
COM_BFSTOP_SETUP_PROXY_ERROR_ACKNOWLEDGE="Votre requête est passée par un proxy. Sans réglages de proxy, Brute Force Stop bloquerait le proxy, c'est-à-dire tout le monde : confirmez que le site est malgré tout atteint directement, ou configurez le proxy."
COM_BFSTOP_SETUP_PROXY_ERROR_CONFIRM="Vérifiez les réglages avec votre requête, et confirmez que l'adresse affichée est celle de votre ordinateur, avant qu'ils soient enregistrés."
COM_BFSTOP_SETUP_PROXY_ERROR_HEADER="Choisissez un en-tête que Brute Force Stop lit."
COM_BFSTOP_SETUP_PROXY_ERROR_TRUSTED="Saisissez l'adresse (ou le réseau) de votre proxy."
COM_BFSTOP_SETUP_REMINDER="Tenez ces réglages à jour. Chaque fois que votre hébergement change (un nouveau proxy ou CDN, des nœuds de répartition de charge ajoutés ou remplacés, un déménagement chez un autre hébergeur), relancez la vérification du proxy. De mauvais réglages peuvent bloquer chaque visiteur, ou laisser des attaquants choisir l'adresse pour laquelle ils sont comptés."
COM_BFSTOP_SETUP_RERUN_PROXY_CHECK="Relancer la vérification du proxy"
COM_BFSTOP_SETUP_DISMISS="C'est voulu"
COM_BFSTOP_SETUP_DISMISSED="Ce message ne sera plus affiché, sauf si autre chose change."
COM_BFSTOP_SETUP_MISMATCH_APPEARSBEHINDPROXY="Votre site semble désormais se trouver derrière un proxy, un répartiteur de charge ou un CDN : votre requête contenait un en-tête de transfert, mais Brute Force Stop ne fait confiance à aucun proxy."
COM_BFSTOP_SETUP_MISMATCH_PROXYADDRESSCHANGED="Adresse de proxy nouvelle ou modifiée ? Votre requête contenait un en-tête de transfert, mais ne venait d'aucun des proxys de confiance."
COM_BFSTOP_SETUP_MISMATCH_PROXYREMOVED="Proxy supprimé, ou atteignez-vous le site directement ? Votre requête ne venait d'aucun des proxys de confiance et ne contenait aucun en-tête de transfert."
COM_BFSTOP_SETUP_MISMATCH_HEADERCHANGED="Votre proxy envoie désormais un autre en-tête : votre requête venait d'un proxy de confiance, sans l'en-tête configuré mais avec un autre."
COM_BFSTOP_SETUP_MISMATCH_SERVERRESOLVES="Votre serveur web résout déjà l'adresse du visiteur ; le réglage de proxy de BFStop n'est plus nécessaire."
COM_BFSTOP_SETUP_MISMATCH_UNSUPPORTEDHEADER="Votre proxy n'envoie que des en-têtes que Brute Force Stop ne peut pas utiliser."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHON="Le réglage « Derrière un répartiteur de charge » de Joomla (Configuration globale, Serveur) est désactivé : les sessions de Joomla, le journal des actions utilisateurs (avec les entrées de Brute Force Stop) et les outils de confidentialité enregistrent l'adresse du proxy. Activez-le, mais seulement si le site ne peut être atteint que par le proxy : Joomla fait confiance à l'en-tête de n'importe qui. Brute Force Stop n'utilise pas ce réglage."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHOFF="Le réglage « Derrière un répartiteur de charge » de Joomla (Configuration globale, Serveur) est activé, mais aucun proxy n'en a besoin ici : Joomla prend alors l'adresse, dans ses propres journaux, dans un en-tête que n'importe qui peut falsifier. Désactivez-le. Brute Force Stop n'utilise pas ce réglage."
COM_BFSTOP_SETUP_PANEL_HEADING="Valeurs enregistrées qui empêchent d'enregistrer la configuration"
COM_BFSTOP_SETUP_PANEL_DESC="La page de configuration vérifie tous les réglages à chaque enregistrement, et ces valeurs, enregistrées par une version antérieure ou devenues invalides, ne passent pas. Les valeurs proposées sont enregistrées avec cette étape ; modifiez-les si vous le souhaitez."
COM_BFSTOP_SETUP_PANEL_SETTING="Réglage"
COM_BFSTOP_SETUP_PANEL_STORED="Enregistré"
COM_BFSTOP_SETUP_PANEL_PROBLEM="Problème"
COM_BFSTOP_SETUP_PANEL_FIX="Valeur proposée"
COM_BFSTOP_SETUP_BLOCKMODE_INTRO="Votre site tourne sur %1$s. Le mode de blocage est « %2$s »."
COM_BFSTOP_SETUP_SERVER_APACHE="Apache"
COM_BFSTOP_SETUP_SERVER_LITESPEED="LiteSpeed"
COM_BFSTOP_SETUP_SERVER_NGINX="nginx"
COM_BFSTOP_SETUP_SERVER_OTHER="un serveur web que Brute Force Stop ne reconnaît pas"
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_NGINX="nginx ne lit pas les fichiers .htaccess : « %1$s » ne ferait que semblant de bloquer dans le serveur web. Choisissez « %2$s » ; nginx peut refuser les adresses bloquées avec le fichier de refus nginx ci-dessous."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_LITESPEED="LiteSpeed lit les fichiers .htaccess, mais pas toutes les directives d'Apache : si vous choisissez « %1$s », vérifiez qu'il fonctionne avec le bouton ci-dessous."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_HTACCESSPROXY="Derrière un proxy, le serveur web compare les entrées du fichier .htaccess à l'adresse du proxy : elles ne refusent donc personne, ou, si l'adresse du proxy y entre, tout le monde. Choisissez « %2$s », ou laissez d'abord le serveur web résoudre l'adresse du visiteur (mod_remoteip)."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_REPORTINGONLY="« Rapport seulement » enregistre les échecs de connexion et envoie des notifications, mais ne bloque personne : votre site n'est pas protégé. Confirmez ci-dessous que c'est votre intention."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_UNPROTECTED="Votre site n'est pas protégé actuellement : avec « Rapport seulement », le délai des échecs de connexion était toute la protection de vos réglages précédents, et la mise à jour a supprimé les délais. Choisissez « Connexion seulement » ou « %2$s »."
COM_BFSTOP_SETUP_RECOMMENDED="recommandé"
COM_BFSTOP_SETUP_BLOCKMODE_LOGINONLY_DESC="Une adresse bloquée peut parcourir le site, mais ses connexions sont refusées."
COM_BFSTOP_SETUP_BLOCKMODE_FULL_DESC="Chaque requête d'une adresse bloquée est refusée (sauf la page de déblocage et la récupération du mot de passe)."
COM_BFSTOP_SETUP_BLOCKMODE_HTACCESS_DESC="Comme « Site entier », et le serveur web refuse aussi les adresses bloquées, depuis le fichier .htaccess (Apache 2.4 ; pas derrière un proxy)."
COM_BFSTOP_SETUP_BLOCKMODE_OFF_DESC="Les échecs de connexion sont enregistrés et notifiés, personne n'est bloqué."
COM_BFSTOP_SETUP_BLOCKMODE_CONFIRM_OFF="Avec « Rapport seulement » : je sais qu'il ne bloque personne."
COM_BFSTOP_SETUP_NGINX_INCLUDE="Incluez le fichier dans le bloc server de la configuration nginx de votre site, et faites recharger nginx quand il change :"
COM_BFSTOP_SETUP_BLOCKMODE_SAVE="Enregistrer et continuer"
COM_BFSTOP_SETUP_BLOCKMODE_SAVED="Le mode de blocage est enregistré."
COM_BFSTOP_SETUP_BLOCKMODE_ERROR_MODE="Choisissez un mode de blocage."
COM_BFSTOP_SETUP_BLOCKMODE_ERROR_OFF="« Rapport seulement » ne bloque personne : confirmez que c'est votre intention."
COM_BFSTOP_SETUP_SUMMARY_COMPLETED="La protection a été activée le %s."
COM_BFSTOP_SETUP_SUMMARY_COMPLETED_DISABLED="La protection a été activée le %s, mais le plugin a été désactivé depuis. Réactivez-la ci-dessous."
COM_BFSTOP_SETUP_SUMMARY_SETTINGS="Avec les réglages actuels, Brute Force Stop bloque une adresse après %1$d échecs de connexion en %2$s (moins si les tentatives semblent risquées, ou si le compte est attaqué depuis de nombreuses adresses), pour %3$s. Tous les autres réglages gardent leurs valeurs : modifiez-les à tout moment sur la page de configuration."
COM_BFSTOP_SETUP_MISSING_PROXY="L'étape du proxy n'est pas encore faite."
COM_BFSTOP_SETUP_MISSING_BLOCKMODE="L'étape du mode de blocage n'est pas encore faite."
COM_BFSTOP_SETUP_MISSING_MODEUNFIT="Le mode de blocage ne convient pas au serveur web (.htaccess sur nginx)."
COM_BFSTOP_SETUP_MISSING_BLOCKINGVALUES="Des valeurs enregistrées empêchent d'enregistrer la configuration."
COM_BFSTOP_SETUP_ACTIVATE="Activer la protection"
COM_BFSTOP_SETUP_ACTIVATED="Brute Force Stop est actif."
COM_BFSTOP_SETUP_ACTIVATE_ERROR_MISSING="La protection ne peut pas encore être activée : terminez d'abord les étapes marquées « à faire »."
COM_BFSTOP_SETUP_ACTIVATE_ERROR_PLUGIN="Le plugin « Système - Brute Force Stop » n'a pas pu être activé : est-il installé ?"
COM_BFSTOP_BANNER_NOT_ACTIVE="Brute Force Stop n'est pas actif : son plugin est désactivé. Lancez l'<a href=\"%s\">assistant de configuration</a>, qui l'active."
COM_BFSTOP_BANNER_SETUP_INCOMPLETE="La configuration de Brute Force Stop n'est pas terminée. Ouvrez l'<a href=\"%s\">assistant de configuration</a>."
COM_BFSTOP_BANNER_PROXY_CHECK="Ouvrez la <a href=\"%s\">vérification du proxy</a>."
COM_BFSTOP_POSTINSTALL_SETUP_TITLE="Brute Force Stop : terminer la configuration"
COM_BFSTOP_POSTINSTALL_SETUP_DESC="Brute Force Stop ne protège votre site qu'une fois que son assistant de configuration a vérifié comment les visiteurs atteignent le site (directement, ou via un proxy, un répartiteur de charge ou un CDN) et le mode de blocage, et l'a activé."
COM_BFSTOP_POSTINSTALL_SETUP_ACTION="Ouvrir l'assistant de configuration"
COM_BFSTOP_ACTIONLOG_SETUP_STEP_APPLIED="L'utilisateur <a href=\"{accountlink}\">{username}</a> a appliqué l'étape {step} de l'assistant de configuration de Brute Force Stop"
COM_BFSTOP_ACTIONLOG_PROTECTION_ACTIVATED="L'utilisateur <a href=\"{accountlink}\">{username}</a> a activé la protection de Brute Force Stop"
