COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="Le profil 'SuperUtilisateur' est attribué à l'utilisateur 'admin'. Cette attribution constitue un risque important en terme de sécurité; les pirates savent que ce nom d'utilisateur est commun et notamment utilisé dans Joomla. Pour améliorer la sécurité, il est vivement recommandé de changer le nom d'utilisateur auquel il est attribué un profil d'administrateur 'SuperUtilisateur'! Consultez également: <a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Joomla! Sécurity et Performance FAQ: Pourquoi changer le nom de l'utilisateur administrateur après une nouvelle installation?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="Soit vous n'utilisez pas un serveur Apache, soit le fichier .htaccess n'existe pas ou n'est pas lisible ou modifiable. Le blocage via .htaccess ne fonctionnera pas."
COM_BFSTOP_WARNING_HTACCESS_NGINX="Ce site fonctionne avec nginx, qui ne lit pas les fichiers .htaccess : avec le mode de blocage « %1$s », aucune adresse n'est refusée par le serveur web, seulement par BFStop, comme avec « %2$s ». Choisissez « %2$s » dans les paramètres ; nginx peut refuser des adresses dans sa propre configuration."
COM_BFSTOP_WARNING_HTACCESS_LITESPEED="Ce site fonctionne avec LiteSpeed, qui lit les fichiers .htaccess, mais pas toutes les directives d'Apache : qu'il respecte les sections &lt;If&gt; avec lesquelles BFStop bloque les adresses dépend de son édition et de sa version. Vérifiez que le serveur web refuse une adresse bloquée, ou choisissez « %2$s » dans les paramètres."
COM_BFSTOP_HTACCESS_CHECK="Vérifier .htaccess"
COM_BFSTOP_HTACCESS_CHECK_EFFECTIVE="Le serveur web respecte la section de blocage du fichier .htaccess dans %s : une requête de test qu'il doit refuser a été refusée."
COM_BFSTOP_HTACCESS_CHECK_IGNORED="Le serveur web ignore la section de blocage du fichier .htaccess dans %s : une requête de test qu'il aurait dû refuser est passée. Apache doit pouvoir y lire les directives d'autorisation (AllowOverride AuthConfig, ou All). nginx ne lit pas les fichiers .htaccess, OpenLiteSpeed n'en lit que les règles de réécriture, et LiteSpeed Enterprise ne prend peut-être pas en charge toutes les directives qu'utilise la section de blocage."
COM_BFSTOP_HTACCESS_CHECK_BROKEN="Le serveur web a échoué sur un fichier de test contenant les directives de la section de blocage (statut 500) : il ne les comprend pas (elles nécessitent Apache 2.4 ou ultérieur). La section de blocage casserait le site dans %s de la même manière ; le journal d'erreurs du serveur web en dit plus."
