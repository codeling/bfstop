COM_BFSTOP_SETUP_START="Inizia"
COM_BFSTOP_SETUP_OVERVIEW_INSTALL="Benvenuto in Brute Force Stop. Prima di bloccare qualcuno, deve sapere come i visitatori raggiungono il sito: direttamente, oppure tramite un proxy, un bilanciatore di carico o una CDN. Dietro un proxy, ogni visitatore sembra provenire dall'indirizzo del proxy: senza le impostazioni giuste, pochi accessi falliti bloccherebbero tutti."
COM_BFSTOP_SETUP_OVERVIEW_UPGRADE="Brute Force Stop è stato aggiornato dalla versione %s. Ecco cosa ha fatto l'aggiornamento:"
COM_BFSTOP_SETUP_OVERVIEW_DID_SETTINGS="Le impostazioni sono state spostate dal Gestore plugin a questo componente."
COM_BFSTOP_SETUP_OVERVIEW_DID_BLOCKMODE="I precedenti interruttori «Blocco attivo» e «Usa .htaccess» sono diventati la modalità di blocco «%s»."
COM_BFSTOP_SETUP_OVERVIEW_DID_API="Ora sono protetti anche gli accessi tramite la Web Services API di Joomla (l'impostazione «Attivo per»)."
COM_BFSTOP_SETUP_OVERVIEW_DID_ADDRESSES="Gli indirizzi dell'elenco dei blocchi e dell'elenco consentiti sono stati portati a una sola grafia."
COM_BFSTOP_SETUP_OVERVIEW_DID_MAINTENANCE="La manutenzione giornaliera è ora un'attività del Pianificatore attività di Joomla."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS="Una sezione di blocco scritta nel file .htaccess da versioni precedenti, se c'era, è stata riscritta nella forma attuale."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS_FAILED="La sezione di blocco scritta nel file .htaccess da versioni precedenti non è stata riscritta: lascia passare chiunque non sia bloccato oltre gli altri controlli di accesso di quella cartella. Rendi il file scrivibile ed esegui di nuovo l'aggiornamento, oppure rimuovi la sezione a mano."
COM_BFSTOP_SETUP_OVERVIEW_DID_DELAYS="Il ritardo della risposta agli accessi falliti, usato dalle tue impostazioni, è stato rimosso: Brute Force Stop ora risponde subito e blocca come prima."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_PROXY="L'aggiornamento ha disattivato Brute Force Stop: la richiesta dell'aggiornamento è arrivata tramite un proxy, un bilanciatore di carico o una CDN, e senza impostazioni del proxy BFStop bloccherebbe l'indirizzo del proxy, cioè tutti. Resta disattivato finché questa procedura guidata non è stata completata."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_LOADBALANCER="L'aggiornamento ha disattivato Brute Force Stop: in Joomla è attivo «Dietro un bilanciatore di carico», quindi il sito sembra trovarsi dietro un proxy, e senza impostazioni del proxy BFStop bloccherebbe l'indirizzo del proxy, cioè tutti. Resta disattivato finché questa procedura guidata non è stata completata."
COM_BFSTOP_SETUP_OVERVIEW_STEPS="La procedura guidata passa in rassegna le impostazioni che richiedono una tua decisione: come i visitatori raggiungono il sito, e la modalità di blocco. Ogni passaggio propone ciò che si adatta a quanto rileva; l'ultimo attiva la protezione."
COM_BFSTOP_SETUP_PROXY_INTRO="Brute Force Stop conta gli accessi falliti per indirizzo del visitatore. Dietro un proxy, un bilanciatore di carico o una CDN, il server web vede l'indirizzo del proxy per ogni visitatore, e l'indirizzo del visitatore si trova in un'intestazione aggiunta dal proxy, che conta solo se la richiesta proviene da un proxy di cui ti fidi. La tua richiesta a questa pagina mostra cosa vale per il tuo sito."
COM_BFSTOP_SETUP_PROXY_DETECTED="Cosa mostra la tua richiesta"
COM_BFSTOP_SETUP_PROXY_REMOTE_PUBLIC="La tua richiesta ha raggiunto il server web da %s, un indirizzo di Internet."
COM_BFSTOP_SETUP_PROXY_REMOTE_PRIVATE="La tua richiesta ha raggiunto il server web da %s, un indirizzo di una rete privata o locale, di solito quello di un proxy o di un bilanciatore di carico."
COM_BFSTOP_SETUP_PROXY_HEADER_UNSUPPORTED="Conteneva l'intestazione %s, che Brute Force Stop non legge."
COM_BFSTOP_SETUP_SCENARIO_A="Il sito sembra essere raggiunto direttamente: non c'è nessun proxy da configurare."
COM_BFSTOP_SETUP_SCENARIO_B="Il sito sembra trovarsi dietro un reverse proxy o un bilanciatore di carico. Senza impostazioni del proxy, BFStop conterebbe gli accessi falliti di tutti i visitatori sull'indirizzo del proxy e bloccherebbe tutti."
COM_BFSTOP_SETUP_SCENARIO_C="Il tuo server web prende già l'indirizzo del visitatore dall'intestazione del proxy (mod_remoteip, real_ip di nginx): BFStop non deve leggere di nuovo l'intestazione. Lascia disattivata la sua impostazione del proxy."
COM_BFSTOP_SETUP_SCENARIO_D="Il sito sembra trovarsi dietro una CDN (oppure la tua rete aggiunge un'intestazione di inoltro in uscita). Senza impostazioni del proxy, BFStop bloccherebbe i server della CDN, e con loro visitatori a caso."
COM_BFSTOP_SETUP_SCENARIO_E="Il tuo proxy invia solo intestazioni che Brute Force Stop non può usare. Resta inattivo finché il proxy non invia un'intestazione che legge, o il server web non risolve l'indirizzo."
COM_BFSTOP_SETUP_UNSUPPORTED="Il tuo proxy invia %s, che Brute Force Stop non può usare."
COM_BFSTOP_SETUP_UNSUPPORTED_USE_OTHER="La tua richiesta conteneva anche un'intestazione che BFStop legge: scegli quella qui sotto."
COM_BFSTOP_SETUP_UNSUPPORTED_FIX="Fai in modo che il proxy aggiunga a X-Forwarded-For (nginx: <code>proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</code>), oppure lascia che il server web risolva l'indirizzo con il suo modulo real-IP (mod_remoteip di Apache, real_ip di nginx)."
COM_BFSTOP_SETUP_UNSUPPORTED_ISSUE="Raccontaci la tua configurazione (apre una nuova segnalazione su GitHub, solo con i nomi delle intestazioni, lo scenario rilevato e le versioni)"
COM_BFSTOP_SETUP_CLOUDFLARE_WARNING="Il sito sembra trovarsi dietro Cloudflare. Fidarsi di tutti gli indirizzi di Cloudflare permette a chiunque usi Cloudflare di raggiungere il tuo server con un indirizzo a sua scelta in CF-Connecting-IP (un Worker nella propria zona può impostarlo). È sicuro solo se il tuo server accetta il traffico di Cloudflare unicamente per la tua zona: Authenticated Origin Pulls con un certificato della tua zona, Cloudflare Tunnel o una regola del firewall. Altrimenti lascia che il server web risolva l'indirizzo con il suo modulo real-IP, e lascia disattivata l'impostazione del proxy di BFStop."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH="Recupera gli intervalli di indirizzi di Cloudflare"
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH_DESC="Recupera gli intervalli pubblicati da Cloudflare (www.cloudflare.com/ips-v4 e ips-v6) come proxy fidati, con l'intestazione CF-Connecting-IP. Solo quando fai clic: non viene inviato nulla altrove."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCHED="Recuperati %d intervalli di indirizzi di Cloudflare. Controllali con la tua richiesta prima di salvare."
COM_BFSTOP_SETUP_CLOUDFLARE_FAILED="Non è stato possibile recuperare gli intervalli di indirizzi di Cloudflare. Inseriscili a mano, da www.cloudflare.com/ips."
COM_BFSTOP_SETUP_PROXY_CHOICE="Come viene raggiunto il tuo sito?"
COM_BFSTOP_SETUP_PROXY_CHOICE_NONE="Non c'è nessun proxy da configurare: i visitatori raggiungono il sito direttamente, oppure il server web risolve già il loro indirizzo."
COM_BFSTOP_SETUP_PROXY_ACKNOWLEDGE="Ne sono sicuro: l'intestazione di inoltro della tua richiesta non proviene da un proxy davanti a questo sito (ma, per esempio, dalla mia rete)."
COM_BFSTOP_SETUP_PROXY_CHOICE_PROXY="Il sito si trova dietro un proxy, un bilanciatore di carico o una CDN, che invia l'indirizzo del visitatore in questa intestazione:"
COM_BFSTOP_SETUP_PROXY_HEADER_PRESENT="(la tua richiesta la contiene)"
COM_BFSTOP_SETUP_PROXY_TRUSTED_DESC="Viene proposto l'indirizzo da cui il proxy si collega al server web. Se c'è più di un nodo proxy (diversi bilanciatori di carico, una CDN), inseriscili tutti, oppure la rete più piccola che li contiene tutti (non più ampia di /8 per IPv4 o /16 per IPv6)."
COM_BFSTOP_SETUP_PREVIEW="Verifica con la mia richiesta"
COM_BFSTOP_SETUP_PREVIEW_QUESTION="Con queste impostazioni Brute Force Stop considera %s il tuo indirizzo. È l'indirizzo del tuo computer su Internet? Se è quello del proxy, o un altro che non conosci, le impostazioni non sono ancora adatte."
COM_BFSTOP_SETUP_PREVIEW_CONFIRM="Sì, %s è l'indirizzo del mio computer."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOTTRUSTED="La tua richiesta non proveniva da nessuno di questi proxy fidati: Brute Force Stop prenderebbe l'indirizzo da cui è arrivata, come senza impostazioni del proxy. Aggiungi l'indirizzo da cui è arrivata la tua richiesta (vedi sopra)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOHEADER="La tua richiesta non conteneva questa intestazione: scegline una che contiene (vedi sopra)."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_UNUSABLE="Questa intestazione della tua richiesta non termina con un indirizzo che non sia uno dei proxy fidati: Brute Force Stop non potrebbe determinare il tuo indirizzo. Controlla l'intestazione e i proxy fidati."
COM_BFSTOP_SETUP_PROXY_SAVE="Salva e continua"
COM_BFSTOP_SETUP_PROXY_SAVED="Le impostazioni del proxy sono state salvate."
COM_BFSTOP_SETUP_PROXY_ERROR_UNSUPPORTED="Il tuo proxy invia solo intestazioni che Brute Force Stop non può usare: c'è un proxy, quindi «nessun proxy» bloccherebbe tutti quelli dietro di esso. Fai prima inviare al proxy un'intestazione che BFStop legge."
COM_BFSTOP_SETUP_PROXY_ERROR_ACKNOWLEDGE="La tua richiesta è arrivata tramite un proxy. Senza impostazioni del proxy, Brute Force Stop bloccherebbe il proxy, cioè tutti: conferma che il sito viene comunque raggiunto direttamente, oppure configura il proxy."
COM_BFSTOP_SETUP_PROXY_ERROR_CONFIRM="Verifica le impostazioni con la tua richiesta e conferma che l'indirizzo mostrato è quello del tuo computer, prima che vengano salvate."
COM_BFSTOP_SETUP_PROXY_ERROR_HEADER="Scegli un'intestazione che Brute Force Stop legge."
COM_BFSTOP_SETUP_PROXY_ERROR_TRUSTED="Inserisci l'indirizzo (o la rete) del tuo proxy."
COM_BFSTOP_SETUP_REMINDER="Mantieni aggiornate queste impostazioni. Ogni volta che il tuo hosting cambia (un nuovo proxy o una nuova CDN, nodi del bilanciatore di carico aggiunti o sostituiti, un trasferimento a un altro provider), esegui di nuovo il controllo del proxy. Impostazioni errate possono bloccare ogni visitatore, o permettere agli attaccanti di scegliere l'indirizzo a cui vengono attribuiti."
COM_BFSTOP_SETUP_RERUN_PROXY_CHECK="Esegui di nuovo il controllo del proxy"
COM_BFSTOP_SETUP_DISMISS="È previsto"
COM_BFSTOP_SETUP_DISMISSED="Questo messaggio non verrà più mostrato, a meno che cambi qualcos'altro."
COM_BFSTOP_SETUP_MISMATCH_APPEARSBEHINDPROXY="Il sito ora sembra trovarsi dietro un proxy, un bilanciatore di carico o una CDN: la tua richiesta conteneva un'intestazione di inoltro, ma Brute Force Stop non si fida di nessun proxy."
COM_BFSTOP_SETUP_MISMATCH_PROXYADDRESSCHANGED="Indirizzo del proxy nuovo o cambiato? La tua richiesta conteneva un'intestazione di inoltro, ma non proveniva da nessuno dei proxy fidati."
COM_BFSTOP_SETUP_MISMATCH_PROXYREMOVED="Proxy rimosso, o stai raggiungendo il sito direttamente? La tua richiesta non proveniva da nessuno dei proxy fidati e non conteneva alcuna intestazione di inoltro."
COM_BFSTOP_SETUP_MISMATCH_HEADERCHANGED="Il tuo proxy ora invia un'altra intestazione: la tua richiesta proveniva da un proxy fidato, senza l'intestazione configurata ma con un'altra."
COM_BFSTOP_SETUP_MISMATCH_SERVERRESOLVES="Il tuo server web risolve già l'indirizzo del visitatore; l'impostazione del proxy di BFStop non serve più."
COM_BFSTOP_SETUP_MISMATCH_UNSUPPORTEDHEADER="Il tuo proxy invia solo intestazioni che Brute Force Stop non può usare."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHON="L'impostazione «Dietro un bilanciatore di carico» di Joomla (Configurazione globale, Server) è disattivata: le sessioni di Joomla, il registro delle azioni utente (con le voci di Brute Force Stop) e gli strumenti per la privacy registrano l'indirizzo del proxy. Attivala, ma solo se il sito non può essere raggiunto se non tramite il proxy: Joomla si fida dell'intestazione di chiunque. Brute Force Stop non usa questa impostazione."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHOFF="L'impostazione «Dietro un bilanciatore di carico» di Joomla (Configurazione globale, Server) è attiva, ma qui nessun proxy ne ha bisogno: Joomla prende allora l'indirizzo, nei propri registri, da un'intestazione che chiunque può falsificare. Disattivala. Brute Force Stop non usa questa impostazione."
COM_BFSTOP_SETUP_PANEL_HEADING="Valori salvati che impediscono di salvare le impostazioni"
COM_BFSTOP_SETUP_PANEL_DESC="La pagina della configurazione controlla tutte le impostazioni a ogni salvataggio, e questi valori, salvati da una versione precedente o non più validi, non superano il controllo. I valori proposti vengono salvati insieme a questo passaggio; modificali se vuoi."
COM_BFSTOP_SETUP_PANEL_SETTING="Impostazione"
COM_BFSTOP_SETUP_PANEL_STORED="Salvato"
COM_BFSTOP_SETUP_PANEL_PROBLEM="Problema"
COM_BFSTOP_SETUP_PANEL_FIX="Valore proposto"
COM_BFSTOP_SETUP_BLOCKMODE_INTRO="Il tuo sito funziona su %1$s. La modalità di blocco è «%2$s»."
COM_BFSTOP_SETUP_SERVER_APACHE="Apache"
COM_BFSTOP_SETUP_SERVER_LITESPEED="LiteSpeed"
COM_BFSTOP_SETUP_SERVER_NGINX="nginx"
COM_BFSTOP_SETUP_SERVER_OTHER="un server web che Brute Force Stop non riconosce"
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_NGINX="nginx non legge i file .htaccess: «%1$s» farebbe solo finta di bloccare nel server web. Scegli «%2$s»; nginx può negare gli indirizzi bloccati con il file di negazione nginx qui sotto."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_LITESPEED="LiteSpeed legge i file .htaccess, ma non tutte le direttive di Apache: se scegli «%1$s», verifica che funzioni con il pulsante qui sotto."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_HTACCESSPROXY="Dietro un proxy, il server web confronta le voci del file .htaccess con l'indirizzo del proxy, quindi non respingono nessuno, oppure, se vi finisce l'indirizzo del proxy, tutti. Scegli «%2$s», oppure lascia che il server web risolva prima l'indirizzo del visitatore (mod_remoteip)."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_REPORTINGONLY="«Solo segnalazione» registra gli accessi falliti e invia notifiche, ma non blocca nessuno: il tuo sito non è protetto. Conferma qui sotto che è ciò che intendi."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_UNPROTECTED="Il tuo sito ora non è protetto: con «Solo segnalazione», il ritardo degli accessi falliti era tutta la protezione delle tue impostazioni precedenti, e l'aggiornamento ha rimosso i ritardi. Scegli «Solo accesso» o «%2$s»."
COM_BFSTOP_SETUP_RECOMMENDED="consigliato"
COM_BFSTOP_SETUP_BLOCKMODE_LOGINONLY_DESC="Un indirizzo bloccato può navigare nel sito, ma i suoi accessi vengono respinti."
COM_BFSTOP_SETUP_BLOCKMODE_FULL_DESC="Ogni richiesta di un indirizzo bloccato viene respinta (tranne la pagina di sblocco e il recupero della password)."
COM_BFSTOP_SETUP_BLOCKMODE_HTACCESS_DESC="Come «Intero sito», e anche il server web respinge gli indirizzi bloccati, dal file .htaccess (Apache 2.4; non dietro un proxy)."
COM_BFSTOP_SETUP_BLOCKMODE_OFF_DESC="Gli accessi falliti vengono registrati e notificati, nessuno viene bloccato."
COM_BFSTOP_SETUP_BLOCKMODE_CONFIRM_OFF="Con «Solo segnalazione»: so che non blocca nessuno."
COM_BFSTOP_SETUP_NGINX_INCLUDE="Includi il file nel blocco server della configurazione nginx del tuo sito, e fai ricaricare nginx quando cambia:"
COM_BFSTOP_SETUP_BLOCKMODE_SAVE="Salva e continua"
COM_BFSTOP_SETUP_BLOCKMODE_SAVED="La modalità di blocco è stata salvata."
COM_BFSTOP_SETUP_BLOCKMODE_ERROR_MODE="Scegli una modalità di blocco."
COM_BFSTOP_SETUP_BLOCKMODE_ERROR_OFF="«Solo segnalazione» non blocca nessuno: conferma che è ciò che intendi."
COM_BFSTOP_SETUP_SUMMARY_COMPLETED="La protezione è stata attivata il %s."
COM_BFSTOP_SETUP_SUMMARY_COMPLETED_DISABLED="La protezione è stata attivata il %s, ma da allora il plugin è stato disattivato. Riattivala qui sotto."
COM_BFSTOP_SETUP_SUMMARY_SETTINGS="Con le impostazioni attuali, Brute Force Stop blocca un indirizzo dopo %1$d accessi falliti entro %2$s (meno se i tentativi sembrano rischiosi, o l'account è attaccato da molti indirizzi), per %3$s. Tutte le altre impostazioni mantengono i loro valori: modificale in qualsiasi momento nella pagina della configurazione."
COM_BFSTOP_SETUP_MISSING_PROXY="Il passaggio del proxy non è ancora stato fatto."
COM_BFSTOP_SETUP_MISSING_BLOCKMODE="Il passaggio della modalità di blocco non è ancora stato fatto."
COM_BFSTOP_SETUP_MISSING_MODEUNFIT="La modalità di blocco non è adatta al server web (.htaccess su nginx)."
COM_BFSTOP_SETUP_MISSING_BLOCKINGVALUES="Valori salvati impediscono di salvare le impostazioni."
COM_BFSTOP_SETUP_ACTIVATE="Attiva la protezione"
COM_BFSTOP_SETUP_ACTIVATED="Brute Force Stop è attivo."
COM_BFSTOP_SETUP_ACTIVATE_ERROR_MISSING="La protezione non può ancora essere attivata: completa prima i passaggi segnati come «da fare»."
COM_BFSTOP_SETUP_ACTIVATE_ERROR_PLUGIN="Non è stato possibile attivare il plugin «Sistema - Brute Force Stop»: è installato?"
COM_BFSTOP_BANNER_NOT_ACTIVE="Brute Force Stop non è attivo: il suo plugin è disattivato. Esegui la <a href=\"%s\">procedura guidata di configurazione</a>, che lo attiva."
COM_BFSTOP_BANNER_SETUP_INCOMPLETE="La configurazione di Brute Force Stop non è completa. Apri la <a href=\"%s\">procedura guidata di configurazione</a>."
COM_BFSTOP_BANNER_PROXY_CHECK="Apri il <a href=\"%s\">controllo del proxy</a>."
COM_BFSTOP_POSTINSTALL_SETUP_TITLE="Brute Force Stop: completa la configurazione"
COM_BFSTOP_POSTINSTALL_SETUP_DESC="Brute Force Stop protegge il tuo sito solo dopo che la sua procedura guidata di configurazione ha controllato come i visitatori raggiungono il sito (direttamente, oppure tramite un proxy, un bilanciatore di carico o una CDN) e la modalità di blocco, e lo ha attivato."
COM_BFSTOP_POSTINSTALL_SETUP_ACTION="Apri la procedura guidata di configurazione"
COM_BFSTOP_ACTIONLOG_SETUP_STEP_APPLIED="L'utente <a href=\"{accountlink}\">{username}</a> ha applicato il passaggio {step} della procedura guidata di configurazione di Brute Force Stop"
COM_BFSTOP_ACTIONLOG_PROTECTION_ACTIVATED="L'utente <a href=\"{accountlink}\">{username}</a> ha attivato la protezione di Brute Force Stop"
