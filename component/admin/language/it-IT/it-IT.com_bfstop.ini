COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="Il Superuser sta usando il nome utente 'admin' predefinito. Questo è un rischio per la sicurezza; gli attaccanti sanno che questo nome utente esiste in molte installazioni Joomla!, e viene utilizzato spesso in molti attacchi. Per aumentare la sicurezza si consiglia di modificare il nome utente per il Superuser! Vedi anche:<a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Joomla! Security and Performance FAQ: Why should I immediately change the name of the default admin user after a new install?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="O non stai usando un server Apache, oppure il file .htaccess non esiste o non è leggibile o scrivibile. Il blocco tramite .htaccess non funzionerà."
COM_BFSTOP_WARNING_HTACCESS_NGINX="Questo sito gira su nginx, che non legge i file .htaccess: con la modalità di blocco «%1$s» nessun indirizzo viene respinto dal server web, ma solo da BFStop, come con «%2$s». Scegli «%2$s» nelle impostazioni; nginx può negare indirizzi nella propria configurazione."
COM_BFSTOP_WARNING_HTACCESS_LITESPEED="Questo sito gira su LiteSpeed, che legge i file .htaccess, ma non tutte le direttive di Apache: se rispetta le sezioni &lt;If&gt; con cui BFStop blocca gli indirizzi dipende dalla sua edizione e versione. Verifica che il server web respinga un indirizzo bloccato, oppure scegli «%2$s» nelle impostazioni."
COM_BFSTOP_HTACCESS_CHECK="Verifica .htaccess"
COM_BFSTOP_HTACCESS_CHECK_EFFECTIVE="Il server web rispetta la sezione dei blocchi del file .htaccess in %s: una richiesta di prova che deve respingere è stata respinta."
COM_BFSTOP_HTACCESS_CHECK_IGNORED="Il server web ignora la sezione dei blocchi del file .htaccess in %s: una richiesta di prova che avrebbe dovuto respingere è passata. Apache deve poter leggere lì le direttive di autorizzazione (AllowOverride AuthConfig, oppure All). nginx non legge i file .htaccess, OpenLiteSpeed ne legge solo le regole di riscrittura e LiteSpeed Enterprise potrebbe non supportare tutte le direttive usate dalla sezione dei blocchi."
COM_BFSTOP_HTACCESS_CHECK_BROKEN="Il server web è andato in errore su un file di prova con le direttive della sezione dei blocchi (stato 500): non le comprende (richiedono Apache 2.4 o successivo). La sezione dei blocchi bloccherebbe il sito in %s allo stesso modo; il log degli errori del server web dice di più."
COM_BFSTOP_HTACCESS_CHECK_UNKNOWN="Non è stato possibile verificare il file .htaccess in %1$s: %2$s."
