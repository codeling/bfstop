COM_BFSTOP_SETUP_MISMATCH_APPEARSBEHINDPROXY="O seu sítio parece agora estar atrás de um proxy, balanceador de carga ou CDN: o seu pedido trazia um cabeçalho de reencaminhamento, mas o Brute Force Stop não confia em nenhum proxy."
COM_BFSTOP_SETUP_MISMATCH_PROXYADDRESSCHANGED="Endereço de proxy novo ou alterado? O seu pedido trazia um cabeçalho de reencaminhamento, mas não veio de nenhum dos proxies de confiança."
COM_BFSTOP_SETUP_MISMATCH_PROXYREMOVED="Proxy removido, ou está a aceder diretamente ao sítio? O seu pedido não veio de nenhum dos proxies de confiança e não trazia cabeçalho de reencaminhamento."
COM_BFSTOP_SETUP_MISMATCH_HEADERCHANGED="O seu proxy envia agora outro cabeçalho: o seu pedido veio de um proxy de confiança, sem o cabeçalho configurado, mas com outro."
COM_BFSTOP_SETUP_MISMATCH_SERVERRESOLVES="O seu servidor web já resolve o endereço do visitante; a definição de proxy do BFStop deixou de ser necessária."
COM_BFSTOP_SETUP_MISMATCH_UNSUPPORTEDHEADER="O seu proxy só envia cabeçalhos que o Brute Force Stop não pode usar."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHON="A definição 'Atrás de balanceador de carga' do próprio Joomla (Configuração global, Servidor) está desligada: as sessões do Joomla, o registo de ações de utilizadores (com as entradas do Brute Force Stop) e as ferramentas de privacidade registam o endereço do proxy. Ligue-a, mas apenas se o sítio não puder ser acedido a não ser através do proxy: o Joomla confia no cabeçalho de qualquer pessoa. O Brute Force Stop não usa esta definição."
COM_BFSTOP_SETUP_LOADBALANCER_SWITCHOFF="A definição 'Atrás de balanceador de carga' do próprio Joomla (Configuração global, Servidor) está ligada, mas aqui nenhum proxy precisa dela: o Joomla obtém então o endereço, nos seus próprios registos, de um cabeçalho que qualquer pessoa pode falsificar. Desligue-a. O Brute Force Stop não usa esta definição."
