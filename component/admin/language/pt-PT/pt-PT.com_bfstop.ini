COM_BFSTOP_WARNING_ADMIN_USER_EXISTS="O Super Utilizador está usando o nome de utilizador padrão 'admin'. Isso é um risco de segurança; os atacantes sabem que esse nome de utilizador existe em muitas instalações do Joomla!, por isso ele é muito usado em vários ataques. Para aumentar a segurança, recomenda-se alterar o nome de utilizador do Super Utilizador! Veja também: <a href='http://docs.joomla.org/Security_and_Performance_FAQs#Why_should_I_immediately_change_the_name_of_the_default_admin_user_after_a_new_install.3F' target='_blank'>Joomla! Security and Performance FAQ: Why should I immediately change the name of the default admin user after a new install?</a>"
COM_BFSTOP_WARNING_HTACCESS_NOT_WORKING="Ou o utilizador não está usando um servidor Apache, ou o ficheiro .htaccess não existe ou não pode ser lido nem gravado. O bloqueio via .htaccess não vai funcionar."
COM_BFSTOP_WARNING_HTACCESS_NGINX="Este site funciona com nginx, que não lê ficheiros .htaccess: com o modo de bloqueio '%1$s', nenhum endereço é recusado pelo servidor web, apenas pelo BFStop, como com '%2$s'. Escolha '%2$s' nas definições; o nginx pode negar endereços na sua própria configuração."
COM_BFSTOP_WARNING_HTACCESS_LITESPEED="Este site funciona com LiteSpeed, que lê ficheiros .htaccess, mas não todas as diretivas do Apache: se respeita as secções &lt;If&gt; com que o BFStop bloqueia endereços depende da sua edição e versão. Verifique se o servidor web recusa um endereço bloqueado, ou escolha '%2$s' nas definições."
COM_BFSTOP_HTACCESS_CHECK="Verificar .htaccess"
COM_BFSTOP_HTACCESS_CHECK_EFFECTIVE="O servidor web respeita a secção de bloqueios do ficheiro .htaccess em %s: um pedido de teste que deve recusar foi recusado."
COM_BFSTOP_HTACCESS_CHECK_IGNORED="O servidor web ignora a secção de bloqueios do ficheiro .htaccess em %s: um pedido de teste que deveria ter recusado passou. O Apache tem de poder ler aí diretivas de autorização (AllowOverride AuthConfig, ou All). O nginx não lê ficheiros .htaccess, o OpenLiteSpeed lê apenas as respetivas regras de reescrita, e o LiteSpeed Enterprise pode não suportar todas as diretivas que a secção de bloqueios utiliza."
COM_BFSTOP_HTACCESS_CHECK_BROKEN="O servidor web falhou num ficheiro de teste com as diretivas da secção de bloqueios (estado 500): não as entende (precisam do Apache 2.4 ou posterior). A secção de bloqueios avariaria o site em %s da mesma forma; o registo de erros do servidor web diz mais."
