COM_BFSTOP_SETUP_PREVIEW_PROBLEM_UNUSABLE="Este cabeçalho do seu pedido não termina num endereço que não seja um dos proxies de confiança: o Brute Force Stop não conseguiria determinar o seu endereço. Verifique o cabeçalho e os proxies de confiança."
