COM_BFSTOP_SETUP_CLEANUP_ERROR_NO_PROXY="Configure primeiro o proxy (o passo do proxy): a limpeza precisa de conhecer o seu endereço."
COM_BFSTOP_SETUP_HTACCESS_INTRO="O ficheiro .htaccess %s ainda tem a secção de bloqueio que versões anteriores escreveram e que a atualização não conseguiu reescrever. Deixa passar qualquer pessoa não bloqueada pelos restantes controlos de acesso dessa pasta (proteção por palavra-passe, restrições de IP). Torne o ficheiro gravável e reescreva-a aqui, ou remova manualmente as linhas entre '# BEGIN BFStop Blocks' e '# END BFStop Blocks'."
COM_BFSTOP_SETUP_HTACCESS_FINE="A secção de bloqueio de %s está na forma atual."
COM_BFSTOP_SETUP_HTACCESS_CURRENT="A secção agora"
COM_BFSTOP_SETUP_HTACCESS_PROPOSED="A secção reescrita"
COM_BFSTOP_SETUP_HTACCESS_RUN="Reescrever a secção"
COM_BFSTOP_SETUP_HTACCESS_DONE="A secção de bloqueio do ficheiro .htaccess está na forma atual."
COM_BFSTOP_SETUP_HTACCESS_ERROR_WRITE="Não foi possível reescrever a secção de bloqueio de %s: torne o ficheiro gravável e tente de novo."
COM_BFSTOP_SETUP_NOTIFY_INTRO="Quem é avisado das falhas de início de sessão e dos bloqueios, e se um utilizador cujo nome de utilizador fez bloquear um endereço recebe uma ligação para o desbloquear."
COM_BFSTOP_SETUP_NOTIFY_MEANING="O significado dos e-mails de desbloqueio mudou com esta atualização. A versão 1.x enviava a ligação para qualquer endereço; agora esta definição tem três valores: 'apenas se o utilizador já iniciou sessão a partir desse endereço' (recomendado: é daí que alguém se bloqueia a si próprio, nunca do endereço de um atacante), 'para qualquer endereço IP' (qualquer pessoa pode fazer o sítio enviar um e-mail a qualquer utilizador falhando o início de sessão com o nome dele; no máximo uma ligação utilizável por utilizador) e desligado. A sua definição foi mantida como o primeiro valor. Ambos precisam do endereço do sítio ($live_site). Escolha abaixo."
COM_BFSTOP_SETUP_PARTS_INTRO="Onde o Brute Force Stop conta as falhas de início de sessão e recusa os endereços bloqueados: o sítio (frontend), a administração (backend) e a API de Web Services do Joomla, cujos inícios de sessão usam tokens de API ou autenticação HTTP Basic."
COM_BFSTOP_SETUP_PARTS_API_TOKENS="Utilizadores com um token de API ativo: %d. Uma integração que use a API a partir de um endereço cujos inícios de sessão possam falhar pode fazer bloquear esse endereço."
COM_BFSTOP_SETUP_PARTS_ERROR_NONE="Escolha pelo menos uma parte: caso contrário, o Brute Force Stop não protegeria nada."
COM_BFSTOP_SETUP_PRIVACY_FAILEDLOGINS="O Brute Force Stop guarda %1$d falhas de início de sessão, a mais antiga de %2$s. Contêm endereços e nomes de utilizador: dados pessoais."
COM_BFSTOP_SETUP_PRIVACY_NO_FAILEDLOGINS="O Brute Force Stop não guarda nenhuma falha de início de sessão."
COM_BFSTOP_SETUP_HASHING_HEADING="Nomes de utilizador guardados em texto simples"
COM_BFSTOP_SETUP_HASHING_DESC="A versão 1.x guardava cada nome de utilizador escrito no formulário de início de sessão – também palavras-passe ali escritas por engano – e a atualização copiou-os para as estatísticas de nomes de utilizador, que não são limpas por antiguidade. Desde a 2.0, os novos que não pertencem a nenhuma conta são guardados como hash, os antigos não. Isto substitui também os antigos pelo seu hash, em rondas de alguns segundos: os nomes de utilizador de contas e os nomes de utilizador comuns das definições continuam legíveis, e as estatísticas que ficam com o mesmo hash são fundidas. Não pode ser desfeito."
COM_BFSTOP_SETUP_HASHING_RUN="Aplicar hash aos nomes de utilizador antigos"
COM_BFSTOP_SETUP_HASHING_CONTINUE="Continuar a aplicar hash"
COM_BFSTOP_SETUP_HASHING_PROGRESS="%d nomes de utilizador com hash até agora. Continue para o resto."
COM_BFSTOP_SETUP_HASHING_DONE="Todos os nomes de utilizador antigos que não pertencem a nenhuma conta têm agora hash (%d nesta execução)."
COM_BFSTOP_SETUP_PRIVACY_LOG="O ficheiro de registo (%1$s) também contém nomes de utilizador: limpe-o na <a href=\"%2$s\">página do registo</a> se quiser."
COM_BFSTOP_SETUP_RATELIMIT_INTRO="A atualização removeu o atraso da resposta às falhas de início de sessão que as suas definições usavam: uma resposta atrasada ocupa um processo PHP durante todo o atraso, o que os atacantes podem usar para esgotar os do servidor, e quase não os trava. O bloqueio continua a detê-los; para travar os clientes, use uma limitação de taxa antes do PHP."
COM_BFSTOP_SETUP_RATELIMIT_DIRECT="O seu sítio é acedido diretamente: a limitação de taxa do servidor web funciona, por exemplo limit_req do nginx, mod_evasive ou mod_qos do Apache, ou fail2ban (ver o README do BFStop)."
COM_BFSTOP_SETUP_RATELIMIT_PROXY="O seu sítio está atrás de um proxy ou CDN: o servidor web só vê o endereço do proxy, pelo que limites por endereço travariam todos os visitantes de uma vez, e o fail2ban baniria o proxy. Limite antes no proxy ou na CDN, ou deixe o servidor web resolver primeiro o endereço do visitante (o seu módulo real-IP)."
COM_BFSTOP_SETUP_RATELIMIT_RESOLVED="O seu servidor web resolve ele próprio o endereço do visitante: a sua limitação de taxa funciona, com o endereço que o módulo real-IP define."
COM_BFSTOP_SETUP_SCHEDULER_INTRO="Uma vez por dia, o Brute Force Stop limpa o que guarda há demasiado tempo, limita as suas tabelas e retira os bloqueios expirados do ficheiro .htaccess, como tarefa do Agendador de tarefas do Joomla."
