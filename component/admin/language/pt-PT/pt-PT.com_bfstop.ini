COM_BFSTOP_FAILEDLOGIN_FILTER_CLEAR="Mostrar todos"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_LABEL="Nomes de utilizador que não correspondem a uma conta"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_DESC="Os utilizadores costumam introduzir a palavra-passe no campo de nome de utilizador. Com 'Hash', o nome de utilizador de um início de sessão falhado só é armazenado (e exibido, registado em registo e enviado por e-mail) como foi introduzido se pertencer a uma conta existente ou estiver na lista de nomes de utilizador comuns; qualquer outro é substituído por um valor ilegível, que continua sendo o mesmo para a mesma entrada, de modo que as tentativas com ele são contadas juntas. 'Armazenar como introduzido' mantém legível todo nome de utilizador indicado, mas então também armazena palavras-passe introduzidas no campo de nome de utilizador."
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_HASH="Hash (recomendado)"
COM_BFSTOP_SETTINGS_UNKNOWN_USERNAME_MODE_PLAIN="Armazenar como introduzido"
COM_BFSTOP_SETTINGS_EMAIL_INVALID="Não é um endereço de e-mail válido: %s"
COM_BFSTOP_SETTINGS_PROXY_IP_INVALID="Não é um endereço de proxy válido: %1$s. Cada entrada tem de ser um endereço IP ou uma rede em notação CIDR, com um comprimento do prefixo de pelo menos /%2$d para IPv4 e /%3$d para IPv6."
COM_BFSTOP_SETTINGS_HTACCESS_PATH_INVALID="O caminho do .htaccess precisa ser um diretório existente no sistema de ficheiros do servidor."
COM_BFSTOP_SETTINGS_GEOIP_DB_PATH_INVALID="O caminho do base de dados GeoIP precisa ser o nome de um ficheiro de base de dados MaxMind (terminado em .mmdb) no sistema de ficheiros do servidor."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_LABEL="Granularidade do rastreamento de IPv6"
COM_BFSTOP_SETTINGS_IPV6_PREFIX_DESC="Um cliente com endereço IPv6 normalmente controla uma rede inteira e pode mudar para outro endereço dela quando quiser. Por isso, os inícios de sessão falhados e os bloqueios de clientes IPv6 são registados por rede deste tamanho em vez de por endereço. Um /64 é uma única rede local; uma ligação doméstica, móvel ou empresarial recebe normalmente pelo menos um /56 - 256 redes desse tipo, a partir de qualquer uma das quais o titular pode enviar pedidos -, por isso /56 é recomendado. Escolha uma rede menor ou um único endereço apenas se souber que os clientes do seu site partilham as suas redes com outros que não quer bloquear em conjunto."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_128="Endereço único (/128)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_LABEL="Limite de tamanho do ficheiro de registo (MB)"
COM_BFSTOP_SETTINGS_LOG_MAX_SIZE_DESC="Quando o ficheiro de registo fica maior que isto, ele é movido para um segundo ficheiro (plg_system_bfstop.1.log.php no diretório de registos), substituindo o anterior. Assim, os ficheiros de registo juntos nunca ocupam muito mais que o dobro deste tamanho."
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_LABEL="Manter entradas do registo (dias)"
COM_BFSTOP_SETTINGS_LOG_KEEP_DAYS_DESC="Entradas do registo mais antigas que este número de dias são eliminadas automaticamente (uma vez por dia, mesmo que o registo seja desativado nesse meio-tempo). Use 0 para manter as entradas até atingir o limite de tamanho."
COM_BFSTOP_LOG_AUTOPRUNE_ENABLED="Entradas do registo com mais de %1$d dias são eliminadas automaticamente, e o ficheiro de registo é rotacionado quando ultrapassa %2$d MB. O utilizador pode alterar isso na aba 'Avançado' das <a href=\"%3$s\">Definições</a>."
COM_BFSTOP_LOG_AUTOPRUNE_DISABLED="Entradas antigas do registo não são eliminadas por idade de momento, apenas quando o ficheiro de registo é rotacionado ao ultrapassar %1$d MB. Para alterar isso, defina 'Manter entradas do registo' nas <a href=\"%2$s\">Definições</a>, ou use os botões 'Limpar entradas antigas do registo' e 'Esvaziar o registo'."
COM_BFSTOP_LOG_PRUNE_BUTTON="Limpar entradas antigas do registo"
COM_BFSTOP_LOG_PRUNE_DISABLED="A limpeza precisa de um período de retenção: defina 'Manter entradas do registo' nas <a href=\"%s\">Definições</a> ou esvazie o registo."
COM_BFSTOP_LOG_PRUNE_N_DELETED="%1$d entradas do registo com mais de %2$d dias foram eliminadas."
COM_BFSTOP_LOG_PRUNE_N_DELETED_0="Não havia entradas do registo com mais de %2$d dias."
COM_BFSTOP_LOG_PRUNE_N_DELETED_1="Uma entrada do registo com mais de %2$d dias foi eliminada."
COM_BFSTOP_LOG_CLEAR_BUTTON="Esvaziar o registo"
COM_BFSTOP_LOG_CLEAR_TITLE="Esvaziar o registo"
COM_BFSTOP_LOG_CLEAR_DESC="Todas as entradas do registo serão eliminadas permanentemente, inclusive as do ficheiro de registo anterior. Isso não pode ser desfeito. Os bloqueios e as entradas de inícios de sessão falhados não são afetados."
COM_BFSTOP_LOG_CLEAR_CONFIRM="Esvaziar"
COM_BFSTOP_LOG_CLEARED="O registo foi esvaziado."
COM_BFSTOP_SETTINGS_NOTIFY_ANY_NEEDS_LIVE_SITE="As ligações de desbloqueio só podem ser enviadas se o endereço do site estiver definido ($live_site no configuration.php do site). Defina-o aí, ou desative as ligações de desbloqueio."
COM_BFSTOP_SETTINGS_RISK_MIN_BLOCK_NUMBER_ABOVE_BLOCK_NUMBER="\"%1$s\" (%2$d) não pode ser superior a \"%3$s\" (%4$d): cada cliente teria %2$d tentativas. Diminua \"%1$s\", ou aumente \"%3$s\"."
COM_BFSTOP_SETTINGS_HTACCESS_NEEDS_APACHE="Este site funciona com nginx, que não lê ficheiros .htaccess: o modo de bloqueio '%1$s' não pode funcionar aqui. Escolha '%2$s'; o nginx pode negar endereços na sua própria configuração."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_LABEL="Ficheiro de negação do nginx"
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_DESC="Apenas para sites servidos pelo nginx, que não lê ficheiros .htaccess: um ficheiro (um caminho absoluto, terminado em .conf) em que o BFStop mantém os bloqueios ativos, como linhas 'deny', para o bloco server da configuração do nginx do site incluir. O nginx só o lê ao ser recarregado: garanta que é recarregado quando o ficheiro muda (por exemplo, com uma unidade path do systemd ou uma tarefa cron que execute 'nginx -t &amp;&amp; nginx -s reload'). Endereços da lista de permissões e proxies de confiança são omitidos. Vazio: nenhum ficheiro."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_PATH="Não é um ficheiro que o BFStop possa escrever como ficheiro de negação do nginx: %1$s. Tem de ser o caminho absoluto de um ficheiro cujo nome termine em %2$s."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_DIRECTORY="O diretório do ficheiro de negação do nginx %1$s não existe ou não pode ser escrito."
COM_BFSTOP_SETTINGS_NGINX_DENY_FILE_FOREIGN="%1$s existe e não foi escrito pelo BFStop: seria substituído. Escolha um ficheiro novo."
COM_BFSTOP_WARNING_NO_LIVE_SITE="O endereço do site não está definido ($live_site no configuration.php). O Joomla! constrói então as ligações dos e-mails do Brute Force Stop com o anfitrião indicado em cada pedido, que um visitante pode escolher livremente - por isso não é enviada nenhuma ligação de desbloqueio e as notificações aos administradores não indicam nenhum endereço. Para definir o endereço, adicione esta linha à classe no configuration.php do site, com o endereço pelo qual o site é acedido (proposto a partir deste pedido, verifique-o): %s"
COM_BFSTOP_WARNING_NOTIFY_ANY_WITHOUT_LIVE_SITE="Devem ser enviadas ligações de desbloqueio (<a href=\"%s\">definições</a>), mas o endereço do site não está definido ($live_site no configuration.php): não é enviada nenhuma ligação de desbloqueio."
COM_BFSTOP_SETTINGS_IPV6_PREFIX_56="/56 (recomendado)"
COM_BFSTOP_IP_NETWORK_TOO_LARGE="A rede %1$s é demasiado grande: o comprimento do prefixo tem de ser de pelo menos /%2$d para IPv4 e /%3$d para IPv6."
COM_BFSTOP_IPADDRESS_TRUSTED_PROXY="Isto é (ou contém) um proxy de confiança das definições: bloqueado no ficheiro .htaccess, todos os pedidos que passam por ele seriam recusados."
COM_BFSTOP_SETTINGS_HTACCESS_NOT_TIDIED="O Brute Force Stop não conseguiu retirar os seus bloqueios de <code>%s</code>, que já não bloqueia: o servidor web continua a recusar estes endereços, mesmo depois de os bloqueios terminarem. Torne o ficheiro gravável e retire-os manualmente - estão nas linhas &lt;If&gt; entre '# BEGIN BFStop Blocks' e '# END BFStop Blocks'."
COM_BFSTOP_BLOCK_HTACCESS_NOT_WRITTEN="O bloqueio foi guardado, mas não pôde ser adicionado a <code>%s</code>: o Joomla recusa o endereço, o servidor web não."

