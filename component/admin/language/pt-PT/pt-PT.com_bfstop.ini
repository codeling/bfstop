COM_BFSTOP_SETUP_PROXY_ERROR_UNSUPPORTED="O seu proxy só envia cabeçalhos que o Brute Force Stop não pode usar: existe um proxy, pelo que 'sem proxy' bloquearia todos os que estão atrás dele. Faça primeiro o proxy enviar um cabeçalho que o BFStop leia."
COM_BFSTOP_SETUP_PROXY_ERROR_ACKNOWLEDGE="O seu pedido chegou através de um proxy. Sem definições de proxy, o Brute Force Stop bloquearia o proxy, ou seja, toda a gente: confirme que o sítio é acedido diretamente mesmo assim, ou configure o proxy."
COM_BFSTOP_SETUP_PROXY_ERROR_CONFIRM="Verifique as definições com o seu pedido e confirme que o endereço mostrado é o do seu computador antes de serem guardadas."
COM_BFSTOP_SETUP_PROXY_ERROR_HEADER="Escolha um cabeçalho que o Brute Force Stop leia."
COM_BFSTOP_SETUP_PROXY_ERROR_TRUSTED="Introduza o endereço (ou a rede) do seu proxy."
COM_BFSTOP_SETUP_REMINDER="Mantenha estas definições atualizadas. Sempre que o seu alojamento mudar (um novo proxy ou CDN, nós do balanceador de carga acrescentados ou substituídos, uma mudança para outro fornecedor), execute de novo a verificação de proxy. Definições erradas podem bloquear todos os visitantes, ou permitir que atacantes escolham o endereço em que são contados."
COM_BFSTOP_SETUP_RERUN_PROXY_CHECK="Executar de novo a verificação de proxy"
COM_BFSTOP_SETUP_DISMISS="Isto é esperado"
