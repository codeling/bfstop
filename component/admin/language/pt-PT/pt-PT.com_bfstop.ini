COM_BFSTOP_SETUP_CLEANUP_INTRO="Enquanto o BFStop tomou o endereço do proxy pelo de cada visitante, contou as falhas de início de sessão deles no proxy, talvez o tenha bloqueado (o que bloqueia toda a gente e, após alguns bloqueios, torna o seguinte permanente) e registou-o como um endereço a partir do qual cada utilizador iniciou sessão. Este passo remove o que o BFStop guarda dos proxies de confiança."
COM_BFSTOP_SETUP_CLEANUP_NO_PROXY="Nenhum proxy está configurado, pelo que não há nada de um proxy a limpar."
