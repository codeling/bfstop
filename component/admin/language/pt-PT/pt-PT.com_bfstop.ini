COM_BFSTOP_SETUP_CLEANUP_KNOWNIPS="Inícios de sessão registados a partir do endereço de um proxy: %d"
COM_BFSTOP_SETUP_CLEANUP_ALLOWLIST="A lista de permitidos tem entradas que contêm um proxy de confiança: %1$s. Acrescentar o proxy à lista de permitidos é um recurso comum, mas isenta todos os visitantes da proteção. Remova-as na <a href=\"%2$s\">lista de permitidos</a> agora que o proxy está configurado."
