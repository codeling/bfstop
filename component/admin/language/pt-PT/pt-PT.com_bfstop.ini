COM_BFSTOP_SETUP_START="Começar"
COM_BFSTOP_SETUP_OVERVIEW_INSTALL="Bem-vindo ao Brute Force Stop. Antes de bloquear alguém, precisa de saber como os visitantes chegam ao seu sítio: diretamente, ou através de um proxy, de um balanceador de carga ou de uma CDN. Atrás de um proxy, todos os visitantes parecem vir do endereço do proxy – sem as definições certas, algumas falhas de início de sessão bloqueariam toda a gente."
COM_BFSTOP_SETUP_OVERVIEW_UPGRADE="O Brute Force Stop foi atualizado a partir da versão %s. Eis o que a atualização fez:"
COM_BFSTOP_SETUP_OVERVIEW_DID_SETTINGS="As definições passaram do Gestor de plugins para este componente."
COM_BFSTOP_SETUP_OVERVIEW_DID_BLOCKMODE="Os antigos interruptores 'Bloqueio ativado' e 'Usar .htaccess' passaram a ser o modo de bloqueio '%s'."
COM_BFSTOP_SETUP_OVERVIEW_DID_API="Os inícios de sessão através da API de Web Services do Joomla também estão agora protegidos (a definição 'Ativo para')."
COM_BFSTOP_SETUP_OVERVIEW_DID_ADDRESSES="Os endereços da lista de bloqueios e da lista de permitidos foram uniformizados numa única grafia."
COM_BFSTOP_SETUP_OVERVIEW_DID_MAINTENANCE="A manutenção diária é agora uma tarefa do Agendador de tarefas do Joomla."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS="Uma secção de bloqueio que versões anteriores escreveram no ficheiro .htaccess, se existia, foi reescrita na forma atual."
COM_BFSTOP_SETUP_OVERVIEW_DID_HTACCESS_FAILED="A secção de bloqueio que versões anteriores escreveram no ficheiro .htaccess não pôde ser reescrita: deixa passar qualquer pessoa que não esteja bloqueada pelos restantes controlos de acesso dessa pasta. Torne o ficheiro gravável e execute de novo a atualização, ou remova a secção manualmente."
COM_BFSTOP_SETUP_OVERVIEW_DID_DELAYS="O atraso da resposta às falhas de início de sessão, que as suas definições usavam, foi removido: o Brute Force Stop responde agora de imediato e bloqueia como antes."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_PROXY="A atualização desativou o Brute Force Stop: o pedido da atualização chegou através de um proxy, de um balanceador de carga ou de uma CDN, e sem definições de proxy o BFStop bloquearia o endereço do proxy, ou seja, toda a gente. Permanece desativado até este assistente estar concluído."
COM_BFSTOP_SETUP_OVERVIEW_DISABLED_LOADBALANCER="A atualização desativou o Brute Force Stop: 'Atrás de balanceador de carga' está ligado no Joomla, pelo que o sítio parece estar atrás de um proxy, e sem definições de proxy o BFStop bloquearia o endereço do proxy, ou seja, toda a gente. Permanece desativado até este assistente estar concluído."
COM_BFSTOP_SETUP_OVERVIEW_STEPS="O assistente percorre as definições que precisam da sua decisão: como os visitantes chegam ao sítio, e o modo de bloqueio. Cada passo propõe o que corresponde ao que deteta; o último ativa a proteção."
COM_BFSTOP_SETUP_PROXY_INTRO="O Brute Force Stop conta as falhas de início de sessão por endereço de visitante. Atrás de um proxy, de um balanceador de carga ou de uma CDN, o servidor web vê o endereço do proxy para cada visitante, e o endereço do visitante está num cabeçalho que o proxy acrescenta – que só conta se o pedido veio de um proxy em que confia. O seu próprio pedido a esta página mostra o que se aplica ao seu sítio."
COM_BFSTOP_SETUP_PROXY_DETECTED="O que o seu pedido mostra"
COM_BFSTOP_SETUP_PROXY_REMOTE_PUBLIC="O seu pedido chegou ao servidor web a partir de %s, um endereço na Internet."
COM_BFSTOP_SETUP_PROXY_REMOTE_PRIVATE="O seu pedido chegou ao servidor web a partir de %s, um endereço de uma rede privada ou local – normalmente o de um proxy ou balanceador de carga."
COM_BFSTOP_SETUP_PROXY_HEADER_UNSUPPORTED="Trazia o cabeçalho %s, que o Brute Force Stop não lê."
COM_BFSTOP_SETUP_SCENARIO_A="O seu sítio parece ser acedido diretamente: não há nenhum proxy a configurar."
COM_BFSTOP_SETUP_SCENARIO_B="O seu sítio parece estar atrás de um proxy inverso ou balanceador de carga. Sem definições de proxy, o BFStop contaria as falhas de início de sessão de todos os visitantes no endereço do proxy e bloquearia toda a gente."
COM_BFSTOP_SETUP_SCENARIO_C="O seu servidor web já obtém o endereço do visitante a partir do cabeçalho do proxy (mod_remoteip, real_ip do nginx): o BFStop não deve voltar a ler o cabeçalho. Mantenha a definição de proxy dele desligada."
COM_BFSTOP_SETUP_SCENARIO_D="O seu sítio parece estar atrás de uma CDN (ou a sua própria rede acrescenta um cabeçalho de reencaminhamento à saída). Sem definições de proxy, o BFStop bloquearia os servidores da CDN, e com eles visitantes ao acaso."
COM_BFSTOP_SETUP_SCENARIO_E="O seu proxy só envia cabeçalhos que o Brute Force Stop não pode usar. Fica inativo até o proxy enviar um cabeçalho que ele lê, ou o servidor web resolver o endereço."
COM_BFSTOP_SETUP_UNSUPPORTED="O seu proxy envia %s, que o Brute Force Stop não pode usar."
COM_BFSTOP_SETUP_UNSUPPORTED_USE_OTHER="O seu pedido trazia também um cabeçalho que o BFStop lê: escolha-o abaixo."
COM_BFSTOP_SETUP_UNSUPPORTED_FIX="Faça o proxy acrescentar ao X-Forwarded-For (nginx: <code>proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;</code>), ou deixe o servidor web resolver o endereço com o seu módulo real-IP (mod_remoteip do Apache, real_ip do nginx)."
COM_BFSTOP_SETUP_UNSUPPORTED_ISSUE="Fale-nos da sua configuração (abre uma nova issue no GitHub, apenas com os nomes dos cabeçalhos, o cenário detetado e as versões)"
COM_BFSTOP_SETUP_CLOUDFLARE_WARNING="O seu sítio parece estar atrás da Cloudflare. Confiar em todos os endereços da Cloudflare permite a qualquer pessoa que use a Cloudflare chegar ao seu servidor com um endereço à sua escolha em CF-Connecting-IP (um Worker na própria zona pode defini-lo). Isso só é seguro se o seu servidor aceitar o tráfego da Cloudflare apenas para a sua zona: Authenticated Origin Pulls com um certificado da sua zona, Cloudflare Tunnel ou uma regra de firewall. Caso contrário, deixe o servidor web resolver o endereço com o seu módulo real-IP e mantenha a definição de proxy do BFStop desligada."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH="Obter os intervalos de endereços da Cloudflare"
COM_BFSTOP_SETUP_CLOUDFLARE_FETCH_DESC="Obtém os intervalos que a Cloudflare publica (www.cloudflare.com/ips-v4 e ips-v6) como proxies de confiança, com o cabeçalho CF-Connecting-IP. Apenas quando clica: nada é enviado para outro lado."
COM_BFSTOP_SETUP_CLOUDFLARE_FETCHED="Foram obtidos %d intervalos de endereços da Cloudflare. Verifique-os com o seu pedido antes de guardar."
COM_BFSTOP_SETUP_CLOUDFLARE_FAILED="Não foi possível obter os intervalos de endereços da Cloudflare. Introduza-os manualmente, a partir de www.cloudflare.com/ips."
COM_BFSTOP_SETUP_PROXY_CHOICE="Como é acedido o seu sítio?"
COM_BFSTOP_SETUP_PROXY_CHOICE_NONE="Não há nenhum proxy a configurar: os visitantes acedem diretamente ao sítio, ou o servidor web já resolve o endereço deles."
COM_BFSTOP_SETUP_PROXY_ACKNOWLEDGE="Tenho a certeza: o cabeçalho de reencaminhamento do seu pedido não vem de um proxy à frente deste sítio (mas, por exemplo, da minha própria rede)."
COM_BFSTOP_SETUP_PROXY_CHOICE_PROXY="O sítio está atrás de um proxy, balanceador de carga ou CDN, que envia o endereço do visitante neste cabeçalho:"
