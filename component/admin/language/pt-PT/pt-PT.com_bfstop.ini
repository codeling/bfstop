COM_BFSTOP_SETUP_PROXY_TRUSTED_DESC="É proposto o endereço a partir do qual o proxy se liga ao servidor web. Se houver mais de um nó de proxy (vários balanceadores de carga, uma CDN), indique-os todos, ou a rede mais pequena que os contenha a todos (não maior que /8 para IPv4 ou /16 para IPv6)."
COM_BFSTOP_SETUP_PREVIEW="Verificar com o meu pedido"
COM_BFSTOP_SETUP_PREVIEW_QUESTION="Com estas definições, o Brute Force Stop considera que o seu endereço é %s. É esse o endereço do seu computador na Internet? Se for o do proxy, ou outro que não conhece, as definições ainda não estão certas."
COM_BFSTOP_SETUP_PREVIEW_CONFIRM="Sim, %s é o endereço do meu computador."
COM_BFSTOP_SETUP_PREVIEW_PROBLEM_NOTTRUSTED="O seu pedido não veio de nenhum destes proxies de confiança: o Brute Force Stop usaria o endereço de onde veio, como sem definições de proxy. Acrescente o endereço de onde veio o seu pedido (ver acima)."
