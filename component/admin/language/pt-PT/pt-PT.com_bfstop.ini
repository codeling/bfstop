COM_BFSTOP_SETUP_BLOCKMODE_WARNING_LITESPEED="O LiteSpeed lê ficheiros .htaccess, mas não todas as diretivas do Apache: se escolher '%1$s', verifique se funciona com o botão abaixo."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_HTACCESSPROXY="Atrás de um proxy, o servidor web compara as entradas do ficheiro .htaccess com o endereço do proxy, pelo que não recusam ninguém – ou, se o endereço do proxy lá entrar, toda a gente. Escolha '%2$s', ou deixe o servidor web resolver primeiro o endereço do visitante (mod_remoteip)."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_REPORTINGONLY="'Somente relatório' regista as falhas de início de sessão e envia notificações, mas não bloqueia ninguém: o seu sítio não está protegido. Confirme abaixo que é isso que pretende."
COM_BFSTOP_SETUP_BLOCKMODE_WARNING_UNPROTECTED="O seu sítio não está agora protegido: com 'Somente relatório', o atraso das falhas de início de sessão era toda a proteção das suas definições anteriores, e a atualização removeu os atrasos. Escolha 'Somente início de sessão' ou '%2$s'."
