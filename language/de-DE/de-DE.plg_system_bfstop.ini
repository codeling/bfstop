PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="Du hast noch %d Versuch(e) bevor deine IP-Adresse blockiert wird!"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Fehlgeschlagene Login-Versuche"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Hallo!\n\nJemand hat versucht, sich mit deinem Benutzernamen auf der Webseite '%s' einzuloggen, dafür aber ein falsches Passwort angegeben.\nDies ist so oft passiert dass die IP-Adresse von der diese Versuche ausgingen, gesperrt wurde, um Missbrauch vorzubeugen.\n\nFür den Fall dass Du das nicht selbst warst, ignoriere bitte diese Mail. Du solltest Dich weiterhin wie gewohnt einloggen können.\nSolltest du jedoch selbst für diese Versuche verantwortlich sein, und du weißt nun das Passwort wieder (du kannst alternativ auch die 'Passwort zurücksetzen'-Funktion benützen), dann kannst Du die Sperre wieder aufheben indem du auf den folgenden Link klickst:\n%s\n\nFreundliche Grüße von der automatischen Webseiten-Verwaltung!\n\nHinweis: Dies ist eine automatisiert versendete Nachricht."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="Es wurde bemerkt, dass einer oder mehrere deiner Login-Versuche fehlgeschlagen sind. Bei erneuten Versuchen wirst du in Kürze gesperrt. Es wird daher empfohlen, die <a href='%1$s'>Funktionalität zum Zurücksetzen des Passworts</a> zu benützen!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Deine IP-Adresse ist: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_HINT="<strong>Dieses Update auf Version 2.0.0 bringt umfangreiche Änderungen an der Konfiguration mit.</strong> Die Konfiguration wurde aus der Plugin-Verwaltung in die BFStop-Komponente verlegt - bitte öffne die <a href=\"%s\">Ansicht „Einstellungen“ der Komponente</a> und überprüfe deine Einstellungen - insbesondere den Abschnitt „Proxy / Load-Balancer“, falls deine Website hinter einem Reverse-Proxy oder Load-Balancer läuft."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_API_HINT="<strong>Brute Force Stop schützt jetzt auch Logins über die Web-Services-API von Joomla!</strong> (api/index.php, mit API-Token oder HTTP-Basic-Authentifizierung), und dieses Update hat das eingeschaltet: fehlgeschlagene Logins dort zählen für die Sperre, und gesperrte Adressen werden auch von der API abgewiesen. Falls eine Ihrer Anbindungen die API von einer Adresse aus nutzt, deren Logins fehlschlagen können, prüfen Sie die Einstellung 'Aktiv für' in der <a href=\"%s\">Einstellungsansicht der Komponente</a>."
