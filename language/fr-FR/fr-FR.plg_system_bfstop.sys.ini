PLG_SYSTEM_BFSTOP="System - Brute Force Stop"
PLG_SYSTEM_BFSTOP_DESC="<h2>Brute Force Stop</h2><div><strong>La configuration a été déplacée :</strong> BFStop se configure désormais dans le composant, plus ici - allez dans <a href=\"index.php?option=com_bfstop&view=settings\">Composants &rarr; Brute Force Stop &rarr; Réglages</a>.</div><br><div>Ce plug-in fournit des moyens pour prévenir des attaques de votre site Joomla. À cette fin, le plug-in stocke des informations sur les échecs de connexion, de sorte qu'au terme d'un certain nombre (configurable) de tentatives l'adresse IP de l'attaquant peut être bloquée. En outre, vous pouvez configurer la notification des connexions échouées et des adresses bloquées, aussi bien qu'un délai variable entre chaque tentative de connexion autorisée.</div><br /><div><em>N'oubliez pas de configurer et de publier ce plugin après installation!</em><br />Si vous avez des questions, merci de visiter le <a href='https://github.com/codeling/bfstop'>site du projet sur github</a>. En cas de difficultés d'utilisation, n'hésitez pas à les rapporter <a href='https://github.com/codeling/bfstop/issues'>ici </a>!</div><br /><div>Ce plugin s'inspire pour partie des plugins suivants: Login Failed Log, Redirect Failed Logins and Ban IP Address/Range. Merci beaucoup aux auteurs de ces plugins!<br />Brute Force Stop est un plugin <a target='_blank' href='http://www.joomla.org/'>Joomla!</a>, publié sous la <a target='_blank' title='GNU General Public License' href='http://www.gnu.org/copyleft/gpl.html'>GNU General Public License</a>.</div>"
PLG_SYSTEM_BFSTOP_BLOCK_ENABLED_LABEL="Activation du blocage"
PLG_SYSTEM_BFSTOP_BLOCK_ENABLED_DESC="Active le blocage des adresses IP. En cas de désactivation, aucune nouvelle adresse IP ne sera ajoutée à la liste des adresses bloquées. Même les adresses IP déjà listées ne seront pas bloquées, mais la liste elle-même sera conservée."
PLG_SYSTEM_BFSTOP_USERID_LABEL="Sélection de l'utilisateur"
PLG_SYSTEM_BFSTOP_USERID_DESC="Utilisateur dont l'adresse électronique est utilisée en tant qu'adresse destinataire des courriels de notification (sous réserve que l'adresse de notification ci-dessus soit configurée en mode 'Utilisateur sélectionné')."
PLG_SYSTEM_BFSTOP_USE_HTACCESS_LABEL="Utiliser .htaccess"
PLG_SYSTEM_BFSTOP_USE_HTACCESS_DESC="Utilise le fichier .htaccess du répertoire de Joomla! pour bloquer des adresses IP. Peut être plus rapide qu'un blocage via Joomla!, mais ne fonctionne que si PHP a le droit d'écrire dans le fichier .htaccess. N'activez cette fonction que si vous savez ce que vous faites, et surveillez les journaux de votre serveur."
PLG_SYSTEM_BFSTOP_HTACCESS_PATH_LABEL="Chemin de .htaccess"
PLG_SYSTEM_BFSTOP_HTACCESS_PATH_DESC="Chemin du fichier .htaccess utilisé pour le blocage (si le blocage par .htaccess est activé, voir l'option « Utiliser .htaccess » dans les paramètres principaux du plugin). Cette option ne doit contenir que le chemin, avec la barre oblique finale (« .htaccess » sera ajouté automatiquement). Si elle est vide, le répertoire racine de cette installation de Joomla! est utilisé ; il n'est donc nécessaire de renseigner ce champ que pour des configurations particulières (par exemple si Joomla est installé dans un sous-répertoire du serveur, mais que vous voulez que bfstop bloque l'accès à l'ensemble du serveur)."
PLG_SYSTEM_BFSTOP_EMAIL_ADDRESS_LABEL="Adresse(s) électronique(s)"
PLG_SYSTEM_BFSTOP_EMAIL_ADDRESS_DESC="Adresse(s) électronique(s) utilisée(s) en tant qu'adresse(s) destinataire(s) des courriels de notification. Pour spécifier plusieurs adresses, utiliser le séparateur ';'."
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_NUMBER_LABEL="Notification des échecs de connexion (msg/j)"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_NUMBER_DESC="Combien d'échecs de connexion au maximum notifier par jour ?"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_ONLY_EXISTING_LABEL="Messages d'échec uniquement pour les comptes existants"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_ONLY_EXISTING_DESC="Ne notifier un échec de connexion que si le nom d'utilisateur (ou l'adresse électronique) saisi appartient à un compte existant. Les tentatives avec des noms qui ne sont pas enregistrés sur ce site (typiquement des robots qui devinent des noms d'utilisateur) sont toujours enregistrées et comptabilisées pour le blocage, mais ne déclenchent pas de notification."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_NUMBER_LABEL="Notification des blocages d'adresses IP (msg/j)"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_NUMBER_DESC="Combien de blocages d'addresses IP au maximum notifier par jour ?"
PLG_SYSTEM_BFSTOP_DELAY_DURATION_LABEL="Délai de reconnexion"
PLG_SYSTEM_BFSTOP_DELAY_DURATION_DESC="Délai (en secondes) avant nouvelle tentative de connexion autorisée"
PLG_SYSTEM_BFSTOP_LOGLEVEL_LABEL="Journal d'activité"
PLG_SYSTEM_BFSTOP_LOGLEVEL_DESC="Détermine si un fichier journal des activités du plugin doit être créé (cela ne devrait être nécessaire qu'en cas de problème ; le fichier journal se trouve dans le répertoire des journaux sous le nom plg_system_bfstop.log.php). Vous pouvez aussi choisir le niveau de détail du journal ; par exemple, avec ERROR, seuls les dysfonctionnements sont consignés dans le fichier."
PLG_SYSTEM_BFSTOP_BLOCK_NUMBER_LABEL="Seuil de blocage"
PLG_SYSTEM_BFSTOP_BLOCK_NUMBER_DESC="Nombre de tentatives autorisées avant blocage"
PLG_SYSTEM_BFSTOP_BLOCKED_MESSAGE_LABEL="Message de blocage"
PLG_SYSTEM_BFSTOP_BLOCKED_MESSAGE_DESC="Le message à faire apparaître dans le navigateur de l'utilisateur qui voit son adresse IP bloquée en raison d'utilisation à plusieurs reprises de codes d'accès erronés. Si laissé vide, le message par défaut sera affiché: 'Votre adresse IP a été bloquée en raison d'une utilisation, à plusieurs reprises et durant un laps de temps très court, de codes d'accès erronés.'"
PLG_SYSTEM_BFSTOP_BLOCK_DURATION_LABEL="Durée de blocage"
PLG_SYSTEM_BFSTOP_BLOCK_DURATION_DESC="Configuration de la durée de blocage de l'adresse IP avant réouverture de l'accès"
PLG_SYSTEM_BFSTOP_NOTIFY_REMAINING_ATTEMPTS_LABEL="Affichage du nombre de tentatives restantes"
PLG_SYSTEM_BFSTOP_NOTIFY_REMAINING_ATTEMPTS_DESC="Active ou désactive la notification utilisateur du nombre de tentatives autorisées avant blocage; en cas d'activation, l'utilisateur reçoit, après chaque tentative de connexion, un message dans la fenêtre de connexion l'informant du nombre de tentatives restantes avant blocage. Cette option n'est naturellement pas pertinente si l'option de blocage n'est pas activée."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_LABEL="Message à l'utilisateur impacté"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_DESC="Si cette option est activée, un utilisateur dont le nom a été utilisé lors d'échecs de connexion depuis une adresse IP qui a ensuite été bloquée reçoit un e-mail contenant un lien pour débloquer cette adresse. Rien n'est envoyé si le nom d'utilisateur n'existe pas, ou si les échecs de connexion depuis cette adresse visaient aussi d'autres comptes existants (le lien ne doit pas parvenir au titulaire d'un compte si quelqu'un en attaque d'autres depuis cette adresse). N'importe qui peut provoquer un tel e-mail en échouant à se connecter sous le nom de cet utilisateur : « seulement si l'utilisateur s'est déjà connecté depuis cette adresse IP » (recommandé) évite que cela soit utilisé contre vos utilisateurs ; si des e-mails sont envoyés pour n'importe quelle adresse IP, au plus un lien encore utilisable est envoyé à la fois à un utilisateur."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_KNOWN="activé, uniquement si l'utilisateur s'est déjà connecté depuis cette adresse IP (recommandé)"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_ANY="activé, pour toute adresse IP (n'importe qui peut provoquer l'envoi d'un e-mail à un utilisateur)"
PLG_SYSTEM_BFSTOP_ENABLED="activé"
PLG_SYSTEM_BFSTOP_DISABLED="désactivé"
PLG_SYSTEM_BFSTOP_NOTIFY_UNLIMITED="sans limite"
PLG_SYSTEM_BFSTOP_NOTIFY_NEVER="aucun"
PLG_SYSTEM_BFSTOP_BLOCK_UNLIMITED="sans limite"
PLG_SYSTEM_BFSTOP_BLOCK_5MINUTES="5 Minutes"
PLG_SYSTEM_BFSTOP_BLOCK_10MINUTES="10 Minutes"
PLG_SYSTEM_BFSTOP_BLOCK_15MINUTES="15 Minutes"
PLG_SYSTEM_BFSTOP_BLOCK_30MINUTES="30 Minutes"
PLG_SYSTEM_BFSTOP_BLOCK_1HOUR="1 Heure"
PLG_SYSTEM_BFSTOP_BLOCK_2HOURS="2 Heures"
PLG_SYSTEM_BFSTOP_BLOCK_4HOURS="4 Heures"
PLG_SYSTEM_BFSTOP_BLOCK_8HOURS="8 Heures"
PLG_SYSTEM_BFSTOP_BLOCK_24HOURS="1 Jour"
; Ajouté à compter de la version 0.9.11
PLG_SYSTEM_BFSTOP_MAX_BLOCKS_BEFORE_LABEL="Déclenchement du blocage permanent"
PLG_SYSTEM_BFSTOP_MAX_BLOCKS_BEFORE_DESC="Permet la mise en place d'un blocage permanent au terme d'un certain nombre de blocages temporaires (les blocages résolus via l'interface d'administration ne sont pas comptabilisés)."
PLG_SYSTEM_BFSTOP_MAX_BLOCK_NEVER="Jamais"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_ORIGIN_LABEL="Activé pour"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_ORIGIN_DESC="Permet de sélectionner les points d'entrée où le contrôle d'accés doit être mis en place : interface d'administration et/ou frontal du site. Si le contrôle d'accès est mis en place sur un seul point d'entrée, alors les accès via le point d'entrée non contrôlé ne pourront être pris en compte dans le contrôle d'accès (par exemple, en cas de contrôle mis en place au niveau de la seule interface d'administration, les tentatives d'accès via le frontal du site ne seront pas prises en compte. De même, des connexions réussies via le frontal du site ne pourront pas remettre a zéro le compteur d'accès incrémenté au niveau de l'interface d'administration). Lorsqu'un blocage est déclenché, veuillez également noter que celui-ci affectera la totalité du site (frontal et administration) quel que soit le point d'entrée contrôlé."
PLG_SYSTEM_BFSTOP_ENABLED_FOR_FRONTEND="Frontal uniquement"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_BACKEND="Administration uniquement"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_BOTH="Frontal ET Administration"
PLG_SYSTEM_BFSTOP_FATAL="Erreur fatale"
PLG_SYSTEM_BFSTOP_WARNING="Avertissement"
PLG_SYSTEM_BFSTOP_INFO="Message d'information"
PLG_SYSTEM_BFSTOP_DEBUG="Information détaillée"
; Ajouté à compter de la version 1.0.0 Beta
PLG_SYSTEM_BFSTOP_USE_HTTP_ERROR_LABEL="Utiliser les codes erreur HTTP"
PLG_SYSTEM_BFSTOP_USE_HTTP_ERROR_DESC="Si cette option est activée (recommandé), bfstop répond aux requêtes d'une adresse IP bloquée avec le code d'état 403 (Forbidden), et à la page de déblocage du lien de l'e-mail de notification avec un état d'erreur lorsque le lien ne peut pas être utilisé (400, 403, 404 ou 500). Ne la désactivez que si votre serveur web, votre CDN ou votre pare-feu remplace les pages d'erreur par les siennes, de sorte que les utilisateurs ne voient jamais le message : il est alors envoyé avec l'état 200. Dans les deux cas, les pages ne sont jamais mises en cache."
; Ajouté à compter de la version 1.1.0
PLG_SYSTEM_BFSTOP_DELETE_OLD_ENTRIES_LABEL="Effacement des anciennes entrées"
PLG_SYSTEM_BFSTOP_DELETE_OLD_ENTRIES_DESC="Efface les entrées dont l'ancienneté excède le nombre de semaines indiqué dans ce champ de saisie (indiquer 0 pour désactiver cette fonction d'effacement automatique)."
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_LABEL="Délai adaptatif"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_DESC="Adaptation du délai avant reconnexion au nombre de connexions échouées. Augmente le délai en cas d'accroissement du nombre de connexions comme contre-mesure aux attaques distribuées."
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_MAX_LABEL="Délai maximum"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_MAX_DESC="Le délai maximum de reconnexion lorsque le délai adaptatif est actif"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MIN_LABEL="Seuil minimal"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MIN_DESC="Le seuil à partir duquel le délai adaptatif entre en fonction (mesuré à travers le nombre de connexions échouées dans la dernière heure)"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MAX_LABEL="Seuil maximal"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MAX_DESC="Le seuil à partir duquel le délai adaptatif est maximal (mesuré à travers le nombre de connexions échouées dans la dernière heure)"
PLG_SYSTEM_BFSTOP_DELAY_FIELDSET_LABEL="Délai"
; Ajouté à compter de la version 1.2.0 Beta1
PLG_SYSTEM_BFSTOP_BLOCK_1WEEK="1 semaine"
PLG_SYSTEM_BFSTOP_BLOCK_30DAYS="30 jours"
PLG_SYSTEM_BFSTOP_NOTIFICATION_FIELDSET_LABEL="Notification"
PLG_SYSTEM_BFSTOP_PROXY_FIELDSET_LABEL="Proxy / Répartiteur de charge"
PLG_SYSTEM_BFSTOP_USE_PROXY_LABEL="Derrière un proxy / répartiteur de charge"
PLG_SYSTEM_BFSTOP_USE_PROXY_DESC="N'activez cette option que si votre site se trouve derrière un proxy inverse ou un répartiteur de charge, de sorte que le navigateur du visiteur ne se connecte jamais directement à Joomla!. Lorsqu'elle est activée, bfstop lit l'adresse IP du visiteur dans l'en-tête choisi ci-dessous plutôt que dans la connexion TCP directe - mais uniquement pour les requêtes qui proviennent réellement de l'adresse IP du proxy configurée ci-dessous. Laissez-la désactivée si vous n'avez pas une telle architecture : n'importe quel visiteur peut falsifier cet en-tête, et lui faire confiance sans adresse IP de proxy vérifiée permettrait à un attaquant de faire bloquer une adresse IP arbitraire au lieu de la sienne."
PLG_SYSTEM_BFSTOP_PROXY_HEADER_SOURCE_LABEL="En-tête de l'IP du client"
PLG_SYSTEM_BFSTOP_PROXY_HEADER_SOURCE_DESC="L'en-tête HTTP que votre proxy / répartiteur de charge utilise pour transmettre l'adresse IP d'origine du client. En cas de doute, consultez la documentation de votre proxy - X-Forwarded-For est le choix le plus courant. L'adresse du client est prise à la fin de l'en-tête, c'est-à-dire l'entrée ajoutée par votre propre proxy ; les entrées plus à gauche sont fournies par le client et ignorées. Choisissez un en-tête que votre proxy définit ou complète lui-même."
PLG_SYSTEM_BFSTOP_PROXY_IP_LABEL="Adresse IP du proxy / répartiteur de charge"
PLG_SYSTEM_BFSTOP_PROXY_IP_DESC="L'adresse IP de votre proxy inverse ou répartiteur de charge, c'est-à-dire l'adresse que Joomla! voit comme REMOTE_ADDR pour chaque requête légitime. S'il y a plusieurs proxys à la suite (par exemple un CDN devant un répartiteur de charge), indiquez-les tous, séparés par des virgules ; les sous-réseaux en notation CIDR (par exemple 10.0.0.0/8) sont également acceptés. L'en-tête d'IP du client ci-dessus n'est pris en compte que pour les requêtes provenant de l'une de ces adresses, afin qu'un visiteur ne puisse pas contourner le proxy et falsifier directement l'en-tête. Obligatoire si « Derrière un proxy / répartiteur de charge » est activé ci-dessus."
PLG_SYSTEM_BFSTOP_GROUP_NOTIFICATION_ENABLED_LABEL="Notification du groupe d'utilisateurs"
PLG_SYSTEM_BFSTOP_GROUP_NOTIFICATION_ENABLED_DESC="En cas d'activation, la totalité des utilisateurs du groupe d'utilisateurs sélectionné ci-dessous sera informée des échecs de connexion / banissements d'adresses IP"
PLG_SYSTEM_BFSTOP_USERGROUP_LABEL="Groupe d'utilisateurs"
PLG_SYSTEM_BFSTOP_USERGROUP_DESC="Indiquer le groupe d'utilisateurs à informer des échecs de connexion / banissements d'adresses IP. Cela suppose l'existence dans Joomla d'un groupe d'utilisateurs adapté à cet usage (par exemple, le  groupe 'Super Users')."
; Ajouté à compter de la version 1.3.0 Beta1
PLG_SYSTEM_BFSTOP_NOTIFY_USE_PASSWORD_REMINDER_LABEL="Réinitialisation du mot de passe : aide-mémoire"
PLG_SYSTEM_BFSTOP_NOTIFY_USE_PASSWORD_REMINDER_DESC="Opportunité et modalités de rappel de l'usage de la fonctionnalité de réinitialisation du mot de passe en cas d'échec de connexion"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_ALWAYS="Toujours"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_1LEFT="Après 1 échec de connexion"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_2LEFT="Après 2 échecs de connexion"
PLG_SYSTEM_BFSTOP_BLOCKED_MSG_SHOWIP_LABEL="Affichage IP"
PLG_SYSTEM_BFSTOP_BLOCKED_MSG_SHOWIP_DESC="En cas de blocage, indique à l'internaute son adresse IP (telle que relevée par le serveur)"
PLG_SYSTEM_BFSTOP_CHECK_INTERVAL_LABEL="Intervalle de vérification"
PLG_SYSTEM_BFSTOP_CHECK_INTERVAL_DESC="Intervalle pendant lequel les tentatives échouées d'une même adresse IP sont prises en compte pour le blocage."
PLG_SYSTEM_BFSTOP_SETTINGS_MOVED_LABEL="La configuration a été déplacée"
PLG_SYSTEM_BFSTOP_SETTINGS_MOVED_DESC="Tous les réglages de BFStop se configurent désormais dans le composant plutôt qu'ici. Allez dans <a href=\"index.php?option=com_bfstop&view=settings\">Composants &rarr; Brute Force Stop &rarr; Réglages</a> pour configurer BFStop."
