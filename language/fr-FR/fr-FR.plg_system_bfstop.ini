PLG_SYSTEM_BFSTOP_USERNAME="ID.Utilisateur"
PLG_SYSTEM_BFSTOP_IPADDRESS="Addresse IP"
PLG_SYSTEM_BFSTOP_ERROR="Erreur"
PLG_SYSTEM_BFSTOP_DATETIME="Date et heure"
PLG_SYSTEM_BFSTOP_ORIGIN="Origine"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="%2$s: Adresse IP %1$s bloquée pour cause de multiples tentatives de connexion sur un court laps de temps. Les tentatives enregistrées à cette adresse sont les suivantes:\n\n%3$s\n\nRemarque: D'autres tentatives de connexions, plus anciennes, ont néanmoins pu également concourir à ce blocage, telles des tentatives de connexion ayant conduit à des blocages temporaires..."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Addresse IP bloquée %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="En raison de multiples tentatives de connexion, rapprochées dans le temps, votre adresse IP a été bloquée."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="Il vous reste %d tentative(s) avant que votre adresse IP ne soit bloquée."
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s : tentatives de connexion échouées"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Bonjour,\n\nPlusieurs tentatives de connexion ont été enregistrées sur le site %s avec votre identifiant d'utilisateur, mais avec un mauvais mot de passe.\nCes tentatives ont été suffisament nombreuses pour déclencher le blocage automatique de l'adresse IP à l'origine de ces tentatives.\n\nDans l'hypothèse où vous ne seriez pas à l'origine de ces tentatives de connexion, vous pouvez ignorer ce message. En effet, vous devriez pouvoir vous connecter sur le site dans les conditions habituelles.\n\nDans le cas contraire, et que vous vous souvenez désormais de votre mot de passe ou que vous souhaitez le réinitialiser sur le site, vous avez la possibilité de débloquer votre adresse IP en cliquant sur ce lien:\n%s\n\nCordialement,\n L'Administration du site.\n\nNote: ceci est un message transmis par un automate."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="Au moins une de vos tentatives de connexion a récemment échoué. Si vous réessayez, vous risquez d'être bientôt bloqué. Nous vous recommandons donc d'utiliser la <a href='%1$s'>fonction de réinitialisation du mot de passe</a> !"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Votre address IP est: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_HINT="<strong>Cette mise à jour vers la version 2.0.0 apporte des changements importants de configuration.</strong> La configuration a quitté le Gestionnaire de plugins pour le composant BFStop : veuillez ouvrir la <a href=\"%s\">vue Configuration du composant</a> et vérifier vos paramètres, en particulier la section « Proxy / Répartiteur de charge » si votre site se trouve derrière un proxy inverse ou un répartiteur de charge."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_API_HINT="<strong>Brute Force Stop protège désormais aussi les connexions via l'API des services web de Joomla!</strong> (api/index.php, avec des jetons d'API ou l'authentification HTTP Basic), et cette mise à jour l'a activé : les échecs de connexion y comptent pour le blocage, et les adresses bloquées sont aussi refusées par l'API. Si l'une de vos intégrations utilise l'API depuis une adresse dont les connexions peuvent échouer, vérifiez le paramètre 'Activé pour' dans la <a href=\"%s\">vue Paramètres du composant</a>."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop n'a pas pu réécrire sa section de blocage dans <code>%s</code>. La section écrite par les versions précédentes laisse passer toute personne non bloquée au-delà des autres contrôles d'accès de ce répertoire (protection par mot de passe, restrictions IP). Rendez le fichier accessible en écriture et relancez la mise à jour, ou supprimez à la main les lignes entre '# BEGIN BFStop Blocks' et '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(adresse du site non configurée)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="La connexion n'est pas possible pour le moment. Veuillez réessayer dans quelques minutes."
