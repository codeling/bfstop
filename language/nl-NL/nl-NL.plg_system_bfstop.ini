PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="%2$s: IP-adres %1$s geblokkeerd omdat er te veel mislukte inlogpogingen in een korte tijd zijn geweest. Dit zijn alle inlogpogingen die vanaf dit adres zijn geregistreerd:\n\n%3$s\n\nLet op: Dit overzicht kan uit meer pogingen bestaan dan die recent voor een blokkade hebben gezorgd. Er kunnen namelijk pogingen in het verleden geweest zijn die toen al tot een tijdelijke blokkade hebben geleid, of pogingen die toen qua tijd te ver uit elkaar lagen maar nu wel relevant zijn!"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Geblokkeerd IP adres %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Uw IP-adres is geblokkeerd omdat er te veel mislukte inlogpogingen in een korte tijd geweest zijn."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="U heeft %d poging(en) over voordat uw IP adres geblokkeerd wordt."
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Mislukte login pogingen"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Hallo!\n\nIemand probeert aan te melden op website '%s' met uw gebruikersnaam, maar daarbij is een onjuist wachtwoord gebruikt.\nDit is zo vaak gebeurd dat het systeem de toegang heeft geblokkeerd voor het IP-adres waar vandaan deze loginpogingen gedaan zijn. Deze blokkade is om verder misbruik te voorkomen.\n\nIndien u niet zelf deze loginpogingen deed, kunt u dit bericht negeren. U kunt nog altijd inloggen zoals gebruikelijk want dan is uw IP adres niet geblokkeerd.\nWaren het wel uw login pogingen en u weet nu ofwel alsnog het goede wachtwoord of u wilt de 'Reset wachtwoord' functie gebruiken, dan heeft u de mogelijkheid de blokkering van uw IP-adres op te heffen door op deze link te klikken:\n%s\n\nMet vriendelijke groet, de automatische websitebeheerder.\n\nAttentie: Dit is een automatisch gegenereerd bericht."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="Een of meer van je inlogpogingen zijn onlangs mislukt. Als je het opnieuw probeert, word je binnenkort geblokkeerd. Je wordt daarom aangeraden de <a href='%1$s'>functie om je wachtwoord opnieuw in te stellen</a> te gebruiken!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Uw IP-adres is: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_HINT="<strong>Deze update naar versie 2.0.0 brengt ingrijpende wijzigingen in de configuratie met zich mee.</strong> De configuratie is verhuisd van de Pluginbeheerder naar de BFStop-component - ga naar de <a href=\"%s\">weergave Instellingen van de component</a> en controleer je instellingen, met name het onderdeel 'Proxy / Load balancer' als je site achter een reverse proxy of load balancer staat."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_API_HINT="<strong>Brute Force Stop beschermt nu ook aanmeldingen via de webservices-API van Joomla!</strong> (api/index.php, met API-tokens of HTTP Basic-authenticatie), en deze update heeft dat ingeschakeld: mislukte aanmeldingen daar tellen mee voor blokkering en geblokkeerde adressen worden ook door de API geweigerd. Als een van uw koppelingen de API gebruikt vanaf een adres waarvan aanmeldingen kunnen mislukken, controleer dan de instelling 'Activeer detectie voor' in de <a href=\"%s\">instellingenweergave van de component</a>."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop kon zijn blokkeersectie in <code>%s</code> niet herschrijven. De sectie die eerdere versies schreven laat iedereen die niet geblokkeerd is langs de andere toegangscontroles van die map (wachtwoordbeveiliging, IP-beperkingen). Maak het bestand schrijfbaar en voer de update opnieuw uit, of verwijder de regels tussen '# BEGIN BFStop Blocks' en '# END BFStop Blocks' met de hand."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(adres van de site niet ingesteld)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="Inloggen is op dit moment niet mogelijk. Probeer het over een paar minuten opnieuw."
