PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_HINT="<strong>Esta atualização para a versão 2.0.0 traz grandes alterações à configuração.</strong> A configuração saiu do Gestor de plugins e foi para o componente BFStop - aceda à <a href=\"%s\">vista Definições do componente</a> e reveja as suas definições, em especial a secção 'Proxy / Balanceador de carga' se o seu site estiver atrás de um proxy inverso ou de um balanceador de carga."
