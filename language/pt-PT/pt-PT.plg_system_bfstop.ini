PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Olá!\n\nAlguém tentou iniciar sessão com o seu nome de utilizador no site '%s', mas usou uma palavra-passe errada.\nIsso aconteceu tantas vezes que o sistema bloqueou o acesso a partir do endereço IP de onde essas tentativas de início de sessão se originaram, para evitar o uso indevido.\n\nSe não foi o utilizador quem fez essas tentativas de início de sessão, ignore esta mensagem. O utilizador deve conseguir iniciar sessão normalmente.\nSe foi o utilizador o responsável por essas tentativas e agora se lembra da palavra-passe ou quer usar a função 'Repor palavra-passe', o utilizador pode desbloquear o endereço IP clicando neste ligação:\n%s\n\nAtenciosamente, o gerenciamento automático do site\n\nObservação: esta é uma mensagem gerada automaticamente."
