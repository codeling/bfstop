PLG_SYSTEM_BFSTOP="Sistema - Brute Force Stop"
PLG_SYSTEM_BFSTOP_DESC="<h2>Brute Force Stop</h2><div><strong>A configuração foi movida:</strong> o BFStop é agora configurado no componente, e já não aqui - aceda a <a href=\"index.php?option=com_bfstop&view=settings\">Componentes &rarr; Brute Force Stop &rarr; Definições</a>.</div><br><div>Este plugin fornece meios para evitar o Brute-force início de sessão na sua instalação do Joomla. Para este efeito, o plugin armazena informações sobre tentativas de início de sessão, de modo que quando se atinge um número configurável de tais tentativas de início de sessão falhadas, o endereço IP do intruso pode ser bloqueado. Além disso, o utilizador pode configurar notificações sobre inícios de sessão que falharam e endereços IP bloqueados, bem como um adiamento variável para uma tentativa de início de sessão falhada.</div><br /><div><em>Não se esqueça de configurar e publicar o plugin após a instalação!</em><br />Se tiver alguma dúvida sobre o plugin, visite o <a href='https://github.com/codeling/bfstop'>site do projeto no github</a>. Caso haja algum problema ao usar o plugin, não hesite em relatá-los no <a href='https://github.com/codeling/bfstop/issues'>rastreador de problemas</a>!</div><br /><div>Em algumas partes, este plugin foi inspirado pelos seguintes plugins:Início de sessão Failed Log, Redirect Failed Inícios de sessão e Ban IP Address/Range. Muito obrigado aos autores destes plugins!<br />Brute Force Stop é um <a target='_blank' href='http://www.joomla.org/'>Joomla!</a> Plugin, publicado sobre licença <a target='_blank' title='GNU General Public License' href='http://www.gnu.org/copyleft/gpl.html'>GNU General Public License</a>.</div><br /><div>Tradução para portugues realizada por solrac comproperty247(at)gmail.com</div>"
PLG_SYSTEM_BFSTOP_BLOCK_ENABLED_LABEL="Ativar bloqueio"
PLG_SYSTEM_BFSTOP_BLOCK_ENABLED_DESC="Se este plugin deve bloquear endereços IP ou não. Quando desativado, não há novos endereços IP serem adicionados à lista de endereços bloqueados, e nem mesmo os endereços IP já nessa lista será mais bloqueado (a própria lista será preservada)."
PLG_SYSTEM_BFSTOP_USERID_LABEL="Selecione um Utilizador"
PLG_SYSTEM_BFSTOP_USERID_DESC="Selecione o utilizador a quem devem ser enviadas as notificações."
PLG_SYSTEM_BFSTOP_USE_HTACCESS_LABEL="Usar .htaccess"
PLG_SYSTEM_BFSTOP_USE_HTACCESS_DESC="Usa o ficheiro .htaccess do diretório do Joomla! para bloquear endereços IP. Pode ser mais rápido do que bloquear pelo Joomla!, mas só funciona se o PHP tiver permissão para gravar no ficheiro .htaccess. Ative esta função somente se souber o que está a fazer e fique atento aos registos do seu servidor."
PLG_SYSTEM_BFSTOP_HTACCESS_PATH_LABEL="Caminho do .htaccess"
PLG_SYSTEM_BFSTOP_HTACCESS_PATH_DESC="Caminho do ficheiro .htaccess usado para o bloqueio (se o bloqueio via .htaccess estiver ativado; veja a opção 'Usar .htaccess' nas definições principais do plugin). Esta opção deve conter apenas o caminho, com a barra final ('.htaccess' será acrescentado automaticamente). Se estiver vazia, será usado o diretório raiz desta instalação do Joomla!, portanto só é preciso preencher algo aqui em definições especiais (por exemplo, se o Joomla estiver instalado em um subdiretório do servidor, mas o utilizador quiser que o bfstop bloqueie o acesso a todo o servidor)."
PLG_SYSTEM_BFSTOP_EMAIL_ADDRESS_LABEL="Endereço de e-mail"
PLG_SYSTEM_BFSTOP_EMAIL_ADDRESS_DESC="Indique o endereço ou endereços de e-mail para os quais as notificações devem ser enviadas. Se quiser indicar mais de um, separe-os com ponto e vírgula (;)."
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_NUMBER_LABEL="Msgs de inícios de sessão falhados por dia"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_NUMBER_DESC="Quantas vezes por dia avisar sobre um início de sessão falhado"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_ONLY_EXISTING_LABEL="Msgs de falha só para contas existentes"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_ONLY_EXISTING_DESC="Notificar sobre um início de sessão falhado somente se o nome de utilizador (ou endereço de e-mail) indicado pertencer a uma conta existente. Tentativas com nomes que não estão registados neste site (normalmente robôs que adivinham nomes de utilizador) continuam a ser registadas e contadas para o bloqueio, mas não geram notificação."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_NUMBER_LABEL="Msgs de bloqueio por dia"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_NUMBER_DESC="Quantas vezes para avisar sobre um IP bloqueado durante um dia"
PLG_SYSTEM_BFSTOP_DELAY_DURATION_LABEL="Adiamento"
PLG_SYSTEM_BFSTOP_DELAY_DURATION_DESC="Atraso (em segundos) após um início de sessão falhado"
PLG_SYSTEM_BFSTOP_LOGLEVEL_LABEL="Registo"
PLG_SYSTEM_BFSTOP_LOGLEVEL_DESC="Determina se deve ser criado um ficheiro de registo com as atividades do plugin (isso só deve ser necessário em caso de problema; o ficheiro está no diretório de registos com o nome plg_system_bfstop.log.php). O utilizador também pode configurar o nível de detalhe do registo; por exemplo, defina como ERROR para registar no ficheiro apenas cada falha de funcionamento."
PLG_SYSTEM_BFSTOP_BLOCK_NUMBER_LABEL="Limite de bloqueio"
PLG_SYSTEM_BFSTOP_BLOCK_NUMBER_DESC="Quantas vezes se pode tentar iniciar sessão até o IP ser bloqueado"
PLG_SYSTEM_BFSTOP_BLOCKED_MESSAGE_LABEL="Mensagem de bloqueio"
PLG_SYSTEM_BFSTOP_BLOCKED_MESSAGE_DESC="A mensagem que o utilizador quer que apareça na janela do navegador de um utilizador cujo IP foi bloqueado por causa de muitas tentativas de início de sessão falhadas. Se ficar vazio, será exibida esta mensagem padrão: 'O seu endereço IP foi bloqueado porque houve muitas tentativas de início de sessão sem sucesso num curto espaço de tempo.'"
PLG_SYSTEM_BFSTOP_BLOCK_DURATION_LABEL="Duração do bloqueio"
PLG_SYSTEM_BFSTOP_BLOCK_DURATION_DESC="Determina quanto tempo o endereço IP é bloqueado antes de ser autorizado o acesso ao site novamente"
PLG_SYSTEM_BFSTOP_NOTIFY_REMAINING_ATTEMPTS_LABEL="Tentativas restantes "
PLG_SYSTEM_BFSTOP_NOTIFY_REMAINING_ATTEMPTS_DESC="Ativa ou desativa as notificações sobre as tentativas restantes; se ativado, após cada tentativa de início de sessão falhado o utilizador verá no formulário de início de sessão uma mensagem sobre quantas tentativas de início de sessão ainda restam antes de o endereço IP ser bloqueado. Esta configuração só está ativa se o bloqueio estiver ativado (com o bloqueio desativado, as entradas 'restantes' não fariam sentido)."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_LABEL="Mensagem de bloqueio ao utilizador"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_DESC="Quando ativado, um utilizador cujo nome de utilizador foi usado em inícios de sessão falhados a partir de um endereço IP que depois foi bloqueado recebe um e-mail com uma ligação para desbloquear esse endereço. Nada é enviado se o nome de utilizador não existir, ou se os inícios de sessão falhados desse endereço também foram contra outras contas existentes (a ligação não deve chegar ao dono de uma conta se alguém estiver atacando outras a partir dali). Qualquer pessoa pode causar esse e-mail falhando no início de sessão como esse utilizador: 'somente se o utilizador já tiver feito início de sessão a partir desse endereço IP' (recomendado) evita que isso seja usado contra os seus utilizadores; se os e-mails forem enviados para qualquer endereço IP, no máximo uma ligação que ainda possa ser usado é enviado a um utilizador por vez."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_KNOWN="ativado, somente se o utilizador já tiver feito início de sessão a partir desse endereço IP (recomendado)"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_ANY="ativado, para qualquer endereço IP (qualquer pessoa pode fazer com que um e-mail seja enviado a um utilizador)"
PLG_SYSTEM_BFSTOP_USE_HTTP_ERROR_LABEL="Usar erro HTTP"
PLG_SYSTEM_BFSTOP_USE_HTTP_ERROR_DESC="Se ativado (recomendado), o bfstop responde às pedidos de um endereço IP bloqueado com o código de status 403 (Forbidden) e responde à página de desbloqueio do ligação do e-mail de notificação com um status de erro quando o ligação não puder ser usado (400, 403, 404 ou 500). Desative somente se o seu servidor web, CDN ou firewall substituir as páginas de erro pelas suas próprias, de modo que os utilizadores nunca vejam a mensagem: ela será então enviada com o status 200. Em ambos os casos, as páginas nunca são armazenadas em cache."
PLG_SYSTEM_BFSTOP_ENABLED="ativado"
PLG_SYSTEM_BFSTOP_DISABLED="desativado"
PLG_SYSTEM_BFSTOP_NOTIFY_UNLIMITED="ilimitado"
PLG_SYSTEM_BFSTOP_NOTIFY_NEVER="nunca"
PLG_SYSTEM_BFSTOP_BLOCK_UNLIMITED="ilimitado"
PLG_SYSTEM_BFSTOP_BLOCK_5MINUTES="5 Minutos"
PLG_SYSTEM_BFSTOP_BLOCK_10MINUTES="10 Minutos"
PLG_SYSTEM_BFSTOP_BLOCK_15MINUTES="15 Minutos"
PLG_SYSTEM_BFSTOP_BLOCK_30MINUTES="30 Minutos"
PLG_SYSTEM_BFSTOP_BLOCK_1HOUR="1 Hora"
PLG_SYSTEM_BFSTOP_BLOCK_2HOURS="2 Horas"
PLG_SYSTEM_BFSTOP_BLOCK_4HOURS="4 Horas"
PLG_SYSTEM_BFSTOP_BLOCK_8HOURS="8 Horas"
PLG_SYSTEM_BFSTOP_BLOCK_24HOURS="1 Dia"
PLG_SYSTEM_BFSTOP_BLOCK_1WEEK="1 semana"
PLG_SYSTEM_BFSTOP_BLOCK_30DAYS="30 dias"
PLG_SYSTEM_BFSTOP_MAX_BLOCKS_BEFORE_LABEL="Permanente após"
PLG_SYSTEM_BFSTOP_MAX_BLOCKS_BEFORE_DESC="Determina após quantas tentativas bloqueadas será criado um bloqueio permanente. Bloqueios que foram removidos (ou seja, desbloqueados) por token também contam; apenas os feitos pelo backend são ignorados."
PLG_SYSTEM_BFSTOP_MAX_BLOCK_NEVER="Nunca"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_ORIGIN_LABEL="Ativo para"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_ORIGIN_DESC="As partes do Joomla! para as quais o plugin está ativo: o frontend (o site), o backend (administração) e a API de serviços web (api/index.php, inícios de sessão com tokens de API ou autenticação HTTP Basic). Numa parte para a qual não está ativo, não faz nada: os inícios de sessão falhados aí não são contados, os inícios de sessão bem-sucedidos aí não zeram o contador de falhas e os endereços bloqueados não são recusados aí - exceto com o bloqueio através do ficheiro .htaccess, que o servidor web aplica a todos os pedidos que abrange."
PLG_SYSTEM_BFSTOP_ENABLED_FOR_FRONTEND="Somente frontend"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_BACKEND="Somente backend"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_BOTH="Frontend e backend"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_API="Somente API"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_FRONTEND_API="Frontend e API"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_BACKEND_API="Backend e API"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_ALL="Frontend, backend e API"
PLG_SYSTEM_BFSTOP_FATAL="Erro fatal"
PLG_SYSTEM_BFSTOP_WARNING="Aviso"
PLG_SYSTEM_BFSTOP_INFO="Mensagem informativa"
PLG_SYSTEM_BFSTOP_DEBUG="Informações detalhadas"
PLG_SYSTEM_BFSTOP_DELETE_OLD_ENTRIES_LABEL="Limpar tentativas antigas"
PLG_SYSTEM_BFSTOP_DELETE_OLD_ENTRIES_DESC="Elimina as tentativas de início de sessão falhadas mais antigas do que o número de semanas indicado neste campo (defina como 0 para não eliminar entradas antigas)."
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_LABEL="Atraso adaptativo"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_DESC="Ative para adaptar o atraso à taxa atual de tentativas de início de sessão falhadas. Aumenta o atraso sempre que houver um número maior de inícios de sessão, como contramedida a ataques distribuídos."
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_MAX_LABEL="Atraso máximo"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_MAX_DESC="O atraso máximo da resposta a tentativas de início de sessão falhadas quando o atraso adaptativo está ativado"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MIN_LABEL="Limite mínimo"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MIN_DESC="O limite a partir do qual o atraso adaptativo começa a ter efeito (medido em número de inícios de sessão falhados na última hora)"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MAX_LABEL="Limite máximo"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MAX_DESC="O limite no qual o atraso adaptativo atinge o atraso máximo (medido em número de inícios de sessão falhados na última hora)"
PLG_SYSTEM_BFSTOP_DELAY_FIELDSET_LABEL="Atraso"
PLG_SYSTEM_BFSTOP_NOTIFICATION_FIELDSET_LABEL="Notificação"
PLG_SYSTEM_BFSTOP_PROXY_FIELDSET_LABEL="Proxy / Balanceador de carga"
PLG_SYSTEM_BFSTOP_USE_PROXY_LABEL="Atrás de um proxy / balanceador de carga"
PLG_SYSTEM_BFSTOP_USE_PROXY_DESC="Ative somente se o seu site estiver atrás de um proxy reverso ou de um balanceador de carga, de modo que o navegador do visitante nunca se conecte diretamente ao Joomla!. Quando ativado, o bfstop lê o endereço IP do visitante do cabeçalho selecionado abaixo, em vez da conexão TCP direta, mas apenas para pedidos que realmente venham do endereço IP do proxy configurado abaixo. Deixe desativado, a menos que o utilizador tenha uma configuração assim: qualquer visitante pode forjar esse cabeçalho, e confiar nele sem um IP de proxy verificado permitiria que um atacante fizesse um endereço IP arbitrário ser bloqueado no lugar do seu."
PLG_SYSTEM_BFSTOP_PROXY_HEADER_SOURCE_LABEL="Cabeçalho do IP do cliente"
PLG_SYSTEM_BFSTOP_PROXY_HEADER_SOURCE_DESC="O cabeçalho HTTP que o seu proxy / balanceador de carga usa para informar o endereço IP original do cliente. Em caso de dúvida, consulte a documentação do seu proxy - X-Forwarded-For é a escolha mais comum. O endereço do cliente é tirado do fim do cabeçalho, ou seja, a entrada acrescentada pelo seu próprio proxy; as entradas mais à esquerda são fornecidas pelo cliente e ignoradas. Escolha um cabeçalho que o seu proxy defina ou ao qual ele mesmo acrescente valores."
PLG_SYSTEM_BFSTOP_PROXY_IP_LABEL="Endereço IP do proxy / balanceador de carga"
PLG_SYSTEM_BFSTOP_PROXY_IP_DESC="O endereço IP do seu proxy reverso ou balanceador de carga, ou seja, o endereço que o Joomla! vê como REMOTE_ADDR em toda pedido legítima. Se houver vários proxies em sequência (por exemplo, uma CDN na frente de um balanceador de carga), liste todos, separados por vírgulas; sub-redes em notação CIDR (por exemplo, 10.0.0.0/8) também são permitidas. O cabeçalho de IP do cliente indicado acima só é considerado confiável para pedidos vindas de um desses endereços, para que um visitante não possa contornar o proxy e forjar o cabeçalho diretamente. Obrigatório se 'Atrás de um proxy / balanceador de carga' estiver ativado acima."
PLG_SYSTEM_BFSTOP_GROUP_NOTIFICATION_ENABLED_LABEL="Notificação para grupo de utilizadores"
PLG_SYSTEM_BFSTOP_GROUP_NOTIFICATION_ENABLED_DESC="Se ativado, todo o grupo de utilizadores selecionado abaixo será notificado em caso de inícios de sessão falhados ou IPs banidos"
PLG_SYSTEM_BFSTOP_USERGROUP_LABEL="Grupo de utilizadores"
PLG_SYSTEM_BFSTOP_USERGROUP_DESC="Escolha um grupo de utilizadores cujos membros serão todos notificados sobre inícios de sessão falhados e IPs banidos (se ativado acima). Provavelmente o utilizador vai querer criar um grupo específico para isso ou usar um grupo que tenha apenas os seus administradores mais experientes, como o grupo padrão 'Super Utilizadores'."
PLG_SYSTEM_BFSTOP_NOTIFY_USE_PASSWORD_REMINDER_LABEL="Lembrete de reposição da palavra-passe"
PLG_SYSTEM_BFSTOP_NOTIFY_USE_PASSWORD_REMINDER_DESC="Se e quando mostrar, após um início de sessão falhado, um lembrete sobre a função de reposição da palavra-passe"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_ALWAYS="Sempre"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_1LEFT="Quando restar 1 tentativa"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_2LEFT="Quando restarem 2 tentativas"
PLG_SYSTEM_BFSTOP_BLOCKED_MSG_SHOWIP_LABEL="Mostrar IP"
PLG_SYSTEM_BFSTOP_BLOCKED_MSG_SHOWIP_DESC="Quando bloqueado, mostra ao utilizador o seu endereço IP (como visto pelo servidor)"
PLG_SYSTEM_BFSTOP_CHECK_INTERVAL_LABEL="Intervalo de verificação"
PLG_SYSTEM_BFSTOP_CHECK_INTERVAL_DESC="Intervalo em que as tentativas com falha do mesmo endereço IP são consideradas para o bloqueio."
PLG_SYSTEM_BFSTOP_SETTINGS_MOVED_LABEL="A configuração foi movida"
PLG_SYSTEM_BFSTOP_SETTINGS_MOVED_DESC="Todas as definições do BFStop são agora feitas no componente, e já não aqui. Aceda a <a href=\"index.php?option=com_bfstop&view=settings\">Componentes &rarr; Brute Force Stop &rarr; Definições</a> para configurar o BFStop."
