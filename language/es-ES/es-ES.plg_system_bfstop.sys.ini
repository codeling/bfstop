PLG_SYSTEM_BFSTOP="System - Brute Force Stop"
PLG_SYSTEM_BFSTOP_DESC="<h2>Brute Force Stop</h2><div><strong>La configuración se ha trasladado:</strong> BFStop ahora se configura en el componente, no aquí - vaya a <a href=\"index.php?option=com_bfstop&view=settings\">Componentes &rarr; Brute Force Stop &rarr; Ajustes</a>.</div><br><div>Este conector proporciona medios para evitar ataques de fuerza bruta contra tu Joomla. Para este fin, el conector almacena la información de las tentativas de entradas fracasadas al sistema, de modo que alcanzando un número configurable de entradas fracasadas la dirección IP del atacante puede ser bloqueada. Además, puedes configurar notificaciones sobre las entradas fracasadas al sistema y bloqueos de direcciones IP, así como un retardo variable para una tentativa de entrada fracasada al sistema.</div><br /><div><em>¡No olvides configurar y publicar el conector después de la instalación!</em><br />Si tienes alguna pregunta sobre el conector, por favor visita el<a href='https://github.com/codeling/bfstop'>proyecto en github</a>. Deberías encontrar allí cualquier solución al problema sobre el conector, no vaciles en exponerlo en el <a href='https://github.com/codeling/bfstop/issues'>Seguimiento de incidencias</a></div><br /><div>En parte, este conector fue inspirado por los conectores siguientes Login Failed Log, Redirect Failed Logins and Ban IP Address/Range. Muchísimas gracias para los autores.<br />Brute Force Stop es un conector <a target='_blank' href='http://www.joomla.org/'>Joomla!</a> publicado bajo la <a target='_blank' title='GNU General Public License' href='http://www.gnu.org/copyleft/gpl.html'>GNU General Public License.</a></div>"
PLG_SYSTEM_BFSTOP_BLOCK_ENABLED_LABEL="Activar bloqueo"
PLG_SYSTEM_BFSTOP_BLOCK_ENABLED_DESC="Si este conector debería bloquear direcciones IP. Cuando esté desactivado, ninguna nueva direccion IP será añadida a la lista de direcciones bloqueadas (aunque la lista será conservada)."
PLG_SYSTEM_BFSTOP_USERID_LABEL="Selecciona un usuario"
PLG_SYSTEM_BFSTOP_USERID_DESC="Selecciona al usuario al que se enviarán las notificaciones."
PLG_SYSTEM_BFSTOP_USE_HTACCESS_LABEL="Usar .htaccess"
PLG_SYSTEM_BFSTOP_USE_HTACCESS_DESC="Usa el archivo .htaccess del directorio de Joomla! para bloquear direcciones IP. Puede ser más rápido que bloquear a través de Joomla!, pero solo funciona si PHP tiene permisos de escritura sobre el archivo .htaccess. Active esta función solo si sabe lo que hace y vigile los registros de su servidor."
PLG_SYSTEM_BFSTOP_HTACCESS_PATH_LABEL="Ruta de .htaccess"
PLG_SYSTEM_BFSTOP_HTACCESS_PATH_DESC="Ruta del archivo .htaccess usado para el bloqueo (si el bloqueo mediante .htaccess está activado; véase la opción «Usar .htaccess» en los ajustes principales del plugin). Esta opción solo debe contener la ruta, con la barra final («.htaccess» se añadirá automáticamente). Si está vacía, se usa el directorio raíz de esta instalación de Joomla!, de modo que solo es necesario indicar algo aquí en configuraciones especiales (por ejemplo, si Joomla está instalado en un subdirectorio del servidor pero quiere que bfstop bloquee el acceso a todo el servidor)."
PLG_SYSTEM_BFSTOP_EMAIL_ADDRESS_LABEL="Dirección de correo electrónico"
PLG_SYSTEM_BFSTOP_EMAIL_ADDRESS_DESC="Introduzca la dirección o direcciones de correo electrónico a las que desea que se envíen las notificaciones. Si desea indicar más de una, sepárelas con un punto y coma (;)."
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_NUMBER_LABEL="Mensajes de inicio de sessión fallidos por día"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_NUMBER_DESC="Con qué frecuencia se notificarán inicios de sesión fallidos en un dia"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_ONLY_EXISTING_LABEL="Mensajes de fallo solo para cuentas existentes"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_ONLY_EXISTING_DESC="Notificar un inicio de sesión fallido solo si el nombre de usuario (o la dirección de correo electrónico) introducido pertenece a una cuenta existente. Los intentos con nombres que no están registrados en este sitio (normalmente robots que prueban nombres de usuario) se siguen registrando y cuentan para el bloqueo, pero no generan ninguna notificación."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_NUMBER_LABEL="Mensajes de bloqueo por día"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_NUMBER_DESC="Con qué frecuencia se notificarán las IP bloqueadas en un día"
PLG_SYSTEM_BFSTOP_DELAY_DURATION_LABEL="Retardo"
PLG_SYSTEM_BFSTOP_DELAY_DURATION_DESC="Retardo (en segundos) en una tentativa de entrada fracasada al sistema"
PLG_SYSTEM_BFSTOP_LOGLEVEL_LABEL="Registro"
PLG_SYSTEM_BFSTOP_LOGLEVEL_DESC="Determina si se debe crear un archivo de registro con las actividades del plugin (solo debería ser necesario en caso de problemas; el archivo se encuentra en el directorio de registros con el nombre plg_system_bfstop.log.php). También puede configurar el nivel de detalle del registro; por ejemplo, con ERROR solo se anotan en el archivo los fallos de funcionamiento."
PLG_SYSTEM_BFSTOP_BLOCK_NUMBER_LABEL="Umbral de bloqueo"
PLG_SYSTEM_BFSTOP_BLOCK_NUMBER_DESC="Cuantas veces un usuario puede equivocarse antes de que sea bloqueada la IP"
PLG_SYSTEM_BFSTOP_BLOCKED_MESSAGE_LABEL="Mensaje de bloqueo"
PLG_SYSTEM_BFSTOP_BLOCKED_MESSAGE_DESC="El mensaje que deseas que aparezca en la ventana del navegador de un usuario cuya IP ha sido bloqueada debido a demasiadas tentativas fracasadas. Si lo dejas vacío, el mensaje mostrado será: 'Su dirección de IP ha sido bloqueada por demasiadas tentativas de entrada fracasadas al sistema.'"
PLG_SYSTEM_BFSTOP_BLOCK_DURATION_LABEL="Duración del bloqueo"
PLG_SYSTEM_BFSTOP_BLOCK_DURATION_DESC="Determina cuánto tiempo una dirección IP será bloqueada antes de que le sea permitido tener acceso al sitio nuevamente"
PLG_SYSTEM_BFSTOP_NOTIFY_REMAINING_ATTEMPTS_LABEL="Tentativas restantes"
PLG_SYSTEM_BFSTOP_NOTIFY_REMAINING_ATTEMPTS_DESC="Activa o desactiva las notificaciones sobre tentativas restantes; de ser permitido, el usuario, después de cada tentativa de entrada al sistema fracasada, verá un mensaje sobre cuántas tentativas quedan disponibles antes de que la dirección IP sea bloqueada. Este ajuste es solo activo si el bloqueo está permitido (si el bloqueo está desactivado, las entradas 'restantes' no tendrían sentido)."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_LABEL="Mensaje al usuario bloqueado"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_DESC="Si está activado, un usuario cuyo nombre de usuario se utilizó en inicios de sesión fallidos desde una dirección IP que después ha sido bloqueada recibe un correo electrónico con un enlace para desbloquear esa dirección. No se envía nada si el nombre de usuario no existe, o si los inicios de sesión fallidos desde esa dirección también iban dirigidos contra otras cuentas existentes (el enlace no debe llegar al titular de una cuenta si alguien está atacando otras desde allí). Cualquiera puede provocar ese correo fallando al iniciar sesión como ese usuario: «solo si el usuario ya ha iniciado sesión desde esa dirección IP» (recomendado) evita que se use contra sus usuarios; si se envían correos para cualquier dirección IP, a un usuario solo se le envía a la vez, como máximo, un enlace que todavía se pueda utilizar."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_KNOWN="activado, solo si el usuario ya ha iniciado sesión desde esa dirección IP (recomendado)"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_ANY="activado, para cualquier dirección IP (cualquiera puede provocar el envío de un correo electrónico a un usuario)"
PLG_SYSTEM_BFSTOP_USE_HTTP_ERROR_LABEL="Utiliza error HTTP"
PLG_SYSTEM_BFSTOP_USE_HTTP_ERROR_DESC="Si está activado (recomendado), bfstop responde a las solicitudes de una dirección IP bloqueada con el código de estado 403 (Forbidden), y a la página de desbloqueo del enlace del correo de notificación con un estado de error cuando el enlace no se puede utilizar (400, 403, 404 o 500). Desactívelo solo si su servidor web, CDN o cortafuegos sustituye las páginas de error por las suyas, de modo que los usuarios nunca ven el mensaje: entonces se envía con el estado 200. En ambos casos, las páginas nunca se guardan en caché."
PLG_SYSTEM_BFSTOP_ENABLED="Activado"
PLG_SYSTEM_BFSTOP_DISABLED="No activado"
PLG_SYSTEM_BFSTOP_NOTIFY_UNLIMITED="Ilimitado"
PLG_SYSTEM_BFSTOP_NOTIFY_NEVER="Nunca"
PLG_SYSTEM_BFSTOP_BLOCK_UNLIMITED="Ilimitado"
PLG_SYSTEM_BFSTOP_BLOCK_5MINUTES="5 minutos"
PLG_SYSTEM_BFSTOP_BLOCK_10MINUTES="10 minutos"
PLG_SYSTEM_BFSTOP_BLOCK_15MINUTES="15 minutos"
PLG_SYSTEM_BFSTOP_BLOCK_30MINUTES="30 minutos"
PLG_SYSTEM_BFSTOP_BLOCK_1HOUR="1 hora"
PLG_SYSTEM_BFSTOP_BLOCK_2HOURS="2 horas"
PLG_SYSTEM_BFSTOP_BLOCK_4HOURS="4 horas"
PLG_SYSTEM_BFSTOP_BLOCK_8HOURS="8 horas"
PLG_SYSTEM_BFSTOP_BLOCK_24HOURS="1 día"
PLG_SYSTEM_BFSTOP_BLOCK_1WEEK="1 semana"
PLG_SYSTEM_BFSTOP_BLOCK_30DAYS="30 dias"
PLG_SYSTEM_BFSTOP_MAX_BLOCKS_BEFORE_LABEL="Permanente después de"
PLG_SYSTEM_BFSTOP_MAX_BLOCKS_BEFORE_DESC="Determina después de cuántos intentos fracasados se establece un bloqueo permanente. Los bloqueos anulados también cuentan; sólo aquellos bloqueos realizados por la parte de la administración serán ignorados."
PLG_SYSTEM_BFSTOP_MAX_BLOCK_NEVER="Nunca"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_ORIGIN_LABEL="Activo para"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_ORIGIN_DESC="Las partes de Joomla! para las que el conector está activo: el frontal (el sitio), la administración y la API de servicios web (api/index.php, inicios de sesión con tokens de API o autenticación HTTP Basic). En una parte para la que no está activo, no hace nada: los inicios de sesión fallidos allí no se cuentan, los inicios de sesión correctos allí no reinician el contador de fallos y las direcciones bloqueadas no se rechazan allí, salvo con el bloqueo mediante el archivo .htaccess, que el servidor web aplica a todas las peticiones que cubre."
PLG_SYSTEM_BFSTOP_ENABLED_FOR_FRONTEND="Solo frontal"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_BACKEND="Solo administración"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_BOTH="Frontal y administración"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_API="Solo API"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_FRONTEND_API="Frontal y API"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_BACKEND_API="Administración y API"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_ALL="Frontal, administración y API"
PLG_SYSTEM_BFSTOP_FATAL="Error fatal"
PLG_SYSTEM_BFSTOP_WARNING="Advertencia"
PLG_SYSTEM_BFSTOP_INFO="Mensaje informativo"
PLG_SYSTEM_BFSTOP_DEBUG="Información detallada"
PLG_SYSTEM_BFSTOP_DELETE_OLD_ENTRIES_LABEL="Suprime las entradas antiguas"
PLG_SYSTEM_BFSTOP_DELETE_OLD_ENTRIES_DESC="Eliminar las entradas más antiguas que el número de semanas que figuran en este campo (establece en 0 para desactivar la supresión de las entradas antiguas)."
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_LABEL="Retardo adaptativo"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_DESC="Adapta el retardo a la tasa actual de retardos que han fallado. Aumentará el retardo cada vez que hay un mayor número de inicios de sesión como una contramedida para los ataques distribuidos."
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_MAX_LABEL="Retardo máximo"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_MAX_DESC="El plazo máximo para la respuesta a los intentos de conexión fallidos cuando el retardo adaptativo se activa"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MIN_LABEL="Nivel mínimo"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MIN_DESC="El nivel en el que el retardo adaptativo empieza a hacer efecto (medido en número de inicios de sesión fallidos en la última hora)"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MAX_LABEL="Nivel máximo"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MAX_DESC="El nivel en el que el retardo adaptativo llega al retardo máximo (medido en número de inicios de sesión fallidos en la última hora)"
PLG_SYSTEM_BFSTOP_DELAY_FIELDSET_LABEL="Retardo"
PLG_SYSTEM_BFSTOP_NOTIFICATION_FIELDSET_LABEL="Notificación"
PLG_SYSTEM_BFSTOP_PROXY_FIELDSET_LABEL="Proxy / Balanceador de carga"
PLG_SYSTEM_BFSTOP_USE_PROXY_LABEL="Detrás de un proxy / balanceador de carga"
PLG_SYSTEM_BFSTOP_USE_PROXY_DESC="Active esta opción solo si su sitio está detrás de un proxy inverso o de un balanceador de carga, de modo que el navegador del visitante nunca se conecta directamente a Joomla!. Cuando está activada, bfstop lee la dirección IP del visitante de la cabecera seleccionada más abajo en lugar de la conexión TCP directa, pero solo para las solicitudes que realmente proceden de la dirección IP del proxy configurada más abajo. Déjela desactivada si no tiene una configuración así: cualquier visitante puede falsificar esta cabecera, por lo que confiar en ella sin una IP de proxy verificada permitiría a un atacante hacer que se bloquee una dirección IP arbitraria en lugar de la suya."
PLG_SYSTEM_BFSTOP_PROXY_HEADER_SOURCE_LABEL="Cabecera de la IP del cliente"
PLG_SYSTEM_BFSTOP_PROXY_HEADER_SOURCE_DESC="La cabecera HTTP que su proxy o balanceador de carga utiliza para comunicar la dirección IP original del cliente. Consulte la documentación de su proxy si tiene dudas: X-Forwarded-For es la opción más habitual. La dirección del cliente se toma del final de la cabecera, es decir, la entrada añadida por su propio proxy; las entradas más a la izquierda las proporciona el cliente y se ignoran. Elija una cabecera que su proxy establezca o a la que añada valores él mismo."
PLG_SYSTEM_BFSTOP_PROXY_IP_LABEL="Dirección IP del proxy / balanceador de carga"
PLG_SYSTEM_BFSTOP_PROXY_IP_DESC="La dirección IP de su proxy inverso o balanceador de carga, es decir, la dirección que Joomla! ve como REMOTE_ADDR en cada solicitud legítima. Si hay varios proxies encadenados (por ejemplo, una CDN delante de un balanceador de carga), indíquelos todos separados por comas; también se admiten subredes en notación CIDR (por ejemplo, 10.0.0.0/8). La cabecera de IP del cliente indicada arriba solo es de confianza para las solicitudes procedentes de una de estas direcciones, para que un visitante no pueda eludir el proxy y falsificar la cabecera directamente. Obligatorio si «Detrás de un proxy / balanceador de carga» está activado arriba."
PLG_SYSTEM_BFSTOP_GROUP_NOTIFICATION_ENABLED_LABEL="Grupo de usuarios para la notificación"
PLG_SYSTEM_BFSTOP_GROUP_NOTIFICATION_ENABLED_DESC="Si está activado, el grupo de usuarios seleccionados a continuación serán notificados en caso de inicios de sesión fallidos o IP prohibidas"
PLG_SYSTEM_BFSTOP_USERGROUP_LABEL="Grupo de usuarios"
PLG_SYSTEM_BFSTOP_USERGROUP_DESC="Selecciona un grupo de usuarios para notificarles sobre los inicios de sesión fallidos e IP prohibidas (si está activado anteriormente). Probablemente deberás crear un grupo dedicado para ello, o usar un grupo con administradores experimentados, como el grupo por defecto 'Superusuarios'."
PLG_SYSTEM_BFSTOP_NOTIFY_USE_PASSWORD_REMINDER_LABEL="Recordatorio para el restablecimiento de la clave"
PLG_SYSTEM_BFSTOP_NOTIFY_USE_PASSWORD_REMINDER_DESC="Si se ha de mostrar, y cuando, un recordatorio sobre el uso de la funcionalidad de recuperación de la contraseña en un inicio de sesión fallido"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_ALWAYS="Siempre"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_1LEFT="Cuando reste 1 intento"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_2LEFT="Cuando queden 2 intento"
PLG_SYSTEM_BFSTOP_BLOCKED_MSG_SHOWIP_LABEL="Muestra IP"
PLG_SYSTEM_BFSTOP_BLOCKED_MSG_SHOWIP_DESC="Una vez bloqueado, mostrar al usuario su dirección IP (según la percepción del servidor)"
PLG_SYSTEM_BFSTOP_CHECK_INTERVAL_LABEL="Intervalo de comprobación"
PLG_SYSTEM_BFSTOP_CHECK_INTERVAL_DESC="Intervalo durante el cual se tienen en cuenta los intentos fallidos de la misma dirección IP para el bloqueo."
PLG_SYSTEM_BFSTOP_SETTINGS_MOVED_LABEL="La configuración se ha trasladado"
PLG_SYSTEM_BFSTOP_SETTINGS_MOVED_DESC="Todos los ajustes de BFStop ahora se configuran en el componente en lugar de aquí. Vaya a <a href=\"index.php?option=com_bfstop&view=settings\">Componentes &rarr; Brute Force Stop &rarr; Ajustes</a> para configurar BFStop."
