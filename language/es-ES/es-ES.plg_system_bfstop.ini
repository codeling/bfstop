PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="Se ha bloqueado la dirección IP %1$s porque hubo demasiados intentos fallidos de inicio de sesión en poco tiempo en %2$s. Estos son todos los intentos desde esa dirección que se han registrado:\n\n%3$s\n\nAviso: Esta lista puede contener más entradas que las que causan el bloqueo actual. Puede contener intentos pasados que ya provocaron entonces un bloqueo temporal, o intentos demasiado espaciados en el tiempo para provocar un bloqueo directo."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Dirección IP bloqueada %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Su dirección IP ha sido bloqueada por demasiadas tentativas fracasadas de entrada al sistema."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="Puede intentar (s) %d  antes de que su dirección IP sea bloqueada"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Tentativas fracasadas de entrada al sistema"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Hola!\n\nAlguien trató de entrar al sistema con su nombre de usuario en el sitio Web '%s', pero ha usado una contraseña incorrecta.\nEsto ha pasado tantas veces que el sistema ha bloqueado el acceso de la Dirección IP desde donde provinieron estas tentativas para prevenir su mal uso.\n\nSi no es usted quien está haciendo estas tentativas de entrada al sistema, por favor no haga caso de este mensaje. Usted debería ser capaz de entrar al sistema como lo hace habitualmente.\nSi es usted el responsable de estas tentativas de entrada al sistema, y quiere usar 'la nueva contraseña', usted tiene la posibilidad de desbloquear la dirección IP haciendo clic en este enlace:\n%s\n\nBest, la dirección de sitio Web automática\n\nNota: Este es un mensaje generado automáticamente."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="Le avisamos de que uno o más de sus intentos de inicio de sesión han fallado recientemente. Si lo intenta de nuevo, pronto será bloqueado. Por tanto, le recomendamos que utilice la <a href='%1$s'>función para restablecer la contraseña</a>."
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Su dirección IP es: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_HINT="<strong>Esta actualización a la versión 2.0.0 incluye cambios importantes en la configuración.</strong> La configuración se ha trasladado del Gestor de plugins al componente BFStop: vaya a la <a href=\"%s\">vista Ajustes del componente</a> y revise sus ajustes, en particular la sección «Proxy / Balanceador de carga» si su sitio está detrás de un proxy inverso o de un balanceador de carga."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_API_HINT="<strong>Brute Force Stop ahora también protege los inicios de sesión a través de la API de servicios web de Joomla!</strong> (api/index.php, con tokens de API o autenticación HTTP Basic), y esta actualización lo ha activado: los inicios de sesión fallidos allí cuentan para el bloqueo y las direcciones bloqueadas también son rechazadas por la API. Si alguna de tus integraciones usa la API desde una dirección cuyos inicios de sesión pueden fallar, revisa el ajuste 'Activo para' en la <a href=\"%s\">vista de configuración del componente</a>."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop no pudo reescribir su sección de bloqueos en <code>%s</code>. La sección escrita por versiones anteriores permite a cualquiera que no esté bloqueado saltarse los demás controles de acceso de ese directorio (protección por contraseña, restricciones de IP). Haz que el archivo se pueda escribir y vuelve a ejecutar la actualización, o elimina a mano las líneas entre '# BEGIN BFStop Blocks' y '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(dirección del sitio no configurada)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="No es posible iniciar sesión en este momento. Inténtalo de nuevo dentro de unos minutos."
