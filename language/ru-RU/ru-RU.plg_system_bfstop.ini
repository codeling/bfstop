PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="IP-адрес %1$s заблокирован, так как с него было слишком много неудачных попыток входа за короткое время на сайте %2$s. Вот все зафиксированные попытки с этого адреса:\n\n%3$s\n\nПримечание: этот список может содержать больше записей, чем те, что вызвали текущую блокировку. В нём могут быть прошлые попытки, которые уже тогда привели к временной блокировке, или попытки, разделённые слишком большими промежутками времени, чтобы вызвать немедленную блокировку."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: IP адрес %s заблокирован"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Ваш IP адрес будет заблокирован, потому что было слишком много неудачных попыток входа в течение короткого времени."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="У Вас осталось %d попытки(а) до того как ваш IP адрес будет заблокирован"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Неудачные попытки входа"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Привет!\n\nКто-то пытался войти под Вашим именем на сайт '%s', но ввел неправильный пароль.\nЭто произошло так много раз, что система заблокировала IP-адрес, с которого эти попытки входа возникали для предотвращения взлома.\n\nВ случае, если эти попытки входа делали не Вы, не обращайте внимания на это сообщение. Вы сможете войти в на сайт как обычно.\nЕсли это Вы пытались войти и забыли пароль, или хотите использовать функцию 'Сброс пароля', у вас есть шанс разблокировать IP адрес, нажав на эту ссылку:\n%s\n\nС уважением, система Brute Force Stop\n\nP.S.: Это сообщение сгенерировано автоматически."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="Было замечено, что одна или несколько Ваших попыток входа в систему в последнее время завершились неудачей. При очередной попытке, вскоре Вы будете заблокированы. Поэтому рекомендуется использовать <a href='%1$s'>функцию восстановления пароля</a>!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Ваш IP-адрес: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_HINT="<strong>Это обновление до версии 2.0.0 содержит серьёзные изменения в настройках.</strong> Настройки перенесены из менеджера плагинов в компонент BFStop - откройте <a href=\"%s\">раздел «Настройки» компонента</a> и проверьте свои параметры, особенно секцию «Прокси / Балансировщик нагрузки», если ваш сайт работает за обратным прокси или балансировщиком нагрузки."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_API_HINT="<strong>Brute Force Stop теперь защищает и входы через API веб-сервисов Joomla!</strong> (api/index.php, с API-токенами или HTTP Basic-аутентификацией), и это обновление включило эту защиту: неудачные входы там учитываются для блокировки, а заблокированные адреса отклоняются и API. Если какая-либо ваша интеграция использует API с адреса, входы с которого могут быть неудачными, проверьте настройку 'Активно для' в <a href=\"%s\">настройках компонента</a>."
