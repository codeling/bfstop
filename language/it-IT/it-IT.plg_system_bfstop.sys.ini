PLG_SYSTEM_BFSTOP="System - Brute Force Stop"
PLG_SYSTEM_BFSTOP_DESC="<h2>Brute Force Stop</h2><div><strong>La configurazione si è spostata:</strong> BFStop ora si configura nel componente, non più qui - vai su <a href=\"index.php?option=com_bfstop&view=settings\">Componenti &rarr; Brute Force Stop &rarr; Impostazioni</a>.</div><br><div>Questo plugin offre gli strumenti per prevenire i Brute-Force-Attacks sulla vostra installazione Joomla!. A questo scopo, il plugin memorizza le informazioni sui tentativi di accesso non riusciti, in modo che quando si raggiunge un numero configurabile di tentativi di accesso non riusciti l'indirizzo IP dell'aggressore possa essere bloccato. Inoltre, è possibile configurare degli avvisi per i tentativi di accesso non riusciti e gli indirizzi IP bloccati, così come un ritardo di tempo variabile per i tentativi di accesso non riuscito.</div><br /><div><em>Non dimenticare di configurare e pubblicare il plugin dopo l'installazione!</em><br />Se avete domande sul plugin, visitate il <a href='https://github.com/codeling/bfstop'>sito del progetto su GitHub</a>. In caso di problemi quando si utilizza il plugin, non esitate a segnalarli in <a href='https://github.com/codeling/bfstop/issues'>issue tracker</a>!</div><br /><div>Alcune parti di questo plugin sono state ispirate dai seguenti plugin: Login Failed Log, Redirect Failed Logins e Ban IP Address/Range. Grazie e mille per i plugin di questi autori!<br />Brute Force Stop è un Plugin<a target='_blank' href='http://www.joomla.org/'>Joomla!</a>, pubblicato con licenza <a target='_blank' title='GNU General Public License' href='http://www.gnu.org/copyleft/gpl.html'>GNU General Public License</a>.</div>"
PLG_SYSTEM_BFSTOP_BLOCK_ENABLED_LABEL="Attiva il Blocco"
PLG_SYSTEM_BFSTOP_BLOCK_ENABLED_DESC="Questo plugin dovrebbe bloccare gli indirizzi IP. Quando disattivato, non verranno aggiunti nuovi indirizzi IP alla lista degli indirizzi bloccati, e nemmeno gli indirizzi IP già presenti in tale lista verranno ancora bloccati (la lista sarà però preservata)."
PLG_SYSTEM_BFSTOP_USERID_LABEL="Seleziona un utente"
PLG_SYSTEM_BFSTOP_USERID_DESC="Seleziona l'utente a cui vuoi che siano inviate le notifiche."
PLG_SYSTEM_BFSTOP_USE_HTACCESS_LABEL="Usa .htaccess"
PLG_SYSTEM_BFSTOP_USE_HTACCESS_DESC="Usa il file .htaccess nella cartella di Joomla! per bloccare gli indirizzi IP. Può essere più veloce del blocco tramite Joomla!, ma funziona solo se PHP ha i permessi di scrittura sul file .htaccess. Attiva questa funzione solo se sai cosa stai facendo e tieni d'occhio i log del tuo server."
PLG_SYSTEM_BFSTOP_HTACCESS_PATH_LABEL="Percorso di .htaccess"
PLG_SYSTEM_BFSTOP_HTACCESS_PATH_DESC="Percorso del file .htaccess usato per il blocco (se il blocco tramite .htaccess è attivo, vedi l'impostazione «Usa .htaccess» nelle impostazioni principali del plugin). Questa opzione deve contenere solo il percorso, con la barra finale («.htaccess» verrà aggiunto automaticamente). Se vuoto, viene usata la cartella radice di questa installazione di Joomla!, quindi qui serve indicare qualcosa solo per configurazioni particolari (ad esempio se Joomla è installato in una sottocartella del server ma vuoi che bfstop blocchi l'accesso all'intero server)."
PLG_SYSTEM_BFSTOP_EMAIL_ADDRESS_LABEL="Indirizzo Email"
PLG_SYSTEM_BFSTOP_EMAIL_ADDRESS_DESC="Inserisci l'indirizzo o gli indirizzi email a cui vuoi che vengano inviate le notifiche. Se vuoi indicarne più di uno, separali con un punto e virgola (;)."
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_NUMBER_LABEL="Messaggi falliti per giorno"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_NUMBER_DESC="Quante volte al giorno vuoi che vengano notificati i tentativi di accesso fallito."
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_ONLY_EXISTING_LABEL="Messaggi di errore solo per account esistenti"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_ONLY_EXISTING_DESC="Notifica un accesso fallito solo se il nome utente (o l'indirizzo email) inserito appartiene a un account esistente. I tentativi con nomi non registrati su questo sito (di solito bot che indovinano i nomi utente) vengono comunque registrati e contati ai fini del blocco, ma non generano alcuna notifica."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_NUMBER_LABEL="Messaggi Bloccati per giorno"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_NUMBER_DESC="Quante volte al giorno vuoi che vengano notificati gli IP bloccati."
PLG_SYSTEM_BFSTOP_DELAY_DURATION_LABEL="Ritardo"
PLG_SYSTEM_BFSTOP_DELAY_DURATION_DESC="Ritardo (in secondi) nel caso di tentativo fallito di accesso."
PLG_SYSTEM_BFSTOP_LOGLEVEL_LABEL="Registrazione"
PLG_SYSTEM_BFSTOP_LOGLEVEL_DESC="Determina se deve essere creato un file di log sulle attività del plugin (dovrebbe essere necessario solo in caso di problemi; il file di log si trova nella directory logs con nome plg_system_bfstop.log.php). È inoltre possibile configurare il livello di dettaglio del log: ad esempio, se impostato su ERRORE scriverè nel file di log solo le informazioni sul malfunzionamento."
PLG_SYSTEM_BFSTOP_BLOCK_NUMBER_LABEL="Soglia del Blocco"
PLG_SYSTEM_BFSTOP_BLOCK_NUMBER_DESC="Quante volte un accesso non autorizzato può essere provato prima che l'IP venga bloccato."
PLG_SYSTEM_BFSTOP_BLOCKED_MESSAGE_LABEL="Messaggio Bloccato"
PLG_SYSTEM_BFSTOP_BLOCKED_MESSAGE_DESC="Il messaggio che vuoi mostrare nella finestra del browser di un utente il cui IP è stato bloccato a causa di troppi tentativi di accesso non riusciti. Se lasciato vuoto, verrà visualizzato il messaggio predefinito: 'Il tuo indirizzo IP è stato bloccato perché ci sono stati troppi tentativi di accesso non riusciti in breve tempo.'"
PLG_SYSTEM_BFSTOP_BLOCK_DURATION_LABEL="Durata del Blocco"
PLG_SYSTEM_BFSTOP_BLOCK_DURATION_DESC="Determina per quanto tempo un indirizzo IP viene bloccato prima che venga ripristinato l'accesso al sito"
PLG_SYSTEM_BFSTOP_NOTIFY_REMAINING_ATTEMPTS_LABEL="Tentativi rimasti"
PLG_SYSTEM_BFSTOP_NOTIFY_REMAINING_ATTEMPTS_DESC="Attiva o disattiva gli avvisi per i tentativi rimasti; se abilitato, l'utente dopo ogni tentativo di login fallito, vede un messaggio nella form di login su quanti tentativi di accesso gli sono rimasti prima che l'indirizzo IP venga bloccato. Questa impostazione è attiva solo se il Blocco è abilitato (se il Blocco è disattivato, la voce 'residua' non avrebbero senso)."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_LABEL="Messaggio di blocco per l'utente"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_DESC="Se attivo, un utente il cui nome utente è stato usato in accessi falliti da un indirizzo IP poi bloccato riceve un'email con un link per sbloccare quell'indirizzo. Non viene inviato nulla se il nome utente non esiste, o se gli accessi falliti da quell'indirizzo erano diretti anche contro altri account esistenti (il link non deve arrivare al titolare di un account se qualcuno ne sta attaccando altri da lì). Chiunque può provocare una tale email fallendo l'accesso come quell'utente: «solo se l'utente ha già effettuato l'accesso da quell'indirizzo IP» (consigliato) evita che ciò venga usato contro i tuoi utenti; se le email vengono inviate per qualsiasi indirizzo IP, a un utente viene inviato al massimo un link ancora utilizzabile alla volta. I link di sblocco richiedono l'indirizzo del sito ($live_site in configuration.php): senza di esso, Joomla! costruisce il link dall'host indicato nella richiesta del login fallito che ha fatto bloccare l'indirizzo, e chi invia quella richiesta sceglie quell'host - quindi il link e il suo token potrebbero puntare al suo server. Questo vale anche quando i link vengono inviati solo agli utenti che hanno già effettuato l'accesso dall'indirizzo bloccato: altre persone possono condividere quell'indirizzo (un NAT, un ufficio, una rete IPv6). Senza $live_site non viene inviato alcun link di sblocco."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_KNOWN="attivo, solo se l'utente ha già effettuato l'accesso da quell'indirizzo IP (consigliato)"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_ANY="attivo, per qualsiasi indirizzo IP (chiunque può far inviare un'email a un utente; richiede $live_site in configuration.php)"
PLG_SYSTEM_BFSTOP_USE_HTTP_ERROR_LABEL="Utilizza HTTP Error"
PLG_SYSTEM_BFSTOP_USE_HTTP_ERROR_DESC="Se attivo (consigliato), bfstop risponde alle richieste di un indirizzo IP bloccato con il codice di stato 403 (Forbidden), e alla pagina di sblocco del link nell'email di notifica con uno stato di errore quando il link non può essere usato (400, 403, 404 o 500). Disattivalo solo se il tuo server web, CDN o firewall sostituisce le pagine di errore con le proprie, così che gli utenti non vedano mai il messaggio: viene allora inviato con lo stato 200. In entrambi i casi le pagine non vengono mai messe in cache."
PLG_SYSTEM_BFSTOP_ENABLED="abilitato"
PLG_SYSTEM_BFSTOP_DISABLED="disabilitato"
PLG_SYSTEM_BFSTOP_NOTIFY_UNLIMITED="illimitato"
PLG_SYSTEM_BFSTOP_NOTIFY_NEVER="mai"
PLG_SYSTEM_BFSTOP_BLOCK_UNLIMITED="illimitato"
PLG_SYSTEM_BFSTOP_BLOCK_5MINUTES="5 Minuti"
PLG_SYSTEM_BFSTOP_BLOCK_10MINUTES="10 Minuti"
PLG_SYSTEM_BFSTOP_BLOCK_15MINUTES="15 Minuti"
PLG_SYSTEM_BFSTOP_BLOCK_30MINUTES="30 Minuti"
PLG_SYSTEM_BFSTOP_BLOCK_1HOUR="1 Ora"
PLG_SYSTEM_BFSTOP_BLOCK_2HOURS="2 Ore"
PLG_SYSTEM_BFSTOP_BLOCK_4HOURS="4 Ore"
PLG_SYSTEM_BFSTOP_BLOCK_8HOURS="8 Ore"
PLG_SYSTEM_BFSTOP_BLOCK_24HOURS="1 Giorno"
PLG_SYSTEM_BFSTOP_BLOCK_1WEEK="1 Settimana"
PLG_SYSTEM_BFSTOP_BLOCK_30DAYS="30 Giorni"
PLG_SYSTEM_BFSTOP_MAX_BLOCKS_BEFORE_LABEL="Permanente dopo"
PLG_SYSTEM_BFSTOP_MAX_BLOCKS_BEFORE_DESC="Determina dopo quanti tentativi bloccati sarà attivato un blocco permanente. Si contano anche i blocchi che sono stati rimossi (cioè sbloccati) con il condice-token; solo gli sblocchi fatti tramite il backend verranno ignorati."
PLG_SYSTEM_BFSTOP_MAX_BLOCK_NEVER="Mai"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_ORIGIN_LABEL="Attivo per"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_ORIGIN_DESC="Le parti di Joomla! per cui il plugin è attivo: il frontend (il sito), il backend (amministrazione) e la API dei servizi web (api/index.php, accessi con token API o autenticazione HTTP Basic). In una parte per cui non è attivo non fa nulla: gli accessi falliti lì non vengono contati, gli accessi riusciti lì non azzerano il contatore degli accessi falliti e gli indirizzi bloccati lì non vengono respinti - tranne con il blocco tramite il file .htaccess, che il server web applica a tutte le richieste che copre."
PLG_SYSTEM_BFSTOP_ENABLED_FOR_FRONTEND="Frontend"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_BACKEND="Backend"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_API="API dei servizi web"
PLG_SYSTEM_BFSTOP_FATAL="Errore Irreversibile"
PLG_SYSTEM_BFSTOP_WARNING="Avviso"
PLG_SYSTEM_BFSTOP_INFO="Messaggio infomrativo"
PLG_SYSTEM_BFSTOP_DEBUG="Informazioni dettagliate"
PLG_SYSTEM_BFSTOP_DELETE_OLD_ENTRIES_LABEL="Rimuovere i vecchi tentativi"
PLG_SYSTEM_BFSTOP_DELETE_OLD_ENTRIES_DESC="Elimina i tentativi di Login falliti più vecchi del numero di settimane fornite in questo campo (impostato a 0 disabilita l'eliminazione delle vecchie voci)."
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_LABEL="Ritardo adattivo"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_DESC="Attiva per adattare il ritardo all'attuale tasso di accessi falliti. Aumenterà il ritardo ogni volta che c'è un aumento del numero di accessi come contromisura per gli attacchi distribuiti."
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_MAX_LABEL="Ritardo massimo"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_MAX_DESC="Il ritardo massimo per la risposta ai tentativi di accesso non riusciti, quando il ritardo adattivo è attivato"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MIN_LABEL="Soglia minima"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MIN_DESC="La soglia alla quale il ritardo adattivo inizia a entrare in azione (misurata in numero di accessi non riusciti nelle ultime ore)"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MAX_LABEL="Soglia massima"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MAX_DESC="La soglia alla quale il ritardo adattativo raggiunge il massimo ritardo (misurata in numero di accessi non riusciti nelle ultime ore)"
PLG_SYSTEM_BFSTOP_DELAY_FIELDSET_LABEL="Ritardo"
PLG_SYSTEM_BFSTOP_NOTIFICATION_FIELDSET_LABEL="Notifica"
PLG_SYSTEM_BFSTOP_PROXY_FIELDSET_LABEL="Proxy / Bilanciatore di carico"
PLG_SYSTEM_BFSTOP_USE_PROXY_LABEL="Dietro un proxy / bilanciatore di carico"
PLG_SYSTEM_BFSTOP_USE_PROXY_DESC="Attiva questa opzione solo se il tuo sito si trova dietro un reverse proxy o un bilanciatore di carico, in modo che il browser del visitatore non si connetta mai direttamente a Joomla!. Quando è attiva, bfstop legge l'indirizzo IP del visitatore dall'header selezionato più sotto anziché dalla connessione TCP diretta, ma solo per le richieste che provengono effettivamente dall'indirizzo IP del proxy configurato più sotto. Lasciala disattivata se non hai una configurazione di questo tipo: qualsiasi visitatore può falsificare questo header, quindi fidarsene senza un IP del proxy verificato permetterebbe a un attaccante di far bloccare un indirizzo IP qualsiasi al posto del proprio."
PLG_SYSTEM_BFSTOP_PROXY_HEADER_SOURCE_LABEL="Header dell'IP del client"
PLG_SYSTEM_BFSTOP_PROXY_HEADER_SOURCE_DESC="L'header HTTP che il tuo proxy / bilanciatore di carico usa per comunicare l'indirizzo IP originale del client. In caso di dubbio consulta la documentazione del tuo proxy - X-Forwarded-For è la scelta più comune. L'indirizzo del client viene preso dalla fine dell'header, cioè dalla voce aggiunta dal tuo proxy; le voci più a sinistra sono fornite dal client e vengono ignorate. Scegli un header che il tuo proxy imposta o a cui aggiunge valori autonomamente."
PLG_SYSTEM_BFSTOP_PROXY_IP_LABEL="Indirizzo IP del proxy / bilanciatore di carico"
PLG_SYSTEM_BFSTOP_PROXY_IP_DESC="L'indirizzo IP del tuo reverse proxy o bilanciatore di carico, cioè l'indirizzo che Joomla! vede come REMOTE_ADDR per ogni richiesta legittima. Se ci sono più proxy in sequenza (ad esempio una CDN davanti a un bilanciatore di carico), elencali tutti separati da virgole; sono consentite anche le sottoreti in notazione CIDR (ad esempio 10.0.0.0/8). L'header dell'IP del client indicato sopra è considerato affidabile solo per le richieste provenienti da uno di questi indirizzi, in modo che un visitatore non possa aggirare il proxy e falsificare direttamente l'header. Obbligatorio se «Dietro un proxy / bilanciatore di carico» è attivo sopra. Indica solo indirizzi da cui non invia nessuno tranne i tuoi proxy: fidarsi di un intero intervallo di indirizzi di una CDN o di un provider di hosting significa fidarsi anche dei suoi altri clienti, che potrebbero raggiungere il tuo server attraverso di esso con qualsiasi indirizzo client nell'intestazione."
PLG_SYSTEM_BFSTOP_GROUP_NOTIFICATION_ENABLED_LABEL="Notifica al gruppo di utenti"
PLG_SYSTEM_BFSTOP_GROUP_NOTIFICATION_ENABLED_DESC="Se attivo, l'intero gruppo di utenti selezionato più sotto verrà avvisato in caso di accessi falliti o IP bloccati"
PLG_SYSTEM_BFSTOP_USERGROUP_LABEL="Gruppo di utenti"
PLG_SYSTEM_BFSTOP_USERGROUP_DESC="Scegli il gruppo di utenti i cui membri riceveranno la notifica di accessi falliti e IP bloccati (se attivata sopra). Probabilmente conviene creare un gruppo apposito, oppure usare un gruppo che contiene solo i tuoi amministratori più esperti, come il gruppo predefinito «Super Utenti»."
PLG_SYSTEM_BFSTOP_NOTIFY_USE_PASSWORD_REMINDER_LABEL="Promemoria reimpostazione password"
PLG_SYSTEM_BFSTOP_NOTIFY_USE_PASSWORD_REMINDER_DESC="Se e quando mostrare, dopo un accesso fallito, un promemoria sulla funzione di reimpostazione della password"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_ALWAYS="Sempre"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_1LEFT="Quando resta 1 tentativo"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_2LEFT="Quando restano 2 tentativi"
PLG_SYSTEM_BFSTOP_BLOCKED_MSG_SHOWIP_LABEL="Mostra IP"
PLG_SYSTEM_BFSTOP_BLOCKED_MSG_SHOWIP_DESC="In caso di blocco, mostra all'utente il suo indirizzo IP (così come lo vede il server)"
PLG_SYSTEM_BFSTOP_CHECK_INTERVAL_LABEL="Intervallo di controllo"
PLG_SYSTEM_BFSTOP_CHECK_INTERVAL_DESC="Intervallo in cui i tentativi falliti dallo stesso indirizzo IP vengono considerati ai fini del blocco."
PLG_SYSTEM_BFSTOP_SETTINGS_MOVED_LABEL="La configurazione si è spostata"
PLG_SYSTEM_BFSTOP_SETTINGS_MOVED_DESC="Tutte le impostazioni di BFStop ora si configurano nel componente anziché qui. Vai su <a href=\"index.php?option=com_bfstop&view=settings\">Componenti &rarr; Brute Force Stop &rarr; Impostazioni</a> per configurare BFStop."
