PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="Indirizzo IP Bloccato %1$s perché ci sono stati troppi tentativi di accesso non riusciti in breve tempo su %2$s. Questi sono i tentativi:\n\n%3$s\n\nNota: Questo elenco può contenere più voci rispetto a quelle che hanno causano il blocco attuale. L'elenco può contenere tentativi nel passato che hanno causato già un blocco temporaneo, o tentativi che erano troppo distanti per causare un blocco diretto."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Indirizzo IP Bloccato %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Il tuo indirizzo IP è stato bloccato perché ci sono stati troppi tentativi di accesso non riusciti in breve tempo."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="Hai ancora %d tentativo(i) prima che il tuo indirizzo IP venga bloccato"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Tentativo di accesso fallito"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Ciao!\n\nQualcuno tenta di accedere con il tuo nome utente al sito web '%s', ma ha usato una password sbagliata.\n Questo è accaduto così tante volte che il sistema, per prevenire abusi, ha bloccato l'accesso all'indirizzo IP da cui i tentativi avevano origine.\n\nNel caso non fossi tu a fare questi tentativi di accesso, ignora questo messaggio. Dovresti essere in grado di effettuare il login come al solito.\nSe sei tu il responsabile di questi tentativi di accesso, e ora ti ricordi la password, o se vuoi usare la funzione 'Reset della Password' hai la possibilità di sbloccare l'indirizzo IP cliccando su questo link:\n%s\n\nCordiali saluti, il gestore automatico del sito\n\nNota: Questo è un messaggio generato automaticamente."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="È stato rilevato che uno o più dei tuoi ultimi tentativi di accesso sono falliti. Se riprovi, verrai presto bloccato. Ti consigliamo quindi di usare la <a href='%1$s'>funzione di reimpostazione della password</a>!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Il tuo indirizzo IP è: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_HINT="<strong>Questo aggiornamento alla versione 2.0.0 comporta importanti modifiche alla configurazione.</strong> La configurazione è stata spostata dal Gestore dei plugin al componente BFStop: apri la <a href=\"%s\">vista Configurazione del componente</a> e controlla le tue impostazioni, in particolare la sezione «Proxy / Bilanciatore di carico» se il tuo sito si trova dietro un reverse proxy o un bilanciatore di carico."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_API_HINT="<strong>Brute Force Stop ora protegge anche gli accessi tramite la API dei servizi web di Joomla!</strong> (api/index.php, con token API o autenticazione HTTP Basic), e questo aggiornamento lo ha attivato: gli accessi falliti lì contano per il blocco e gli indirizzi bloccati vengono respinti anche dalla API. Se una tua integrazione usa la API da un indirizzo i cui accessi possono fallire, controlla l'impostazione 'Attivo per' nella <a href=\"%s\">vista Impostazioni del componente</a>."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop non è riuscito a riscrivere la sua sezione di blocco in <code>%s</code>. La sezione scritta dalle versioni precedenti permette a chiunque non sia bloccato di superare gli altri controlli di accesso di quella directory (protezione con password, restrizioni IP). Rendi il file scrivibile ed esegui di nuovo l'aggiornamento, oppure rimuovi a mano le righe tra '# BEGIN BFStop Blocks' e '# END BFStop Blocks'."
