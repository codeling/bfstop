; traducció feta per nouespai 29/08/2014

PLG_SYSTEM_BFSTOP="Sistema - Brute Force Stop"
PLG_SYSTEM_BFSTOP_DESC="<h2>Brute Force Stop</ h2><div><strong>La configuració s'ha traslladat:</strong> BFStop ara es configura al component, no aquí - vés a <a href=\"index.php?option=com_bfstop&view=settings\">Components &rarr; Brute Force Stop &rarr; Configuració</a>.</div><br><div> Aquest connector proporciona els mitjans per evitar els atacs per força bruta a la teva instal·lació Joomla!. Per això, el connector emmagatzema informació sobre els intents fallits de connexió, de manera que en arribar a un nombre configurable d'intents fallits d'inici de sessió l'adreça IP de l'atacant pot ser bloquejada. A més, pot configurar notificacions sobre intents fallits i les adreces IP bloquejades, així com un retard variable després d'un inici de sessió fallit.</div><br /><div><em>No oblidis de configurar i publicar el connector després de la instal·lació!</em><br />Si tens qualsevol pregunta sobre el connector, visita <a href='https://github.com/codeling/bfstop'>El lloc del projecte a github</a>. Si hi ha algun problema en utilitzar el connector, no dubtis a reportar al <a href='https://github.com/codeling/bfstop/issues'>Seguiment d'incidències.</a></div><br/><div>En algunes parts, aquest connector s'inspira en els següents plugins Login Failed Log, Redirect Failed Logins and Ban IP Address/Range. Moltes gràcies als autors d'aquests connectors!.<br /> Brute Force Stop és un connector <a target='_blank' href='http://www.joomla.org/'>Joomla!,</a> publicat sota la <a target='_blank' title='GNU General Public License' href='http://www.gnu.org/copyleft/gpl.html'>GNU General Public License.</a></div>"
PLG_SYSTEM_BFSTOP_BLOCK_ENABLED_LABEL="Activar bloqueig"
PLG_SYSTEM_BFSTOP_BLOCK_ENABLED_DESC="Si aquest connector ha de bloquejar les adreces IP. Quan està desactivat, no s'afegiran noves adreces IP a la llista d'adreces bloquejades, i ni tan sols les adreces IP que ja estan en aquesta llista seran bloquejades més (encara que la llista en si es mantindrà)."
PLG_SYSTEM_BFSTOP_USERID_LABEL="Selecciona un usuari"
PLG_SYSTEM_BFSTOP_USERID_DESC="Selecciona l'usuari que desitja tenir notificacions d'enviament."
PLG_SYSTEM_BFSTOP_USE_HTACCESS_LABEL="Utilitza .htaccess"
PLG_SYSTEM_BFSTOP_USE_HTACCESS_DESC="Utilitza el fitxer .htaccess del directori de Joomla! per bloquejar adreces IP. Pot ser més ràpid que bloquejar mitjançant Joomla!, però només funciona si PHP té permisos d'escriptura sobre el fitxer .htaccess. Activeu aquesta funció només si sabeu què feu i vigileu els registres del servidor."
PLG_SYSTEM_BFSTOP_HTACCESS_PATH_LABEL="Ruta de .htaccess"
PLG_SYSTEM_BFSTOP_HTACCESS_PATH_DESC="Ruta del fitxer .htaccess que s'utilitza per bloquejar (si el bloqueig mitjançant .htaccess està activat; vegeu l'opció «Utilitza .htaccess» als paràmetres principals del connector). Aquesta opció només ha de contenir la ruta, amb la barra final («.htaccess» s'afegirà automàticament). Si és buida, s'utilitza el directori arrel d'aquesta instal·lació de Joomla!, de manera que només cal indicar-hi alguna cosa en configuracions especials (per exemple, si Joomla està instal·lat en un subdirectori del servidor però voleu que bfstop bloquegi l'accés a tot el servidor)."
PLG_SYSTEM_BFSTOP_EMAIL_ADDRESS_LABEL="Adreça de correu electrònic"
PLG_SYSTEM_BFSTOP_EMAIL_ADDRESS_DESC="Introdueix l'adreça de correu electrònic on vols tenir notificacions d'enviament."
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_NUMBER_LABEL="Missatges d'inici de sessió fallits per dia"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_NUMBER_DESC="Amb quina freqüència es notificaran inicis de sessió fallits en un dia"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_ONLY_EXISTING_LABEL="Missatges d'error només per a comptes existents"
PLG_SYSTEM_BFSTOP_NOTIFY_FAILED_ONLY_EXISTING_DESC="Notifica un inici de sessió fallit només si el nom d'usuari (o l'adreça electrònica) introduït pertany a un compte existent. Els intents amb noms que no estan registrats en aquest lloc (normalment robots que proven noms d'usuari) continuen registrant-se i comptant per al bloqueig, però no generen cap notificació."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_NUMBER_LABEL="Missatges de bloqueig per dia"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_NUMBER_DESC="Amb quina freqüència es notificaran les IP bloquejades en un dia"
PLG_SYSTEM_BFSTOP_DELAY_DURATION_LABEL="Retard"
PLG_SYSTEM_BFSTOP_DELAY_DURATION_DESC="Retard (en segons) en un intent d'accés fallit"
PLG_SYSTEM_BFSTOP_LOGLEVEL_LABEL="Iniciant sessió"
PLG_SYSTEM_BFSTOP_LOGLEVEL_DESC="Determina si un informe sobre les activitats del connector ha de ser creat (això tan sols serà necessari en cas d'un problema, el fitxer de registre es pot trobar al directori de registres amb el nom plg_system_bfstop.log.php)"
PLG_SYSTEM_BFSTOP_BLOCK_NUMBER_LABEL="Límit abans de bloquejar"
PLG_SYSTEM_BFSTOP_BLOCK_NUMBER_DESC="Quantes vegades un usuari pot equivocar-se abans de que es bloquegi la IP"
PLG_SYSTEM_BFSTOP_BLOCKED_MESSAGE_LABEL="Missatge de bloqueig"
PLG_SYSTEM_BFSTOP_BLOCKED_MESSAGE_DESC="El missatge que voleu que aparegui a la finestra del navegador d'un usuari la direcció IP del qual ha estat bloquejada a causa de massa intents de connexió fallits. Si es deixa buida, es mostrarà aquest missatge per defecte: La seva adreça IP ha estat bloquejada a causa de haver massa intents fallits d'ingressar en molt poc temps."
PLG_SYSTEM_BFSTOP_BLOCK_DURATION_LABEL="Durada del bloqueig"
PLG_SYSTEM_BFSTOP_BLOCK_DURATION_DESC="Determina el temps que es bloqueja l'adreça IP abans de que se li permeti accedir al lloc de nou"
PLG_SYSTEM_BFSTOP_NOTIFY_REMAINING_ATTEMPTS_LABEL="Intents restants"
PLG_SYSTEM_BFSTOP_NOTIFY_REMAINING_ATTEMPTS_DESC="Activa o desactiva les notificacions sobre els intents restants. Si està habilitat, l'usuari, després de cada intent fallit d'inici de sessió, veurà un missatge en el formulari d'accés de quants intents d'inici de sessió encara estan disponibles abans que es bloquegi l'adreça IP. Aquest ajust només s'activa si s'ha habilitat el bloqueig (si el bloqueig està desactivat, les entrades 'restants' no tindrien sentit)."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_LABEL="Missatge a l'usuari bloquejat"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_DESC="Quan s'activa, en cas d'una adreça IP bloquejada, la notificació s'enviarà a l'usuari que va intentar connectar-se (només per descomptat, en cas que sigui un nom d'usuari existent)."
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_KNOWN="activat, només si l'usuari ja ha iniciat sessió des d'aquesta adreça IP (recomanat)"
PLG_SYSTEM_BFSTOP_NOTIFY_BLOCKED_USER_ANY="activat, per a qualsevol adreça IP (qualsevol persona pot fer que s'enviï un correu electrònic a un usuari)"
PLG_SYSTEM_BFSTOP_USE_HTTP_ERROR_LABEL="Utilitza error HTTP"
PLG_SYSTEM_BFSTOP_USE_HTTP_ERROR_DESC="Si està activat, bfstop enviarà un codi d'estat 403 (prohibit) si l'adreça IP dels usuaris està bloquejada"
PLG_SYSTEM_BFSTOP_ENABLED="Activat"
PLG_SYSTEM_BFSTOP_DISABLED="Desactivat"
PLG_SYSTEM_BFSTOP_NOTIFY_UNLIMITED="Il·limitat"
PLG_SYSTEM_BFSTOP_NOTIFY_NEVER="Mai"
PLG_SYSTEM_BFSTOP_BLOCK_UNLIMITED="Il·limitat"
PLG_SYSTEM_BFSTOP_BLOCK_5MINUTES="5 minuts"
PLG_SYSTEM_BFSTOP_BLOCK_10MINUTES="10 minuts"
PLG_SYSTEM_BFSTOP_BLOCK_15MINUTES="15 minuts"
PLG_SYSTEM_BFSTOP_BLOCK_30MINUTES="30 minuts"
PLG_SYSTEM_BFSTOP_BLOCK_1HOUR="1 hora"
PLG_SYSTEM_BFSTOP_BLOCK_2HOURS="2 hores"
PLG_SYSTEM_BFSTOP_BLOCK_4HOURS="4 hores"
PLG_SYSTEM_BFSTOP_BLOCK_8HOURS="8 hores"
PLG_SYSTEM_BFSTOP_BLOCK_24HOURS="1 dia"
PLG_SYSTEM_BFSTOP_BLOCK_1WEEK="1 setmana"
PLG_SYSTEM_BFSTOP_BLOCK_30DAYS="30 dies"
PLG_SYSTEM_BFSTOP_MAX_BLOCKS_BEFORE_LABEL="Permanent després de"
PLG_SYSTEM_BFSTOP_MAX_BLOCKS_BEFORE_DESC="Determina després de quants intents bloquejats s'establirà un bloqueig permanent. El bloquejos que van ser retirats (o sigui desbloquejats) per token també compten. Només aquells realitzats a través de la part administrativa seran ignorats."
PLG_SYSTEM_BFSTOP_MAX_BLOCK_NEVER="Mai"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_ORIGIN_LABEL="Activa per a"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_ORIGIN_DESC="Determina a quines parts del sistema de Joomla! han de ser actius. Si es posa que només sigui frontal o administració, no es considerarà l'altre part, per cap funcionalitat (per exemple, si està configurat només per l'administració, els intents fallits d'inici de sessió al frontal no es registraran i les connexions reeixides al frontal no reiniciaran el comptador d'inicis de sessió fallida). Si us plau, tingues en compte que un bloqueig sempre afecta tot el lloc, no importa el que s'introdueix aquí!."
PLG_SYSTEM_BFSTOP_ENABLED_FOR_FRONTEND="Només Frontal"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_BACKEND="Només Administració"
PLG_SYSTEM_BFSTOP_ENABLED_FOR_BOTH="Frontal i Administració"
PLG_SYSTEM_BFSTOP_FATAL="Error fatal"
PLG_SYSTEM_BFSTOP_WARNING="Advertència"
PLG_SYSTEM_BFSTOP_INFO="Misstage informatiu"
PLG_SYSTEM_BFSTOP_DEBUG="Informació detallada"
PLG_SYSTEM_BFSTOP_DELETE_OLD_ENTRIES_LABEL="Suprimeix les entrades antigues"
PLG_SYSTEM_BFSTOP_DELETE_OLD_ENTRIES_DESC="Elimina les entrades més antigues que el nombre de setmanes que figuren en aquest camp (estableix a 0 per desactivar la supressió de les entrades antigues)."
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_LABEL="Retard adaptatiu"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_DESC="Adapta el retard a la taxa actual de retards que han fallat. Augmentarà el retard cada vegada que hi ha un major nombre d'inicis de sessió com una contramesura per als atacs distribuïts."
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_MAX_LABEL="Retard màxim"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_MAX_DESC="El termini màxim per a la resposta als intents de connexió fallits quan el retard adaptatiu s'activa"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MIN_LABEL="Nivell mínim"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MIN_DESC="El nivell en què el retard adaptatiu comença a fer efecte (mesurat en nombre d'inicis de sessió fallits en la darrera hora)"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MAX_LABEL="Nivell màxim"
PLG_SYSTEM_BFSTOP_ADAPTIVE_DELAY_THRSH_MAX_DESC="El nivell en què el retard adaptatiu arriba al retard màxim (mesurat en nombre d'inicis de sessió fallits en la darrera hora)"
PLG_SYSTEM_BFSTOP_DELAY_FIELDSET_LABEL="Retard"
PLG_SYSTEM_BFSTOP_NOTIFICATION_FIELDSET_LABEL="Notificació"
PLG_SYSTEM_BFSTOP_PROXY_FIELDSET_LABEL="Proxy / Balancejador de càrrega"
PLG_SYSTEM_BFSTOP_USE_PROXY_LABEL="Darrere d'un proxy / balancejador de càrrega"
PLG_SYSTEM_BFSTOP_USE_PROXY_DESC="Activeu-ho només si el vostre lloc és darrere d'un proxy invers o d'un balancejador de càrrega, de manera que el navegador del visitant mai no es connecta directament a Joomla!. Quan està activat, bfstop llegeix l'adreça IP del visitant de la capçalera seleccionada més avall, en lloc de la connexió TCP directa, però només per a les sol·licituds que realment provenen de l'adreça IP del proxy configurada més avall. Deixeu-ho desactivat si no teniu una configuració d'aquest tipus: qualsevol visitant pot falsificar aquesta capçalera, de manera que confiar-hi sense una IP de proxy verificada permetria a un atacant fer bloquejar una adreça IP arbitrària en lloc de la seva."
PLG_SYSTEM_BFSTOP_PROXY_HEADER_SOURCE_LABEL="Capçalera de la IP del client"
PLG_SYSTEM_BFSTOP_PROXY_HEADER_SOURCE_DESC="La capçalera HTTP que el vostre proxy o balancejador de càrrega utilitza per comunicar l'adreça IP original del client. Consulteu la documentació del vostre proxy si teniu dubtes: X-Forwarded-For és l'opció més habitual. L'adreça del client es pren del final de la capçalera, és a dir, l'entrada afegida pel vostre propi proxy; les entrades més a l'esquerra les proporciona el client i s'ignoren. Trieu una capçalera que el vostre proxy estableixi o a la qual afegeixi valors ell mateix."
PLG_SYSTEM_BFSTOP_PROXY_IP_LABEL="Adreça IP del proxy / balancejador de càrrega"
PLG_SYSTEM_BFSTOP_PROXY_IP_DESC="L'adreça IP del vostre proxy invers o balancejador de càrrega, és a dir, l'adreça que Joomla! veu com a REMOTE_ADDR en cada sol·licitud legítima. Si hi ha diversos proxies en cadena (per exemple, una CDN davant d'un balancejador de càrrega), enumereu-los tots separats per comes; també s'admeten subxarxes en notació CIDR (per exemple, 10.0.0.0/8). La capçalera d'IP del client indicada més amunt només es considera fiable per a les sol·licituds que provenen d'una d'aquestes adreces, de manera que un visitant no pugui eludir el proxy i falsificar la capçalera directament. Obligatori si «Darrere d'un proxy / balancejador de càrrega» està activat més amunt."
PLG_SYSTEM_BFSTOP_GROUP_NOTIFICATION_ENABLED_LABEL="Grup d'usuaris per a la notificació"
PLG_SYSTEM_BFSTOP_GROUP_NOTIFICATION_ENABLED_DESC="Si està activat, el grup d'usuaris seleccionats a continuació seran notificats en cas d'inicis de sessió fallits o IP prohibides"
PLG_SYSTEM_BFSTOP_USERGROUP_LABEL="Grup d'usuaris"
PLG_SYSTEM_BFSTOP_USERGROUP_DESC="Tria un grup d'usuaris per a notificar-los sobre els inicis de sessió fallits i IP prohibides (si està activat anteriorment). Probablement hauràs de crear un grup dedicat per això, o usar un grup amb administradors experimentats, com el grup per defecte 'Superusuaris'."
PLG_SYSTEM_BFSTOP_NOTIFY_USE_PASSWORD_REMINDER_LABEL="Recordatori per al restabliment de la clau "
PLG_SYSTEM_BFSTOP_NOTIFY_USE_PASSWORD_REMINDER_DESC="Si s'ha de mostrar, i quan, un recordatori sobre l'ús de la funcionalitat de recuperació de la contrasenya en un inici de sessió fallit"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_ALWAYS="Sempre"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_1LEFT="Quan resti 1 intent"
PLG_SYSTEM_BFSTOP_REMINDER_NOTIFY_2LEFT="Quan restin 2 intents"
PLG_SYSTEM_BFSTOP_BLOCKED_MSG_SHOWIP_LABEL="Mostra IP"
PLG_SYSTEM_BFSTOP_BLOCKED_MSG_SHOWIP_DESC="Un cop bloquejat, mostrar a l'usuari la seva adreça IP (segons la percepció del servidor)"
PLG_SYSTEM_BFSTOP_CHECK_INTERVAL_LABEL="Interval de comprovació"
PLG_SYSTEM_BFSTOP_CHECK_INTERVAL_DESC="Interval durant el qual es tenen en compte els intents fallits de la mateixa adreça IP per al bloqueig."
PLG_SYSTEM_BFSTOP_SETTINGS_MOVED_LABEL="La configuració s'ha traslladat"
PLG_SYSTEM_BFSTOP_SETTINGS_MOVED_DESC="Tots els paràmetres de BFStop ara es configuren al component en lloc d'aquí. Vés a <a href=\"index.php?option=com_bfstop&view=settings\">Components &rarr; Brute Force Stop &rarr; Configuració</a> per configurar BFStop."
