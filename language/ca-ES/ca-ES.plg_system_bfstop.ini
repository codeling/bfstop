PLG_SYSTEM_BFSTOP_ERROR="Error"
PLG_SYSTEM_BFSTOP_DATETIME="Dia i hora"
PLG_SYSTEM_BFSTOP_ORIGIN="Origen"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="S'ha bloquejat l'adreça IP %1$s perquè hi havia massa intents fallits d'inici de sessió en poc temps a %2$s. Aquests són tots els intents des d'aquesta adreça que s'han registrat:\n\n%3$s\n\nAvís: Aquesta llista pot contenir més entrades que les que han causat el bloqueig actual. Pot contenir intents anteriors que ja van causar un bloqueig temporal aleshores, o intents que estaven massa separats en el temps per causar un bloqueig directe."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Adreça IP bloquejada %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="La teva adreça IP ha estat bloquejada perquè hi havia massa intents fallits d'ingressar en molt poc temps."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="Et resten %d intent(s) d'ingressar abans que la teva adreça IP sigui bloquejada. Si no recordes el nom o contrasenya, pots demanar al sistema que te la torni a enviar"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Intents fallits d'inici de sessió"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Hola,\n\nAlgú ha intentat iniciar sessió amb el teu nom d'usuari al lloc web '%s', però ha utilitzat una contrasenya incorrecta.\nAixò ha passat tantes vegades que s'ha bloquejat l'accés des de l'adreça Ip des d'on aquests intents de connexió es van originar per evitar abusos.\n\nEn cas que no siguis tu qui hagis fet aquests intents de connexió, si us plau, ignora aquest missatge. Hauríes de ser capaç d'iniciar sessió com de costum. \nHauries de ser responsable d'aquests intents de connexió, i o bé saber de nou la contrasenya (o utilitzar la funció de 'Restablir contrasenya'). Ara tens l'oportunitat de desbloquejar l'adreça Ip, clicant aquest enllaç:\n%s\n\nAfectuosament, el gestor automàtica del lloc web!\n\nNota: Aquest és un missatge generat automàticament."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="S'ha detectat que un o més dels vostres intents d'inici de sessió han fallat recentment. Si ho torneu a intentar, aviat sereu bloquejat. Per això us recomanem que feu servir la <a href='%1$s'>funció per restablir la contrasenya</a>!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="La vostra adreça IP és: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_HINT="<strong>Aquesta actualització a la versió 2.0.0 comporta canvis importants de configuració.</strong> La configuració ha passat del Gestor de connectors al component BFStop: aneu a la <a href=\"%s\">vista de Configuració del component</a> i reviseu els vostres paràmetres, en particular la secció «Proxy / Balancejador de càrrega» si el vostre lloc es troba darrere d'un proxy invers o d'un balancejador de càrrega."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_API_HINT="<strong>Brute Force Stop ara també protegeix els inicis de sessió a través de l'API de serveis web de Joomla!</strong> (api/index.php, amb testimonis d'API o autenticació HTTP Basic), i aquesta actualització ho ha activat: els inicis de sessió fallits hi compten per al bloqueig i les adreces bloquejades també són rebutjades per l'API. Si alguna de les teves integracions fa servir l'API des d'una adreça els inicis de sessió de la qual poden fallar, revisa l'opció 'Activa per a' a la <a href=\"%s\">vista de configuració del component</a>."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop no ha pogut reescriure la seva secció de bloquejos a <code>%s</code>. La secció escrita per versions anteriors permet a qualsevol que no estigui bloquejat saltar-se els altres controls d'accés d'aquest directori (protecció amb contrasenya, restriccions d'IP). Feu que el fitxer es pugui escriure i torneu a executar l'actualització, o elimineu a mà les línies entre '# BEGIN BFStop Blocks' i '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(adreça del lloc no configurada)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="Ara mateix no és possible iniciar la sessió. Torneu-ho a provar d'aquí a uns minuts."
