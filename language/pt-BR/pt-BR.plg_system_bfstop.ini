PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="O endereço IP %1$s foi bloqueado porque houve muitas tentativas de login sem sucesso em um curto espaço de tempo em %2$s. Estas são todas as tentativas desse endereço que foram registradas:\n\n%3$s\n\nAviso: esta lista pode conter mais entradas do que as que causaram o bloqueio atual. Ela pode conter tentativas antigas que já causaram um bloqueio temporário na época, ou tentativas muito espaçadas no tempo para causar um bloqueio direto."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Bloqueado o endereço IP %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Seu endereço IP foi bloqueado porque houve muitas tentativas de login sem sucesso em um curto espaço de tempo."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="Tem mais %d tentativas(s) antes do seu endereço IP ser bloqueado"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Tentativas de login com falha"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Olá!\n\nAlguém tentou fazer login com o seu nome de usuário no site '%s', mas usou uma senha errada.\nIsso aconteceu tantas vezes que o sistema bloqueou o acesso a partir do endereço IP de onde essas tentativas de login se originaram, para evitar o uso indevido.\n\nSe não foi você quem fez essas tentativas de login, ignore esta mensagem. Você deve conseguir fazer login normalmente.\nSe foi você o responsável por essas tentativas e agora se lembra da senha ou quer usar a função 'Redefinir senha', você pode desbloquear o endereço IP clicando neste link:\n%s\n\nAtenciosamente, o gerenciamento automático do site\n\nObservação: esta é uma mensagem gerada automaticamente."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="Notamos que uma ou mais de suas tentativas de login falharam recentemente. Se tentar novamente, você logo será bloqueado. Por isso, recomendamos que use a <a href='%1$s'>função de redefinição de senha</a>!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Seu endereço IP é: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_HINT="<strong>Esta atualização para a versão 2.0.0 traz grandes mudanças na configuração.</strong> A configuração saiu do Gerenciador de plugins e foi para o componente BFStop - acesse a <a href=\"%s\">visualização Configurações do componente</a> e revise suas configurações, em especial a seção 'Proxy / Balanceador de carga' se o seu site estiver atrás de um proxy reverso ou de um balanceador de carga."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_API_HINT="<strong>O Brute Force Stop agora também protege os logins pela API de serviços web do Joomla!</strong> (api/index.php, com tokens de API ou autenticação HTTP Basic), e esta atualização ativou isso: logins com falha ali contam para o bloqueio, e endereços bloqueados também são recusados pela API. Se alguma integração sua usa a API a partir de um endereço cujos logins podem falhar, verifique a configuração 'Ativo para' na <a href=\"%s\">tela de configurações do componente</a>."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="O Brute Force Stop não conseguiu reescrever sua seção de bloqueios em <code>%s</code>. A seção escrita por versões anteriores deixa qualquer pessoa que não esteja bloqueada passar pelos outros controles de acesso desse diretório (proteção por senha, restrições de IP). Torne o arquivo gravável e execute a atualização novamente, ou remova manualmente as linhas entre '# BEGIN BFStop Blocks' e '# END BFStop Blocks'."
