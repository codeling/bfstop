PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="Blocked IP Address %1$s because there were too many unsuccessful login attempts in a short time on %2$s. These are all the attempts from that address that were recorded:\n\n%3$s\n\nNotice: This list may hold more entries than the ones causing the current block. The list may contain attempts in the past which already caused a temporary block then, or attempts which were too far apart to cause a direct block."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Blocked IP Address %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Your IP address has been blocked because there were too many unsuccessful login attempts in a short time."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="You have %d attempt(s) left before your IP address will be blocked"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Failed login attempts"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Hi!\n\nSomebody tried to log in with your username at the website '%s', but has used a wrong password.\nThis has happened so many times that the system has blocked access from the IP Address where these login attempts originated to prevent misuse.\n\nIn case it wasn't you doing these login attempts, please ignore this message. You should be able to login just as usual.\nShould you be responsible for these login attempts, and you now either know the password again or you want to use the 'Reset password' functionality, you have the chance to unblock the IP address by clicking on this link:\n%s\n\nBest regards, the automatic website management\n\nNote: This is an automatically generated message."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="It was noticed that one or more of your login attempts have recently failed. When trying again, you will soon be blocked. It is therefore recommended that you use the <a href='%1$s'>functionality to reset your password</a>!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Your IP address is: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_HINT="<strong>This update to version 2.0.0 comes with major configuration changes.</strong> Configuration has moved out of the Plugin Manager into the BFStop component - please go to the <a href=\"%s\">component's Settings view</a> and review your settings - in particular the 'Proxy / Load Balancer' section if your site sits behind a reverse proxy or load balancer."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_API_HINT="<strong>Brute Force Stop now also protects logins through Joomla's Web Services API</strong> (api/index.php, with API tokens or HTTP Basic authentication), and this update has switched that on: failed logins there count towards blocking, and blocked addresses are rejected by the API too. If an integration of yours uses the API from an address whose logins may fail, check the 'Active for' setting in the <a href=\"%s\">component's Settings view</a>."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop could not rewrite its block section in <code>%s</code>. The section written by earlier versions lets everybody who isn't blocked past the other access controls of that directory (password protection, IP restrictions). Make the file writable and run the update again, or remove the lines between '# BEGIN BFStop Blocks' and '# END BFStop Blocks' by hand."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(site address not configured)"
