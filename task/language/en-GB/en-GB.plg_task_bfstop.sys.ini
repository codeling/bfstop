PLG_TASK_BFSTOP="Task - Brute Force Stop"
PLG_TASK_BFSTOP_XML_DESCRIPTION="Runs the daily maintenance of Brute Force Stop as a scheduled task: purges old failed logins, blocks and unblock links, keeps its tables below their upper bounds, takes expired blocks out of the .htaccess file and removes old log files. Without it, a visitor's request does this once the maintenance did not run for two days."
