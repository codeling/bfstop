PLG_SYSTEM_BFSTOP_DATETIME="Datum en tijd"
PLG_SYSTEM_BFSTOP_ORIGIN="Oorsprong"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="%2$s: IP-adres %1$s geblokkeerd omdat er te veel mislukte inlogpogingen in een korte tijd zijn geweest. Dit zijn de inlogpogingen vanaf dit adres die tot de blokkade hebben geleid:\n\n%3$s\n\nPogingen die al tot een eerdere blokkade hebben geleid, worden niet vermeld."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Geblokkeerd IP adres %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Uw IP-adres is geblokkeerd omdat er te veel mislukte inlogpogingen in een korte tijd geweest zijn."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="U heeft %d poging(en) over voordat uw IP adres geblokkeerd wordt."
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Mislukte login pogingen"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Hallo!\n\nIemand probeert aan te melden op website '%s' met uw gebruikersnaam, maar daarbij is een onjuist wachtwoord gebruikt.\nDit is zo vaak gebeurd dat het systeem de toegang heeft geblokkeerd voor het IP-adres waar vandaan deze loginpogingen gedaan zijn. Deze blokkade is om verder misbruik te voorkomen.\n\nIndien u niet zelf deze loginpogingen deed, kunt u dit bericht negeren. U kunt nog altijd inloggen zoals gebruikelijk want dan is uw IP adres niet geblokkeerd.\nWaren het wel uw login pogingen en u weet nu ofwel alsnog het goede wachtwoord of u wilt de 'Reset wachtwoord' functie gebruiken, dan heeft u de mogelijkheid de blokkering van uw IP-adres op te heffen door op deze link te klikken:\n%s\n\nMet vriendelijke groet, de automatische websitebeheerder.\n\nAttentie: Dit is een automatisch gegenereerd bericht."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="Een of meer van je inlogpogingen zijn onlangs mislukt. Als je het opnieuw probeert, word je binnenkort geblokkeerd. Je wordt daarom aangeraden de <a href='%1$s'>functie om je wachtwoord opnieuw in te stellen</a> te gebruiken!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Uw IP-adres is: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_DELAYS_REMOVED="<strong>Brute Force Stop vertraagt het antwoord op mislukte aanmeldingen niet meer.</strong> Uw vorige instellingen vertraagden het ('Vertraging' of 'Zelflerende vertraging'); deze instellingen zijn verwijderd. Een vertraagd antwoord houdt een PHP-worker van de server bezig zolang de vertraging duurt, waarmee aanvallers die veel aanmeldingen tegelijk sturen de site onbereikbaar kunnen maken, terwijl het hen nauwelijks afremt. Mislukte aanmeldingen worden nog steeds geteld en geblokkeerd zoals voorheen. Gebruik om clients af te remmen de snelheidsbeperking van uw webserver of van een proxy ervoor (bijv. limit_req van nginx, mod_evasive van Apache of fail2ban)."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop kon zijn blokkeersectie in <code>%s</code> niet herschrijven. De sectie die eerdere versies schreven laat iedereen die niet geblokkeerd is langs de andere toegangscontroles van die map (wachtwoordbeveiliging, IP-beperkingen). Maak het bestand schrijfbaar en voer de update opnieuw uit, of verwijder de regels tussen '# BEGIN BFStop Blocks' en '# END BFStop Blocks' met de hand."
PLG_SYSTEM_BFSTOP_UPDATE_MIGRATION_FAILED="Brute Force Stop kon zijn instellingen en gegevens bij de update niet overzetten (%s). Tot dit is opgelost werkt de plugin met zijn standaardinstellingen: controleer de <a href=\"%s\">instellingen</a> en voer de update opnieuw uit."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(adres van de site niet ingesteld)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="Inloggen is op dit moment niet mogelijk. Probeer het over een paar minuten opnieuw."
PLG_SYSTEM_BFSTOP_UNINSTALL_HTACCESS_NOT_REMOVED="Brute Force Stop kon zijn blokkadesectie niet uit <code>%s</code> verwijderen: de webserver blijft de adressen erin weigeren. Maak het bestand schrijfbaar en verwijder de regels tussen '# BEGIN BFStop Blocks' en '# END BFStop Blocks' met de hand."
PLG_SYSTEM_BFSTOP_SETUP_INSTALLED="<strong>Brute Force Stop is geïnstalleerd, maar nog niet actief.</strong> Doorloop de <a href=\"%s\">installatie-assistent</a> om het te activeren: die controleert hoe bezoekers je site bereiken (direct, of via een proxy, load balancer of CDN) en of de blokkeermodus bij je webserver past."
PLG_SYSTEM_BFSTOP_SETUP_UPDATED="<strong>Actie vereist: open de <a href=\"%s\">installatie-assistent</a>.</strong> Die laat zien wat deze update van Brute Force Stop veranderd heeft, en loopt de instellingen langs die jouw beslissing nodig hebben: hoe bezoekers je site bereiken (direct, of via een proxy, load balancer of CDN) en de blokkeermodus."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_PROXY="<strong>Brute Force Stop is uitgeschakeld:</strong> je site lijkt achter een proxy, load balancer of CDN te staan, en BFStop zou het adres van de proxy blokkeren, dus iedereen. Het blijft uitgeschakeld tot de <a href=\"%s\">installatie-assistent</a> afgerond is."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_LOADBALANCER="<strong>Brute Force Stop is uitgeschakeld:</strong> de Joomla-instelling 'Achter load balancer' staat aan, dus je site lijkt achter een proxy of load balancer te staan, en BFStop zou het adres van de proxy blokkeren, dus iedereen. Het blijft uitgeschakeld tot de <a href=\"%s\">installatie-assistent</a> afgerond is."
PLG_SYSTEM_BFSTOP_SETUP_CONSOLE="In de backend: Componenten - Brute Force Stop - Installatie-assistent. Op de opdrachtregel: 'php cli/joomla.php bfstop:status' toont de stand, 'php cli/joomla.php bfstop:setup --no-proxy' (of --trusted=<proxy's> --header=<header>) rondt de installatie af en activeert de bescherming."
PLG_SYSTEM_BFSTOP_BLOCKED_PROXY_WARNING="Waarschuwing: Brute Force Stop heeft zojuist %1$s geblokkeerd, wat een proxy, load balancer of CDN kan zijn (het verzoek kwam van een privéadres met een doorstuurheader, of er hebben meerdere accounts vanaf dit adres ingelogd). Is dat zo, dan is iedereen erachter geblokkeerd, misschien ook jij. Om de blokkade op te heffen gebruik je de lijst met geblokkeerde adressen in de backend (Componenten - Brute Force Stop - Geblokkeerde IP's), of voer je op de server uit: %2$s\nVoer daarna de proxycontrole van de installatie-assistent uit (Componenten - Brute Force Stop - Installatie-assistent), zodat BFStop mislukte logins telt voor de adressen van de bezoekers en niet voor dat van de proxy."
