PLG_SYSTEM_BFSTOP_FAILED_LOGIN_ATTEMPT="%s: Tentativo di accesso fallito su %s"
PLG_SYSTEM_BFSTOP_USERNAME="Nome utente"
PLG_SYSTEM_BFSTOP_IPADDRESS="Indirizzo-IP"
PLG_SYSTEM_BFSTOP_ERROR="Errore"
PLG_SYSTEM_BFSTOP_DATETIME="Data e ora"
PLG_SYSTEM_BFSTOP_ORIGIN="Origine"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="Indirizzo IP Bloccato %1$s perché ci sono stati troppi tentativi di accesso non riusciti in breve tempo su %2$s. Questi sono i tentativi da quell'indirizzo che hanno causato il blocco:\n\n%3$s\n\nI tentativi che hanno già causato un blocco precedente non sono elencati."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Indirizzo IP Bloccato %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Il tuo indirizzo IP è stato bloccato perché ci sono stati troppi tentativi di accesso non riusciti in breve tempo."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="Hai ancora %d tentativo(i) prima che il tuo indirizzo IP venga bloccato"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Tentativo di accesso fallito"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Ciao!\n\nQualcuno tenta di accedere con il tuo nome utente al sito web '%s', ma ha usato una password sbagliata.\n Questo è accaduto così tante volte che il sistema, per prevenire abusi, ha bloccato l'accesso all'indirizzo IP da cui i tentativi avevano origine.\n\nNel caso non fossi tu a fare questi tentativi di accesso, ignora questo messaggio. Dovresti essere in grado di effettuare il login come al solito.\nSe sei tu il responsabile di questi tentativi di accesso, e ora ti ricordi la password, o se vuoi usare la funzione 'Reset della Password' hai la possibilità di sbloccare l'indirizzo IP cliccando su questo link:\n%s\n\nCordiali saluti, il gestore automatico del sito\n\nNota: Questo è un messaggio generato automaticamente."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="È stato rilevato che uno o più dei tuoi ultimi tentativi di accesso sono falliti. Se riprovi, verrai presto bloccato. Ti consigliamo quindi di usare la <a href='%1$s'>funzione di reimpostazione della password</a>!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Il tuo indirizzo IP è: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_DELAYS_REMOVED="<strong>Brute Force Stop non ritarda più la risposta agli accessi falliti.</strong> Le impostazioni precedenti la ritardavano («Ritardo» o «Ritardo adattivo»); queste impostazioni sono state rimosse. Una risposta ritardata tiene occupato un processo PHP del server per tutto il ritardo, cosa che gli aggressori che inviano molti accessi in parallelo possono sfruttare per rendere il sito irraggiungibile, mentre li rallenta appena. Gli accessi falliti vengono ancora contati e bloccati come prima. Per rallentare i client, usa la limitazione di frequenza del server web o di un proxy davanti a esso (ad es. limit_req di nginx, mod_evasive di Apache o fail2ban)."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop non è riuscito a riscrivere la sua sezione di blocco in <code>%s</code>. La sezione scritta dalle versioni precedenti permette a chiunque non sia bloccato di superare gli altri controlli di accesso di quella directory (protezione con password, restrizioni IP). Rendi il file scrivibile ed esegui di nuovo l'aggiornamento, oppure rimuovi a mano le righe tra '# BEGIN BFStop Blocks' e '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_UPDATE_MIGRATION_FAILED="Brute Force Stop non è riuscito a migrare le sue impostazioni e i suoi dati durante l'aggiornamento (%s). Finché non viene risolto, il plugin funziona con le impostazioni predefinite: controlla le <a href=\"%s\">impostazioni</a> ed esegui di nuovo l'aggiornamento."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(indirizzo del sito non configurato)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="Al momento non è possibile accedere. Riprova tra qualche minuto."
PLG_SYSTEM_BFSTOP_UNINSTALL_HTACCESS_NOT_REMOVED="Brute Force Stop non è riuscito a togliere la sua sezione dei blocchi da <code>%s</code>: il server web continua a rifiutare gli indirizzi che contiene. Rendi il file scrivibile e togli a mano le righe tra '# BEGIN BFStop Blocks' e '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_SETUP_INSTALLED="<strong>Brute Force Stop è installato ma non ancora attivo.</strong> Esegui la <a href=\"%s\">procedura guidata di configurazione</a> per attivarlo: controlla come i visitatori raggiungono il sito (direttamente, oppure tramite un proxy, un bilanciatore di carico o una CDN) e se la modalità di blocco è adatta al tuo server web."
PLG_SYSTEM_BFSTOP_SETUP_UPDATED="<strong>Azione richiesta: apri la <a href=\"%s\">procedura guidata di configurazione</a>.</strong> Mostra cosa ha cambiato questo aggiornamento di Brute Force Stop e passa in rassegna le impostazioni che richiedono una tua decisione: come i visitatori raggiungono il sito (direttamente, oppure tramite un proxy, un bilanciatore di carico o una CDN) e la modalità di blocco."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_PROXY="<strong>Brute Force Stop è stato disattivato:</strong> il sito sembra trovarsi dietro un proxy, un bilanciatore di carico o una CDN, e BFStop bloccherebbe l'indirizzo del proxy, cioè tutti. Resta disattivato finché la <a href=\"%s\">procedura guidata di configurazione</a> non è stata completata."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_LOADBALANCER="<strong>Brute Force Stop è stato disattivato:</strong> l'impostazione «Dietro un bilanciatore di carico» di Joomla è attiva, quindi il sito sembra trovarsi dietro un proxy o un bilanciatore di carico, e BFStop bloccherebbe l'indirizzo del proxy, cioè tutti. Resta disattivato finché la <a href=\"%s\">procedura guidata di configurazione</a> non è stata completata."
PLG_SYSTEM_BFSTOP_SETUP_CONSOLE="Nel backend: Componenti - Brute Force Stop - Procedura guidata di configurazione. Da riga di comando: 'php cli/joomla.php bfstop:status' mostra lo stato, 'php cli/joomla.php bfstop:setup --no-proxy' (oppure --trusted=<proxy> --header=<intestazione>) completa la configurazione e attiva la protezione."
PLG_SYSTEM_BFSTOP_BLOCKED_PROXY_WARNING="Attenzione: Brute Force Stop ha appena bloccato %1$s, che potrebbe essere un proxy, un bilanciatore di carico o una CDN (la richiesta proveniva da un indirizzo privato con un'intestazione di inoltro, oppure da questo indirizzo hanno effettuato l'accesso più account). In tal caso tutti quelli che si trovano dietro sono bloccati, forse anche tu. Per rimuovere il blocco usa l'elenco degli indirizzi bloccati nel backend (Componenti - Brute Force Stop - IP bloccati), oppure esegui sul server: %2$s\nPoi esegui il controllo del proxy della procedura guidata di configurazione (Componenti - Brute Force Stop - Procedura guidata di configurazione), così che BFStop conti gli accessi falliti sugli indirizzi dei visitatori e non su quello del proxy."
