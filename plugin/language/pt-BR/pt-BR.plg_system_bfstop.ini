PLG_SYSTEM_BFSTOP_FAILED_LOGIN_ATTEMPT="%s: Falha na tentativa de login em %s"
PLG_SYSTEM_BFSTOP_USERNAME="Nome"
PLG_SYSTEM_BFSTOP_IPADDRESS="Endereço IP"
PLG_SYSTEM_BFSTOP_ERROR="Erro"
PLG_SYSTEM_BFSTOP_DATETIME="Data e hora"
PLG_SYSTEM_BFSTOP_ORIGIN="Origem"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="O endereço IP %1$s foi bloqueado porque houve muitas tentativas de login sem sucesso em um curto espaço de tempo em %2$s. Estas são as tentativas desse endereço que levaram ao bloqueio:\n\n%3$s\n\nTentativas que já levaram a um bloqueio anterior não são listadas."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Bloqueado o endereço IP %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Seu endereço IP foi bloqueado porque houve muitas tentativas de login sem sucesso em um curto espaço de tempo."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="Tem mais %d tentativas(s) antes do seu endereço IP ser bloqueado"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Tentativas de login com falha"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Olá!\n\nAlguém tentou fazer login com o seu nome de usuário no site '%s', mas usou uma senha errada.\nIsso aconteceu tantas vezes que o sistema bloqueou o acesso a partir do endereço IP de onde essas tentativas de login se originaram, para evitar o uso indevido.\n\nSe não foi você quem fez essas tentativas de login, ignore esta mensagem. Você deve conseguir fazer login normalmente.\nSe foi você o responsável por essas tentativas e agora se lembra da senha ou quer usar a função 'Redefinir senha', você pode desbloquear o endereço IP clicando neste link:\n%s\n\nAtenciosamente, o gerenciamento automático do site\n\nObservação: esta é uma mensagem gerada automaticamente."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="Notamos que uma ou mais de suas tentativas de login falharam recentemente. Se tentar novamente, você logo será bloqueado. Por isso, recomendamos que use a <a href='%1$s'>função de redefinição de senha</a>!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Seu endereço IP é: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_DELAYS_REMOVED="<strong>O Brute Force Stop não atrasa mais a resposta a logins com falha.</strong> As suas configurações anteriores a atrasavam ('Adiamento' ou 'Atraso adaptativo'); essas configurações foram removidas. Uma resposta atrasada mantém um processo PHP do servidor ocupado durante todo o atraso, o que atacantes que enviam muitos logins em paralelo podem usar para deixar o site indisponível, enquanto isso quase não os atrasa. Os logins com falha continuam sendo contados e bloqueados como antes. Para frear clientes, use a limitação de taxa do seu servidor web ou de um proxy à frente dele (por ex. limit_req do nginx, mod_evasive do Apache ou fail2ban)."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="O Brute Force Stop não conseguiu reescrever sua seção de bloqueios em <code>%s</code>. A seção escrita por versões anteriores deixa qualquer pessoa que não esteja bloqueada passar pelos outros controles de acesso desse diretório (proteção por senha, restrições de IP). Torne o arquivo gravável e execute a atualização novamente, ou remova manualmente as linhas entre '# BEGIN BFStop Blocks' e '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_UPDATE_MIGRATION_FAILED="O Brute Force Stop não conseguiu migrar suas configurações e dados durante a atualização (%s). Até que isso seja corrigido, o plugin funciona com as configurações padrão: verifique as <a href=\"%s\">configurações</a> e execute a atualização novamente."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(endereço do site não configurado)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="Não é possível fazer login agora. Tente novamente em alguns minutos."
PLG_SYSTEM_BFSTOP_UNINSTALL_HTACCESS_NOT_REMOVED="O Brute Force Stop não conseguiu remover sua seção de bloqueios de <code>%s</code>: o servidor web continua recusando os endereços nela. Torne o arquivo gravável e remova manualmente as linhas entre '# BEGIN BFStop Blocks' e '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_SETUP_INSTALLED="<strong>O Brute Force Stop está instalado, mas ainda não está ativo.</strong> Execute o <a href=\"%s\">assistente de configuração</a> para ativá-lo: ele verifica como os visitantes chegam ao seu site (diretamente, ou por meio de um proxy, balanceador de carga ou CDN) e se o modo de bloqueio é adequado ao seu servidor web."
PLG_SYSTEM_BFSTOP_SETUP_UPDATED="<strong>Ação necessária: abra o <a href=\"%s\">assistente de configuração</a>.</strong> Ele mostra o que esta atualização do Brute Force Stop mudou e percorre as configurações que precisam da sua decisão: como os visitantes chegam ao seu site (diretamente, ou por meio de um proxy, balanceador de carga ou CDN) e o modo de bloqueio."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_PROXY="<strong>O Brute Force Stop foi desativado:</strong> seu site parece estar atrás de um proxy, balanceador de carga ou CDN, e o BFStop bloquearia o endereço do proxy, ou seja, todo mundo. Ele permanece desativado até que o <a href=\"%s\">assistente de configuração</a> seja concluído."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_LOADBALANCER="<strong>O Brute Force Stop foi desativado:</strong> a configuração 'Atrás de balanceador de carga' do Joomla está ativada, então seu site parece estar atrás de um proxy ou balanceador de carga, e o BFStop bloquearia o endereço do proxy, ou seja, todo mundo. Ele permanece desativado até que o <a href=\"%s\">assistente de configuração</a> seja concluído."
PLG_SYSTEM_BFSTOP_SETUP_CONSOLE="No painel de administração: Componentes - Brute Force Stop - Assistente de configuração. Na linha de comando: 'php cli/joomla.php bfstop:status' mostra o estado, 'php cli/joomla.php bfstop:setup --no-proxy' (ou --trusted=<proxies> --header=<cabeçalho>) conclui a configuração e ativa a proteção."
PLG_SYSTEM_BFSTOP_BLOCKED_PROXY_WARNING="Atenção: o Brute Force Stop acabou de bloquear %1$s, que pode ser um proxy, um balanceador de carga ou uma CDN (a requisição veio de um endereço privado com um cabeçalho de encaminhamento, ou várias contas fizeram login a partir deste endereço). Nesse caso, todos que estão atrás dele estão bloqueados, possivelmente você também. Para remover o bloqueio, use a lista de endereços bloqueados no painel de administração (Componentes - Brute Force Stop - IPs bloqueados), ou execute no servidor: %2$s\nDepois execute a verificação de proxy do assistente de configuração (Componentes - Brute Force Stop - Assistente de configuração), para que o BFStop conte as falhas de login nos endereços dos visitantes e não no do proxy."
