PLG_SYSTEM_BFSTOP_FAILED_LOGIN_ATTEMPT="%s: Неудачная попытка входа на %s"
PLG_SYSTEM_BFSTOP_USERNAME="Имя пользователя"
PLG_SYSTEM_BFSTOP_IPADDRESS="IP-адрес"
PLG_SYSTEM_BFSTOP_ERROR="Ошибка"
PLG_SYSTEM_BFSTOP_DATETIME="Дата и время"
PLG_SYSTEM_BFSTOP_ORIGIN="Источник"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="IP-адрес %1$s заблокирован, так как с него было слишком много неудачных попыток входа за короткое время на сайте %2$s. Вот попытки с этого адреса, которые привели к блокировке:\n\n%3$s\n\nПопытки, которые уже привели к более ранней блокировке, не указаны."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: IP адрес %s заблокирован"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Ваш IP адрес будет заблокирован, потому что было слишком много неудачных попыток входа в течение короткого времени."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="У Вас осталось %d попытки(а) до того как ваш IP адрес будет заблокирован"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Неудачные попытки входа"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Привет!\n\nКто-то пытался войти под Вашим именем на сайт '%s', но ввел неправильный пароль.\nЭто произошло так много раз, что система заблокировала IP-адрес, с которого эти попытки входа возникали для предотвращения взлома.\n\nВ случае, если эти попытки входа делали не Вы, не обращайте внимания на это сообщение. Вы сможете войти в на сайт как обычно.\nЕсли это Вы пытались войти и забыли пароль, или хотите использовать функцию 'Сброс пароля', у вас есть шанс разблокировать IP адрес, нажав на эту ссылку:\n%s\n\nС уважением, система Brute Force Stop\n\nP.S.: Это сообщение сгенерировано автоматически."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="Было замечено, что одна или несколько Ваших попыток входа в систему в последнее время завершились неудачей. При очередной попытке, вскоре Вы будете заблокированы. Поэтому рекомендуется использовать <a href='%1$s'>функцию восстановления пароля</a>!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Ваш IP-адрес: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_DELAYS_REMOVED="<strong>Brute Force Stop больше не задерживает ответ на неудачные входы.</strong> Ваши прежние настройки задерживали его («Задержка» или «Адаптивная задержка»); эти настройки удалены. Задержанный ответ занимает PHP-процесс сервера на всё время задержки, и злоумышленники, отправляющие много входов параллельно, могут этим сделать сайт недоступным, почти не замедляясь сами. Неудачные входы по-прежнему подсчитываются и блокируются, как и раньше. Чтобы замедлять клиентов, используйте ограничение частоты запросов веб-сервера или стоящего перед ним прокси (например, limit_req в nginx, mod_evasive в Apache или fail2ban)."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop не смог переписать свой раздел блокировок в <code>%s</code>. Раздел, записанный предыдущими версиями, позволяет всем, кто не заблокирован, обходить другие ограничения доступа этого каталога (защиту паролем, ограничения по IP). Сделайте файл доступным для записи и запустите обновление снова или удалите вручную строки между '# BEGIN BFStop Blocks' и '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_UPDATE_MIGRATION_FAILED="Brute Force Stop не смог перенести свои настройки и данные при обновлении (%s). Пока это не исправлено, плагин работает с настройками по умолчанию: проверьте <a href=\"%s\">настройки</a> и запустите обновление снова."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(адрес сайта не настроен)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="Вход сейчас невозможен. Пожалуйста, попробуйте снова через несколько минут."
PLG_SYSTEM_BFSTOP_UNINSTALL_HTACCESS_NOT_REMOVED="Brute Force Stop не удалось удалить свой раздел блокировок из <code>%s</code>: веб-сервер продолжает отклонять адреса из него. Сделайте файл доступным для записи и удалите вручную строки между '# BEGIN BFStop Blocks' и '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_SETUP_INSTALLED="<strong>Brute Force Stop установлен, но ещё не активен.</strong> Запустите <a href=\"%s\">мастер настройки</a>, чтобы активировать его: он проверяет, как посетители попадают на ваш сайт (напрямую или через прокси, балансировщик нагрузки или CDN) и подходит ли режим блокировки вашему веб-серверу."
PLG_SYSTEM_BFSTOP_SETUP_UPDATED="<strong>Требуется действие: откройте <a href=\"%s\">мастер настройки</a>.</strong> Он показывает, что изменило это обновление Brute Force Stop, и проходит по настройкам, которые требуют вашего решения: как посетители попадают на ваш сайт (напрямую или через прокси, балансировщик нагрузки или CDN) и режим блокировки."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_PROXY="<strong>Brute Force Stop отключён:</strong> похоже, ваш сайт находится за прокси, балансировщиком нагрузки или CDN, и BFStop заблокировал бы адрес прокси, то есть всех. Он останется отключённым, пока не будет завершён <a href=\"%s\">мастер настройки</a>."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_LOADBALANCER="<strong>Brute Force Stop отключён:</strong> в Joomla включена настройка «За балансировщиком нагрузки», значит, ваш сайт, похоже, находится за прокси или балансировщиком нагрузки, и BFStop заблокировал бы адрес прокси, то есть всех. Он останется отключённым, пока не будет завершён <a href=\"%s\">мастер настройки</a>."
PLG_SYSTEM_BFSTOP_SETUP_CONSOLE="В панели управления: Компоненты - Brute Force Stop - Мастер настройки. В командной строке: 'php cli/joomla.php bfstop:status' показывает состояние, 'php cli/joomla.php bfstop:setup --no-proxy' (или --trusted=<прокси> --header=<заголовок>) завершает настройку и включает защиту."
PLG_SYSTEM_BFSTOP_BLOCKED_PROXY_WARNING="Внимание: Brute Force Stop только что заблокировал %1$s, а это может быть прокси, балансировщик нагрузки или CDN (запрос пришёл с частного адреса с заголовком пересылки, или с этого адреса входили несколько учётных записей). В таком случае заблокированы все, кто находится за ним, возможно, и вы. Чтобы снять блокировку, воспользуйтесь списком заблокированных адресов в панели управления (Компоненты - Brute Force Stop - Заблокированные IP) или выполните на сервере: %2$s\nЗатем запустите проверку прокси в мастере настройки (Компоненты - Brute Force Stop - Мастер настройки), чтобы BFStop учитывал неудачные входы по адресам посетителей, а не по адресу прокси."
