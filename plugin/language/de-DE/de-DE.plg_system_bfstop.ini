PLG_SYSTEM_BFSTOP_USERNAME="Benutzername"
PLG_SYSTEM_BFSTOP_IPADDRESS="IP-Adresse"
PLG_SYSTEM_BFSTOP_ERROR="Fehler"
PLG_SYSTEM_BFSTOP_DATETIME="Zeitpunkt"
PLG_SYSTEM_BFSTOP_ORIGIN="Quelle"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="Die IP Adresse %1$s wurde aufgrund zu vieler fehlgeschlagener Login-Versuche auf %2$s gesperrt! Login-Versuche von dieser IP-Adresse, die zur Sperre geführt haben:\n\n%3$s\n\nVersuche, die bereits zu einer früheren Sperre geführt haben, sind nicht angeführt."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: IP-Adresse %s gesperrt"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Deine IP-Addresse wurde aufgrund zu vieler fehlgeschlagener Login-Versuche gesperrt."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="Du hast noch %d Versuch(e) bevor deine IP-Adresse blockiert wird!"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Fehlgeschlagene Login-Versuche"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Hallo!\n\nJemand hat versucht, sich mit deinem Benutzernamen auf der Webseite '%s' einzuloggen, dafür aber ein falsches Passwort angegeben.\nDies ist so oft passiert dass die IP-Adresse von der diese Versuche ausgingen, gesperrt wurde, um Missbrauch vorzubeugen.\n\nFür den Fall dass Du das nicht selbst warst, ignoriere bitte diese Mail. Du solltest Dich weiterhin wie gewohnt einloggen können.\nSolltest du jedoch selbst für diese Versuche verantwortlich sein, und du weißt nun das Passwort wieder (du kannst alternativ auch die 'Passwort zurücksetzen'-Funktion benützen), dann kannst Du die Sperre wieder aufheben indem du auf den folgenden Link klickst:\n%s\n\nFreundliche Grüße von der automatischen Webseiten-Verwaltung!\n\nHinweis: Dies ist eine automatisiert versendete Nachricht."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="Es wurde bemerkt, dass einer oder mehrere deiner Login-Versuche fehlgeschlagen sind. Bei erneuten Versuchen wirst du in Kürze gesperrt. Es wird daher empfohlen, die <a href='%1$s'>Funktionalität zum Zurücksetzen des Passworts</a> zu benützen!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Deine IP-Adresse ist: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_DELAYS_REMOVED="<strong>Brute Force Stop verzögert die Antwort auf fehlgeschlagene Logins nicht mehr.</strong> Ihre bisherigen Einstellungen haben sie verzögert („Verzögerung“ oder „Adaptives Delay“); diese Einstellungen wurden entfernt. Eine verzögerte Antwort hält einen PHP-Worker des Servers für die ganze Dauer besetzt, womit Angreifer, die viele Logins gleichzeitig senden, die Website unerreichbar machen können, während es sie kaum bremst. Fehlgeschlagene Logins werden weiterhin gezählt und gesperrt wie bisher. Um Clients zu bremsen, verwenden Sie die Ratenbegrenzung Ihres Webservers oder eines vorgeschalteten Proxys (z. B. limit_req von nginx, mod_evasive von Apache oder fail2ban)."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop konnte seinen Sperrabschnitt in <code>%s</code> nicht neu schreiben. Der von früheren Versionen geschriebene Abschnitt lässt alle, die nicht gesperrt sind, an den anderen Zugriffsbeschränkungen dieses Verzeichnisses vorbei (Passwortschutz, IP-Beschränkungen). Machen Sie die Datei beschreibbar und führen Sie das Update erneut aus, oder entfernen Sie die Zeilen zwischen '# BEGIN BFStop Blocks' und '# END BFStop Blocks' von Hand."
PLG_SYSTEM_BFSTOP_UPDATE_MIGRATION_FAILED="Brute Force Stop konnte seine Einstellungen und Daten beim Update nicht übernehmen (%s). Bis das behoben ist, arbeitet das Plugin mit seinen Standardeinstellungen: Prüfen Sie die <a href=\"%s\">Einstellungen</a> und führen Sie das Update erneut aus."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(Adresse der Website nicht eingestellt)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="Anmelden ist gerade nicht möglich. Bitte versuchen Sie es in ein paar Minuten erneut."
PLG_SYSTEM_BFSTOP_UNINSTALL_HTACCESS_NOT_REMOVED="Brute Force Stop konnte seinen Sperr-Abschnitt nicht aus <code>%s</code> entfernen: der Webserver weist die Adressen darin weiter ab. Machen Sie die Datei beschreibbar und entfernen Sie die Zeilen zwischen '# BEGIN BFStop Blocks' und '# END BFStop Blocks' von Hand."
PLG_SYSTEM_BFSTOP_SETUP_INSTALLED="<strong>Brute Force Stop ist installiert, aber noch nicht aktiv.</strong> Führen Sie den <a href=\"%s\">Einrichtungsassistenten</a> aus, um es zu aktivieren: Er prüft, wie Besucher Ihre Website erreichen (direkt oder über einen Proxy, Load-Balancer oder ein CDN) und ob der Sperrmodus zu Ihrem Webserver passt."
PLG_SYSTEM_BFSTOP_SETUP_UPDATED="<strong>Handlungsbedarf: Öffnen Sie den <a href=\"%s\">Einrichtungsassistenten</a>.</strong> Er zeigt, was dieses Update von Brute Force Stop geändert hat, und geht die Einstellungen durch, die Ihre Entscheidung brauchen: wie Besucher Ihre Website erreichen (direkt oder über einen Proxy, Load-Balancer oder ein CDN) und den Sperrmodus."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_PROXY="<strong>Brute Force Stop wurde deaktiviert:</strong> Ihre Website scheint hinter einem Proxy, Load-Balancer oder CDN zu liegen, und BFStop würde die Adresse des Proxys sperren, also alle Besucher. Es bleibt deaktiviert, bis der <a href=\"%s\">Einrichtungsassistent</a> abgeschlossen ist."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_LOADBALANCER="<strong>Brute Force Stop wurde deaktiviert:</strong> Die Joomla-Einstellung „Hinter Load-Balancer“ ist eingeschaltet, Ihre Website scheint also hinter einem Proxy oder Load-Balancer zu liegen, und BFStop würde die Adresse des Proxys sperren, also alle Besucher. Es bleibt deaktiviert, bis der <a href=\"%s\">Einrichtungsassistent</a> abgeschlossen ist."
PLG_SYSTEM_BFSTOP_SETUP_CONSOLE="Im Backend: Komponenten - Brute Force Stop - Einrichtungsassistent. Auf der Kommandozeile: 'php cli/joomla.php bfstop:status' zeigt den Stand, 'php cli/joomla.php bfstop:setup --no-proxy' (oder --trusted=<Proxys> --header=<Header>) schließt die Einrichtung ab und aktiviert den Schutz."
PLG_SYSTEM_BFSTOP_BLOCKED_PROXY_WARNING="Warnung: Brute Force Stop hat soeben %1$s gesperrt, möglicherweise ein Proxy, ein Load-Balancer oder ein CDN (die Anfrage kam von einer privaten Adresse mit einem Weiterleitungs-Header, oder von dieser Adresse haben sich mehrere Konten angemeldet). Dann ist jeder dahinter gesperrt, womöglich auch Sie. Um die Sperre aufzuheben, verwenden Sie die Liste der gesperrten Adressen im Backend (Komponenten - Brute Force Stop - Gesperrte IPs) oder führen Sie auf dem Server aus: %2$s\nFühren Sie danach die Proxy-Prüfung des Einrichtungsassistenten aus (Komponenten - Brute Force Stop - Einrichtungsassistent), damit BFStop fehlgeschlagene Logins den Adressen der Besucher zuordnet und nicht der des Proxys."
