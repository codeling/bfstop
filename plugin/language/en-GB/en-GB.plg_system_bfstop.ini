PLG_SYSTEM_BFSTOP_FAILED_LOGIN_ATTEMPT="%s: Failed login attempt at %s"
PLG_SYSTEM_BFSTOP_USERNAME="Username"
PLG_SYSTEM_BFSTOP_IPADDRESS="IP-Address"
PLG_SYSTEM_BFSTOP_ERROR="Error"
PLG_SYSTEM_BFSTOP_DATETIME="Date and time"
PLG_SYSTEM_BFSTOP_ORIGIN="Origin"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="Blocked IP Address %1$s because there were too many unsuccessful login attempts in a short time on %2$s. These are the attempts from that address which led to the block:\n\n%3$s\n\nAttempts which already led to an earlier block are not listed."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Blocked IP Address %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Your IP address has been blocked because there were too many unsuccessful login attempts in a short time."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="You have %d attempt(s) left before your IP address will be blocked"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Failed login attempts"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Hi!\n\nSomebody tried to log in with your username at the website '%s', but has used a wrong password.\nThis has happened so many times that the system has blocked access from the IP Address where these login attempts originated to prevent misuse.\n\nIn case it wasn't you doing these login attempts, please ignore this message. You should be able to login just as usual.\nShould you be responsible for these login attempts, and you now either know the password again or you want to use the 'Reset password' functionality, you have the chance to unblock the IP address by clicking on this link:\n%s\n\nBest regards, the automatic website management\n\nNote: This is an automatically generated message."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="It was noticed that one or more of your login attempts have recently failed. When trying again, you will soon be blocked. It is therefore recommended that you use the <a href='%1$s'>functionality to reset your password</a>!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Your IP address is: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_DELAYS_REMOVED="<strong>Brute Force Stop no longer delays the response to failed logins.</strong> Your previous settings delayed it ('Delay' or 'Adaptive Delay'); these settings have been removed. A delayed response keeps a PHP worker of the server busy for the whole delay, which attackers sending many logins in parallel can use to make the site unavailable, while it hardly slows them down. Failed logins are still counted and blocked as before. To slow down clients, use the rate limiting of your web server or of a proxy in front of it (e.g. nginx's limit_req, Apache's mod_evasive or fail2ban)."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop could not rewrite its block section in <code>%s</code>. The section written by earlier versions lets everybody who isn't blocked past the other access controls of that directory (password protection, IP restrictions). Make the file writable and run the update again, or remove the lines between '# BEGIN BFStop Blocks' and '# END BFStop Blocks' by hand."
PLG_SYSTEM_BFSTOP_UPDATE_MIGRATION_FAILED="Brute Force Stop could not migrate its settings and data during the update (%s). The plugin works with its default settings until this is fixed: check the <a href=\"%s\">settings</a>, and run the update again."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(site address not configured)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="Logging in is not possible right now. Please try again in a few minutes."
PLG_SYSTEM_BFSTOP_UNINSTALL_HTACCESS_NOT_REMOVED="Brute Force Stop could not remove its block section from <code>%s</code>: the web server goes on refusing the addresses in it. Make the file writable and remove the lines between '# BEGIN BFStop Blocks' and '# END BFStop Blocks' by hand."
PLG_SYSTEM_BFSTOP_SETUP_INSTALLED="<strong>Brute Force Stop is installed but not active yet.</strong> Run the <a href=\"%s\">setup assistant</a> to activate it: it checks how visitors reach your site (directly, or through a proxy, load balancer or CDN) and whether the blocking mode fits your web server."
PLG_SYSTEM_BFSTOP_SETUP_UPDATED="<strong>Action required: open the <a href=\"%s\">setup assistant</a>.</strong> It shows what this update of Brute Force Stop changed, and goes through the settings which need your decision: how visitors reach your site (directly, or through a proxy, load balancer or CDN) and the blocking mode."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_PROXY="<strong>Brute Force Stop has been disabled:</strong> your site appears to be behind a proxy, load balancer or CDN, and BFStop would block the proxy's address, which means everyone. It stays disabled until the <a href=\"%s\">setup assistant</a> has been completed."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_LOADBALANCER="<strong>Brute Force Stop has been disabled:</strong> Joomla's 'Behind Load Balancer' setting is on, so your site appears to be behind a proxy or load balancer, and BFStop would block the proxy's address, which means everyone. It stays disabled until the <a href=\"%s\">setup assistant</a> has been completed."
PLG_SYSTEM_BFSTOP_SETUP_CONSOLE="In the backend: Components - Brute Force Stop - Setup assistant. On the command line: 'php cli/joomla.php bfstop:status' shows the state, 'php cli/joomla.php bfstop:setup --no-proxy' (or --trusted=<proxies> --header=<header>) completes the setup and activates protection."
PLG_SYSTEM_BFSTOP_BLOCKED_PROXY_WARNING="Warning: Brute Force Stop just blocked %1$s, which may be a proxy, a load balancer or a CDN (the request came from a private address with a forwarding header, or several accounts have logged in from this address). If so, everyone behind it is blocked, possibly including you. To lift the block, use the list of blocked addresses in the backend (Components - Brute Force Stop - Blocked IPs), or run on the server: %2$s\nThen run the proxy check of the setup assistant (Components - Brute Force Stop - Setup assistant), so that BFStop counts failed logins against the visitors' addresses instead of the proxy's."
