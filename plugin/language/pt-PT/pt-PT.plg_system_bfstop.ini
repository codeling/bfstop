PLG_SYSTEM_BFSTOP_USERNAME="Nome"
PLG_SYSTEM_BFSTOP_IPADDRESS="Endereço IP"
PLG_SYSTEM_BFSTOP_ERROR="Erro"
PLG_SYSTEM_BFSTOP_DATETIME="Data e hora"
PLG_SYSTEM_BFSTOP_ORIGIN="Origem"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="O endereço IP %1$s foi bloqueado porque houve muitas tentativas de início de sessão sem sucesso num curto espaço de tempo em %2$s. Estas são as tentativas desse endereço que levaram ao bloqueio:\n\n%3$s\n\nAs tentativas que já levaram a um bloqueio anterior não são listadas."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Bloqueado o endereço IP %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="O seu endereço IP foi bloqueado porque houve muitas tentativas de início de sessão sem sucesso num curto espaço de tempo."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="Tem mais %d tentativas(s) antes do seu endereço IP ser bloqueado"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Tentativas de início de sessão falhadas"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Olá!\n\nAlguém tentou iniciar sessão com o seu nome de utilizador no site '%s', mas usou uma palavra-passe errada.\nIsso aconteceu tantas vezes que o sistema bloqueou o acesso a partir do endereço IP de onde essas tentativas de início de sessão se originaram, para evitar o uso indevido.\n\nSe não foi o utilizador quem fez essas tentativas de início de sessão, ignore esta mensagem. O utilizador deve conseguir iniciar sessão normalmente.\nSe foi o utilizador o responsável por essas tentativas e agora se lembra da palavra-passe ou quer usar a função 'Repor palavra-passe', o utilizador pode desbloquear o endereço IP clicando neste ligação:\n%s\n\nAtenciosamente, o gerenciamento automático do site\n\nObservação: esta é uma mensagem gerada automaticamente."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="Foi detetado que uma ou mais das suas tentativas de início de sessão falharam recentemente. Se tentar novamente, será em breve bloqueado. Recomenda-se por isso que utilize a <a href='%1$s'>funcionalidade de reposição da palavra-passe</a>!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="O seu endereço IP é: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_DELAYS_REMOVED="<strong>O Brute Force Stop já não atrasa a resposta a inícios de sessão falhados.</strong> As suas definições anteriores atrasavam-na ('Adiamento' ou 'Atraso adaptativo'); essas definições foram removidas. Uma resposta atrasada mantém um processo PHP do servidor ocupado durante todo o atraso, o que atacantes que enviam muitos inícios de sessão em paralelo podem usar para tornar o site indisponível, enquanto quase não os trava. Os inícios de sessão falhados continuam a ser contados e bloqueados como antes. Para travar clientes, utilize a limitação de taxa do seu servidor web ou de um proxy à frente dele (p. ex. limit_req do nginx, mod_evasive do Apache ou fail2ban)."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="O Brute Force Stop não conseguiu reescrever a sua secção de bloqueios em <code>%s</code>. A secção escrita por versões anteriores deixa qualquer pessoa que não esteja bloqueada passar pelos outros controlos de acesso desse diretório (proteção por palavra-passe, restrições de IP). Torne o ficheiro gravável e execute a atualização novamente, ou remova manualmente as linhas entre '# BEGIN BFStop Blocks' e '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_UPDATE_MIGRATION_FAILED="O Brute Force Stop não conseguiu migrar as suas definições e dados durante a atualização (%s). Até que isso seja corrigido, o plugin funciona com as definições predefinidas: verifique as <a href=\"%s\">definições</a> e execute a atualização novamente."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(endereço do site não configurado)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="Não é possível iniciar sessão neste momento. Tente novamente dentro de alguns minutos."
PLG_SYSTEM_BFSTOP_UNINSTALL_HTACCESS_NOT_REMOVED="O Brute Force Stop não conseguiu remover a sua secção de bloqueios de <code>%s</code>: o servidor web continua a recusar os endereços nela. Torne o ficheiro gravável e remova manualmente as linhas entre '# BEGIN BFStop Blocks' e '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_SETUP_INSTALLED="<strong>O Brute Force Stop está instalado, mas ainda não está ativo.</strong> Execute o <a href=\"%s\">assistente de configuração</a> para o ativar: verifica como os visitantes chegam ao seu sítio (diretamente, ou através de um proxy, balanceador de carga ou CDN) e se o modo de bloqueio é adequado ao seu servidor web."
PLG_SYSTEM_BFSTOP_SETUP_UPDATED="<strong>Ação necessária: abra o <a href=\"%s\">assistente de configuração</a>.</strong> Mostra o que esta atualização do Brute Force Stop alterou e percorre as definições que precisam da sua decisão: como os visitantes chegam ao seu sítio (diretamente, ou através de um proxy, balanceador de carga ou CDN) e o modo de bloqueio."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_PROXY="<strong>O Brute Force Stop foi desativado:</strong> o seu sítio parece estar atrás de um proxy, balanceador de carga ou CDN, e o BFStop bloquearia o endereço do proxy, ou seja, toda a gente. Permanece desativado até o <a href=\"%s\">assistente de configuração</a> estar concluído."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_LOADBALANCER="<strong>O Brute Force Stop foi desativado:</strong> a definição 'Atrás de balanceador de carga' do Joomla está ligada, pelo que o seu sítio parece estar atrás de um proxy ou balanceador de carga, e o BFStop bloquearia o endereço do proxy, ou seja, toda a gente. Permanece desativado até o <a href=\"%s\">assistente de configuração</a> estar concluído."
PLG_SYSTEM_BFSTOP_SETUP_CONSOLE="Na administração: Componentes - Brute Force Stop - Assistente de configuração. Na linha de comandos: 'php cli/joomla.php bfstop:status' mostra o estado, 'php cli/joomla.php bfstop:setup --no-proxy' (ou --trusted=<proxies> --header=<cabeçalho>) conclui a configuração e ativa a proteção."
PLG_SYSTEM_BFSTOP_BLOCKED_PROXY_WARNING="Atenção: o Brute Force Stop acabou de bloquear %1$s, que pode ser um proxy, um balanceador de carga ou uma CDN (o pedido veio de um endereço privado com um cabeçalho de reencaminhamento, ou várias contas iniciaram sessão a partir deste endereço). Nesse caso, todos os que estão atrás dele ficam bloqueados, possivelmente também o utilizador. Para levantar o bloqueio, use a lista de endereços bloqueados na administração (Componentes - Brute Force Stop - IPs bloqueados), ou execute no servidor: %2$s\nDepois execute a verificação de proxy do assistente de configuração (Componentes - Brute Force Stop - Assistente de configuração), para que o BFStop conte as falhas de início de sessão nos endereços dos visitantes e não no do proxy."
