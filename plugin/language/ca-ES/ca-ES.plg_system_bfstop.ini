PLG_SYSTEM_BFSTOP_FAILED_LOGIN_ATTEMPT="%s: Intent d'inici de sessió fallit a %s"
PLG_SYSTEM_BFSTOP_USERNAME="Nom d'usuari"
PLG_SYSTEM_BFSTOP_IPADDRESS="Adreça IP"
PLG_SYSTEM_BFSTOP_ERROR="Error"
PLG_SYSTEM_BFSTOP_DATETIME="Dia i hora"
PLG_SYSTEM_BFSTOP_ORIGIN="Origen"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="S'ha bloquejat l'adreça IP %1$s perquè hi havia massa intents fallits d'inici de sessió en poc temps a %2$s. Aquests són els intents des d'aquesta adreça que han provocat el bloqueig:\n\n%3$s\n\nNo s'hi inclouen els intents que ja van provocar un bloqueig anterior."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Adreça IP bloquejada %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="La teva adreça IP ha estat bloquejada perquè hi havia massa intents fallits d'ingressar en molt poc temps."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="Et resten %d intent(s) d'ingressar abans que la teva adreça IP sigui bloquejada. Si no recordes el nom o contrasenya, pots demanar al sistema que te la torni a enviar"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Intents fallits d'inici de sessió"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Hola,\n\nAlgú ha intentat iniciar sessió amb el teu nom d'usuari al lloc web '%s', però ha utilitzat una contrasenya incorrecta.\nAixò ha passat tantes vegades que s'ha bloquejat l'accés des de l'adreça Ip des d'on aquests intents de connexió es van originar per evitar abusos.\n\nEn cas que no siguis tu qui hagis fet aquests intents de connexió, si us plau, ignora aquest missatge. Hauríes de ser capaç d'iniciar sessió com de costum. \nHauries de ser responsable d'aquests intents de connexió, i o bé saber de nou la contrasenya (o utilitzar la funció de 'Restablir contrasenya'). Ara tens l'oportunitat de desbloquejar l'adreça Ip, clicant aquest enllaç:\n%s\n\nAfectuosament, el gestor automàtica del lloc web!\n\nNota: Aquest és un missatge generat automàticament."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="S'ha detectat que un o més dels vostres intents d'inici de sessió han fallat recentment. Si ho torneu a intentar, aviat sereu bloquejat. Per això us recomanem que feu servir la <a href='%1$s'>funció per restablir la contrasenya</a>!"
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="La vostra adreça IP és: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_DELAYS_REMOVED="<strong>Brute Force Stop ja no retarda la resposta als inicis de sessió fallits.</strong> La vostra configuració anterior la retardava ('Retard' o 'Retard adaptatiu'); aquests paràmetres s'han eliminat. Una resposta retardada manté ocupat un procés PHP del servidor durant tot el retard, cosa que els atacants que envien molts inicis de sessió alhora poden aprofitar per deixar el lloc inaccessible, mentre que a ells gairebé no els frena. Els inicis de sessió fallits es continuen comptant i bloquejant com abans. Per frenar els clients, utilitzeu la limitació de velocitat del servidor web o d'un servidor intermediari davant seu (p. ex. limit_req de nginx, mod_evasive d'Apache o fail2ban)."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop no ha pogut reescriure la seva secció de bloquejos a <code>%s</code>. La secció escrita per versions anteriors permet a qualsevol que no estigui bloquejat saltar-se els altres controls d'accés d'aquest directori (protecció amb contrasenya, restriccions d'IP). Feu que el fitxer es pugui escriure i torneu a executar l'actualització, o elimineu a mà les línies entre '# BEGIN BFStop Blocks' i '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_UPDATE_MIGRATION_FAILED="Brute Force Stop no ha pogut migrar la seva configuració i les seves dades durant l'actualització (%s). Fins que no es resolgui, el connector funciona amb la configuració per defecte: reviseu la <a href=\"%s\">configuració</a> i torneu a executar l'actualització."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(adreça del lloc no configurada)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="Ara mateix no és possible iniciar la sessió. Torneu-ho a provar d'aquí a uns minuts."
PLG_SYSTEM_BFSTOP_UNINSTALL_HTACCESS_NOT_REMOVED="Brute Force Stop no ha pogut treure la seva secció de bloquejos de <code>%s</code>: el servidor web continua rebutjant les adreces que conté. Feu que el fitxer es pugui escriure i traieu a mà les línies entre '# BEGIN BFStop Blocks' i '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_SETUP_INSTALLED="<strong>Brute Force Stop està instal·lat però encara no està actiu.</strong> Executeu l'<a href=\"%s\">assistent de configuració</a> per activar-lo: comprova com arriben els visitants al vostre lloc (directament, o a través d'un proxy, un balancejador de càrrega o una CDN) i si el mode de bloqueig és adequat per al vostre servidor web."
PLG_SYSTEM_BFSTOP_SETUP_UPDATED="<strong>Cal actuar: obriu l'<a href=\"%s\">assistent de configuració</a>.</strong> Mostra què ha canviat aquesta actualització de Brute Force Stop i repassa els paràmetres que necessiten la vostra decisió: com arriben els visitants al vostre lloc (directament, o a través d'un proxy, un balancejador de càrrega o una CDN) i el mode de bloqueig."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_PROXY="<strong>Brute Force Stop s'ha desactivat:</strong> sembla que el vostre lloc és darrere d'un proxy, un balancejador de càrrega o una CDN, i BFStop bloquejaria l'adreça del proxy, és a dir, tothom. Es manté desactivat fins que s'hagi completat l'<a href=\"%s\">assistent de configuració</a>."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_LOADBALANCER="<strong>Brute Force Stop s'ha desactivat:</strong> el paràmetre 'Darrere d'un balancejador de càrrega' de Joomla està activat, de manera que sembla que el vostre lloc és darrere d'un proxy o un balancejador de càrrega, i BFStop bloquejaria l'adreça del proxy, és a dir, tothom. Es manté desactivat fins que s'hagi completat l'<a href=\"%s\">assistent de configuració</a>."
PLG_SYSTEM_BFSTOP_SETUP_CONSOLE="A l'administració: Components - Brute Force Stop - Assistent de configuració. A la línia d'ordres: 'php cli/joomla.php bfstop:status' mostra l'estat, 'php cli/joomla.php bfstop:setup --no-proxy' (o --trusted=<proxies> --header=<capçalera>) completa la configuració i activa la protecció."
PLG_SYSTEM_BFSTOP_BLOCKED_PROXY_WARNING="Atenció: Brute Force Stop acaba de bloquejar %1$s, que podria ser un proxy, un balancejador de càrrega o una CDN (la petició venia d'una adreça privada amb una capçalera de reenviament, o diversos comptes han iniciat sessió des d'aquesta adreça). En aquest cas, tothom qui hi ha al darrere queda bloquejat, potser també vós. Per aixecar el bloqueig, feu servir la llista d'adreces bloquejades a l'administració (Components - Brute Force Stop - IP bloquejades), o executeu al servidor: %2$s\nDesprés executeu la comprovació del proxy de l'assistent de configuració (Components - Brute Force Stop - Assistent de configuració), perquè BFStop compti els inicis de sessió fallits a les adreces dels visitants i no a la del proxy."
