PLG_SYSTEM_BFSTOP_FAILED_LOGIN_ATTEMPT="%s: Tentativa de entrada al sistema fracasada en %s"
PLG_SYSTEM_BFSTOP_USERNAME="Usuario"
PLG_SYSTEM_BFSTOP_IPADDRESS="IP-Dirección"
PLG_SYSTEM_BFSTOP_ERROR="Error"
PLG_SYSTEM_BFSTOP_DATETIME="Fecha y tiempo"
PLG_SYSTEM_BFSTOP_ORIGIN="Origen"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_BODY="Se ha bloqueado la dirección IP %1$s porque hubo demasiados intentos fallidos de inicio de sesión en poco tiempo en %2$s. Estos son los intentos desde esa dirección que provocaron el bloqueo:\n\n%3$s\n\nNo se incluyen los intentos que ya provocaron un bloqueo anterior."
PLG_SYSTEM_BFSTOP_BLOCKED_IP_ADDRESS_SUBJECT="%s: Dirección IP bloqueada %s"
PLG_SYSTEM_BFSTOP_BLOCKED_IP_MESSAGE="Su dirección IP ha sido bloqueada por demasiadas tentativas fracasadas de entrada al sistema."
PLG_SYSTEM_BFSTOP_X_ATTEMPTS_LEFT="Puede intentar (s) %d  antes de que su dirección IP sea bloqueada"
PLG_SYSTEM_BFSTOP_BLOCKED_SUBJECT="%s: Tentativas fracasadas de entrada al sistema"
PLG_SYSTEM_BFSTOP_BLOCKED_BODY="Hola!\n\nAlguien trató de entrar al sistema con su nombre de usuario en el sitio Web '%s', pero ha usado una contraseña incorrecta.\nEsto ha pasado tantas veces que el sistema ha bloqueado el acceso de la Dirección IP desde donde provinieron estas tentativas para prevenir su mal uso.\n\nSi no es usted quien está haciendo estas tentativas de entrada al sistema, por favor no haga caso de este mensaje. Usted debería ser capaz de entrar al sistema como lo hace habitualmente.\nSi es usted el responsable de estas tentativas de entrada al sistema, y quiere usar 'la nueva contraseña', usted tiene la posibilidad de desbloquear la dirección IP haciendo clic en este enlace:\n%s\n\nBest, la dirección de sitio Web automática\n\nNota: Este es un mensaje generado automáticamente."
PLG_SYSTEM_BFSTOP_PASSWORD_RESET_RECOMMENDED="Le avisamos de que uno o más de sus intentos de inicio de sesión han fallado recientemente. Si lo intenta de nuevo, pronto será bloqueado. Por tanto, le recomendamos que utilice la <a href='%1$s'>función para restablecer la contraseña</a>."
PLG_SYSTEM_BFSTOP_BLOCKED_CLIENT_IP="Su dirección IP es: %s."
PLG_SYSTEM_BFSTOP_UPDATE_2_0_0_DELAYS_REMOVED="<strong>Brute Force Stop ya no retrasa la respuesta a los inicios de sesión fallidos.</strong> Su configuración anterior la retrasaba ('Retardo' o 'Retardo adaptativo'); estos ajustes se han eliminado. Una respuesta retrasada mantiene ocupado un proceso PHP del servidor durante todo el retraso, lo que los atacantes que envían muchos inicios de sesión a la vez pueden aprovechar para dejar el sitio inaccesible, mientras que apenas los frena. Los inicios de sesión fallidos se siguen contando y bloqueando como antes. Para frenar a los clientes, use la limitación de velocidad de su servidor web o de un proxy delante de él (p. ej. limit_req de nginx, mod_evasive de Apache o fail2ban)."
PLG_SYSTEM_BFSTOP_UPDATE_HTACCESS_NOT_REWRITTEN="Brute Force Stop no pudo reescribir su sección de bloqueos en <code>%s</code>. La sección escrita por versiones anteriores permite a cualquiera que no esté bloqueado saltarse los demás controles de acceso de ese directorio (protección por contraseña, restricciones de IP). Haz que el archivo se pueda escribir y vuelve a ejecutar la actualización, o elimina a mano las líneas entre '# BEGIN BFStop Blocks' y '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_UPDATE_MIGRATION_FAILED="Brute Force Stop no pudo migrar su configuración y sus datos durante la actualización (%s). Hasta que se resuelva, el plugin funciona con su configuración predeterminada: revisa la <a href=\"%s\">configuración</a> y vuelve a ejecutar la actualización."
PLG_SYSTEM_BFSTOP_SITE_ADDRESS_NOT_SET="(dirección del sitio no configurada)"
PLG_SYSTEM_BFSTOP_LOGIN_UNAVAILABLE="No es posible iniciar sesión en este momento. Inténtalo de nuevo dentro de unos minutos."
PLG_SYSTEM_BFSTOP_UNINSTALL_HTACCESS_NOT_REMOVED="Brute Force Stop no pudo quitar su sección de bloqueos de <code>%s</code>: el servidor web sigue rechazando las direcciones que contiene. Haga el archivo escribible y quite a mano las líneas entre '# BEGIN BFStop Blocks' y '# END BFStop Blocks'."
PLG_SYSTEM_BFSTOP_SETUP_INSTALLED="<strong>Brute Force Stop está instalado pero aún no está activo.</strong> Ejecute el <a href=\"%s\">asistente de configuración</a> para activarlo: comprueba cómo llegan los visitantes a su sitio (directamente, o a través de un proxy, un balanceador de carga o una CDN) y si el modo de bloqueo es adecuado para su servidor web."
PLG_SYSTEM_BFSTOP_SETUP_UPDATED="<strong>Acción necesaria: abra el <a href=\"%s\">asistente de configuración</a>.</strong> Muestra lo que ha cambiado esta actualización de Brute Force Stop y repasa los ajustes que necesitan su decisión: cómo llegan los visitantes a su sitio (directamente, o a través de un proxy, un balanceador de carga o una CDN) y el modo de bloqueo."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_PROXY="<strong>Brute Force Stop se ha desactivado:</strong> su sitio parece estar detrás de un proxy, un balanceador de carga o una CDN, y BFStop bloquearía la dirección del proxy, es decir, a todo el mundo. Permanece desactivado hasta que se complete el <a href=\"%s\">asistente de configuración</a>."
PLG_SYSTEM_BFSTOP_SETUP_DISABLED_LOADBALANCER="<strong>Brute Force Stop se ha desactivado:</strong> el ajuste «Detrás de un balanceador de carga» de Joomla está activado, por lo que su sitio parece estar detrás de un proxy o un balanceador de carga, y BFStop bloquearía la dirección del proxy, es decir, a todo el mundo. Permanece desactivado hasta que se complete el <a href=\"%s\">asistente de configuración</a>."
PLG_SYSTEM_BFSTOP_SETUP_CONSOLE="En la administración: Componentes - Brute Force Stop - Asistente de configuración. En la línea de comandos: 'php cli/joomla.php bfstop:status' muestra el estado, 'php cli/joomla.php bfstop:setup --no-proxy' (o --trusted=<proxies> --header=<cabecera>) completa la configuración y activa la protección."
PLG_SYSTEM_BFSTOP_BLOCKED_PROXY_WARNING="Atención: Brute Force Stop acaba de bloquear %1$s, que podría ser un proxy, un balanceador de carga o una CDN (la petición venía de una dirección privada con una cabecera de reenvío, o varias cuentas han iniciado sesión desde esta dirección). En ese caso, todos los que están detrás quedan bloqueados, posiblemente también usted. Para levantar el bloqueo, use la lista de direcciones bloqueadas en la administración (Componentes - Brute Force Stop - IP bloqueadas), o ejecute en el servidor: %2$s\nDespués ejecute la comprobación del proxy del asistente de configuración (Componentes - Brute Force Stop - Asistente de configuración), para que BFStop cuente los inicios de sesión fallidos en las direcciones de los visitantes y no en la del proxy."
