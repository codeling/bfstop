name: Update server and website

# https://bfstop.bfroehler.info on GitHub Pages: the page (site/) and the
# update server - update.xml and update-pkg.xml, which installed sites ask
# for new versions, generated by package/update-server.php from the releases
# published on GitHub (never drafts, never test releases).
#
# It is deployed
#   - when a release is published, changed, unpublished or deleted,
#   - when the page or the generator changes on main,
#   - by hand (Actions → Update server and website → Run workflow).
#
# A `release` event runs the workflow file *at the tag*, with the tag as the
# ref, which the "github-pages" environment doesn't accept (only main may
# deploy). So that event only starts this workflow again on the default
# branch, as a workflow_dispatch, which does the work.
on:
  release:
    types: [published, unpublished, edited, deleted]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'package/update-server.php'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a running one is finished, not cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  dispatch:
    name: Start the deployment on ${{ github.event.repository.default_branch }}
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run this workflow on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: gh workflow run pages.yml --ref "$BRANCH"

  build:
    name: Generate the site
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - name: Fetch the releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
      - name: Generate the update server files
        run: |
          mkdir _site
          php package/update-server.php "$RUNNER_TEMP/releases.json" _site
          xmllint --noout _site/*.xml
      - name: Add the page
        run: cp -r site/. _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
