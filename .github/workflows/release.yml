name: Release

# Pushing a version tag (tag com_bfstop with the same name first) builds the
# release from the tags and tests it like every change (ci.yml: all Joomla
# sites install the package, and a site of the previous release is updated
# with it), then creates a *draft* GitHub release with the zips, their SHA-256
# sums and notes from the CHANGELOG - published by hand once it was checked.
#
#   X.Y.Z                       a release: the CHANGELOG entry needs its date
#   X.Y.Z-alphaN/-betaN/-rcN    a test release: marked as pre-release on
#                               GitHub; never offered by the update server
#
# The versions in the manifests have to be the tag (tests/lint/check-versions.php),
# so a tag on the wrong commit fails before anything is built.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

jobs:
  ci:
    name: Build and test
    uses: ./.github/workflows/ci.yml

  release:
    name: Draft GitHub release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bfstop-${{ needs.ci.outputs.version }}
          path: build
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.ci.outputs.version }}
        run: |
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::the package built is version $VERSION, the tag is $TAG"
            exit 1
          fi
          php package/release-notes.php "$VERSION" build > "$RUNNER_TEMP/notes.md"
          flags=(--draft --verify-tag --title "BFStop $VERSION" --notes-file "$RUNNER_TEMP/notes.md")
          if php tests/lint/check-versions.php --is-prerelease="$VERSION"; then
            flags+=(--prerelease)
          fi
          gh release create "$VERSION" "${flags[@]}" \
            "build/pkg_bfstop-$VERSION.zip" "build/bfstop-$VERSION.zip" \
            "build/com_bfstop-$VERSION.zip" "build/SHA256SUMS-$VERSION"
          echo "Draft release created: check it, then publish it on GitHub" >> "$GITHUB_STEP_SUMMARY"
