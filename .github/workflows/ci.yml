name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Syntax check and unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit:11
          coverage: none
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        # PHPUnit 11 needs PHP >= 8.2
        if: matrix.php != '8.1'
        run: phpunit -c tests/phpunit.xml.dist --testsuite unit

  integration:
    name: Joomla ${{ matrix.joomla }}, ${{ matrix.db }}, PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { joomla: 5.4.8, php: '8.2', db: 'mysql:8.0' }
          - { joomla: 5.4.8, php: '8.2', db: 'mariadb:10.11' }
          - { joomla: 5.4.8, php: '8.2', db: 'postgres:12' }
          - { joomla: 6.1.3, php: '8.4', db: 'mysql:8.4' }
          - { joomla: 6.1.3, php: '8.4', db: 'mariadb:11.4' }
          - { joomla: 6.1.3, php: '8.4', db: 'postgres:17' }
    env:
      JOOMLA_VERSION: ${{ matrix.joomla }}
      DB_HOST: 127.0.0.1
      DB_NAME: joomla
      DB_PASS: bfstop-test
    steps:
      - name: Set paths
        run: |
          echo "JOOMLA_ROOT=$RUNNER_TEMP/joomla" >> "$GITHUB_ENV"
          echo "COM_BFSTOP_ROOT=$RUNNER_TEMP/com_bfstop" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      # the component is tested together with the plugin: use its branch of
      # the same name if there is one (for changes spanning both), else main
      - name: Determine com_bfstop branch
        id: com
        run: |
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if git ls-remote --exit-code --heads https://github.com/codeling/com_bfstop.git "$branch" > /dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: codeling/com_bfstop
          ref: ${{ steps.com.outputs.ref }}
          path: com_bfstop
      - name: Move com_bfstop checkout out of the plugin's
        run: mv com_bfstop "$COM_BFSTOP_ROOT"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, pgsql, pdo_pgsql, zip, mbstring, intl, gd
          tools: phpunit:11
          coverage: none

      - name: Start database (${{ matrix.db }})
        env:
          DB_IMAGE: ${{ matrix.db }}
        run: tests/ci/start-database.sh

      - name: Install Joomla and bfstop
        run: tests/ci/install-joomla.sh

      - name: Tests
        run: phpunit -c tests/phpunit.xml.dist

      - name: Plugin log
        if: failure()
        run: cat "$JOOMLA_ROOT"/administrator/logs/*.php || true
