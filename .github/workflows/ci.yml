name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # by release.yml, for a version tag: everything is built and tested from
  # the tag, with the com_bfstop tag of the same name
  workflow_call:
    outputs:
      version:
        description: version of the package built (artifact bfstop-<version>)
        value: ${{ jobs.package.outputs.version }}

permissions:
  contents: read

jobs:
  lint:
    name: Manifest, language and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - name: XML files are well-formed
        run: |
          command -v xmllint > /dev/null || {
            sudo apt-get update -q > /dev/null
            sudo apt-get install -y -q libxml2-utils > /dev/null
          }
          find . -name '*.xml' -not -path './.git/*' -print0 | xargs -0 xmllint --noout
      - name: Actions are pinned to commit SHAs
        run: php tests/lint/check-workflows.php
      - name: The Joomla! packages of the matrix have checksums
        run: php tests/lint/check-joomla-checksums.php
      - name: Language files
        run: php tests/lint/check-language.php bfstop.xml PLG_SYSTEM_BFSTOP
      - name: Plugin, package and CHANGELOG have the same version
        run: php tests/lint/check-versions.php
      - name: Composer manifest is valid
        run: composer validate --strict
      - name: Vendored GeoIP reader is the version locked in composer.lock
        # src/Helper/Geo is generated by tools/vendor-geoip.php; if this fails
        # after a dependency update, run `composer install && composer vendor-geoip`
        run: |
          composer install --no-interaction --no-progress
          composer check-geoip
      - name: Release zip contains everything the manifest references
        run: |
          ./deploy.sh zip
          php tests/lint/check-zip.php bfstop-*.zip bfstop.xml

  unit:
    name: Syntax check and unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: phpunit:11
          coverage: none
          ini-values: error_reporting=E_ALL
      - name: Check PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        # PHPUnit 11 needs PHP >= 8.2
        if: matrix.php != '8.1'
        run: phpunit -c tests/phpunit.xml.dist --testsuite unit

  apache:
    name: .htaccess blocks on Apache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - name: Install Apache
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q apache2 apache2-utils
          # the job starts its own Apache, with its own configuration
          sudo systemctl stop apache2 || true
      - name: The block section turns away blocked addresses and nothing else
        run: tests/ci/apache-htaccess.sh

  # the Joomla!/PHP/database combinations live in tests/ci/matrix.json, a file
  # which the joomla-versions workflow can change (a workflow file it can't)
  matrix:
    name: Test matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
      upgrade: ${{ steps.read.outputs.upgrade }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: read
        run: |
          echo "matrix=$(jq -c '{include: .include}' tests/ci/matrix.json)" >> "$GITHUB_OUTPUT"
          # the update from the previous release: the Joomla 5 entries with
          # MySQL/MariaDB (1.5 ran on neither Joomla 6 nor PostgreSQL)
          echo "upgrade=$(jq -c '{include: [.include[] | select((.joomla | startswith("5.")) and (.db | startswith("postgres") | not))]}' tests/ci/matrix.json)" >> "$GITHUB_OUTPUT"

  # what users install: the package with plugin and component, built once by
  # package/build.sh; the jobs below install exactly this, and it is kept as
  # an artifact of the run (a snapshot to try out)
  package:
    name: Package
    runs-on: ubuntu-latest
    outputs:
      com-ref: ${{ steps.com.outputs.ref }}
      version: ${{ steps.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # a release tag: the com_bfstop tag of the same name, which has to
      # exist (tag com_bfstop first). Otherwise the com_bfstop branch of the
      # same name if there is one and it has commits main hasn't (for changes
      # spanning both), else main: a branch which was merged and not deleted
      # is a stale copy of an old main
      - name: Determine com_bfstop branch
        id: com
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if ! git ls-remote --exit-code --tags https://github.com/codeling/com_bfstop.git "refs/tags/$GITHUB_REF_NAME" > /dev/null; then
              echo "::error::com_bfstop has no tag $GITHUB_REF_NAME - tag the component first"
              exit 1
            fi
            echo "ref=refs/tags/$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "Using com_bfstop tag $GITHUB_REF_NAME"
            exit 0
          fi
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          ref=main
          ahead=none
          if [[ "$branch" =~ ^[A-Za-z0-9._/-]+$ ]] \
            && git ls-remote --exit-code --heads https://github.com/codeling/com_bfstop.git "$branch" > /dev/null; then
            ahead="$(gh api "repos/codeling/com_bfstop/compare/main...$branch" --jq .ahead_by)"
            if [ "$ahead" -gt 0 ]; then
              ref="$branch"
            fi
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Using com_bfstop $ref (a branch '$branch' there is ahead of main by: $ahead)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codeling/com_bfstop
          ref: ${{ steps.com.outputs.ref }}
          path: com_bfstop
      - name: Move com_bfstop checkout out of the plugin's
        run: mv com_bfstop "$RUNNER_TEMP/com_bfstop"
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - name: Versions are those of the release
        if: github.ref_type == 'tag'
        run: COM_BFSTOP_ROOT="$RUNNER_TEMP/com_bfstop" php tests/lint/check-versions.php --release="$GITHUB_REF_NAME"
      - name: Build plugin, component and package
        id: build
        run: |
          package/build.sh "$RUNNER_TEMP/com_bfstop" build
          echo "version=$(php tests/lint/check-versions.php --print-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bfstop-${{ steps.build.outputs.version }}
          path: build/
          if-no-files-found: error

  integration:
    name: Joomla ${{ matrix.joomla }}, ${{ matrix.db }}, PHP ${{ matrix.php }}
    needs: [matrix, package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      JOOMLA_VERSION: ${{ matrix.joomla }}
      DB_HOST: 127.0.0.1
      DB_NAME: joomla
      DB_PASS: bfstop-test
    steps:
      - name: Set paths
        run: |
          echo "JOOMLA_ROOT=$RUNNER_TEMP/joomla" >> "$GITHUB_ENV"
          echo "COM_BFSTOP_ROOT=$RUNNER_TEMP/com_bfstop" >> "$GITHUB_ENV"
          echo "DOWNLOAD_CACHE=$HOME/.cache/bfstop-ci" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # the component's classes are loaded from its checkout by the tests
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codeling/com_bfstop
          ref: ${{ needs.package.outputs.com-ref }}
          path: com_bfstop
      - name: Move com_bfstop checkout out of the plugin's
        run: mv com_bfstop "$COM_BFSTOP_ROOT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bfstop-${{ needs.package.outputs.version }}
          path: ${{ runner.temp }}/build

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, pgsql, pdo_pgsql, zip, mbstring, intl, gd
          tools: phpunit:11
          coverage: none
          ini-values: error_reporting=E_ALL

      - name: Start database (${{ matrix.db }})
        env:
          DB_IMAGE: ${{ matrix.db }}
        run: tests/ci/start-database.sh

      # the release packages the tests install (Joomla; for the update, the
      # previous BFStop release) are kept between runs instead of being
      # fetched from GitHub for every job. A cached package has to pass the
      # same SHA-256 check as a downloaded one (tests/ci/fetch-verified.sh)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bfstop-ci
          key: downloads-joomla-${{ matrix.joomla }}
      - name: Install Joomla and the bfstop package
        env:
          BFSTOP_PACKAGE: ${{ runner.temp }}/build/pkg_bfstop-${{ needs.package.outputs.version }}.zip
        run: tests/ci/install-joomla.sh

      - name: Tests
        run: phpunit -c tests/phpunit.xml.dist

      - name: Plugin log
        if: failure()
        run: cat "$JOOMLA_ROOT"/administrator/logs/*.php || true

  # a site with the previous release (tests/ci/previous-release.sha256) and
  # its data, updated with the package: tests/ci/upgrade-test.sh
  upgrade:
    name: Update from the previous release (Joomla ${{ matrix.joomla }}, ${{ matrix.db }})
    needs: [matrix, package]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.upgrade) }}
    env:
      JOOMLA_VERSION: ${{ matrix.joomla }}
      DB_HOST: 127.0.0.1
      DB_NAME: joomla
      DB_PASS: bfstop-test
    steps:
      - name: Set paths
        run: |
          echo "JOOMLA_ROOT=$RUNNER_TEMP/joomla" >> "$GITHUB_ENV"
          echo "COM_BFSTOP_ROOT=$RUNNER_TEMP/com_bfstop" >> "$GITHUB_ENV"
          echo "DOWNLOAD_CACHE=$HOME/.cache/bfstop-ci" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: codeling/com_bfstop
          ref: ${{ needs.package.outputs.com-ref }}
          path: com_bfstop
      - name: Move com_bfstop checkout out of the plugin's
        run: mv com_bfstop "$COM_BFSTOP_ROOT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bfstop-${{ needs.package.outputs.version }}
          path: ${{ runner.temp }}/build
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, pdo_mysql, zip, mbstring, intl, gd
          tools: phpunit:11
          coverage: none
          ini-values: error_reporting=E_ALL
      - name: Start database (${{ matrix.db }})
        env:
          DB_IMAGE: ${{ matrix.db }}
        run: tests/ci/start-database.sh
      # the release packages the tests install (Joomla; for the update, the
      # previous BFStop release) are kept between runs instead of being
      # fetched from GitHub for every job. A cached package has to pass the
      # same SHA-256 check as a downloaded one (tests/ci/fetch-verified.sh)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/bfstop-ci
          key: downloads-update-joomla-${{ matrix.joomla }}-${{ hashFiles('tests/ci/previous-release.sha256') }}
      - name: Update from the previous release
        env:
          BFSTOP_PACKAGE: ${{ runner.temp }}/build/pkg_bfstop-${{ needs.package.outputs.version }}.zip
        run: tests/ci/upgrade-test.sh
      - name: Plugin log
        if: failure()
        run: cat "$JOOMLA_ROOT"/administrator/logs/*.php || true
